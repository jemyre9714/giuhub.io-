<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>司法的重量：西瓜寮土石案</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  color: #e8e8e8; min-height: 100vh; padding: 24px;
}
#app { max-width: 820px; margin: 0 auto; }
.progress-bar { height: 6px; background: #2a2a4a; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #f0a500, #f7c948); transition: width .4s; }
.hud { display: flex; justify-content: space-between; font-size: 13px; color: #9aa0b5; margin-bottom: 20px; }
.scene {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(240,165,0,0.25);
  border-radius: 16px; padding: 28px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  animation: fadeIn .4s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.scene-title {
  font-size: 22px; color: #f7c948; margin-bottom: 18px;
  border-left: 4px solid #f0a500; padding-left: 12px;
}
.scene-body p { line-height: 1.9; margin-bottom: 10px; color: #cfd3e0; font-size: 15px; }
.question {
  margin: 22px 0 14px; padding: 14px 16px;
  background: rgba(240,165,0,0.08);
  border-left: 3px solid #f0a500; border-radius: 6px;
  font-weight: 600; color: #f7c948;
}
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  text-align: left; padding: 14px 16px; cursor: pointer;
  background: rgba(255,255,255,0.05); color: #e8e8e8;
  border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
  font-size: 14px; transition: all .2s;
}
.option:hover:not(:disabled) { background: rgba(240,165,0,0.15); border-color: #f0a500; }
.option:disabled { cursor: default; opacity: .6; }
.option.correct { background: rgba(46,204,113,0.18); border-color: #2ecc71; }
.option.wrong { background: rgba(231,76,60,0.18); border-color: #e74c3c; }
.calc-fields { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
.calc-field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #cfd3e0; }
.calc-field small { color: #7a8199; }
.calc-field input {
  padding: 10px 12px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(0,0,0,0.3); color: #fff; font-size: 15px;
}
.submit-calc, .next-btn, .restart-btn {
  padding: 12px 24px; border-radius: 10px; border: none; cursor: pointer;
  background: linear-gradient(135deg, #f0a500, #f7c948); color: #1a1a2e;
  font-weight: 700; font-size: 15px; transition: transform .15s;
}
.submit-calc:hover:not(:disabled), .next-btn:hover:not(:disabled) { transform: translateY(-2px); }
.next-btn:disabled { opacity: .35; cursor: not-allowed; }
.feedback { margin-top: 16px; padding: 14px; border-radius: 10px; font-size: 14px; line-height: 1.7; }
.feedback.ok { background: rgba(46,204,113,0.12); border: 1px solid rgba(46,204,113,0.4); }
.feedback.ng { background: rgba(231,76,60,0.12); border: 1px solid rgba(231,76,60,0.4); }
.next-wrap { text-align: right; margin-top: 22px; }
.end .verdict-line { font-size: 16px; line-height: 1.9; margin: 16px 0; padding: 16px; background: rgba(240,165,0,0.1); border-radius: 10px; }
.end .verdict-line strong { color: #f7c948; }
.end h2 { color: #f7c948; margin: 20px 0 8px; }
.score-line { font-size: 18px; color: #f0a500; margin: 12px 0; }
.answer-log { list-style: none; margin: 12px 0 20px; }
.answer-log li { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 13px; line-height: 1.6; }
.answer-log li.ok { color: #7fd99a; }
.answer-log li.ng { color: #e8877c; }
</style>
</head>

/* ===================== MODEL：狀態管理 ===================== */
class GameModel {
  constructor(scenes) {
    this.scenes = scenes;
    this.index = 0;
    this.score = 0;
    this.maxScore = scenes.length * 10;
    this.answers = [];
  }
  get current() { return this.scenes[this.index]; }
  get isLast() { return this.index === this.scenes.length - 1; }
  get progress() { return (this.index / this.scenes.length) * 100; }

  submitChoice(optionIndex) {
    const scene = this.current;
    const opt = scene.options[optionIndex];
    if (opt.correct) this.score += 10;
    this.answers.push({ scene: scene.id, correct: opt.correct, feedback: opt.feedback });
    return opt;
  }

  submitCalc(values) {
    const scene = this.current;
    let allCorrect = true;
    const results = scene.fields.map(f => {
      const ok = Number(values[f.key]) === f.answer;
      if (!ok) allCorrect = false;
      return { ...f, ok, userValue: values[f.key] };
    });
    if (allCorrect) this.score += 10;
    this.answers.push({
      scene: scene.id,
      correct: allCorrect,
      feedback: allCorrect ? '計算正確！' : '部分計算有誤。'
    });
    return results;
  }

  next() { if (!this.isLast) this.index++; }

  getRating() {
    const pct = this.score / this.maxScore;
    if (pct === 1) return { title: '明察秋毫・承審法官', desc: '你完全掌握本件爭點與法律適用，判決精準。' };
    if (pct >= 0.7) return { title: '穩健斷案・資深法官', desc: '大部分爭點判斷正確，少數細節可再精進。' };
    if (pct >= 0.4) return { title: '尚需磨練・學習中', desc: '掌握部分爭點，建議重讀判決理由。' };
    return { title: '初入法門・見習生', desc: '再讀一次判決，你會發現更多細節。' };
  }
}

/* ===================== VIEW：渲染 ===================== */
class GameView {
  constructor(root) { this.root = root; }

  renderProgress(model) {
    return `
      <div class="progress-bar">
        <div class="progress-fill" style="width:${model.progress}%"></div>
      </div>
      <div class="hud">
        <span>第 ${model.index + 1} / ${model.scenes.length} 章</span>
        <span>得分：${model.score} / ${model.maxScore}</span>
      </div>`;
  }

  renderScene(model) {
    const scene = model.current;
    const body = scene.paragraphs.map(p => `<p>${p}</p>`).join('');
    let interactive = '';

    if (scene.type === 'story') {
      interactive = `
        <div class="question">${scene.question}</div>
        <div class="options">
          ${scene.options.map((o, i) =>
            `<button class="option" data-index="${i}">${String.fromCharCode(65 + i)}. ${o.text}</button>`
          ).join('')}
        </div>
        <div class="feedback" id="feedback"></div>`;
    } else if (scene.type === 'calc') {
      interactive = `
        <div class="question">${scene.question}</div>
        <div class="calc-fields">
          ${scene.fields.map(f => `
            <label class="calc-field">
              <span>${f.label} <small>（提示：${f.hint}）</small></span>
              <input type="number" data-key="${f.key}" placeholder="輸入金額">
            </label>`).join('')}
        </div>
        <button class="submit-calc">送出計算</button>
        <div class="feedback" id="feedback"></div>`;
    }

    return `
      ${this.renderProgress(model)}
      <div class="scene">
        <h1 class="scene-title">${scene.title}</h1>
        <div class="scene-body">${body}</div>
        ${interactive}
        <div class="next-wrap">
          <button class="next-btn" id="nextBtn" disabled>下一章 →</button>
        </div>
      </div>`;
  }

  renderEnd(model) {
    const rating = model.getRating();
    const log = model.answers.map((a, i) =>
      `<li class="${a.correct ? 'ok' : 'ng'}">
        第 ${i + 1} 關：${a.correct ? '✔ 正確' : '✘ 待改進'} — ${a.feedback}
      </li>`).join('');
    return `
      <div class="scene end">
        <h1 class="scene-title">判決宣示</h1>
        <p class="verdict-line">水利局應給付西瓜寮 <strong>1 億 2,722 萬 2,777 元</strong>，及自 99 年 6 月 8 日起至清償日止，按年息 5% 計算之利息。</p>
        <h2>你的評價：${rating.title}</h2>
        <p>${rating.desc}</p>
        <p class="score-line">總得分：${model.score} / ${model.maxScore}</p>
        <h3>審判紀錄</h3>
        <ul class="answer-log">${log}</ul>
        <button class="restart-btn" onclick="location.reload()">重新審判</button>
      </div>`;
  }

  showFeedback(html, isCorrect) {
    const el = document.getElementById('feedback');
    if (!el) return;
    el.innerHTML = html;
    el.className = 'feedback ' + (isCorrect ? 'ok' : 'ng');
    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn) nextBtn.disabled = false;
  }
}

/* ===================== CONTROLLER：流程控制 ===================== */
class GameController {
  constructor(model, view) {
    this.model = model;
    this.view = view;
  }
  start() { this.render(); }

  render() {
    if (this.model.index >= this.model.scenes.length) {
      this.view.root.innerHTML = this.view.renderEnd(this.model);
      return;
    }
    this.view.root.innerHTML = this.view.renderScene(this.model);
    this.bind();
  }

  bind() {
    const scene = this.model.current;
    const nextBtn = document.getElementById('nextBtn');

    if (scene.type === 'story') {
      document.querySelectorAll('.option').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.option').forEach(b => b.disabled = true);
          const idx = Number(btn.dataset.index);
          const opt = this.model.submitChoice(idx);
          const feedback = `<strong>${opt.correct ? '✔ 正確' : '✘ 不正確'}</strong><br>${opt.feedback}`;
          this.view.showFeedback(feedback, opt.correct);
          btn.classList.add(opt.correct ? 'correct' : 'wrong');
        });
      });
    } else if (scene.type === 'calc') {
      document.querySelector('.submit-calc').addEventListener('click', () => {
        const values = {};
        document.querySelectorAll('.calc-field input').forEach(inp => {
          values[inp.dataset.key] = inp.value;
        });
        const results = this.model.submitCalc(values);
        const allOk = results.every(r => r.ok);
        const html = results.map(r =>
          `<div>${r.label}：${r.ok ? '✔ 正確' : `✘ 正確答案為 ${r.answer.toLocaleString()} 元`}</div>`
        ).join('');
        this.view.showFeedback(html, allOk);
        document.querySelector('.submit-calc').disabled = true;
      });
    }

    nextBtn.addEventListener('click', () => {
      this.model.next();
      this.render();
    });
  }
}

/* ===================== 啟動 ===================== */
const root = document.getElementById('app');
const model = new GameModel(SCENES);
const view = new GameView(root);
const controller = new GameController(model, view);
controller.start();
</script>
