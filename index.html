<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>西瓜寮裁判所 - 107年度重上更三字第17號</title>
<style>
:root { --gold: #ffcc00; --red: #ff0033; --green: #00ff66; --blue: #0066ff; --bg: #0a0a1a; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: "Arial Black", "Impact", "Noto Sans TC", sans-serif; -webkit-tap-highlight-color: transparent; }
body {
  color: #fff; min-height: 100vh; padding: 10px; overflow-x: hidden;
  background-color: #050510;
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(255, 0, 50, 0.15) 0%, transparent 60%),
    linear-gradient(rgba(0, 50, 100, 0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 50, 100, 0.1) 1px, transparent 1px);
  background-size: 100% 100%, 30px 30px, 30px 30px;
  background-attachment: fixed;
}
body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999; background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.12) 50%); background-size: 100% 4px; }

#app { max-width: 1000px; margin: 0 auto; position: relative; z-index: 1; border: 6px solid #111; border-radius: 8px; box-shadow: 0 0 0 4px #444, 0 0 60px rgba(0,0,0,0.9), inset 0 0 100px rgba(0,0,0,0.9); background: #000; padding: 15px; overflow: hidden; }

/* 頂部心證天秤與導覽列 */
.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 10px; position: relative; }
.trust-meter { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: bold; width: 100%; }
.trust-left { color: var(--green); width: 80px; text-align: right; line-height: 1.2; text-shadow: 1px 1px 0 #000; }
.trust-right { color: var(--red); width: 80px; text-align: left; line-height: 1.2; text-shadow: 1px 1px 0 #000; }
.balance-container { flex: 1; height: 30px; position: relative; display: flex; justify-content: center; }
.balance-bar { width: 90%; height: 14px; background: #222; border-radius: 7px; display: flex; overflow: hidden; border: 2px solid #555; position: relative; margin-top: 8px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.8); }
.bar-melon { height: 100%; background: linear-gradient(90deg, #008800, #00ff66); transition: width 0.5s ease; }
.bar-water { height: 100%; background: linear-gradient(90deg, #ff0033, #aa0022); transition: width 0.5s ease; }
.scale-icon { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 32px; transition: transform 0.5s ease; z-index: 2; filter: drop-shadow(0 0 5px #fff); }

.trust-float { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: 900; text-shadow: 2px 2px 0 #000; animation: floatUp 1s ease-out forwards; pointer-events: none; z-index: 100; font-style: italic; }
@keyframes floatUp { 0% { opacity: 0; top: 20px; } 20% { opacity: 1; top: 10px; } 100% { opacity: 0; top: -20px; } }

.top-menu-btn { background: #222; border: 2px solid var(--gold); color: var(--gold); padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; margin-left: 5px; }
.top-menu-btn:hover { background: var(--gold); color: #000; }

/* 極簡封面畫面 */
.cover-screen { text-align: center; padding: 60px 20px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; }
.cover-case-no { color: #aaa; font-size: clamp(12px, 3vw, 16px); letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase; }
.cover-title { font-size: clamp(40px, 10vw, 80px); color: var(--gold); font-weight: 900; letter-spacing: 6px; text-shadow: 4px 4px 0 #a00, 8px 8px 0 #000, 0 0 20px rgba(255, 204, 0, 0.5); margin-bottom: 20px; font-style: italic; animation: titlePulse 2s infinite alternate; }
@keyframes titlePulse { from { filter: brightness(1); } to { filter: brightness(1.3); } }
.cover-scale { font-size: 48px; margin-bottom: 30px; animation: scaleFloat 2s infinite alternate; }
@keyframes scaleFloat { from { transform: translateY(0); } to { transform: translateY(-10px); } }
.press-start { font-size: clamp(20px, 5vw, 28px); color: #fff; font-weight: 900; animation: blink 1s infinite; cursor: pointer; padding: 15px 35px; text-shadow: 2px 2px 0 var(--red); border: 2px dashed transparent; transition: .2s; background: rgba(255,0,51,0.2); border-radius: 8px; border-color: var(--red); }
.press-start:hover { border-color: var(--gold); color: var(--gold); text-shadow: 2px 2px 0 #000; background: rgba(255, 204, 0, 0.2); }
@keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.02); } }

/* RPG 勘驗地圖畫面 */
.rpg-container { position: relative; width: 100%; height: 400px; background: #111; border: 4px solid var(--gold); border-radius: 6px; overflow: hidden; margin-bottom: 15px; box-shadow: inset 0 0 30px rgba(0,0,0,0.9); }
.rpg-viewport { position: relative; width: 100%; height: 320px; background-size: cover; background-position: center; image-rendering: pixelated; }
.rpg-player { position: absolute; width: 48px; height: 48px; background-size: contain; background-repeat: no-repeat; transform: translate(-50%, -50%); z-index: 10; transition: left 0.1s linear, top 0.1s linear; image-rendering: pixelated; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.8)); }
.rpg-npc { position: absolute; width: 48px; height: 48px; background-size: contain; background-repeat: no-repeat; transform: translate(-50%, -50%); z-index: 5; image-rendering: pixelated; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.8)); cursor: pointer; }
.rpg-controls-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #222; border-top: 2px solid #444; }
.d-pad { display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); gap: 2px; }
.d-btn { background: #333; border: 2px solid #555; color: #fff; font-weight: bold; font-size: 16px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.d-btn:active { background: var(--gold); color: #000; }
.rpg-info { flex: 1; margin-left: 15px; font-family: "Noto Sans TC", sans-serif; font-size: 14px; color: #ccc; }

/* 法庭全景 */
.courtroom-scene { 
  background: linear-gradient(to bottom, #2a1a0e, #1a1008);
  border: 4px solid #333; border-radius: 4px; margin-bottom: 15px; position: relative; height: clamp(320px, 50vh, 450px); display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; box-shadow: inset 0 0 50px rgba(0,0,0,0.9); transition: filter 0.3s; 
}
.courtroom-scene.danger { filter: drop-shadow(0 0 30px var(--red)) brightness(1.2) contrast(1.5); }
.courtroom-scene::before { 
  content: ''; position: absolute; inset: 0; 
  background: 
    radial-gradient(circle at 50% 10%, rgba(255, 204, 0, 0.1) 0%, transparent 50%),
    repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.02) 40px, rgba(255,255,255,0.02) 42px),
    linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.9) 100%);
  pointer-events: none; z-index: 0; 
}

/* 審判長席 */
.judge-stand { position: relative; z-index: 2; width: 100%; height: 40%; background: linear-gradient(to bottom, #3a2515, #1a1008); border-bottom: 8px solid #4a2e15; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 5px; box-shadow: 0 10px 20px rgba(0,0,0,0.8); }
.judge-bench { display: flex; justify-content: center; align-items: flex-end; gap: clamp(10px, 3vw, 40px); }
.judge-avatar { filter: drop-shadow(0 0 10px #000); transition: .3s; position: relative; object-fit: contain; image-rendering: pixelated;}
.main-judge { width: clamp(60px, 12vw, 100px); height: clamp(60px, 12vw, 100px); z-index: 2; }
.judge-side { width: clamp(40px, 8vw, 70px); height: clamp(40px, 8vw, 70px); opacity: 0.7; }
.judge-avatar.active { filter: drop-shadow(0 0 20px var(--gold)); transform: translateY(-5px); }

/* 特效層 */
.effect-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
.falling-wig { position: absolute; top: 5%; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; animation: wigDrop 2s forwards cubic-bezier(0.5, 0, 1, 1); z-index: 10; }
@keyframes wigDrop { 0% { top: 5%; opacity: 1; } 80% { top: 80%; opacity: 1; } 100% { top: 100%; opacity: 0; } }
.bald-judge { filter: grayscale(0.5) contrast(1.2); }
.note-bounce { position: absolute; font-size: 24px; animation: noteUp 1.5s ease-out forwards; }
@keyframes noteUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-100px) scale(1.5); opacity: 0; } }
.bullet-hole { position: absolute; width: 40px; height: 40px; background: radial-gradient(circle, #000 20%, #555 40%, transparent 60%); border-radius: 50%; animation: popIn 0.2s; }
.tumbleweed { position: absolute; font-size: 40px; animation: blowAcross 4s linear forwards; }
@keyframes blowAcross { 0% { transform: translateX(-100px) rotate(0deg); } 100% { transform: translateX(100vw) rotate(720deg); } }

.desk-item { position: absolute; font-size: 40px; z-index: 10; animation: dropOnDesk 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
@keyframes dropOnDesk { 0% { transform: translateY(-50px) scale(2); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }

/* 法警 */
.bailiff-stand { position: absolute; bottom: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; transition: transform 0.2s; }
.bailiff-stand.left { left: 2%; }
.bailiff-stand.right { right: 2%; }
.bailiff-avatar { width: clamp(40px, 8vw, 70px); height: clamp(40px, 8vw, 70px); filter: drop-shadow(0 0 5px #000); object-fit: contain; image-rendering: pixelated; }
.bailiff-label { font-size: 10px; color: #ffcc00; background: #000; padding: 2px 6px; border-radius: 4px; margin-top: 2px; display: none; }
@media (min-width: 600px) { .bailiff-label { display: block; } }
.bailiff-shock { animation: shock 0.15s infinite alternate; }
@keyframes shock { from { transform: translateY(0) scale(1); } to { transform: translateY(-20px) scale(1.3) rotate(5deg); filter: drop-shadow(0 0 20px var(--red)); } }

/* 雙方代理人與桌子 */
.players-area { position: relative; z-index: 2; display: flex; justify-content: space-between; padding: 0 5%; width: 100%; height: 60%; align-items: flex-end; padding-bottom: 20px;}
.player-side { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; width: 45%; position: relative; height: 100%; }
.player-side .avatar { width: clamp(70px, 14vw, 110px); height: clamp(70px, 14vw, 110px); background: transparent; border: none; box-shadow: none; transition: .2s; z-index: 3; display: flex; align-items: center; justify-content: center; overflow: visible; }
.player-side .avatar.active { transform: translateY(-10px); filter: drop-shadow(0 0 15px currentColor); }
.player-side.left .avatar.active { color: var(--green); }
.player-side.right .avatar.active { color: var(--red); }
.player-side .avatar img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.8)); }

.name-tag { font-size: clamp(10px, 2.5vw, 14px); font-weight: 900; color: #fff; background: #000; padding: 4px 10px; border: 2px solid #555; text-transform: uppercase; text-align: center; line-height: 1.2; z-index: 4; box-shadow: 0 2px 5px rgba(0,0,0,0.8); }
.player-side.left .name-tag { color: var(--green); border-color: var(--green); }
.player-side.right .name-tag { color: var(--red); border-color: var(--red); }

.lawyer-desk { 
  position: absolute; bottom: 0; width: 90%; height: 50px; 
  background: linear-gradient(to bottom, #6b4423, #3b2210);
  border: 3px solid #222; border-radius: 4px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.1);
  z-index: 2;
}
.player-side.left .lawyer-desk { left: 5%; }
.player-side.right .lawyer-desk { right: 5%; }
.desk-item-container { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 5; }

.speaking { animation: speakBounce 0.3s infinite alternate; }
@keyframes speakBounce { from { transform: translateY(0) scale(1); } to { transform: translateY(-12px) scale(1.05); filter: drop-shadow(0 0 15px currentColor); } }

/* 對話框與動作按鈕 */
.dialog-box { background: #111; border: 4px solid #fff; border-radius: 4px; padding: 20px; min-height: 120px; position: relative; box-shadow: inset 0 0 0 2px #000, 0 10px 20px rgba(0,0,0,0.8); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; }
.speaker-name { position: absolute; top: -16px; left: 15px; background: var(--gold); color: #000; font-size: clamp(12px, 3vw, 14px); font-weight: 900; padding: 4px 15px; border: 2px solid #000; transform: skewX(-10deg); box-shadow: 2px 2px 0 rgba(0,0,0,0.8); z-index: 2; }
.dialog-content { font-size: clamp(14px, 3.5vw, 18px); line-height: 1.6; color: #fff; margin-top: 8px; font-family: "Noto Sans TC", sans-serif; font-weight: bold; white-space: pre-wrap; text-shadow: 1px 1px 2px rgba(0,0,0,0.9); }

@keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

.action-bar-court { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
.action-btn { flex: 1; padding: 12px; font-size: clamp(14px, 3.5vw, 18px); font-weight: 900; border: 3px solid #fff; border-radius: 4px; cursor: pointer; text-transform: uppercase; box-shadow: 0 6px 0 rgba(0,0,0,0.6); text-shadow: 1px 1px 0 #000; transition: .1s; }
.action-btn:active { transform: translateY(6px); box-shadow: none; }
.btn-wait { background: var(--blue); color: #fff; }
.btn-obj { background: var(--red); color: #fff; }
.btn-record { background: var(--gold); color: #000; text-shadow: none; }

.hint-box { background: rgba(0, 50, 150, 0.9); border: 3px solid var(--blue); border-radius: 4px; padding: 12px; margin-top: 15px; text-align: center; font-size: clamp(12px, 3vw, 16px); color: #fff; box-shadow: 0 0 15px rgba(0,102,255,0.6); animation: pulse 2s infinite; }
.hint-box::before { content: '法庭提示！'; display: block; color: var(--gold); font-size: 1.2em; font-style: italic; margin-bottom: 5px; text-shadow: 2px 2px 0 #000; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 10px rgba(0,102,255,0.5); } 50% { box-shadow: 0 0 25px rgba(0,102,255,1); } }

.btn { padding: 12px 20px; border: 3px solid #fff; border-radius: 4px; cursor: pointer; background: var(--gold); color: #000; font-weight: 900; font-size: clamp(14px, 3.5vw, 18px); transition: .1s; display: block; margin: 10px auto; width: 100%; max-width: 300px; text-transform: uppercase; box-shadow: 0 6px 0 #a00, 0 10px 10px rgba(0,0,0,0.5); text-shadow: 1px 1px 0 #fff; }
.btn:active { transform: translateY(6px); box-shadow: 0 0 0 #a00; }
.btn.green { background: var(--green); box-shadow: 0 6px 0 #080; text-shadow: none; }
.btn.red { background: var(--red); color: #fff; box-shadow: 0 6px 0 #800; text-shadow: 1px 1px 0 #000; }
.next-wrap { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }

/* 法庭紀錄抽屜 (支援多分頁) */
.court-record-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 15px; animation: fadeIn .2s; }
.record-box { background: #112; border: 4px solid var(--gold); border-radius: 8px; width: 100%; max-width: 700px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.9); }
.record-tabs { display: flex; background: #000; border-bottom: 3px solid var(--gold); }
.record-tab { flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: bold; color: #888; cursor: pointer; border-right: 2px solid #333; transition: .2s; }
.record-tab.active { background: var(--gold); color: #000; text-shadow: none; }
.record-body { padding: 15px; overflow-y: auto; flex: 1; }
.record-close { background: var(--red); color: #fff; border: none; padding: 10px; font-weight: bold; cursor: pointer; text-align: center; }

.evidence-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
.evidence-card { padding: 12px 6px; text-align: center; background: #222; border: 3px solid #555; border-radius: 6px; cursor: pointer; transition: .2s; color: #fff; position: relative; }
.evidence-card:hover { border-color: var(--gold); background: #2a2a3e; transform: translateY(-3px); }
.ev-icon { font-size: 32px; margin-bottom: 5px; display: block; }
.ev-name { font-size: 12px; font-weight: bold; font-family: "Noto Sans TC", sans-serif; }

.law-item, .timeline-item { background: #1a1a2e; border-left: 5px solid var(--gold); padding: 12px; margin-bottom: 10px; border-radius: 0 4px 4px 0; font-family: "Noto Sans TC", sans-serif; font-size: 14px; line-height: 1.5; }
.timeline-item { border-left-color: var(--blue); }

.feedback { margin-top: 15px; padding: 15px; border: 4px solid; font-size: clamp(13px, 3vw, 16px); font-family: "Noto Sans TC", sans-serif; font-weight: bold; border-radius: 4px; animation: popIn 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
.feedback.ok { background: rgba(0,255,102,0.2); border-color: var(--green); color: #ccffdd; }
.feedback.ng { background: rgba(255,0,51,0.2); border-color: var(--red); color: #ffccdd; }
.feedback.neutral { background: rgba(255,204,0,0.2); border-color: var(--gold); color: #ffefb3; }

/* 角色彈出對話視窗 */
.character-popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: flex-end; justify-content: center; z-index: 2000; padding: 20px; overflow: hidden; }
.character-popup { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 600px; animation: popOutFromBottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.character-portrait { width: clamp(150px, 35vw, 250px); height: clamp(150px, 35vw, 250px); filter: drop-shadow(0 0 40px rgba(0,0,0,1)); z-index: 2; margin-bottom: -20px; position: relative; animation: speakBounce 0.3s infinite alternate; }
.character-portrait img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
.character-dialog { background: #000; border: 5px solid var(--gold); border-radius: 8px; padding: 25px; width: 100%; position: relative; z-index: 1; box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,1); text-align: center; }
.character-dialog .dialog-content { font-size: clamp(16px, 4vw, 22px); text-align: left; padding: 10px; text-shadow: 1px 1px 0 #000; }
@keyframes popOutFromBottom { 0% { transform: translateY(100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

/* 法警帶走與結算動畫 */
.bailiff-scene { position: fixed; inset: 0; background: #000; z-index: 3000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.bailiff-drag { display: flex; align-items: flex-end; gap: 10px; animation: dragAway 2s forwards cubic-bezier(0.7, 0, 1, 1); }
.bailiff-svg-large { width: clamp(80px, 20vw, 150px); height: clamp(80px, 20vw, 150px); }
.player-img-large { width: clamp(70px, 16vw, 120px); height: clamp(70px, 16vw, 120px); transform: rotate(30deg); filter: drop-shadow(0 0 10px rgba(255,0,0,0.8)); object-fit: cover; image-rendering: pixelated; }
.bailiff-text { position: absolute; top: 20%; width: 100%; text-align: center; font-size: clamp(24px, 8vw, 50px); color: var(--red); font-weight: 900; text-shadow: 3px 3px 0 #fff; animation: blink .3s infinite; font-style: italic; }
@keyframes dragAway { 0% { transform: translateX(0); } 20% { transform: translateX(-50px) rotate(-5deg); } 100% { transform: translateX(100vw); opacity: 0; } }

.gameover-scene { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 4000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
.gameover-title { font-size: clamp(60px, 15vw, 100px); color: var(--red); font-weight: 900; text-shadow: 4px 4px 0 #fff; font-style: italic; margin-bottom: 20px; transform: rotate(-5deg); }

#flash-overlay { position: fixed; inset: 0; background: #fff; z-index: 5000; pointer-events: none; opacity: 0; }
.flash-active { animation: flashAnim 0.4s ease-out; }
@keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
#decisive-text { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5001; pointer-events: none; opacity: 0; padding: 20px; }
.decisive-active { animation: decisiveAnim 1.5s ease-out forwards; }
.decisive-text-inner { font-size: clamp(40px, 15vw, 100px); font-weight: 900; color: var(--gold); text-shadow: 6px 6px 0 var(--red), 12px 12px 0 #000; font-style: italic; letter-spacing: 6px; text-align: center; line-height: 1.2; transform: rotate(-10deg); }

#victory-overlay { position: fixed; inset: 0; z-index: 6000; background: radial-gradient(circle, rgba(255,204,0,0.2) 0%, rgba(0,0,0,0.95) 70%); display: none; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
#victory-overlay.show { display: flex; animation: fadeIn .5s ease; }
.victory-title { font-size: clamp(60px, 15vw, 120px); color: var(--gold); font-weight: 900; text-shadow: 8px 8px 0 var(--red), 16px 16px 0 #000; transform: rotate(-10deg); z-index: 2; font-style: italic; letter-spacing: 8px; }
.victory-sub { font-size: clamp(18px, 4vw, 30px); color: #fff; margin-top: 20px; z-index: 2; text-align: center; font-weight: bold; text-shadow: 2px 2px 0 #000; }
.confetti { position: absolute; width: 10px; height: 10px; background: #f00; animation: fall linear forwards; z-index: 1; }
@keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }

.shake { animation: shake .4s ease; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-15px); } 40%, 80% { transform: translateX(15px); } }

/* 損害賠償計算專屬樣式 */
.calc-facts { background: #222; border: 3px solid var(--gold); padding: 15px; border-radius: 4px; margin-bottom: 15px; }
.fact-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #555; font-family: "Noto Sans TC", sans-serif; font-size: 14px; }
.fact-row:last-child { border-bottom: none; }
.fact-label { color: #aaa; }
.fact-val { color: var(--gold); font-weight: bold; }
.calc-input { width: 100%; padding: 12px; background: #222; color: var(--gold); border: 3px solid #555; border-radius: 4px; font-size: 16px; font-weight: 900; text-align: center; outline: none; margin-top: 5px; }
.calc-input:focus { border-color: var(--gold); background: #1a1a2e; }
</style>

class Model {
  constructor() {
    this.state = 'cover'; // cover, rpg, trial, calc, end
    this.score = 0;
    this.lives = 3;
    this.trustMelon = 50;
    this.trustWater = 50;
    this.trustChange = null;
    this.trustChangeColor = null;
    
    // RPG 狀態
    this.currentMap = 'river';
    this.playerPos = { x: 100, y: 150 };
    this.sp = 0;
    this.inventory = {};
    this.collectedItems = {};
    
    // 法庭辯論狀態
    this.trialIndex = 0;
    this.res = null;
    this.bagOpen = false;
    this.recordTab = 'evidence'; // evidence, laws, timeline
    this.charPopup = null;
    this.effect = null;
    this.bailiffShock = false;
    this.isDanger = false;
    
    // 計算題狀態
    this.calcInput = { qty: '', price: '', cost: '' };
    this.calcResult = null;
  }
  
  initInventory() {
    // 預設給予基本證物
    this.inventory['e_prep'] = ALL_EVIDENCE['e_prep'];
    this.inventory['e_tender'] = ALL_EVIDENCE['e_tender'];
  }
}

class View {
  constructor(r) { this.r = r; }

  renderTopBar(m) {
    let w = Math.max(0, Math.min(100, m.trustWater));
    let mel = Math.max(0, Math.min(100, m.trustMelon));
    let total = w + mel; if(total === 0) total = 1;
    let melPct = (mel / total) * 100;
    let waterPct = (w / total) * 100;
    let rotate = (Math.round(melPct) === Math.round(waterPct)) ? 0 : (melPct - 50) * 0.6; 

    return `
      <div class="top-bar">
        ${m.trustChange ? `<div class="trust-float" style="color: ${m.trustChangeColor};">${m.trustChange}</div>` : ''}
        <div class="trust-meter">
          <div class="trust-left">西瓜寮<br>${Math.round(melPct)}%</div>
          <div class="balance-container">
            <div class="balance-bar">
              <div class="bar-melon" style="width:${melPct}%"></div>
              <div class="bar-water" style="width:${waterPct}%"></div>
            </div>
            <div class="scale-icon" style="transform: translateX(-50%) rotate(${rotate}deg);">⚖️</div>
          </div>
          <div class="trust-right">水利局<br>${Math.round(waterPct)}%</div>
        </div>
        <button class="top-menu-btn" onclick="window.openRecord()">📁 法庭紀錄</button>
      </div>
    `;
  }

  renderCourt(m, activeSpeaker) {
    const isJudge = activeSpeaker === '審判長' || activeSpeaker === '系統' || activeSpeaker === '旁白';
    const isMelon = activeSpeaker === '上訴人西瓜寮訴訟代理人';
    const isWater = activeSpeaker === '被上訴人水利局訴訟代理人';
    const shockClass = m.bailiffShock ? 'bailiff-shock' : '';
    const dangerClass = m.isDanger ? 'danger' : '';
    const baldClass = (m.effect === 'wig_fall') ? 'bald-judge' : '';

    return `
      ${this.renderTopBar(m)}
      <div class="courtroom-scene ${dangerClass}">
        ${this.renderEffects(m)}
        <div class="judge-stand">
          <div class="judge-bench">
            <img src="${JUDGE_LEFT_AVATAR}" class="judge-avatar judge-side ${isJudge?'active speaking':''}" alt="左陪席">
            <img src="${JUDGE_AVATAR}" class="judge-avatar main-judge ${isJudge?'active speaking':''} ${dangerClass} ${baldClass}" alt="審判長">
            <img src="${JUDGE_RIGHT_AVATAR}" class="judge-avatar judge-side ${isJudge?'active speaking':''}" alt="右陪席">
          </div>
          <div class="bailiff-stand left ${shockClass}"><img src="${BAILIFF_AVATAR}" class="bailiff-avatar"><span class="bailiff-label">法警</span></div>
          <div class="bailiff-stand right ${shockClass}"><img src="${BAILIFF_AVATAR}" class="bailiff-avatar"><span class="bailiff-label">法警</span></div>
        </div>
        <div class="players-area">
          <div class="player-side left">
            <div class="avatar ${isMelon?'active speaking':''}"><img src="${MELON_AVATAR}" alt="西瓜寮代理人"></div>
            <div class="name-tag">上訴人<br>西瓜寮訴訟代理人</div>
            <div class="lawyer-desk"></div>
          </div>
          <div class="player-side right">
            <div class="avatar ${isWater?'active speaking':''}"><img src="${WATER_AVATAR}" alt="水利局代理人"></div>
            <div class="name-tag">被上訴人<br>水利局訴訟代理人</div>
            <div class="lawyer-desk"></div>
          </div>
        </div>
      </div>
    `;
  }

  renderEffects(m) {
    if (!m.effect) return '';
    let html = '<div class="effect-layer">';
    if (m.effect === 'wig_fall') {
      html += `<svg class="falling-wig" viewBox="0 0 16 16"><rect x="4" y="1" width="8" height="3" fill="#eee"/></svg>`;
    } else if (m.effect === 'gun') {
      for(let i=0; i<6; i++) {
        html += `<div class="bullet-hole" style="left:${Math.random()*100}%; top:${Math.random()*100}%;"></div>`;
      }
    }
    html += '</div>';
    return html;
  }

  render(m) {
    let h = '';
    
    if (m.state === 'cover') {
      h = `
        <div class="cover-screen">
          <div class="cover-case-no">臺灣高等法院臺中分院 107 年度重上更三字第 17 號</div>
          <div class="cover-title">西瓜寮裁判所</div>
          <div class="cover-scale">⚖️</div>
          <div class="press-start" onclick="window.startInvestigation()">▶ PRESS START ◀</div>
        </div>
      `;
    } 
    else if (m.state === 'rpg') {
      const mapData = RPG_MAPS[m.currentMap];
      h = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <h3 style="color:var(--gold);">📍 勘驗中：${mapData.name} (SP: ${m.sp})</h3>
          <div>
            <button class="top-menu-btn" onclick="window.changeMap('river')">河床</button>
            <button class="top-menu-btn" onclick="window.changeMap('courtroom')">卷宗室</button>
            <button class="top-menu-btn" onclick="window.changeMap('miaoli')">縣府</button>
            <button class="top-menu-btn" style="background:var(--green); color:#000;" onclick="window.startTrial()">🚀 開庭辯論</button>
          </div>
        </div>
        <div class="rpg-container" id="rpgViewport" onclick="window.onMapClick(event)">
          <div class="rpg-viewport" style="background: ${mapData.bg};">
            <div class="rpg-player" style="left: ${m.playerPos.x}px; top: ${m.playerPos.y}px; background-image: url('${MELON_AVATAR}');"></div>
            ${mapData.npcs.map(n => `
              <div class="rpg-npc" style="left: ${n.x}px; top: ${n.y}px; background-image: url('${n.avatar}');" onclick="window.interactNpc('${n.id}', event)"></div>
            `).join('')}
          </div>
          <div class="rpg-controls-bar">
            <div class="d-pad">
              <div></div><button class="d-btn" onclick="window.movePlayer(0, -20)">▲</button><div></div>
              <button class="d-btn" onclick="window.movePlayer(-20, 0)">◀</button><button class="d-btn" onclick="window.movePlayer(0, 20)">●</button><button class="d-btn" onclick="window.movePlayer(20, 0)">▶</button>
              <div></div><button class="d-btn" onclick="window.movePlayer(0, 20)">▼</button><div></div>
            </div>
            <div class="rpg-info">
              💡 <b>操作說明</b>：使用方向鍵或點擊畫面讓律師移動並靠近NPC對話蒐集證物。蒐集完畢後可點擊右上角「開庭辯論」進入法庭！
            </div>
          </div>
        </div>
      `;
    }
    else if (m.state === 'trial') {
      const s = TRIAL_SCENES[m.trialIndex];
      h += this.renderCourt(m, s.speaker);
      
      if (!m.res || m.res.type !== 'strong') {
        h += `<div class="dialog-box"><span class="speaker-name">${s.speaker}</span><div class="dialog-content">「${s.opp}」</div></div>`;
        h += `
          <div class="action-bar-court">
            <button class="action-btn btn-wait" onclick="window.actionWait()">💬 待った！(威懾)</button>
            <button class="action-btn btn-obj" onclick="window.actionObject()"> objection 異議あり！(出示證物)</button>
            <button class="action-btn btn-record" onclick="window.openRecord()">📁 調查紀錄</button>
          </div>
        `;
        h += `<div class="hint-box">${s.hint}</div>`;
      } else {
        h += `<div class="dialog-box" style="border-color:var(--green);"><span class="speaker-name" style="background:var(--green);color:#000;">上訴人(西瓜寮)</span><div class="dialog-content">「${m.res.line}」</div></div>`;
        h += `<div class="feedback ok"><strong>✔ 動搖心證！</strong>${m.res.fb}</div>`;
        h += `<div class="next-wrap"><button class="btn green" onclick="window.nextTrialStep()">進入下一階段 →</button></div>`;
      }
    }
    else if (m.state === 'calc') {
      h += this.renderCourt(m, '系統');
      h += `
        <div class="dialog-box" style="margin-top:15px;border-color:var(--blue);">
          <span class="speaker-name" style="background:var(--blue);color:#fff;">更三審法官精算</span>
          <div class="dialog-content">請根據卷證資料核算本案最終損害賠償與損益相抵金額（數量 559,221 m³，市價 275 元，清運費 47.5 元）。</div>
        </div>
        <div class="calc-facts">
          <h3 style="color:var(--gold);font-size:15px;margin-bottom:8px;">📑 卷證事實數據</h3>
          <div class="fact-row"><span class="fact-label">系爭土石數量</span><span class="fact-val">559,221 立方公尺</span></div>
          <div class="fact-row"><span class="fact-label">起訴時市價</span><span class="fact-val">每立方公尺 275 元</span></div>
          <div class="fact-row"><span class="fact-label">平均清運費</span><span class="fact-val">每立方公尺 47.5 元</span></div>
        </div>
        <div style="background:#111; padding:15px; border:3px solid #444; border-radius:4px;">
          <div style="margin-bottom:10px;">1. 輸入土石數量：<input type="text" class="calc-input" id="calcQty" value="${m.calcInput.qty}" placeholder="559221" oninput="window.updateCalc('qty', this.value)"></div>
          <div style="margin-bottom:10px;">2. 輸入市價單價：<input type="text" class="calc-input" id="calcPrice" value="${m.calcInput.price}" placeholder="275" oninput="window.updateCalc('price', this.value)"></div>
          <div style="margin-bottom:15px;">3. 輸入清運費單價：<input type="text" class="calc-input" id="calcCost" value="${m.calcInput.cost}" placeholder="47.5" oninput="window.updateCalc('cost', this.value)"></div>
          <button class="btn green" onclick="window.submitCalc()">確認計算結果</button>
        </div>
      `;
    }

    // 法庭紀錄 Modal 抽屜
    if (m.bagOpen) {
      h += `
        <div class="court-record-modal" onclick="window.closeRecord()">
          <div class="record-box" onclick="event.stopPropagation()">
            <div class="record-tabs">
              <div class="record-tab ${m.recordTab==='evidence'?'active':''}" onclick="window.setRecordTab('evidence')">📁 證物檔案 (${Object.keys(m.inventory).length})</div>
              <div class="record-tab ${m.recordTab==='laws'?'active':''}" onclick="window.setRecordTab('laws')">⚖️ 核心法條庫</div>
              <div class="record-tab ${m.recordTab==='timeline'?'active':''}" onclick="window.setRecordTab('timeline')">📜 歷審時間軸</div>
            </div>
            <div class="record-body">
              ${m.recordTab === 'evidence' ? `
                <div class="evidence-grid">
                  ${Object.values(m.inventory).map(e => `
                    <div class="evidence-card" onclick="window.presentEvidence('${e.id}')">
                      <span class="ev-icon">${e.icon}</span>
                      <span class="ev-name">${e.name}</span>
                    </div>
                  `).join('')}
                </div>
              ` : m.recordTab === 'laws' ? `
                ${ALL_LAWS.map(l => `<div class="law-item"><b>${l.name}</b><br>${l.desc}</div>`).join('')}
              ` : `
                ${ALL_TIMELINE.map(t => `<div class="timeline-item"><b>[${t.year}] ${t.title}</b><br>${t.desc}</div>`).join('')}
              `}
            </div>
            <button class="record-close" onclick="window.closeRecord()">關閉紀錄</button>
          </div>
        </div>
      `;
    }

    // 角色彈出對話
    if (m.charPopup) {
      h += `
        <div class="character-popup-overlay" onclick="window.closePopup()">
          <div class="character-popup">
            <div class="character-portrait" style="color:${m.charPopup.color};">
              <img src="${m.charPopup.icon}" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;">
            </div>
            <div class="character-dialog" style="border-color:${m.charPopup.color};">
              <span class="speaker-name" style="background:${m.charPopup.color}; color:#000;">${m.charPopup.speaker}</span>
              <div class="dialog-content">${m.charPopup.text}</div>
            </div>
          </div>
        </div>
      `;
    }

    this.r.innerHTML = h;
  }
}

class Ctrl {
  constructor(m, v) { this.m = m; this.v = v; }
  start() { this.v.render(this.m); }
}

const app = new Ctrl(new Model(), new View(document.getElementById('app')));

// 遊戲控制器全域綁定
window.startInvestigation = () => {
  app.m.state = 'rpg';
  app.m.initInventory();
  app.start();
};

window.changeMap = (mapName) => {
  app.m.currentMap = mapName;
  app.start();
};

window.movePlayer = (dx, dy) => {
  app.m.playerPos.x = Math.max(50, Math.min(750, app.m.playerPos.x + dx));
  app.m.playerPos.y = Math.max(50, Math.min(270, app.m.playerPos.y + dy));
  app.start();
};

window.onMapClick = (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  app.m.playerPos.x = x;
  app.m.playerPos.y = y;
  app.start();
};

window.interactNpc = (npcId, e) => {
  e.stopPropagation();
  const mapData = RPG_MAPS[app.m.currentMap];
  const npc = mapData.npcs.find(n => n.id === npcId);
  if (npc) {
    if (npc.item && !app.m.collectedItems[npc.item]) {
      app.m.collectedItems[npc.item] = true;
      app.m.inventory[npc.item] = ALL_EVIDENCE[npc.item];
      app.m.sp += 10;
    }
    app.m.charPopup = {
      speaker: npc.name,
      text: npc.text + (npc.item ? `\n\n【獲得證物：${ALL_EVIDENCE[npc.item].name}】` : ''),
      icon: npc.avatar,
      color: 'var(--gold)'
    };
    app.start();
  }
};

window.startTrial = () => {
  app.m.state = 'trial';
  app.m.trialIndex = 0;
  app.start();
};

window.openRecord = () => { app.m.bagOpen = true; app.start(); };
window.closeRecord = () => { app.m.bagOpen = false; app.start(); };
window.setRecordTab = (tab) => { app.m.recordTab = tab; app.start(); };
window.closePopup = () => { app.m.charPopup = null; app.start(); };

window.actionWait = () => {
  app.m.charPopup = {
    speaker: '上訴人(西瓜寮)',
    text: '等一下！代理人，對方這段陳述邏輯上有明顯漏洞，請再仔細說明！',
    icon: MELON_AVATAR,
    color: 'var(--blue)'
  };
  app.start();
};

window.actionObject = () => {
  app.m.bagOpen = true;
  app.start();
};

window.presentEvidence = (id) => {
  app.m.bagOpen = false;
  const s = TRIAL_SCENES[app.m.trialIndex];
  if (s.ans.includes(id)) {
    app.m.score += 20;
    app.m.trustMelon += 25;
    app.m.trustWater -= 25;
    app.m.trustChange = '+25%';
    app.m.trustChangeColor = 'var(--green)';
    app.m.res = { ok: true, type: 'strong', line: s.success, fb: s.fbOk };
    
    // 閃光特效
    document.getElementById('flash-overlay').classList.add('flash-active');
    document.getElementById('decisive-text').classList.add('decisive-active');
    setTimeout(() => {
      document.getElementById('flash-overlay').classList.remove('flash-active');
      document.getElementById('decisive-text').classList.remove('decisive-active');
    }, 1500);
  } else {
    app.m.trustMelon = Math.max(0, app.m.trustMelon - 15);
    app.m.trustWater += 15;
    app.m.trustChange = '-15%';
    app.m.trustChangeColor = 'var(--red)';
    app.m.res = { ok: false, type: 'weak', fb: s.fbNg };
  }
  app.start();
};

window.nextTrialStep = () => {
  app.m.res = null;
  app.m.trialIndex++;
  if (app.m.trialIndex >= TRIAL_SCENES.length) {
    app.m.state = 'calc';
  }
  app.start();
};

window.updateCalc = (type, val) => { app.m.calcInput[type] = val; };
window.submitCalc = () => {
  const q = parseFloat(app.m.calcInput.qty);
  const p = parseFloat(app.m.calcInput.price);
  const c = parseFloat(app.m.calcInput.cost);
  if (q === 559221 && p === 275 && c === 47.5) {
    document.getElementById('victory-overlay').classList.add('show');
  } else {
    alert('計算數值有誤，請依卷證資料重新輸入！');
  }
};

app.start();
</script>
</body>
</html>
