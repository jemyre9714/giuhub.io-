<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>西瓜寮裁判所｜THE WEIGHT OF JUSTICE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #f59e0b;
      --gold-bright: #fde047;
      --red: #f43f5e;
      --green: #10b981;
      --blue: #38bdf8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #06080f;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      overflow-x: hidden;
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(245, 158, 11, 0.14) 0%, transparent 55%),
        radial-gradient(ellipse at 15% 85%, rgba(16, 185, 129, 0.08) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 85%, rgba(244, 63, 94, 0.08) 0%, transparent 45%);
    }
    .font-serif-tc { font-family: 'Noto Serif TC', serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }

    /* 商業級主機框體 */
    #app {
      width: 100%;
      max-width: 1060px;
      background: linear-gradient(180deg, #0d121f 0%, #070a12 100%);
      border: 2px solid rgba(245, 158, 11, 0.45);
      border-radius: 20px;
      box-shadow:
        0 25px 70px -15px rgba(0, 0, 0, 0.95),
        0 0 0 1px rgba(255, 255, 255, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* 角色像素與高畫質混合渲染 */
    .pixel-art {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* 動態光束與法庭木質層次 */
    .court-stage {
      background:
        radial-gradient(circle at 50% 15%, rgba(253, 224, 71, 0.18) 0%, transparent 52%),
        linear-gradient(180deg, #1b110a 0%, #2c190e 45%, #160c06 100%);
      position: relative;
      overflow: hidden;
    }
    .court-pillars {
      background-image: repeating-linear-gradient(
        90deg,
        rgba(245, 158, 11, 0.04) 0px,
        rgba(245, 158, 11, 0.04) 2px,
        transparent 2px,
        transparent 64px
      );
    }
    .court-stage.danger-mode {
      animation: dangerPulse 0.6s infinite alternate;
    }
    @keyframes dangerPulse {
      from { box-shadow: inset 0 0 40px rgba(244, 63, 94, 0.5); filter: contrast(1.15); }
      to { box-shadow: inset 0 0 95px rgba(244, 63, 94, 0.95); filter: contrast(1.35) saturate(1.4); }
    }

    /* 說話彈跳動畫 */
    .speaking-bounce {
      animation: speakBob 0.28s infinite alternate ease-in-out;
    }
    @keyframes speakBob {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-7px) scale(1.03); }
    }

    /* 心證浮動數值 */
    .trust-float {
      position: absolute;
      top: 44px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.95), 0 0 2px #000;
      animation: floatDelta 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      pointer-events: none;
      z-index: 60;
    }
    @keyframes floatDelta {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(0.8); }
      20% { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -26px) scale(1); }
    }

    /* 經典搞笑特效保留並強化 */
    .falling-wig {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      width: 64px;
      height: 64px;
      animation: wigDrop 1.8s forwards cubic-bezier(0.55, 0, 1, 0.45);
      z-index: 30;
    }
    @keyframes wigDrop {
      0% { top: 8%; opacity: 1; transform: translateX(-50%) rotate(0deg); }
      75% { top: 78%; opacity: 1; transform: translateX(-40%) rotate(140deg); }
      100% { top: 105%; opacity: 0; transform: translateX(-35%) rotate(200deg); }
    }
    .bald-judge {
      filter: grayscale(0.45) contrast(1.25) brightness(1.15);
    }
    .note-bounce {
      position: absolute;
      font-size: 26px;
      animation: noteFloat 1.6s ease-out forwards;
      z-index: 30;
    }
    @keyframes noteFloat {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-110px) scale(1.5) rotate(18deg); opacity: 0; }
    }
    .bullet-hole {
      position: absolute;
      width: 38px;
      height: 38px;
      background: radial-gradient(circle, #000 22%, #64748b 45%, transparent 68%);
      border-radius: 50%;
      animation: popScale 0.2s ease-out;
      z-index: 30;
    }
    .tumbleweed {
      position: absolute;
      font-size: 44px;
      animation: blowAcross 3.5s linear forwards;
      z-index: 30;
    }
    @keyframes blowAcross {
      0% { transform: translateX(-80px) rotate(0deg); }
      100% { transform: translateX(1050px) rotate(720deg); }
    }
    .bug-fly {
      position: absolute;
      font-size: 32px;
      animation: bugSwarm 2.2s ease-in-out forwards;
      z-index: 30;
    }
    @keyframes bugSwarm {
      0% { transform: translate(0, 0) scale(0.6) rotate(0deg); opacity: 0; }
      20% { opacity: 1; }
      50% { transform: translate(60px, -45px) scale(1.3) rotate(25deg); }
      100% { transform: translate(-40px, -115px) scale(1.1) rotate(-20deg); opacity: 0; }
    }
    .aa-slot-active {
      box-shadow: 0 0 0 3px #fbbf24, 0 0 18px rgba(251, 191, 36, 0.75);
      animation: aaSlotPulse 1.1s infinite alternate;
    }
    @keyframes aaSlotPulse {
      from { border-color: #fde047; }
      to { border-color: #f59e0b; }
    }
    .desk-food-drop {
      animation: dropFood 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes dropFood {
      0% { transform: translateY(-60px) scale(2); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .bailiff-shock {
      animation: shockJump 0.14s infinite alternate;
    }
    @keyframes shockJump {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-16px) scale(1.22) rotate(5deg); filter: drop-shadow(0 0 16px #f43f5e); }
    }

    /* 畫面震動與「異議あり！」爆裂特效 */
    .shake {
      animation: screenShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    @keyframes screenShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-12px); }
      40%, 80% { transform: translateX(12px); }
    }
    #flash-overlay {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 5000;
      pointer-events: none;
      opacity: 0;
    }
    .flash-active {
      animation: flashBang 0.38s ease-out;
    }
    @keyframes flashBang {
      0% { opacity: 0.92; }
      100% { opacity: 0; }
    }
    #decisive-text {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5001;
      pointer-events: none;
      opacity: 0;
      padding: 16px;
    }
    .decisive-active {
      animation: decisivePop 1.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes decisivePop {
      0% { opacity: 0; transform: scale(0.4) rotate(-12deg); }
      18% { opacity: 1; transform: scale(1.12) rotate(4deg); }
      35% { transform: scale(1) rotate(-2deg); }
      82% { opacity: 1; transform: scale(1) rotate(0deg); }
      100% { opacity: 0; transform: scale(1.35) rotate(0deg); }
    }
    .burst-badge {
      background: radial-gradient(circle, #dc2626 0%, #991b1b 70%, #450a0a 100%);
      border: 5px solid #fde047;
      box-shadow: 0 0 0 6px #000, 0 20px 50px rgba(0, 0, 0, 0.95);
      padding: 16px 40px;
      border-radius: 16px;
      transform: rotate(-6deg);
    }
    /* 勝利彩帶 */
    .confetti {
      position: absolute;
      top: -12px;
      animation: confettiFall linear forwards;
      z-index: 1;
    }
    @keyframes confettiFall {
      to { transform: translateY(105vh) rotate(720deg); }
    }

    @keyframes popScale {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popScale 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 街機 CPS-2 封面專屬樣式 */
    .cps2-sunburst {
      background:
        radial-gradient(circle at 50% 54%, rgba(245, 158, 11, 0.26) 0%, rgba(15, 23, 42, 0.85) 65%, #050811 100%),
        repeating-conic-gradient(from 0deg at 50% 54%, rgba(251, 191, 36, 0.08) 0deg 8deg, transparent 8deg 16deg);
    }
    .cps2-title-text {
      background: linear-gradient(180deg, #fef08a 0%, #f59e0b 48%, #ea580c 52%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 5px 0 #450a0a) drop-shadow(0 10px 18px rgba(0,0,0,0.95));
    }
    .cps2-scanlines {
      background-image: repeating-linear-gradient(
        180deg,
        transparent 0px,
        transparent 4px,
        rgba(0, 0, 0, 0.28) 4px,
        rgba(0, 0, 0, 0.28) 6px
      );
    }
    .cps2-skew {
      transform: skewX(-12deg);
    }
    .cps2-unskew {
      transform: skewX(12deg);
    }
    .vs-pulse {
      animation: vsBeat 1.4s infinite alternate ease-in-out;
    }
    @keyframes vsBeat {
      from { transform: scale(1) rotate(-4deg); }
      to { transform: scale(1.08) rotate(2deg); }
    }

    /* 角色選擇卡片特效 */
    .role-dossier {
      position: relative;
      overflow: hidden;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .role-dossier::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, transparent 30%, rgba(255,255,255,0.08) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
      pointer-events: none;
    }
    .role-dossier:hover::before {
      transform: translateX(100%);
    }
    .role-dossier:hover {
      transform: translateY(-6px) scale(1.015);
    }
  </style>
</head>

  <script type="module">
    /**

    /**
     * ============================================================================
     * 4. Model 狀態與核心邏輯層（完整保留所有計算與判定規則）
     * ============================================================================
     */
    class Model {
      constructor() {
        this.i = 0;
        this.score = 0;
        this.max = 60;
        this.lives = 3;
        this.bag = false;
        this.res = null;
        this.logs = [];
        this.role = null;
        this.scenes = [];
        this.charPopup = null;
        this.gameover = false;
        this.bailiffAnim = false;
        this.judgeStep = 0;
        this.calcInput = { qty: '', price: '', cost: '' };
        this.bailiffShock = false;
        this.isDanger = false;
        this.effect = null;
        this.deskItem = null;
        this.trustMelon = 50;
        this.trustWater = 50;
        this.trustChange = null;
        this.trustChangeColor = null;
        this.recordBag = [];
        this.selectedSlot = 0;
        this.recordTab = 'evidence'; // 'evidence' | 'statutes'
        this.recordReadOnly = false;
      }

      get cur() { return this.scenes[this.i]; }

      open(readOnly = false) {
        const s = this.cur;
        this.bag = true;
        this.recordReadOnly = readOnly;
        this.recordTab = 'evidence';
        this.selectedSlot = 0;
        // 將所有關鍵書證與娛樂迷因證物全部匯集在一起，提供完整選擇感
        const allIds = Object.keys(ALL_EVIDENCE);
        if (s && s.bag && s.bag.length > 0 && !readOnly) {
          const priority = [...s.bag];
          const rest = allIds.filter(id => !priority.includes(id));
          this.recordBag = [...priority, ...rest];
        } else {
          this.recordBag = allIds;
        }
        if (!readOnly) {
          this.res = null;
          this.charPopup = null;
          this.effect = null;
          this.deskItem = null;
          this.trustChange = null;
        }
      }

      closeBag() {
        this.bag = false;
      }

      selectSlot(idx) {
        const listLen = this.recordTab === 'evidence' ? this.recordBag.length : STATUTES_LIST.length;
        if (listLen === 0) return;
        this.selectedSlot = (idx + listLen) % listLen;
        sfx.blip(680);
      }

      switchRecordTab(tab) {
        this.recordTab = tab;
        this.selectedSlot = 0;
        sfx.blip(760);
      }

      pick(id) {
        const s = this.cur;
        const ev = ALL_EVIDENCE[id];
        this.trustChange = null;

        // 搞笑證物觸發專屬懲罰與特效
        if (ev.joke) {
          sfx.damage();
          this.lives--;
          this.bag = false;
          this.effect = ev.effect;

          if (ev.isFood) {
            const deskSide = (this.role === 'melon') ? 'left' : (this.role === 'water' ? 'right' : 'left');
            this.deskItem = { icon: ev.foodIcon, side: deskSide };
          }

          if (id === 'j_gun') {
            this.bailiffShock = true;
            this.isDanger = true;
            this.shakeScreen();
            this.charPopup = { speaker: '法警', text: ev.joke, icon: BAILIFF_AVATAR, fallbackType: 'bailiff', rawFile: 'bailiff.png', color: '#f43f5e', isImg: true };
          } else if (id === 'j_wig') {
            this.charPopup = { speaker: '審判長', text: ev.joke, icon: JUDGE_AVATAR, fallbackType: 'judge', rawFile: 'judge.png', color: '#f59e0b', isImg: true };
          } else if (id === 'j_earbuds') {
            this.charPopup = { speaker: '左陪席・陳正直', text: ev.joke, icon: JUDGE_LEFT_AVATAR, fallbackType: 'judge', rawFile: 'judge_left.png', color: '#38bdf8', isImg: true };
          } else if (id === 'j_vegetable_bugs') {
            this.shakeScreen();
            this.charPopup = { speaker: '審判長（暴怒拍桌）', text: ev.joke, memeSvg: ev.memeSvg, color: '#f43f5e', isMeme: true };
          } else if (id === 'j_over_my_dead_body') {
            this.shakeScreen();
            this.charPopup = { speaker: '審判長（扶額無奈）', text: ev.joke, memeSvg: ev.memeSvg, color: '#f43f5e', isMeme: true };
          } else {
            this.charPopup = { speaker: '審判長', text: ev.joke, icon: JUDGE_AVATAR, fallbackType: 'judge', rawFile: 'judge.png', color: '#f59e0b', isImg: true };
          }

          if (this.role === 'melon') {
            const penalty = ev.fatal ? 40 : 15;
            this.trustMelon = Math.max(0, this.trustMelon - penalty);
            this.trustWater += penalty;
            this.trustChange = `-${penalty}%`;
            this.trustChangeColor = '#f43f5e';
          }
          if (this.role === 'water') {
            const penalty = ev.fatal ? 40 : 15;
            this.trustWater = Math.max(0, this.trustWater - penalty);
            this.trustMelon += penalty;
            this.trustChange = `-${penalty}%`;
            this.trustChangeColor = '#f43f5e';
          }

          if (this.lives <= 0 || (this.role === 'melon' && this.trustMelon <= 0) || (this.role === 'water' && this.trustWater <= 0)) {
            this.res = { ok: false, rev: 'GameOver' };
            this.logs.push({ ok: false, fb: '心證崩盤，被趕出法庭' });
            setTimeout(() => {
              this.charPopup = null;
              this.bailiffAnim = true;
              app.start();
              setTimeout(() => {
                this.bailiffAnim = false;
                this.gameover = true;
                app.start();
              }, 2400);
            }, 2000);
          } else {
            this.res = { ok: false, retry: true };
          }
          return this.res;
        }

        // 正確證物判定
        if (s.ans.includes(id)) {
          sfx.objection();
          this.score += 10;
          this.bag = false;
          this.res = { ok: true, fb: s.fbOk, line: s.success, type: 'strong' };
          this.logs.push({ ok: true, fb: s.fbOk });

          if (this.role === 'melon') {
            this.trustMelon += 20;
            this.trustWater -= 20;
            this.trustChange = '+20%';
            this.trustChangeColor = '#10b981';
            this.charPopup = { speaker: '上訴人西瓜寮訴訟代理人', text: s.success, icon: MELON_POINT_AVATAR, fallbackType: 'melon', rawFile: 'lawyer_melon_point.png', color: '#10b981', isImg: true };
          } else if (this.role === 'water') {
            this.trustWater += 20;
            this.trustMelon -= 20;
            this.trustChange = '+20%';
            this.trustChangeColor = '#10b981';
            this.charPopup = { speaker: '被上訴人水利局訴訟代理人', text: s.success, icon: WATER_POINT_AVATAR, fallbackType: 'water', rawFile: 'lawyer_water_point.png', color: '#f43f5e', isImg: true };
          }

          setTimeout(() => this.decisiveEffect(), 80);
        } else {
          sfx.damage();
          this.bag = false;
          this.res = { ok: false, fb: s.fbNg, type: 'weak' };

          if (this.role === 'melon') {
            this.trustMelon = Math.max(0, this.trustMelon - 10);
            this.trustWater += 10;
            this.trustChange = '-10%';
            this.trustChangeColor = '#f43f5e';
          }
          if (this.role === 'water') {
            this.trustWater = Math.max(0, this.trustWater - 10);
            this.trustMelon += 10;
            this.trustChange = '-10%';
            this.trustChangeColor = '#f43f5e';
          }
        }
        return this.res;
      }

      closeCharPopup() {
        this.charPopup = null;
        if (!(this.res && this.res.rev === 'GameOver')) {
          app.start();
        }
      }

      judgeNextStep() {
        if (this.judgeStep < 2) {
          sfx.gavel();
          this.judgeStep++;
        }
      }

      judgePick(optionType, trustM, trustW, fb) {
        sfx.gavel();
        this.trustMelon += trustM;
        this.trustWater += trustW;

        this.trustChange = trustM > 0 ? `西瓜 +${trustM}%` : (trustW > 0 ? `水利 +${trustW}%` : '');
        if (trustM < 0) this.trustChange = `西瓜 ${trustM}%`;
        if (trustW < 0) this.trustChange = `水利 ${trustW}%`;

        this.trustChangeColor = trustM > 0 ? '#10b981' : '#f43f5e';
        this.score += (trustM > 0) ? 10 : 0;
        this.res = { ok: trustM > 0, fb };
        this.logs.push({ ok: trustM > 0, fb });
      }

      storyPick(isCorrect) {
        const s = this.cur;
        if (isCorrect) {
          sfx.gavel();
          this.res = { ok: true, fb: s.fbOk };
        } else {
          sfx.damage();
          this.res = { ok: false, fb: s.fbNg };
        }
      }

      setCalcInput(type, val) {
        this.calcInput[type] = val;
      }

      submitCalc() {
        const ans = this.cur.answer;
        const userQty = parseFloat(String(this.calcInput.qty).replace(/,/g, ''));
        const userPrice = parseFloat(String(this.calcInput.price).replace(/,/g, ''));
        const userCost = parseFloat(String(this.calcInput.cost).replace(/,/g, ''));

        const isCorrect = (userQty === ans.qty) && (userPrice === ans.price) && (userCost === ans.cost);
        if (isCorrect) {
          sfx.objection();
          this.score += 10;
          this.res = { ok: true, msg: '計算正確！' };
          this.logs.push({ ok: true, fb: '計算正確' });
        } else {
          sfx.damage();
          this.res = { ok: false, msg: '數字有誤，請重新核對卷宗事實！' };
          this.logs.push({ ok: false, fb: '計算錯誤' });
        }
      }

      next() {
        if (this.i < this.scenes.length - 1) {
          sfx.gavel();
          this.i++;
          this.lives = 3;
          this.bag = false;
          this.res = null;
          this.charPopup = null;
          this.effect = null;
          this.deskItem = null;
          this.bailiffAnim = false;
          this.gameover = false;
          this.bailiffShock = false;
          this.isDanger = false;
          this.judgeStep = 0;
          this.calcInput = { qty: '', price: '', cost: '' };
          this.trustChange = null;
        }
      }

      shakeScreen() {
        const a = document.getElementById('app');
        if (a) {
          a.classList.add('shake');
          setTimeout(() => a.classList.remove('shake'), 550);
        }
      }

      decisiveEffect() {
        const flash = document.getElementById('flash-overlay');
        const dText = document.getElementById('decisive-text');
        flash.classList.add('flash-active');
        dText.classList.add('decisive-active');
        setTimeout(() => {
          flash.classList.remove('flash-active');
          dText.classList.remove('decisive-active');
        }, 1400);
      }
    }

                       class="role-dossier group bg-gradient-to-b ${c.bgGlow} border-2 ${c.borderCls} rounded-2xl p-4 flex flex-col justify-between shadow-2xl cursor-pointer">
                    <div>
                      <!-- 頂部代號與難度標籤 -->
                      <div class="flex items-center justify-between gap-1 mb-3">
                        <span class="font-mono text-[10px] font-black text-slate-400 tracking-wider">${c.code}</span>
                        <span class="text-[10px] font-black px-2 py-0.5 rounded-full border ${c.tagCls}">${c.badge}</span>
                      </div>

                      <!-- 立繪舞台框 -->
                      <div class="w-full h-28 rounded-xl bg-slate-950/85 border border-white/10 flex items-center justify-center mb-3 relative overflow-hidden group-hover:border-white/25 transition">
                        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(255,255,255,0.08),transparent_70%)]"></div>
                        <div class="relative z-10 group-hover:scale-110 transition-transform duration-200">
                          ${c.visual}
                        </div>
                      </div>

                      <!-- 角色名稱與副標 -->
                      <div class="text-[10px] font-cinzel font-bold tracking-widest text-slate-400 uppercase">${c.sub}</div>
                      <h3 class="font-serif-tc text-lg font-black text-white mt-0.5 mb-2 leading-snug">${c.title}</h3>
                      <p class="text-xs text-slate-300 leading-relaxed mb-3">${c.desc}</p>
                    </div>

                    <!-- 底部心證天秤預覽與啟動按鈕 -->
                    <div class="space-y-2.5 pt-2 border-t border-white/10">
                      <div>
                        <div class="flex items-center justify-between text-[10px] font-bold text-slate-400 mb-1">
                          <span>${c.difficulty}</span>
                          <span class="text-slate-300">${c.trustInfo}</span>
                        </div>
                        <div class="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden flex border border-slate-800">
                          <div class="h-full bg-emerald-400" style="width:${c.trustMelonPct}%"></div>
                          <div class="h-full bg-rose-500" style="width:${100 - c.trustMelonPct}%"></div>
                        </div>
                      </div>

                      <div class="w-full py-2.5 rounded-xl ${c.btnCls} font-black text-xs sm:text-sm text-center shadow-lg tracking-wider group-hover:brightness-110 transition">
                        ${c.cta}
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>

              <!-- 底部全證物庫提示列 -->
              <div class="relative z-10 bg-slate-950/90 border border-slate-800 rounded-xl px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-300">
                <span>📂 <b>全證物開放模式：</b>法庭紀錄已整合全部 ${Object.keys(ALL_EVIDENCE).length} 項關鍵書證與娛樂迷因（含「南北菜蟲一起串聯」、「Over My Dead Body」），隨時自由挑選指證！</span>
                <span class="text-amber-400 font-bold">誤用娛樂證物將扣減心證值</span>
              </div>
            </div>
          `;
          return;
        }

        // 3. Game Over 畫面
        if (m.gameover) {
          this.r.innerHTML = `
            <div class="min-h-[70vh] bg-slate-950 flex flex-col items-center justify-center p-6 text-center animate-pop">
              <div class="font-cinzel text-5xl sm:text-7xl font-black text-rose-500 tracking-wider mb-3 drop-shadow-[0_4px_20px_rgba(244,63,94,0.6)]">
                GAME OVER
              </div>
              <p class="text-base sm:text-xl text-slate-200 font-bold mb-6">
                心證崩盤，你已被法警強制帶離法庭！
              </p>
              <button onclick="location.reload()" class="bg-rose-600 hover:bg-rose-500 active:scale-95 text-white font-black px-8 py-3.5 rounded-2xl shadow-lg transition cursor-pointer">
                🔄 重新開庭挑戰
              </button>
            </div>
          `;
          return;
        }

        // 4. 法警拖出法庭過場動畫
        if (m.bailiffAnim) {
          const playerImg = m.role === 'melon' ? MELON_AVATAR : WATER_AVATAR;
          const playerType = m.role === 'melon' ? 'melon' : 'water';
          const playerFile = m.role === 'melon' ? 'lawyer_melon.png' : 'lawyer_water.png';
          this.r.innerHTML = `
            <div class="min-h-[70vh] bg-slate-950 flex flex-col items-center justify-center p-6 relative overflow-hidden">
              <div class="font-serif-tc text-2xl sm:text-4xl font-black text-rose-500 mb-12 animate-pulse text-center">
                「法警！將這位訴訟代理人帶出去！」
              </div>
              <div class="bailiff-drag">
                <img src="${BAILIFF_AVATAR}" onerror="window.handleImgFallback(this,'bailiff','bailiff.png')" class="pixel-art w-20 h-20 sm:w-28 sm:h-28 object-contain" />
                <img src="${playerImg}" onerror="window.handleImgFallback(this,'${playerType}','${playerFile}')" class="pixel-art w-16 h-16 sm:w-24 sm:h-24 object-contain rotate-12" />
                <img src="${BAILIFF_AVATAR}" onerror="window.handleImgFallback(this,'bailiff','bailiff.png')" class="pixel-art w-20 h-20 sm:w-28 sm:h-28 object-contain" />
              </div>
            </div>
          `;
          return;
        }

        const s = m.cur;
        let h = '';

        // 5. 終章宣判結算
        if (s.type === 'end' || s.type === 'end_story') {
          h += this.renderCourt(m, '審判長');
          const isTie = Math.round(m.trustMelon) === Math.round(m.trustWater);
          const isMelonWin = m.trustMelon > m.trustWater;

          h += `<div class="p-4 sm:p-6 space-y-4">`;
          if (s.type === 'end_story') {
            h += `
              <div class="bg-slate-900/95 border-2 border-amber-400 rounded-2xl p-4 sm:p-5 relative shadow-xl">
                <span class="inline-block bg-amber-400 text-slate-950 font-black text-xs px-3 py-0.5 rounded-md mb-2">審判長宣判主文</span>
                <p class="text-sm sm:text-lg text-slate-100 leading-relaxed font-bold">
                  本院判斷如下：被上訴人水利局應給付上訴人西瓜寮 <strong class="text-amber-300">1 億 2,722 萬 2,777 元</strong>，及自 99 年 6 月 8 日起至清償日止，按年息 5% 計算之利息。
                </p>
              </div>
              <div class="flex justify-center">
                <button onclick="window.playVictory(true)" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black px-8 py-3.5 rounded-2xl shadow-lg transition cursor-pointer">
                  🏆 觀看判決結果
                </button>
              </div>
            `;
          } else if (isTie) {
            h += `
              <div class="bg-slate-900 border-2 border-amber-400 rounded-2xl p-5 text-center space-y-4">
                <h2 class="font-serif-tc text-xl sm:text-2xl font-black text-amber-300">⚖️ 兩造勢均力敵，心證 50% / 50% ⚖️</h2>
                <p class="text-xs sm:text-sm text-slate-300">請法官行使最終裁量權，決定本案勝訴方。</p>
                <div class="flex flex-col sm:flex-row justify-center gap-3">
                  <button onclick="window.playVictory(true)" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-6 py-3 rounded-xl cursor-pointer">判決西瓜寮勝訴</button>
                  <button onclick="window.playVictory(false)" class="bg-rose-600 hover:bg-rose-500 text-white font-black px-6 py-3 rounded-xl cursor-pointer">判決水利局勝訴</button>
                </div>
              </div>
            `;
          } else if (isMelonWin) {
            h += `
              <div class="bg-slate-900/95 border-2 border-emerald-400 rounded-2xl p-4 sm:p-5 shadow-xl">
                <span class="inline-block bg-emerald-400 text-slate-950 font-black text-xs px-3 py-0.5 rounded-md mb-2">審判長宣判主文</span>
                <p class="text-sm sm:text-lg text-slate-100 leading-relaxed font-bold">
                  本院判斷如下：被上訴人水利局應給付上訴人西瓜寮 <strong class="text-emerald-300">1 億 2,722 萬 2,777 元</strong>，及自 99 年 6 月 8 日起至清償日止，按年息 5% 計算之利息。
                </p>
              </div>
              <div class="flex justify-center">
                <button onclick="window.playVictory(true)" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black px-8 py-3.5 rounded-2xl shadow-lg transition cursor-pointer">
                  🏆 西瓜寮勝訴！
                </button>
              </div>
            `;
          } else {
            h += `
              <div class="bg-slate-900/95 border-2 border-rose-500 rounded-2xl p-4 sm:p-5 shadow-xl">
                <span class="inline-block bg-rose-500 text-white font-black text-xs px-3 py-0.5 rounded-md mb-2">審判長宣判主文</span>
                <p class="text-sm sm:text-lg text-slate-100 leading-relaxed font-bold">
                  本院判斷如下：上訴人西瓜寮之訴及假執行之聲請均駁回。訴訟費用由上訴人負擔。
                </p>
              </div>
              <div class="flex justify-center">
                <button onclick="window.playVictory(false)" class="bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-black px-8 py-3.5 rounded-2xl shadow-lg transition cursor-pointer">
                  ⚖️ 水利局勝訴！
                </button>
              </div>
            `;
          }
          h += `</div>`;
          this.r.innerHTML = h;
          return;
        }

        // 6. 各模式主要審理畫面
        if (m.role === 'story') {
          if (s.type === 'story') {
            h += this.renderCourt(m, s.speaker);
            h += this.renderDialoguePanel(s.speaker, s.text, 'amber');
            h += `<div class="px-4 pb-4 flex justify-center"><button id="btnNext" class="bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-black px-8 py-3 rounded-xl shadow-lg transition cursor-pointer">${s.btn} ▶</button></div>`;
          } else if (s.type === 'story_choice') {
            h += this.renderCourt(m, s.speaker);
            h += this.renderDialoguePanel(s.speaker, s.text, 'amber');
            h += `<div class="px-4 pb-4 space-y-3">`;
            if (!m.res) {
              h += `
                <div class="bg-slate-900/90 border border-amber-500/40 rounded-2xl p-4">
                  <div class="text-xs font-black text-amber-400 mb-3 text-center">💭 請做出法官裁決</div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    ${s.opts.map((opt, idx) => `
                      <button onclick="window.storyDecide(${opt.correct})"
                              class="${idx === 1 ? 'bg-sky-600 hover:bg-sky-500' : 'bg-rose-600 hover:bg-rose-500'} active:scale-95 text-white font-black py-3 px-4 rounded-xl shadow transition cursor-pointer">
                        ${opt.label}
                      </button>
                    `).join('')}
                  </div>
                </div>
              `;
            } else {
              h += this.renderFeedbackBanner(m.res.ok ? 'ok' : 'ng', m.res.ok ? '✔ 裁決正確！' : '✘ 裁決錯誤！', m.res.fb);
              h += `<div class="flex justify-center"><button id="btnNext" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-8 py-3 rounded-xl shadow cursor-pointer">繼續故事 →</button></div>`;
            }
            h += `</div>`;
          } else if (s.type === 'calc') {
            h += this.renderCourt(m, '系統');
            h += this.renderCalc(m, s);
          }
        } else if (m.role === 'judge') {
          if (s.type === 'story') {
            h += this.renderCourt(m, '系統');
            h += this.renderDialoguePanel('系統提示', s.text, 'amber');
            h += `<div class="px-4 pb-4 flex justify-center"><button id="btnNext" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-8 py-3 rounded-xl shadow cursor-pointer">${s.btn} ▶</button></div>`;
          } else if (s.type === 'judge_trial') {
            const activeSpeaker = (m.judgeStep === 0) ? '被上訴人水利局訴訟代理人' : (m.judgeStep === 1) ? '上訴人西瓜寮訴訟代理人' : '審判長';
            h += this.renderCourt(m, activeSpeaker);
            if (m.judgeStep === 0) {
              h += this.renderDialoguePanel('被上訴人（水利局）', `「${s.p_claim}」`, 'rose');
              h += `<div class="px-4 pb-4 flex justify-center"><button id="btnJudgeNext" class="bg-sky-600 hover:bg-sky-500 text-white font-black px-8 py-3 rounded-xl shadow cursor-pointer">聽取上訴人抗辯 →</button></div>`;
            } else if (m.judgeStep === 1) {
              h += this.renderDialoguePanel('上訴人（西瓜寮）', `「${s.d_claim}」`, 'emerald');
              h += `<div class="px-4 pb-4 flex justify-center"><button id="btnJudgeNext" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-8 py-3 rounded-xl shadow cursor-pointer">進入審判長裁決 →</button></div>`;
            } else {
              h += `<div class="p-4 space-y-3">`;
              h += `<div class="bg-slate-900 border border-amber-500/40 rounded-2xl p-4">
                      <div class="text-sm sm:text-base font-black text-amber-300 mb-3 text-center">💭 ${s.question}</div>`;
              if (!m.res) {
                h += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">`;
                s.options.forEach(opt => {
                  const cls = opt.type === 'p'
                    ? 'bg-rose-700 hover:bg-rose-600 text-white'
                    : opt.type === 'd'
                      ? 'bg-emerald-700 hover:bg-emerald-600 text-white'
                      : 'bg-amber-500 hover:bg-amber-400 text-slate-950';
                  h += `<button class="${cls} font-black text-xs sm:text-sm py-3 px-4 rounded-xl shadow transition cursor-pointer"
                                onclick="window.judgeDecide('${opt.type}', ${opt.trustM}, ${opt.trustW}, '${opt.fb}')">${opt.label}</button>`;
                });
                h += `</div>`;
              } else {
                h += this.renderFeedbackBanner(m.res.ok ? 'ok' : 'neutral', m.res.ok ? '✔ 裁決成立！' : '⚖️ 自由心證裁量', m.res.fb);
                h += `<div class="flex justify-center mt-3"><button id="btnNext" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-8 py-3 rounded-xl shadow cursor-pointer">下一章 →</button></div>`;
              }
              h += `</div></div>`;
            }
          } else if (s.type === 'calc') {
            h += this.renderCourt(m, '系統');
            h += this.renderCalc(m, s);
          }
        } else {
          // 律師對決模式（西瓜寮 / 水利局）
          if (s.type === 'story') {
            h += this.renderCourt(m, s.speaker);
            h += this.renderDialoguePanel(s.speaker, s.text, 'amber');
            h += `<div class="px-4 pb-4 flex justify-center"><button id="btnNext" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-8 py-3 rounded-xl shadow cursor-pointer">${s.btn} ▶</button></div>`;
          } else if (s.type === 'trial') {
            const isSuccess = m.res && m.res.type === 'strong';
            const speaker = !isSuccess
              ? s.speaker
              : (m.role === 'melon' ? '上訴人西瓜寮訴訟代理人' : '被上訴人水利局訴訟代理人');
            const theme = !isSuccess ? (m.role === 'melon' ? 'rose' : 'emerald') : (m.role === 'melon' ? 'emerald' : 'rose');
            const quote = !isSuccess ? `「${s.opp}」` : `「${m.res.line}」`;

            h += this.renderCourt(m, speaker);
            h += this.renderDialoguePanel(speaker, quote, theme);

            h += `<div class="px-4 pb-4 space-y-3">`;
            if (!m.res && !m.bag) {
              h += `
                <div class="bg-sky-950/70 border border-sky-500/50 rounded-xl p-3 text-center">
                  <span class="text-xs font-black text-amber-300 mr-1.5">💡 庭上提示：</span>
                  <span class="text-xs sm:text-sm text-sky-100 font-medium">${s.hint}</span>
                </div>
                <div class="flex justify-center">
                  <button id="btnObj" class="bg-gradient-to-r from-rose-600 via-red-600 to-rose-700 hover:from-rose-500 hover:to-red-500 active:scale-95 text-white font-serif-tc font-black text-xl sm:text-3xl px-10 py-3.5 rounded-2xl border-2 border-amber-300/80 shadow-[0_8px_25px_rgba(244,63,94,0.55)] transition cursor-pointer tracking-wider">
                    ⚡ 異議あり！（出示證物）
                  </button>
                </div>
              `;
            }

            if (m.bag) {
              h += this.renderCourtRecordModal(m);
            }

            if (m.res) {
              const fbType = m.res.type === 'strong' ? 'ok' : (m.res.retry ? 'ng' : 'neutral');
              const fbTitle = m.res.type === 'strong' ? '✔ 動搖心證！' : (m.res.retry ? '⚠️ 庭上失態！' : '⚖️ 證據力不足');
              h += this.renderFeedbackBanner(fbType, fbTitle, m.res.fb || '審判長對你的舉動感到困惑，請重新整理思緒！');

              if (m.res.retry) {
                h += `<div class="flex justify-center"><button id="btnRetry" class="bg-rose-600 hover:bg-rose-500 text-white font-black px-8 py-3 rounded-xl shadow cursor-pointer">重新選擇證物</button></div>`;
              } else {
                h += `<div class="flex justify-center"><button id="btnNext" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-8 py-3 rounded-xl shadow cursor-pointer">下一章 →</button></div>`;
              }
            }
            h += `</div>`;
          } else if (s.type === 'calc') {
            h += this.renderCourt(m, '系統');
            h += this.renderCalc(m, s);
          }
        }

        // 故事模式或審判長模式點擊右上角「法庭紀錄」時也能開啟檢視
        if (m.bag && s.type !== 'trial') {
          h += this.renderCourtRecordModal(m);
        }

        // 7. 角色特寫彈窗（反擊宣告或搞笑吐槽）
        if (m.charPopup) {
          h += `
            <div onclick="window.closePopup()" class="fixed inset-0 z-[2000] bg-slate-950/85 backdrop-blur-sm flex items-end sm:items-center justify-center p-4 cursor-pointer">
              <div class="w-full max-w-xl flex flex-col items-center animate-pop">
                ${m.charPopup.isMeme
                  ? `<div class="w-64 h-44 sm:w-80 sm:h-52 -mb-3 z-10 speaking-bounce drop-shadow-[0_12px_30px_rgba(244,63,94,0.75)]">${m.charPopup.memeSvg}</div>`
                  : `<div class="w-40 h-40 sm:w-56 sm:h-56 -mb-5 z-10 speaking-bounce drop-shadow-[0_12px_30px_rgba(0,0,0,0.95)]">
                      <img src="${m.charPopup.icon}" onerror="window.handleImgFallback(this,'${m.charPopup.fallbackType || 'judge'}','${m.charPopup.rawFile || 'judge.png'}')"
                           class="pixel-art w-full h-full object-contain rounded-2xl" />
                    </div>`
                }
                <div class="w-full bg-slate-900 border-2 rounded-2xl p-5 pt-7 shadow-2xl relative" style="border-color:${m.charPopup.color};">
                  <span class="inline-block text-slate-950 font-black text-xs sm:text-sm px-3 py-0.5 rounded-md mb-2" style="background:${m.charPopup.color};">
                    ${m.charPopup.speaker}
                  </span>
                  <div class="dialog-content text-sm sm:text-lg text-white font-bold leading-relaxed" data-text="${m.charPopup.text}"></div>
                  <div class="text-right text-[11px] text-slate-400 mt-2 animate-pulse">▼ 點擊任意處繼續</div>
                </div>
              </div>
            </div>
          `;
        }

        this.r.innerHTML = h;
      }

      /**
       * 經典《逆轉裁判》(Ace Attorney) 雙層式法庭紀錄抽屜 UI
       */
      renderCourtRecordModal(m) {
        const isEvTab = m.recordTab === 'evidence';
        const items = isEvTab ? m.recordBag.map(id => ALL_EVIDENCE[id]) : STATUTES_LIST;
        const safeIdx = Math.min(m.selectedSlot, Math.max(0, items.length - 1));
        const curItem = items[safeIdx];
        const canPresent = isEvTab && !m.recordReadOnly && m.cur?.type === 'trial' && !m.res;

        return `
          <div class="fixed inset-0 z-[1800] bg-slate-950/88 backdrop-blur-md flex items-center justify-center p-2.5 sm:p-5 animate-pop">
            <div class="w-full max-w-4xl max-h-[92vh] bg-gradient-to-b from-[#0b1936] via-[#091329] to-[#050b18] border-2 border-amber-400 rounded-2xl shadow-[0_0_60px_rgba(14,165,233,0.35)] overflow-hidden flex flex-col">

              <!-- 頂部逆轉裁判檔案櫃標頭 & 分頁切換 -->
              <div class="bg-gradient-to-r from-sky-950 via-blue-950 to-sky-950 border-b-2 border-amber-400/70 px-3.5 py-2.5 flex items-center justify-between gap-2 shrink-0">
                <div class="flex items-center gap-2">
                  <span class="bg-amber-400 text-slate-950 font-black text-xs px-2.5 py-0.5 rounded tracking-widest">COURT RECORD</span>
                  <span class="text-xs sm:text-sm font-black text-sky-100 hidden sm:inline">全卷宗證物與迷因檔案櫃</span>
                </div>

                <div class="flex items-center gap-1.5">
                  <button onclick="window.switchRecordTab('evidence')"
                          class="px-3 py-1 rounded-lg text-xs font-black transition cursor-pointer ${isEvTab ? 'bg-amber-400 text-slate-950 shadow' : 'bg-slate-900/80 text-sky-300 border border-sky-700/60 hover:bg-slate-800'}">
                    📂 全部證物 (${m.recordBag.length})
                  </button>
                  <button onclick="window.switchRecordTab('statutes')"
                          class="px-3 py-1 rounded-lg text-xs font-black transition cursor-pointer ${!isEvTab ? 'bg-amber-400 text-slate-950 shadow' : 'bg-slate-900/80 text-sky-300 border border-sky-700/60 hover:bg-slate-800'}">
                    ⚖️ 法條六法 (${STATUTES_LIST.length})
                  </button>
                  <button onclick="window.closeCourtRecord()"
                          class="ml-1 bg-slate-900 hover:bg-rose-900/70 border border-slate-600 text-slate-200 text-xs font-black px-2.5 py-1 rounded-lg cursor-pointer" title="關閉 (ESC)">
                    ✕ 退回
                  </button>
                </div>
              </div>

              <!-- 中央大型預覽與卷宗說明面板 -->
              ${curItem ? `
                <div class="p-3.5 sm:p-5 grid grid-cols-1 sm:grid-cols-12 gap-4 items-center border-b border-sky-500/30 bg-[radial-gradient(circle_at_top_left,rgba(56,189,248,0.12),transparent_60%)] shrink-0">
                  <!-- 左側：發光證物大圖展示框 -->
                  <div class="sm:col-span-5 flex flex-col items-center">
                    <div class="w-full h-32 sm:h-40 bg-slate-950/90 border-2 ${curItem.joke ? 'border-rose-500/70 shadow-[inset_0_0_25px_rgba(244,63,94,0.25)]' : 'border-sky-400/70 shadow-[inset_0_0_25px_rgba(56,189,248,0.25)]'} rounded-xl p-2.5 flex items-center justify-center relative overflow-hidden">
                      ${curItem.memeSvg
                        ? curItem.memeSvg
                        : isEvTab
                          ? `<svg class="w-20 h-20 sm:w-24 sm:h-24 drop-shadow-[0_6px_14px_rgba(0,0,0,0.9)]" viewBox="0 0 16 16"><use href="#${curItem.icon}"/></svg>`
                          : `<div class="text-center"><div class="text-4xl mb-1">📜</div><div class="text-xs font-black text-amber-300">${curItem.code}</div></div>`
                      }
                      <span class="absolute top-2 left-2 text-[10px] font-black px-2 py-0.5 rounded ${curItem.joke ? 'bg-rose-600 text-white' : 'bg-sky-600 text-white'}">
                        ${isEvTab ? (curItem.category || '卷宗證物') : '實體法 / 程序法'}
                      </span>
                    </div>
                  </div>

                  <!-- 右側：證物標題、出處與詳細說明 -->
                  <div class="sm:col-span-7 flex flex-col justify-between h-full space-y-2">
                    <div>
                      <div class="text-[11px] font-bold text-sky-400 tracking-wider mb-0.5">
                        ${isEvTab ? `出處：${curItem.origin || '本案卷宗'}` : curItem.code}
                      </div>
                      <h3 class="font-serif-tc text-lg sm:text-2xl font-black text-amber-300 leading-snug">
                        ${isEvTab ? curItem.name : curItem.title}
                      </h3>
                    </div>

                    <div class="bg-slate-950/85 border border-sky-800/70 rounded-xl p-3 text-xs sm:text-sm text-slate-100 leading-relaxed min-h-[72px]">
                      ${curItem.desc}
                    </div>

                    ${canPresent ? `
                      <div class="pt-0.5 flex justify-end">
                        <button id="btnPresentSelected" data-id="${curItem.id}"
                                class="w-full sm:w-auto bg-gradient-to-r from-rose-600 via-red-600 to-rose-700 hover:from-rose-500 hover:to-red-500 active:scale-95 text-white font-serif-tc font-black text-sm sm:text-lg px-7 py-2 rounded-xl border-2 border-amber-300 shadow-[0_6px_20px_rgba(244,63,94,0.55)] transition cursor-pointer tracking-wider">
                          👉 指證！提出此證物 (PRESENT!)
                        </button>
                      </div>
                    ` : ''}
                  </div>
                </div>
              ` : ''}

              <!-- 下方全證物網格選單（所有證據完整陳列，清晰可選） -->
              <div class="bg-slate-950/95 px-3 py-3 sm:px-5 flex items-center gap-2 sm:gap-3 overflow-y-auto">
                <button onclick="window.navRecordSlot(-1)"
                        class="w-9 h-24 sm:w-10 sm:h-28 rounded-xl bg-sky-950 hover:bg-sky-800 border border-sky-500/50 text-amber-300 font-black text-lg flex items-center justify-center shrink-0 cursor-pointer active:scale-90 transition" title="上一個 (←)">
                  ◀
                </button>

                <div class="flex-1 grid grid-cols-3 sm:grid-cols-6 gap-2 max-h-44 sm:max-h-52 overflow-y-auto p-1">
                  ${items.map((item, idx) => {
                    const active = idx === safeIdx;
                    const isJoke = isEvTab && item.joke;
                    return `
                      <button onclick="window.selectRecordSlot(${idx})"
                              class="h-16 sm:h-[70px] rounded-xl border-2 transition flex flex-col items-center justify-center p-1 cursor-pointer relative ${
                                active
                                  ? 'bg-sky-900/90 border-amber-400 aa-slot-active scale-[1.03] z-10'
                                  : isJoke
                                    ? 'bg-rose-950/35 border-rose-500/45 hover:border-rose-400'
                                    : 'bg-slate-900 border-sky-500/40 hover:border-sky-300'
                              }">
                        ${isJoke ? `<span class="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-rose-400"></span>` : `<span class="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-sky-400"></span>`}
                        ${isEvTab
                          ? `<svg class="w-8 h-8 sm:w-9 sm:h-9" viewBox="0 0 16 16"><use href="#${item.icon}"/></svg>`
                          : `<span class="text-lg">⚖️</span>`
                        }
                        <span class="text-[9px] font-bold text-slate-100 truncate w-full text-center mt-0.5">
                          ${isEvTab ? item.name : item.code.replace('民事訴訟法第 ', '民訴').replace('民法第 ', '民法')}
                        </span>
                      </button>
                    `;
                  }).join('')}
                </div>

                <button onclick="window.navRecordSlot(1)"
                        class="w-9 h-24 sm:w-10 sm:h-28 rounded-xl bg-sky-950 hover:bg-sky-800 border border-sky-500/50 text-amber-300 font-black text-lg flex items-center justify-center shrink-0 cursor-pointer active:scale-90 transition" title="下一個 (→)">
                  ▶
                </button>
              </div>

              <div class="bg-slate-950 border-t border-slate-800 px-4 py-1.5 flex items-center justify-between text-[10px] sm:text-xs text-slate-400 shrink-0">
                <span>提示：全卷宗 ${items.length} 項證物皆可自由點選（藍點為書證、紅點為迷因/特殊物品）</span>
                <span>第 ${safeIdx + 1} / ${items.length} 項</span>
              </div>
            </div>
          </div>
        `;
      }

      renderFeedbackBanner(type, title, body) {
        const styles = {
          ok: 'bg-emerald-950/80 border-emerald-400 text-emerald-100',
          ng: 'bg-rose-950/80 border-rose-500 text-rose-100',
          neutral: 'bg-amber-950/80 border-amber-400 text-amber-100'
        };
        return `
          <div class="border-2 ${styles[type] || styles.neutral} rounded-2xl p-4 shadow-lg animate-pop">
            <div class="font-black text-sm sm:text-base mb-1">${title}</div>
            <div class="text-xs sm:text-sm leading-relaxed opacity-95">${body}</div>
          </div>
        `;
      }

      renderDialoguePanel(speaker, text, theme = 'amber') {
        const themes = {
          amber: { box: 'border-amber-400/80', badge: 'bg-amber-400 text-slate-950' },
          emerald: { box: 'border-emerald-400/80', badge: 'bg-emerald-400 text-slate-950' },
          rose: { box: 'border-rose-500/80', badge: 'bg-rose-500 text-white' }
        };
        const t = themes[theme] || themes.amber;
        return `
          <div class="p-4 sm:p-5">
            <div class="bg-slate-900/95 border-2 ${t.box} rounded-2xl p-4 sm:p-5 relative shadow-xl animate-pop cursor-pointer">
              <span class="inline-block ${t.badge} font-black text-xs sm:text-sm px-3 py-0.5 rounded-md mb-2 shadow">
                ${speaker}
              </span>
              <div class="dialog-content text-sm sm:text-lg text-slate-100 leading-relaxed font-bold min-h-[56px]" data-text="${text}"></div>
            </div>
          </div>
        `;
      }

      renderCalc(m, s) {
        const disabled = !m.calcInput.qty || !m.calcInput.price || !m.calcInput.cost;
        let h = `
          <div class="p-4 space-y-4">
            <div class="bg-slate-900 border border-sky-500/40 rounded-2xl p-4">
              <div class="flex items-center justify-between mb-3">
                <span class="text-xs sm:text-sm font-black text-amber-400">📑 卷宗事實（附帶卷證資料供核算）</span>
                <span class="text-[11px] text-sky-300 bg-sky-950 px-2.5 py-0.5 rounded-full border border-sky-500/30">民法第216條之1 損益相抵</span>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                ${s.facts.map(f => `
                  <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 flex flex-col justify-between">
                    <span class="text-xs text-slate-400">${f.label}</span>
                    <span class="text-sm sm:text-base font-black text-amber-300 mt-1">${f.value}</span>
                  </div>
                `).join('')}
              </div>
            </div>
        `;

        if (!m.res) {
          h += `
            <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4 space-y-3">
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label class="block text-xs font-bold text-sky-300 mb-1">1. 系爭土石數量（立方公尺）</label>
                  <input type="text" class="w-full bg-slate-950 border-2 border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2.5 text-center text-base font-black text-amber-300 outline-none"
                         value="${m.calcInput.qty}" placeholder="例如：559221" oninput="window.updateInput('qty', this.value)" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-sky-300 mb-1">2. 起訴時市價（元 / m³）</label>
                  <input type="text" class="w-full bg-slate-950 border-2 border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2.5 text-center text-base font-black text-amber-300 outline-none"
                         value="${m.calcInput.price}" placeholder="例如：275" oninput="window.updateInput('price', this.value)" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-sky-300 mb-1">3. 平均清運費（元 / m³）</label>
                  <input type="text" class="w-full bg-slate-950 border-2 border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2.5 text-center text-base font-black text-amber-300 outline-none"
                         value="${m.calcInput.cost}" placeholder="例如：47.5" oninput="window.updateInput('cost', this.value)" />
                </div>
              </div>
              <div class="flex justify-center pt-2">
                <button id="btnSubmitCalc" ${disabled ? 'disabled' : ''}
                        class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-8 py-3 rounded-xl shadow-lg transition ${disabled ? 'opacity-40 cursor-not-allowed' : 'cursor-pointer'}">
                  🧮 確認並核算賠償金額
                </button>
              </div>
            </div>
          `;
        } else {
          if (m.res.ok) {
            h += this.renderFeedbackBanner('ok', '✔ 計算正確！', '系統已依民法第226條及第216條之1損益相抵原則完成最終賠償金額核算。');
            h += `
              <div class="bg-slate-950 border-2 border-amber-400/70 rounded-2xl p-4 text-center space-y-1.5 animate-pop">
                <div class="text-xs sm:text-sm text-slate-300">市價總額：275 × 559,221 = <b class="text-white">153,785,775 元</b></div>
                <div class="text-xs sm:text-sm text-slate-300">扣除免除清運費：47.5 × 559,221 = <b class="text-rose-300">26,562,998 元</b></div>
                <div class="text-lg sm:text-2xl font-black text-amber-300 pt-1">最終判賠金額：127,222,777 元</div>
              </div>
            `;
          } else {
            h += this.renderFeedbackBanner('ng', '✘ 計算錯誤！', '請檢查您填入的數字是否與上方卷宗事實完全相符。');
          }
          h += `<div class="flex justify-center"><button id="btnNext" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-8 py-3 rounded-xl shadow cursor-pointer">進入終局宣判 →</button></div>`;
        }
        h += `</div>`;
        return h;
      }
    }

    /**
     * ============================================================================
     * 6. Controller 事件與打字機控制層
     * ============================================================================
     */
    class Ctrl {
      constructor(m, v) {
        this.m = m;
        this.v = v;
        this.typeTimer = null;
      }

      start() {
        this.v.render(this.m);
        this.bind();
      }

      bind() {
        const m = this.m;
        const nBtn = document.getElementById('btnNext');
        if (nBtn) nBtn.onclick = () => { m.next(); this.start(); };

        const jNext = document.getElementById('btnJudgeNext');
        if (jNext) jNext.onclick = () => { m.judgeNextStep(); this.start(); };

        const oBtn = document.getElementById('btnObj');
        if (oBtn) oBtn.onclick = () => { sfx.gavel(); m.open(); this.start(); };

        const rBtn = document.getElementById('btnRetry');
        if (rBtn) rBtn.onclick = () => { m.res = null; m.open(false); this.start(); };

        const presentBtn = document.getElementById('btnPresentSelected');
        if (presentBtn) {
          presentBtn.onclick = () => {
            const r = m.pick(presentBtn.dataset.id);
            if (r.ok) m.decisiveEffect();
            else if (r.retry || r.rev) this.shake();
            this.start();
          };
        }

        const sBtn = document.getElementById('btnSubmitCalc');
        if (sBtn) sBtn.onclick = () => { m.submitCalc(); this.start(); };

        const typeBoxes = document.querySelectorAll('[data-text]');
        typeBoxes.forEach(box => {
          const text = box.dataset.text;
          if (text && !box.dataset.typed) {
            box.dataset.typed = 'true';
            box.innerText = '';
            let i = 0;
            clearInterval(this.typeTimer);
            this.typeTimer = setInterval(() => {
              if (i < text.length) {
                box.innerText += text.charAt(i);
                if (i % 3 === 0) sfx.blip(580);
                i++;
              } else {
                clearInterval(this.typeTimer);
              }
            }, 26);

            box.onclick = (e) => {
              e.stopPropagation();
              clearInterval(this.typeTimer);
              box.innerText = text;
            };
          } else if (text) {
            box.innerText = text;
          }
        });
      }

      shake() {
        const a = document.getElementById('app');
        if (a) {
          a.classList.add('shake');
          setTimeout(() => a.classList.remove('shake'), 420);
        }
      }
    }

    const app = new Ctrl(new Model(), new View(document.getElementById('app')));

    window.showRoleSelect = () => {
      sfx.gavel();
      app.m.role = 'select';
      app.start();
    };

    window.selectRole = (role) => {
      sfx.gavel();
      app.m.role = role;
      app.m.i = 0;
      app.m.res = null;
      app.m.bag = false;
      app.m.gameover = false;
      app.m.bailiffAnim = false;
      app.m.judgeStep = 0;
      app.m.calcInput = { qty: '', price: '', cost: '' };

      if (role === 'melon') { app.m.trustMelon = 20; app.m.trustWater = 80; }
      else if (role === 'water') { app.m.trustMelon = 60; app.m.trustWater = 40; }
      else { app.m.trustMelon = 50; app.m.trustWater = 50; }

      if (role === 'story') app.m.scenes = [...SCENES_STORY];
      else if (role === 'melon') app.m.scenes = [...SCENES_MELON, SCENE_CALC, SCENE_END];
      else if (role === 'water') app.m.scenes = [...SCENES_WATER, SCENE_CALC, SCENE_END];
      else if (role === 'judge') app.m.scenes = [...SCENES_JUDGE, SCENE_CALC, SCENE_END];

      app.m.trustChange = null;
      app.start();
    };

    window.judgeDecide = (type, trustM, trustW, fb) => {
      app.m.judgePick(type, trustM, trustW, fb);
      app.start();
    };

    window.storyDecide = (isCorrect) => {
      app.m.storyPick(isCorrect);
      app.start();
    };

    window.closePopup = () => {
      app.m.closeCharPopup();
    };

    window.openCourtRecord = () => {
      sfx.gavel();
      const canPresentNow = app.m.cur?.type === 'trial' && !app.m.res;
      app.m.open(!canPresentNow);
      app.start();
    };

    window.closeCourtRecord = () => {
      sfx.blip(440);
      app.m.closeBag();
      app.start();
    };

    window.selectRecordSlot = (idx) => {
      app.m.selectSlot(idx);
      app.start();
    };

    window.navRecordSlot = (delta) => {
      app.m.selectSlot(app.m.selectedSlot + delta);
      app.start();
    };

    window.switchRecordTab = (tab) => {
      app.m.switchRecordTab(tab);
      app.start();
    };

    // 支援逆轉裁判經典鍵盤操作（左右鍵切換證物、Enter指證、Esc關閉）
    window.addEventListener('keydown', (e) => {
      if (!app.m.bag) return;
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        window.navRecordSlot(-1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        window.navRecordSlot(1);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        window.closeCourtRecord();
      } else if (e.key === 'Enter') {
        const presentBtn = document.getElementById('btnPresentSelected');
        if (presentBtn) {
          e.preventDefault();
          presentBtn.click();
        }
      }
    });

    window.updateInput = (type, val) => {
      app.m.setCalcInput(type, val);
      const btn = document.getElementById('btnSubmitCalc');
      if (btn) {
        const hasAll = app.m.calcInput.qty && app.m.calcInput.price && app.m.calcInput.cost;
        if (hasAll) {
          btn.classList.remove('opacity-40', 'cursor-not-allowed');
          btn.classList.add('cursor-pointer');
          btn.removeAttribute('disabled');
        } else {
          btn.classList.add('opacity-40', 'cursor-not-allowed');
          btn.classList.remove('cursor-pointer');
          btn.setAttribute('disabled', 'true');
        }
      }
    };

    window.playVictory = (isMelonWin) => {
      sfx.victory();
      const overlay = document.getElementById('victory-overlay');
      const title = overlay.querySelector('.victory-title');
      const sub = overlay.querySelector('.victory-sub');

      if (isMelonWin) {
        title.innerText = '西瓜寮勝訴！';
        title.className = 'victory-title font-serif-tc text-4xl sm:text-7xl font-black mb-4 tracking-wide text-emerald-400 drop-shadow-[0_4px_20px_rgba(16,185,129,0.65)]';
        sub.innerText = '水利局應給付西瓜寮 1 億 2,722 萬 2,777 元';
      } else {
        title.innerText = '水利局勝訴！';
        title.className = 'victory-title font-serif-tc text-4xl sm:text-7xl font-black mb-4 tracking-wide text-rose-500 drop-shadow-[0_4px_20px_rgba(244,63,94,0.65)]';
        sub.innerText = '原告之訴及假執行之聲請均駁回，訴訟費用由原告負擔。';
      }

      overlay.classList.remove('hidden');
      overlay.classList.add('flex');

      for (let i = 0; i < 90; i++) {
        setTimeout(() => {
          const c = document.createElement('div');
          c.className = 'confetti';
          c.style.left = Math.random() * 100 + 'vw';
          c.style.backgroundColor = ['#fbbf24', '#f43f5e', '#10b981', '#38bdf8', '#ffffff'][Math.floor(Math.random() * 5)];
          c.style.animationDuration = (Math.random() * 2.5 + 2) + 's';
          c.style.width = c.style.height = (Math.random() * 8 + 5) + 'px';
          c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
          overlay.appendChild(c);
          setTimeout(() => c.remove(), 4800);
        }, i * 18);
      }
    };

    app.start();
  </script>
</body>
</html>
