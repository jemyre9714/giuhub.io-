
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>西瓜寮裁判所：THE WEIGHT OF JUSTICE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #ffcc00;
      --red: #ff0033;
      --green: #00ff66;
      --blue: #0088ff;
      --bg: #070913;
    }
    * {
      box-sizing: border-box;
      font-family: "Inter", "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      color: #fff;
      min-height: 100vh;
      margin: 0;
      padding: 8px;
      background-color: #050711;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(255, 0, 51, 0.16) 0%, transparent 60%),
        linear-gradient(rgba(0, 102, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 102, 255, 0.08) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      background-attachment: fixed;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.12) 50%);
      background-size: 100% 4px;
    }

    #app-frame {
      max-width: 1040px;
      margin: 0 auto;
      border: 4px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 0 0 3px #0f172a, 0 20px 60px rgba(0,0,0,0.92), inset 0 0 80px rgba(0,0,0,0.85);
      background: #080b16;
      overflow: hidden;
      position: relative;
    }

    /* CPS-2 頂部街機狀態列 */
    .cps2-bar {
      background: linear-gradient(90deg, #0b1120, #111827, #0b1120);
      border-bottom: 2px solid #1e293b;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    /* 封面街機光束與金橘漸層標題 */
    .arcade-cover {
      position: relative;
      padding: 28px 16px 36px;
      background:
        repeating-conic-gradient(from 0deg at 50% 52%, rgba(255, 204, 0, 0.07) 0deg 10deg, rgba(0, 0, 0, 0) 10deg 20deg),
        radial-gradient(circle at 50% 45%, #2a1f0a 0%, #091512 48%, #070b14 100%);
      overflow: hidden;
    }
    .case-pill {
      display: inline-block;
      background: rgba(6, 182, 212, 0.14);
      border: 2px solid #22d3ee;
      color: #67e8f9;
      padding: 6px 24px;
      font-weight: 900;
      font-size: clamp(12px, 2.5vw, 15px);
      letter-spacing: 2px;
      transform: skewX(-12deg);
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.35);
    }
    .arcade-main-title {
      font-size: clamp(38px, 8.5vw, 76px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 6px;
      background: linear-gradient(180deg, #fff066 0%, #ffaa00 48%, #ff4500 52%, #ff9900 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(4px 5px 0 #450a0a) drop-shadow(7px 9px 0 #000);
      margin: 14px 0 22px;
      line-height: 1.1;
    }
    .vs-badge {
      font-size: clamp(34px, 7vw, 62px);
      font-weight: 900;
      font-style: italic;
      background: linear-gradient(180deg, #fde047, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(3px 4px 0 #7f1d1d) drop-shadow(0 0 18px rgba(250, 204, 21, 0.5));
      animation: vsPulse 1.4s infinite alternate;
    }
    @keyframes vsPulse {
      from { transform: scale(1) rotate(-4deg); }
      to { transform: scale(1.1) rotate(4deg); }
    }
    .press-start-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 14px 44px;
      background: linear-gradient(180deg, #7f1d1d, #450a0a);
      border: 3px solid #facc15;
      color: #fff;
      font-size: clamp(18px, 4vw, 28px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 3px;
      transform: skewX(-10deg);
      box-shadow: 0 8px 0 #1f0505, 0 0 30px rgba(250, 204, 21, 0.45);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      animation: startBlink 1.3s infinite alternate;
    }
    .press-start-btn:hover {
      transform: skewX(-10deg) scale(1.04);
      box-shadow: 0 8px 0 #1f0505, 0 0 40px rgba(250, 204, 21, 0.8);
    }
    .press-start-btn:active {
      transform: skewX(-10deg) translateY(5px);
      box-shadow: 0 3px 0 #1f0505;
    }
    @keyframes startBlink {
      from { filter: brightness(0.95); }
      to { filter: brightness(1.2); }
    }

    /* 原木辯護桌 */
    .wooden-bench {
      width: 100%;
      height: 54px;
      background: linear-gradient(180deg, #855228 0%, #5c3416 60%, #3d210c 100%);
      border: 3px solid #261306;
      border-top: 5px solid #a66a38;
      border-radius: 4px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.85), inset 0 2px 4px rgba(255,255,255,0.18);
      position: relative;
    }
    .wooden-bench::after {
      content: '';
      position: absolute;
      inset: 7px 12px;
      border: 2px solid rgba(38, 19, 6, 0.65);
      background: repeating-linear-gradient(90deg, transparent 0, transparent 48%, rgba(38, 19, 6, 0.7) 48%, rgba(38, 19, 6, 0.7) 52%);
    }

    /* 心證天秤 */
    .trust-bar-wrap {
      background: #0f172a;
      border-bottom: 2px solid #334155;
      padding: 10px 14px;
      position: relative;
    }
    .trust-float {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      font-weight: 900;
      font-style: italic;
      text-shadow: 2px 2px 0 #000;
      animation: floatUp 1.1s ease-out forwards;
      pointer-events: none;
      z-index: 40;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translate(-50%, 10px); }
      20% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -22px); }
    }

    /* 法庭舞台 */
    .courtroom-stage {
      background: linear-gradient(180deg, #2b1a0e 0%, #1a1008 55%, #110a05 100%);
      border: 3px solid #334155;
      border-radius: 8px;
      height: clamp(290px, 46vh, 400px);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
    }
    .courtroom-stage.danger {
      filter: drop-shadow(0 0 24px var(--red)) contrast(1.25);
    }
    .judge-bench {
      height: 42%;
      background: linear-gradient(180deg, #3f2716, #1f1209);
      border-bottom: 6px solid #59371e;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 4px;
      position: relative;
      z-index: 2;
    }
    .speaking-anim {
      animation: speakBounce 0.28s infinite alternate;
    }
    @keyframes speakBounce {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-9px) scale(1.04); }
    }

    /* 特效層 */
    .effect-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }
    .falling-wig {
      position: absolute;
      top: 4%;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 56px;
      animation: wigDrop 1.8s forwards cubic-bezier(0.5, 0, 1, 1);
    }
    @keyframes wigDrop {
      0% { top: 4%; opacity: 1; }
      80% { top: 82%; opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }
    .fly-item {
      position: absolute;
      font-size: 28px;
      animation: flyAcross 2.4s linear forwards;
    }
    @keyframes flyAcross {
      0% { transform: translateX(-40px) rotate(0deg); opacity: 1; }
      100% { transform: translateX(105vw) rotate(540deg); opacity: 0; }
    }
    .bullet-hole {
      position: absolute;
      width: 36px;
      height: 36px;
      background: radial-gradient(circle, #000 25%, #64748b 45%, transparent 65%);
      border-radius: 50%;
    }
    .bailiff-shock {
      animation: shockAnim 0.14s infinite alternate;
    }
    @keyframes shockAnim {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-16px) scale(1.22) rotate(5deg); filter: drop-shadow(0 0 14px var(--red)); }
    }

    /* 閃光與大字爆裂特效 */
    #flash-overlay {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 6000;
      pointer-events: none;
      opacity: 0;
    }
    .flash-active {
      animation: flashAnim 0.38s ease-out;
    }
    @keyframes flashAnim {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    #decisive-text {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 6001;
      pointer-events: none;
      opacity: 0;
    }
    .decisive-active {
      animation: burstAnim 1.25s ease-out forwards;
    }
    @keyframes burstAnim {
      0% { opacity: 0; transform: scale(0.45) rotate(-10deg); }
      18% { opacity: 1; transform: scale(1.12) rotate(4deg); }
      38% { transform: scale(1) rotate(-2deg); }
      80% { opacity: 1; transform: scale(1) rotate(0deg); }
      100% { opacity: 0; transform: scale(1.35); }
    }
    .burst-badge {
      font-size: clamp(42px, 13vw, 94px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 4px;
      padding: 12px 32px;
      border: 6px solid #fff;
      border-radius: 16px;
      transform: rotate(-8deg);
      box-shadow: 0 15px 40px rgba(0,0,0,0.9);
    }
    .burst-objection {
      background: linear-gradient(180deg, #ef4444, #991b1b);
      color: #fde047;
      text-shadow: 4px 4px 0 #450a0a, 8px 8px 0 #000;
    }
    .burst-holdit {
      background: linear-gradient(180deg, #2563eb, #1e3a8a);
      color: #fff;
      text-shadow: 4px 4px 0 #172554, 8px 8px 0 #000;
    }
    .burst-takethat {
      background: linear-gradient(180deg, #16a34a, #14532d);
      color: #fef08a;
      text-shadow: 4px 4px 0 #052e16, 8px 8px 0 #000;
    }

    /* 角色選擇卡片 */
    .role-card-pro {
      background: linear-gradient(180deg, #111827, #090d16);
      border: 3px solid #334155;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .role-card-pro:hover {
      transform: translateY(-6px) scale(1.02);
      z-index: 10;
    }

    /* 勝訴慶祝畫面 */
    #victory-overlay {
      position: fixed;
      inset: 0;
      z-index: 7000;
      background: radial-gradient(circle, rgba(250,204,21,0.22) 0%, rgba(0,0,0,0.95) 72%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    #victory-overlay.show {
      display: flex;
    }
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      animation: fallDown linear forwards;
    }
    @keyframes fallDown {
      to { transform: translateY(105vh) rotate(720deg); }
    }

    .shake {
      animation: shakeAnim 0.4s ease;
    }
    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-12px); }
      40%, 80% { transform: translateX(12px); }
    }
  </style>
</head>

<div id="victory-overlay">
  <div id="victory-title" class="text-5xl sm:text-7xl font-black italic text-yellow-400 mb-6" style="text-shadow: 6px 6px 0 #991b1b, 12px 12px 0 #000;">勝訴！</div>
  <div id="victory-sub" class="text-lg sm:text-2xl font-bold text-white max-w-2xl leading-relaxed mb-8">水利局應給付西瓜寮 1 億 2,722 萬 2,777 元</div>
  <button onclick="location.reload()" class="px-8 py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-lg rounded-lg border-2 border-white shadow-xl cursor-pointer">返回標題畫面</button>
</div>

<script type="module">
const GH_RAW = "https://raw.githubusercontent.com/jemyre9714/giuhub.io-/main/";

// 內建精緻 SVG 角色頭像備援（確保無外部檔案時依然生動呈現）
function makeFallbackSvgDataUrl(type) {
  const svgs = {

// Web Audio API 音效與「異議あり！／待った！」喊聲引擎
class SoundFX {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  toggleMute() {
    this.muted = !this.muted;
    if (this.muted && window.speechSynthesis) window.speechSynthesis.cancel();
    return this.muted;
  }
  blip(freq = 560) {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    gain.gain.setValueAtTime(0.025, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.04);
  }
  gavel() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(160, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(38, this.ctx.currentTime + 0.22);
    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.25);
  }
  speakShout(jaText, zhFallback, pitch = 1.05, rate = 1.15) {
    if (this.muted || !('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const voices = window.speechSynthesis.getVoices();
      const jaVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes('ja'));
      const zhVoice = voices.find(v => v.lang && (v.lang.toLowerCase().includes('zh-tw') || v.lang.toLowerCase().includes('zh')));
      const utter = new SpeechSynthesisUtterance(jaVoice ? jaText : zhFallback);
      if (jaVoice) {
        utter.voice = jaVoice;
        utter.lang = 'ja-JP';
      } else if (zhVoice) {
        utter.voice = zhVoice;
        utter.lang = 'zh-TW';
      }
      utter.pitch = pitch;
      utter.rate = rate;
      utter.volume = 1.0;
      window.speechSynthesis.speak(utter);
    } catch (e) {}
  }
  objection(role = 'melon') {
    if (this.muted) return;
    this.init();
    this.gavel();
    if (this.ctx) {
      const now = this.ctx.currentTime;
      [220, 277.18, 329.63, 440, 554.37].forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = idx % 2 === 0 ? 'sawtooth' : 'square';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.04, now + 0.35);
        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.38);
      });
    }
    const pitch = role === 'water' ? 0.85 : 1.15;
    this.speakShout('いぎあり！', '異議！', pitch, 1.18);
  }
  holdIt(role = 'melon') {
    if (this.muted) return;
    this.init();
    this.gavel();
    const pitch = role === 'water' ? 0.88 : 1.15;
    this.speakShout('まった！', '等等！', pitch, 1.15);
  }
  penalty() {
    if (this.muted) return;
    this.init();
    this.gavel();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.linearRampToValueAtTime(65, now + 0.35);
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.36);
  }
}

    this.role = null;
    this.scenes = [];
    this.charPopup = null;

    this.bailiffAnim = false;
    this.judgeStep = 0;
    this.statementIdx = 0;
    this.pressedSet = new Set();
    this.calcInput = { qty: '', price: '', cost: '' };
    this.bailiffShock = false;
    this.isDanger = false;
    this.effect = null;
    this.deskItem = null;
    this.trustMelon = 50;
    this.trustWater = 50;
    this.trustChange = null;
    this.trustChangeColor = null;
  }

  get cur() {
    return this.scenes[this.i];
  }

  open(readOnly = false) {
    this.bag = true;
    this.recordReadOnly = readOnly;
    this.recordTab = 'evidence';
    this.recordBag = Object.keys(ALL_EVIDENCE);
    this.selectedSlot = 0;
    this.charPopup = null;
    this.pressPopup = null;
    this.effect = null;
    this.trustChange = null;
  }

  closeBag() {
    this.bag = false;
    this.recordReadOnly = false;
  }

  navStatement(dir) {
    const s = this.cur;
    if (!s || !s.statements) return;
    const len = s.statements.length;
    this.statementIdx = (this.statementIdx + dir + len) % len;
    sfx.blip(620);
  }

  jumpStatement(idx) {
    const s = this.cur;
    if (!s || !s.statements) return;
    this.statementIdx = Math.max(0, Math.min(s.statements.length - 1, idx));
    sfx.blip(620);
  }

  pressStatement() {
    const s = this.cur;
    if (!s || !s.statements) return;
    const st = s.statements[this.statementIdx];
    const key = `${this.i}_${this.statementIdx}`;
    const isFirstPress = !this.pressedSet.has(key);
    if (isFirstPress) {
      this.pressedSet.add(key);
      if (this.role === 'melon') {
        this.trustMelon = Math.min(95, this.trustMelon + 3);
        this.trustWater = Math.max(5, this.trustWater - 3);
        this.trustChange = '詰問突破 +3%';
        this.trustChangeColor = 'var(--green)';
      } else if (this.role === 'water') {
        this.trustWater = Math.min(95, this.trustWater + 3);
        this.trustMelon = Math.max(5, this.trustMelon - 3);
        this.trustChange = '詰問突破 +3%';
        this.trustChangeColor = 'var(--red)';
      }
    }
    sfx.holdIt(this.role);
    this.triggerBurst('待った！', 'burst-holdit');
    this.pressPopup = {
      step: 0,
      statementIdx: this.statementIdx,
      mySpeaker: this.role === 'melon' ? '上訴人西瓜寮訴訟代理人' : '被上訴人水利局訴訟代理人',
      myAvatar: this.role === 'melon' ? 'melon_point' : 'water_point',
      myColor: this.role === 'melon' ? 'var(--green)' : 'var(--red)',
      pressQ: st.pressQ,
      oppSpeaker: s.speaker,
      oppAvatar: this.role === 'melon' ? 'water' : 'melon',
      oppColor: this.role === 'melon' ? 'var(--red)' : 'var(--green)',
      pressA: st.pressA,
      contradictionHint: st.contradictionHint
    };
  }

  advancePressPopup() {
    if (!this.pressPopup) return;
    if (this.pressPopup.step === 0) {
      this.pressPopup.step = 1;
      sfx.blip(480);
    } else {
      this.pressPopup = null;
    }
  }

  triggerBurst(text, cls) {
    const flash = document.getElementById('flash-overlay');
    const wrap = document.getElementById('decisive-text');
    const inner = document.getElementById('decisive-inner');
    if (!flash || !wrap || !inner) return;
    inner.innerText = text;
    inner.className = `burst-badge ${cls}`;
    flash.classList.remove('flash-active');
    wrap.classList.remove('decisive-active');
    void flash.offsetWidth;
    flash.classList.add('flash-active');
    wrap.classList.add('decisive-active');
  }

  pick(id) {
    const s = this.cur;
    const ev = ALL_EVIDENCE[id];
    if (!ev) return;
    this.trustChange = null;
    this.bag = false;

    if (ev.joke) {
      this.lives--;
      this.effect = ev.effect;
      sfx.penalty();

      if (ev.isFood) {
        const deskSide = this.role === 'water' ? 'right' : 'left';
        this.deskItem = { icon: ev.foodIcon, side: deskSide };
      }

      if (id === 'j_gun') {
        this.bailiffShock = true;
        this.isDanger = true;
        this.charPopup = { speaker: '法警', text: ev.joke, avatarKey: 'bailiff', color: 'var(--red)' };
      } else if (id === 'j_earbuds') {
        this.charPopup = { speaker: '左陪席法官', text: ev.joke, avatarKey: 'judge_left', color: 'var(--blue)' };
      } else {
        this.charPopup = { speaker: '審判長', text: ev.joke, avatarKey: 'judge', color: 'var(--gold)' };
      }

      const penalty = ev.fatal ? 35 : 15;
      if (this.role === 'melon') {
        this.trustMelon = Math.max(0, this.trustMelon - penalty);
        this.trustWater = Math.min(100, this.trustWater + penalty);
        this.trustChange = `心證受損 -${penalty}%`;
        this.trustChangeColor = 'var(--red)';
      } else if (this.role === 'water') {
        this.trustWater = Math.max(0, this.trustWater - penalty);
        this.trustMelon = Math.min(100, this.trustMelon + penalty);
        this.trustChange = `心證受損 -${penalty}%`;
        this.trustChangeColor = 'var(--red)';
      }

      if (this.lives <= 0 || (this.role === 'melon' && this.trustMelon <= 0) || (this.role === 'water' && this.trustWater <= 0)) {
        this.res = { ok: false, rev: 'GameOver' };
        setTimeout(() => {
          this.charPopup = null;
          this.bailiffAnim = true;
          app.start();
          setTimeout(() => {
            this.bailiffAnim = false;
            this.gameover = true;
            app.start();
          }, 2200);
        }, 1900);
      } else {
        this.res = { ok: false, retry: true, fb: ev.joke };
      }
      return this.res;
    }

    if (s.ans && s.ans.includes(id)) {
      this.score += 10;
      this.res = { ok: true, fb: s.fbOk, line: s.success, type: 'strong' };
      sfx.objection(this.role);
      this.triggerBurst('異議あり！', 'burst-objection');

      if (this.role === 'melon') {
        this.trustMelon = Math.min(95, this.trustMelon + 20);
        this.trustWater = Math.max(5, this.trustWater - 20);
        this.trustChange = '心證逆轉 +20%';
        this.trustChangeColor = 'var(--green)';
        this.charPopup = { speaker: '上訴人西瓜寮訴訟代理人', text: s.success, avatarKey: 'melon_point', color: 'var(--green)' };
      } else if (this.role === 'water') {
        this.trustWater = Math.min(95, this.trustWater + 20);
        this.trustMelon = Math.max(5, this.trustMelon - 20);
        this.trustChange = '心證逆轉 +20%';
        this.trustChangeColor = 'var(--red)';
        this.charPopup = { speaker: '被上訴人水利局訴訟代理人', text: s.success, avatarKey: 'water_point', color: 'var(--red)' };
      }
    } else {
      this.lives--;
      sfx.penalty();
      this.res = { ok: false, retry: true, fb: s.fbNg, type: 'weak' };
      if (this.role === 'melon') {
        this.trustMelon = Math.max(0, this.trustMelon - 10);
        this.trustWater = Math.min(100, this.trustWater + 10);
        this.trustChange = '舉證失誤 -10%';
        this.trustChangeColor = 'var(--red)';
      } else if (this.role === 'water') {
        this.trustWater = Math.max(0, this.trustWater - 10);
        this.trustMelon = Math.min(100, this.trustMelon + 10);
        this.trustChange = '舉證失誤 -10%';
        this.trustChangeColor = 'var(--red)';
      }
      if (this.lives <= 0) {
        this.res = { ok: false, rev: 'GameOver' };
        this.bailiffAnim = true;
        setTimeout(() => {
          this.bailiffAnim = false;
          this.gameover = true;
          app.start();
        }, 2200);
      }
    }
    return this.res;
  }

  closeCharPopup() {
    this.charPopup = null;
    if (!this.res || this.res.rev !== 'GameOver') {
      app.start();
    }
  }

  judgeNextStep() {
    if (this.judgeStep < 2) {
      this.judgeStep++;
      sfx.blip(540);
    }
  }

  judgePick(optionType, trustM, trustW, fb) {
    this.trustMelon = Math.max(5, Math.min(95, this.trustMelon + trustM));
    this.trustWater = Math.max(5, Math.min(95, this.trustWater + trustW));
    this.trustChange = trustM > 0 ? `西瓜寮 +${trustM}%` : `水利局 +${trustW}%`;
    this.trustChangeColor = trustM > 0 ? 'var(--green)' : 'var(--red)';
    this.score += trustM > 0 ? 10 : 0;
    this.res = { ok: trustM > 0, fb };
    sfx.gavel();
  }

  storyPick(isCorrect) {
    const s = this.cur;
    sfx.gavel();
    if (isCorrect) {
      this.trustMelon = Math.min(95, this.trustMelon + 15);
      this.trustWater = Math.max(5, this.trustWater - 15);
      this.res = { ok: true, fb: s.fbOk };
    } else {
      this.res = { ok: false, fb: s.fbNg };
    }
  }

  setCalcInput(type, val) {
    this.calcInput[type] = val;
  }

  submitCalc() {
    const ans = this.cur.answer;
    const userQty = parseFloat(this.calcInput.qty.replace(/,/g, ''));
    const userPrice = parseFloat(this.calcInput.price.replace(/,/g, ''));
    const userCost = parseFloat(this.calcInput.cost.replace(/,/g, ''));
    const isCorrect = userQty === ans.qty && userPrice === ans.price && userCost === ans.cost;
    sfx.gavel();
    if (isCorrect) {
      this.score += 10;
      this.res = { ok: true };
    } else {
      this.res = { ok: false };
    }
  }

  next() {
    if (this.i < this.scenes.length - 1) {
      this.i++;
      this.lives = 5;
      this.bag = false;
      this.res = null;
      this.charPopup = null;
      this.pressPopup = null;
      this.effect = null;
      this.deskItem = null;
      this.bailiffAnim = false;
      this.gameover = false;
      this.bailiffShock = false;
      this.isDanger = false;
      this.judgeStep = 0;
      this.statementIdx = 0;
      this.calcInput = { qty: '', price: '', cost: '' };
      this.trustChange = null;
      sfx.blip(600);
    }
  }
}

          <div class="text-5xl sm:text-7xl font-black italic text-rose-500 mb-4" style="text-shadow: 4px 4px 0 #fff;">GAME OVER</div>
          <p class="text-base sm:text-xl font-bold text-slate-200 mb-6">合議庭心證崩盤，你已被法警請出法庭！</p>
          <button onclick="location.reload()" class="px-8 py-3 bg-rose-600 hover:bg-rose-500 text-white font-black rounded-xl border-2 border-white cursor-pointer">重新開始審理</button>
        </div>
      `;
      this.r.innerHTML = h;
      return;
    }

    if (m.bailiffAnim) {
      h += `
        <div class="p-10 text-center bg-slate-950 min-h-[420px] flex flex-col items-center justify-center">
          <div class="text-2xl sm:text-4xl font-black text-rose-500 animate-bounce mb-6">法警！將這位訴訟代理人帶離法庭！</div>
          <div class="flex items-center gap-4">
            ${renderAvatarTag('bailiff', 'w-24 h-24 object-contain', '法警')}
            ${renderAvatarTag(m.role === 'water' ? 'water' : 'melon', 'w-24 h-24 object-contain rotate-12', '代理人')}
            ${renderAvatarTag('bailiff', 'w-24 h-24 object-contain', '法警')}
          </div>
        </div>
      `;
      this.r.innerHTML = h;
      return;
    }

    const s = m.cur;

    // 4. 終局宣判畫面
    if (s.type === 'end' || s.type === 'end_story') {
      h += this.renderCourt(m, '審判長');
      const isTie = Math.round(m.trustMelon) === Math.round(m.trustWater);
      const isMelonWin = m.trustMelon > m.trustWater;

      if (s.type === 'end_story' || isMelonWin) {
        h += this.renderDialoguePanel('審判長（主文宣判）', '原判決關於駁回上訴人後開第二項之訴部分均廢棄。\n被上訴人水利局應給付上訴人西瓜寮新臺幣 1 億 2,722 萬 2,777 元，及自民國99年6月8日起至清償日止，按週年利率5%計算之利息！', 'green');
        h += `<div class="mt-4 flex justify-center"><button onclick="window.playVictory(true)" class="px-8 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-lg rounded-xl border-2 border-white shadow-xl cursor-pointer">🎉 觀看勝訴判決結果</button></div>`;
      } else if (isTie) {
        h += this.renderDialoguePanel('審判長', '兩造攻防勢均力敵，心證 50% / 50%，請行使最終裁判權：', 'gold');
        h += `
          <div class="mt-4 flex flex-wrap justify-center gap-3">
            <button onclick="window.playVictory(true)" class="px-6 py-3 bg-emerald-500 text-slate-950 font-black rounded-xl cursor-pointer">判決西瓜寮勝訴</button>
            <button onclick="window.playVictory(false)" class="px-6 py-3 bg-rose-600 text-white font-black rounded-xl cursor-pointer">判決水利局勝訴</button>
          </div>
        `;
      } else {
        h += this.renderDialoguePanel('審判長（主文宣判）', '上訴人西瓜寮開發股份有限公司之上訴及假執行之聲請均駁回。訴訟費用由上訴人負擔。', 'red');
        h += `<div class="mt-4 flex justify-center"><button onclick="window.playVictory(false)" class="px-8 py-3 bg-rose-600 hover:bg-rose-500 text-white font-black text-lg rounded-xl border-2 border-white shadow-xl cursor-pointer">觀看水利局勝訴結果</button></div>`;
      }
      h += `</div>`;
      this.r.innerHTML = h;
      return;
    }

    // 5. 一般章節（故事、尋問對決、審判長裁決、金額核算）
    if (s.type === 'story') {
      h += this.renderCourt(m, s.speaker);
      h += this.renderDialoguePanel(s.speaker, s.text, 'gold');
      h += `<div class="mt-4 flex justify-center"><button id="btnNext" class="px-8 py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-base rounded-xl border-2 border-white shadow-lg cursor-pointer">${s.btn} →</button></div>`;
    } else if (s.type === 'story_choice') {
      h += this.renderCourt(m, s.speaker);
      h += this.renderDialoguePanel(s.speaker, s.text, 'gold');
      if (!m.res) {
        h += `<div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">`;
        s.opts.forEach((opt, idx) => {
          h += `<button onclick="window.storyDecide(${opt.correct})" class="p-3.5 font-black text-sm sm:text-base rounded-xl border-2 border-white shadow cursor-pointer ${idx === 1 ? 'bg-emerald-500 hover:bg-emerald-400 text-slate-950' : 'bg-slate-800 hover:bg-slate-700 text-white'}">${opt.label}</button>`;
        });
        h += `</div>`;
      } else {
        h += `<div class="mt-4 p-4 rounded-xl border-2 font-bold text-sm sm:text-base ${m.res.ok ? 'bg-emerald-950/70 border-emerald-400 text-emerald-100' : 'bg-rose-950/70 border-rose-500 text-rose-100'}">${m.res.fb}</div>`;
        h += `<div class="mt-4 flex justify-center"><button id="btnNext" class="px-8 py-2.5 bg-amber-400 text-slate-950 font-black rounded-xl cursor-pointer">繼續審理 →</button></div>`;
      }
    } else if (s.type === 'trial') {
      const st = s.statements[m.statementIdx];
      const activeSpk = !m.res || m.res.type !== 'strong'
        ? s.speaker
        : (m.role === 'melon' ? '上訴人西瓜寮訴訟代理人' : '被上訴人水利局訴訟代理人');
      h += this.renderCourt(m, activeSpk);

      if (!m.res || m.res.type !== 'strong') {
        // 證言進度指示器與前後切換列
        h += `
          <div class="mt-3 flex items-center justify-between bg-slate-900/90 border border-slate-700 rounded-lg px-3 py-1.5">
            <button onclick="window.navStatement(-1)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs font-black text-cyan-300 rounded cursor-pointer">◀ 上一句</button>
            <div class="flex items-center gap-2">
              <span class="text-xs font-black text-amber-300">～尋問～ 證言 ${m.statementIdx + 1} / ${s.statements.length}</span>
              <div class="flex gap-1">
                ${s.statements.map((_, idx) => `<button onclick="window.jumpStatement(${idx})" class="w-2.5 h-2.5 rounded-full cursor-pointer ${idx === m.statementIdx ? 'bg-amber-400' : 'bg-slate-600'}"></button>`).join('')}
              </div>
            </div>
            <button onclick="window.navStatement(1)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs font-black text-cyan-300 rounded cursor-pointer">下一句 ▶</button>
          </div>
        `;
        h += this.renderDialoguePanel(s.speaker, `「${st.text}」`, m.role === 'melon' ? 'red' : 'green');
        h += `<div class="mt-3 p-3 bg-blue-950/75 border border-sky-400 rounded-lg text-xs sm:text-sm text-sky-100 font-bold">💡 ${s.hint}</div>`;
        h += `
          <div class="mt-4 grid grid-cols-2 gap-3">
            <button onclick="window.pressNow()" class="py-3.5 px-4 bg-gradient-to-b from-blue-600 to-blue-800 hover:from-blue-500 hover:to-blue-700 text-white font-black text-base sm:text-xl italic rounded-xl border-2 border-cyan-300 shadow-[0_5px_0_#1e3a8a] active:translate-y-1 cursor-pointer">
              ✋ 威懾（待った！）
            </button>
            <button id="btnObj" class="py-3.5 px-4 bg-gradient-to-b from-rose-600 to-red-800 hover:from-rose-500 hover:to-red-700 text-yellow-300 font-black text-base sm:text-xl italic rounded-xl border-2 border-yellow-300 shadow-[0_5px_0_#7f1d1d] active:translate-y-1 cursor-pointer">
              ⚡ 異議あり！（指證）
            </button>
          </div>
        `;
      } else {
        h += this.renderDialoguePanel(activeSpk, `「${m.res.line}」`, m.role === 'melon' ? 'green' : 'red');
      }

      if (m.res) {
        h += `
          <div class="mt-4 p-4 rounded-xl border-2 text-sm sm:text-base font-bold ${m.res.ok ? 'bg-emerald-950/75 border-emerald-400 text-emerald-100' : 'bg-rose-950/75 border-rose-500 text-rose-100'}">
            <div class="font-black text-base mb-1">${m.res.ok ? '✔ 決定性反擊！動搖合議庭心證！' : '✘ 舉證不足或無關證物！'}</div>
            ${m.res.fb || ''}
          </div>
        `;
        if (m.res.ok) {
          h += `<div class="mt-4 flex justify-center"><button id="btnNext" class="px-8 py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-base rounded-xl border-2 border-white shadow-lg cursor-pointer">進入下一爭點 →</button></div>`;
        } else if (m.res.retry) {
          h += `<div class="mt-4 flex justify-center"><button id="btnRetry" class="px-8 py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-black rounded-xl border-2 border-white cursor-pointer">重新開啟法庭紀錄</button></div>`;
        }
      }
    } else if (s.type === 'judge_trial') {
      const spk = m.judgeStep === 0 ? '被上訴人水利局訴訟代理人' : m.judgeStep === 1 ? '上訴人西瓜寮訴訟代理人' : '審判長';
      h += this.renderCourt(m, spk);
      if (m.judgeStep === 0) {
        h += this.renderDialoguePanel('被上訴人（水利局）主張', `「${s.p_claim}」`, 'red');
        h += `<div class="mt-4 flex justify-center"><button id="btnJudgeNext" class="px-8 py-3 bg-amber-400 text-slate-950 font-black rounded-xl cursor-pointer">聽取上訴人抗辯 →</button></div>`;
      } else if (m.judgeStep === 1) {
        h += this.renderDialoguePanel('上訴人（西瓜寮）抗辯', `「${s.d_claim}」`, 'green');
        h += `<div class="mt-4 flex justify-center"><button id="btnJudgeNext" class="px-8 py-3 bg-amber-400 text-slate-950 font-black rounded-xl cursor-pointer">合議庭評議裁決 →</button></div>`;
      } else {
        h += this.renderDialoguePanel('合議庭評議', s.question, 'gold');
        if (!m.res) {
          h += `<div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-2.5">`;
          s.options.forEach(opt => {
            const cls = opt.type === 'd' ? 'bg-emerald-600 hover:bg-emerald-500 text-white' : opt.type === 'p' ? 'bg-rose-700 hover:bg-rose-600 text-white' : 'bg-slate-800 hover:bg-slate-700 text-amber-300';
            h += `<button onclick="window.judgeDecide('${opt.type}', ${opt.trustM}, ${opt.trustW}, '${opt.fb}')" class="p-3 rounded-xl border border-slate-500 font-black text-xs sm:text-sm text-left cursor-pointer ${cls}">${opt.label}</button>`;
          });
          h += `</div>`;
        } else {
          h += `<div class="mt-4 p-4 rounded-xl border-2 font-bold text-sm ${m.res.ok ? 'bg-emerald-950/75 border-emerald-400 text-emerald-100' : 'bg-amber-950/75 border-amber-400 text-amber-100'}">${m.res.fb}</div>`;
          h += `<div class="mt-4 flex justify-center"><button id="btnNext" class="px-8 py-2.5 bg-amber-400 text-slate-950 font-black rounded-xl cursor-pointer">下一章 →</button></div>`;
        }
      }
    } else if (s.type === 'calc') {
      h += this.renderCourt(m, '審判長');
      h += this.renderCalc(m, s);
    }

    h += `</div>`;
    if (m.bag) h += this.renderCourtRecordModal(m);
    if (m.pressPopup) h += this.renderPressModal(m);
    if (m.charPopup) h += this.renderCharPopup(m);

    this.r.innerHTML = h;
  }
}

class Ctrl {
  constructor(m, v) {
    this.m = m;
    this.v = v;
  }
  start() {
    this.v.render(this.m);
    this.bind();
    this.upgradeAvatarImages();
  }
  upgradeAvatarImages() {
    document.querySelectorAll('img[data-gh]').forEach(img => {
      if (img.dataset.probed) return;
      img.dataset.probed = '1';
      const tester = new Image();
      tester.onload = () => { img.src = img.dataset.gh; };
      tester.onerror = () => {
        const localTester = new Image();
        localTester.onload = () => { img.src = img.dataset.local; };
        localTester.src = img.dataset.local;
      };
      tester.src = img.dataset.gh;
    });
  }
  bind() {
    const m = this.m;
    const nBtn = document.getElementById('btnNext');
    if (nBtn) nBtn.onclick = () => { m.next(); this.start(); };
    const jNext = document.getElementById('btnJudgeNext');
    if (jNext) jNext.onclick = () => { m.judgeNextStep(); this.start(); };
    const oBtn = document.getElementById('btnObj');
    if (oBtn) oBtn.onclick = () => { sfx.objection(m.role); m.open(false); this.start(); };
    const rBtn = document.getElementById('btnRetry');
    if (rBtn) rBtn.onclick = () => { m.res = null; m.open(false); this.start(); };
    const sBtn = document.getElementById('btnSubmitCalc');
    if (sBtn) sBtn.onclick = () => { m.submitCalc(); this.start(); };
    const rcBtn = document.getElementById('btnRetryCalc');
    if (rcBtn) rcBtn.onclick = () => { m.res = null; this.start(); };
  }
  shake() {
    const frame = document.getElementById('app-frame');
    if (frame) {
      frame.classList.remove('shake');
      void frame.offsetWidth;
      frame.classList.add('shake');
    }
  }
}

const app = new Ctrl(new Model(), new View(document.getElementById('app-frame')));
window.app = app;

window.showRoleSelect = () => { sfx.gavel(); app.m.role = 'select'; app.start(); };
window.selectRole = (role) => {
  sfx.gavel();
  app.m.role = role;
  app.m.i = 0;
  app.m.statementIdx = 0;
  app.m.pressedSet.clear();
  if (role === 'melon') { app.m.trustMelon = 20; app.m.trustWater = 80; }
  else if (role === 'water') { app.m.trustMelon = 60; app.m.trustWater = 40; }
  else { app.m.trustMelon = 50; app.m.trustWater = 50; }

  if (role === 'story') app.m.scenes = [...SCENES_STORY];
  else if (role === 'melon') app.m.scenes = [...SCENES_MELON, SCENE_CALC, SCENE_END];
  else if (role === 'water') app.m.scenes = [...SCENES_WATER, SCENE_CALC, SCENE_END];
  else if (role === 'judge') app.m.scenes = [...SCENES_JUDGE, SCENE_CALC, SCENE_END];
  app.start();
};

window.toggleMute = () => { sfx.toggleMute(); app.start(); };
window.openRecord = (readOnly = true) => { sfx.blip(580); app.m.open(readOnly); app.start(); };
window.closeRecord = () => { sfx.blip(440); app.m.closeBag(); app.start(); };
window.switchRecordTab = (tab) => { sfx.blip(540); app.m.recordTab = tab; app.start(); };
window.selectEvidenceSlot = (idx) => { sfx.blip(640); app.m.selectedSlot = idx; app.start(); };
window.presentSelectedEvidence = () => {
  const id = app.m.recordBag[app.m.selectedSlot];
  const r = app.m.pick(id);
  if (r && !r.ok) app.shake();
  app.start();
};

window.navStatement = (dir) => { app.m.navStatement(dir); app.start(); };
window.jumpStatement = (idx) => { app.m.jumpStatement(idx); app.start(); };
window.pressNow = () => { app.m.pressStatement(); app.start(); };
window.advancePress = () => { app.m.advancePressPopup(); app.start(); };
window.objectFromPress = () => {
  app.m.pressPopup = null;
  sfx.objection(app.m.role);
  app.m.open(false);
  app.start();
};

window.judgeDecide = (type, trustM, trustW, fb) => { app.m.judgePick(type, trustM, trustW, fb); app.start(); };
window.storyDecide = (isCorrect) => { app.m.storyPick(isCorrect); app.start(); };
window.closePopup = () => { app.m.closeCharPopup(); };

window.updateInput = (type, val) => {
  app.m.setCalcInput(type, val);
  const btn = document.getElementById('btnSubmitCalc');
  if (btn) {
    const ok = app.m.calcInput.qty && app.m.calcInput.price && app.m.calcInput.cost;
    if (ok) btn.removeAttribute('disabled');
    else btn.setAttribute('disabled', 'true');
  }
};

window.playVictory = (isMelonWin) => {
  sfx.gavel();
  const overlay = document.getElementById('victory-overlay');
  const title = document.getElementById('victory-title');
  const sub = document.getElementById('victory-sub');
  if (isMelonWin) {
    title.innerText = '西瓜寮勝訴！';
    title.style.color = '#4ade80';
    sub.innerText = '被上訴人水利局應給付上訴人西瓜寮 1 億 2,722 萬 2,777 元，及自99年6月8日起按週年利率5%計算之利息。';
  } else {
    title.innerText = '水利局勝訴！';
    title.style.color = '#fb7185';
    sub.innerText = '上訴人西瓜寮之上訴及假執行之聲請均駁回，訴訟費用由上訴人負擔。';
  }
  overlay.classList.add('show');
  for (let i = 0; i < 80; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-12px';
      c.style.backgroundColor = ['#facc15', '#ef4444', '#22c55e', '#38bdf8', '#fff'][Math.floor(Math.random() * 5)];
      c.style.animationDuration = (Math.random() * 2.5 + 2) + 's';
      overlay.appendChild(c);
      setTimeout(() => c.remove(), 4500);
    }, i * 22);
  }
};

document.addEventListener('keydown', (e) => {
  if (app.m.bag && app.m.recordTab === 'evidence') {
    const len = app.m.recordBag.length;
    if (e.key === 'ArrowRight') {
      app.m.selectedSlot = (app.m.selectedSlot + 1) % len;
      sfx.blip(640);
      app.start();
    } else if (e.key === 'ArrowLeft') {
      app.m.selectedSlot = (app.m.selectedSlot - 1 + len) % len;
      sfx.blip(640);
      app.start();
    } else if (e.key === 'Enter' && !app.m.recordReadOnly) {
      window.presentSelectedEvidence();
    } else if (e.key === 'Escape') {
      window.closeRecord();
    }
    return;
  }
  if (app.m.cur && app.m.cur.type === 'trial' && !app.m.res && !app.m.pressPopup && !app.m.charPopup) {
    if (e.key === 'ArrowRight') { app.m.navStatement(1); app.start(); }
    else if (e.key === 'ArrowLeft') { app.m.navStatement(-1); app.start(); }
  }
});

app.start();
</script>
</body>
</html>
