<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>法庭攻防與土石清運計算系統</title>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    
    /* 1. 合議庭區：完美對齊、不懸空 */
    .judicial-bench {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 15px;
      margin-bottom: 25px;
      background: #1a1a1a;
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid #333;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }
    .bench-seat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .judicial-bench img {
      max-height: 140px;
      object-fit: contain;
    }
    .bench-label {
      font-size: 12px;
      color: #ccc;
      margin-top: 5px;
    }

    /* 2. 訴訟代理人區 (常態靜態顯示) */
    .lawyer-section {
      display: flex;
      justify-content: space-around;
      margin-bottom: 25px;
    }
    .lawyer-box {
      background: #1a1a1a;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .lawyer-box img {
      max-height: 180px;
    }

    /* 3. 數據表格與按鈕樣式 */
    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 65%;
      background: #222;
    }
    th, td {
      border: 1px solid #444;
      padding: 12px;
    }
    th {
      background: #333;
    }
    button {
      padding: 10px 20px;
      background-color: #d9534f;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #c9302c;
    }

    /* 4. 模擬遊戲對話框與大半身特寫樣式 (對應您的截圖畫面) */
    .dialogue-overlay {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .dialogue-avatar {
      max-height: 350px;
      margin-bottom: -20px;
      z-index: 1000;
      filter: drop-shadow(0 0 15px #2ecc71);
    }
    .dialogue-box {
      background: #0f1f0f;
      border: 3px solid #2ecc71;
      width: 70%;
      padding: 25px;
      border-radius: 10px;
      text-align: left;
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.4);
    }
    .dialogue-speaker {
      color: #2ecc71;
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 18px;
    }
    .dialogue-text {
      font-size: 16px;
      line-height: 1.5;
    }

    /* 5. 彈跳視窗 (Modal) 樣式 */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.85);
    }
    .modal-content {
      background-color: #2c2c2c;
      margin: 5% auto;
      padding: 25px;
      border: 1px solid #555;
      width: 500px;
      border-radius: 8px;
      text-align: left;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-content label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
    }
    .modal-content input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
      background: #111;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
    }

    /* 卷證資料區塊樣式 */
    .evidence-box {
      background: #1e1e1e;
      border: 1px dashed #777;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      font-size: 13px;
      color: #ddd;
    }
    .evidence-box h4 {
      margin: 0 0 5px 0;
      color: #f0ad4e;
    }
  </style>
</head>
<body>

  <h1>法庭攻防與土石清運計算系統</h1>

  <!-- 1. 合議庭區：左陪席、審判長、右陪席 -->
  <div class="judicial-bench">
    <div class="bench-seat">
      <img src="judge_left.png" alt="左陪席法官">
      <div class="bench-label">左陪席法官</div>
    </div>
    <div class="bench-seat">
      <img src="judge_chief.png" alt="審判長">
      <div class="bench-label">審判長</div>
    </div>
    <div class="bench-seat">
      <img src="judge_right.png" alt="右陪席法官">
      <div class="bench-label">右陪席法官</div>
    </div>
  </div>

  <!-- 2. 訴訟代理人區 (常態顯示) -->
  <div class="lawyer-section">
    <div class="lawyer-box">
      <h3>上訴人：西瓜寮</h3>
      <img src="lawyer_melon.png" alt="西瓜寮代理人">
      <br><br>
      <button onclick="triggerObjection('melon')" style="font-size: 14px; padding: 6px 12px;">測試西瓜寮發動異議</button>
    </div>
    <div class="lawyer-box">
      <h3>被上訴人：水利局</h3>
      <img src="lawyer_water.png" alt="水利局代理人">
      <br><br>
      <button onclick="triggerObjection('water')" style="font-size: 14px; padding: 6px 12px; background-color: #337ab7;">測試水利局發動異議</button>
    </div>
  </div>

  <hr style="border-color: #444; width: 80%;">

  <!-- 3. 數據申報表格 -->
  <h2>土石清運與金額申報表</h2>
  <table>
    <tr>
      <th>項目</th>
      <th>數量 (立方公尺)</th>
      <th>金額 (新台幣)</th>
    </tr>
    <tr>
      <td>系爭土石體積與清運費計算</td>
      <td id="result-volume">0</td>
      <td id="result-amount">0</td>
    </tr>
  </table>
  <br>
  <button onclick="openCalculatorModal()">開啟土石計算機 (檢附卷證資料)</button>

  <!-- ================= 模擬遊戲對話框 (對應截圖中的發言畫面) ================= -->
  <div id="dialogueOverlay" class="dialogue-overlay" onclick="closeDialogue()">
    <!-- 這裡會動態載入帶有發光特效的指向圖片 (lawyer_melon_point.png 或 lawyer_water_point.png) -->
    <img id="dialogueAvatarImg" class="dialogue-avatar" src="" alt="發言特寫">
    
    <div class="dialogue-box">
      <div id="dialogueSpeaker" class="dialogue-speaker">上訴人西瓜寮訴訟代理人</div>
      <div id="dialogueText" class="dialogue-text">異議あり！本件終止契約之主張，係於二審始提出之新攻擊防禦方法，違反民事訴訟法第447條！</div>
    </div>
  </div>

  <!-- ================= 彈跳視窗：檢附卷證資料的土石計算機 ================= -->
  <div id="calcModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0; color: #f0ad4e;">系爭土石清運計算機</h3>
      
      <!-- 檢附卷證資料區 -->
      <div class="evidence-box">
        <h4>📋 檢附卷證資料依據：</h4>
        <p>1. <b>臺灣OO地方法院勘驗筆錄</b>：記載堆置長度 10m、寬度 5m、平均深度 2m。<br>
           2. <b>土石清運公會鑑價參考表</b>：一般營建混合物清運單價計新台幣 1,500 元/m³。</p>
      </div>

      <label>長度 (公尺) [依勘驗筆錄]：</label>
      <input type="number" id="calc-length" value="10">
      
      <label>寬度 (公尺) [依勘驗筆錄]：</label>
      <input type="number" id="calc-width" value="5">
      
      <label>深度/高度 (公尺) [依勘驗筆錄]：</label>
      <input type="number" id="calc-depth" value="2">
      
      <label>單價 (元/立方公尺) [依鑑價參考表]：</label>
      <input type="number" id="calc-price" value="1500">
      
      <div style="text-align: right; margin-top: 20px;">
        <button onclick="calculateAndFill()">確認計算並填入表格</button>
        <button onclick="closeModal()" style="background-color: #666;">關閉</button>
      </div>
    </div>
  </div>

  <script>
    // 點擊觸發異議對話框，並自動帶入對應的指向特寫圖片
    function triggerObjection(lawyerType) {
      const overlay = document.getElementById('dialogueOverlay');
      const avatarImg = document.getElementById('dialogueAvatarImg');
      const speakerElem = document.getElementById('dialogueSpeaker');
      const textElem = document.getElementById('dialogueText');

      if (lawyerType === 'melon') {
        speakerElem.innerText = "上訴人西瓜寮訴訟代理人";
        textElem.innerText = "異議あり！本件終止契約之主張，係於二審始提出之新攻擊防禦方法，違反民事訴訟法第447條！";
        avatarImg.src = "lawyer_melon_point.png"; // 換上您要求的指向圖
      } else {
        speakerElem.innerText = "被上訴人水利局訴訟代理人";
        textElem.innerText = "異議あり！對造之主張顯無理由，相關土石體積計算基準應依被證五勘驗筆錄為準！";
        avatarImg.src = "lawyer_water_point.png"; // 換上水利局指向圖
      }

      overlay.style.display = 'flex';
    }

    // 點擊畫面任意處關閉對話框
    function closeDialogue() {
      document.getElementById('dialogueOverlay').style.display = 'none';
    }

    // 開啟計算機視窗
    function openCalculatorModal() {
      document.getElementById('calcModal').style.display = 'block';
    }

    // 關閉計算機視窗
    function closeModal() {
      document.getElementById('calcModal').style.display = 'none';
    }

    // 點擊 Modal 外部黑幕自動關閉
    window.onclick = function(event) {
      const modal = document.getElementById('calcModal');
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    }

    // 計算邏輯並填入表格
    function calculateAndFill() {
      const L = parseFloat(document.getElementById('calc-length').value) || 0;
      const W = parseFloat(document.getElementById('calc-width').value) || 0;
      const D = parseFloat(document.getElementById('calc-depth').value) || 0;
      const P = parseFloat(document.getElementById('calc-price').value) || 0;

      const volume = L * W * D;
      const amount = volume * P;

      // 填入表格
      document.getElementById('result-volume').innerText = volume.toLocaleString();
      document.getElementById('result-amount').innerText = amount.toLocaleString() + ' 元';

      closeModal();
    }
  </script>

</body>
</html>
