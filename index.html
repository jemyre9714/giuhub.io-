<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>西瓜寮裁判所</title>
<style>
:root { --gold: #ffcc00; --red: #ff0033; --green: #00ff66; --blue: #0066ff; --bg: #0a0a1a; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: "Arial Black", "Impact", "Noto Sans TC", sans-serif; -webkit-tap-highlight-color: transparent; }
body {
  color: #fff; min-height: 100vh; padding: 10px; overflow-x: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(circle at center, rgba(0,50,100,0.4) 0%, transparent 70%), linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000), linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000);
  background-size: 100% 100%, 20px 20px, 20px 20px; background-position: 0 0, 0 0, 10px 10px;
}
body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999; background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.15) 50%); background-size: 100% 4px; }

#app { max-width: 1000px; margin: 0 auto; position: relative; z-index: 1; border: 4px solid #222; border-radius: 12px; box-shadow: 0 0 0 2px #444, 0 0 50px rgba(0,0,0,0.8), inset 0 0 100px rgba(0,0,0,0.9); background: #000; padding: 15px; overflow: hidden; }

/* 封面與選單 */
.cover-screen { text-align: center; padding: 60px 20px; position: relative; }
.cover-title { font-size: clamp(36px, 8vw, 60px); color: var(--gold); font-weight: 900; letter-spacing: 4px; text-shadow: 4px 4px 0 #a00, 8px 8px 0 #000; margin-bottom: 10px; font-style: italic; }
.cover-sub { color: #fff; font-size: clamp(16px, 4vw, 24px); letter-spacing: 4px; margin-bottom: 40px; text-shadow: 2px 2px 0 var(--blue); }
.press-start { font-size: clamp(20px, 5vw, 32px); color: #fff; font-weight: 900; animation: blink 1s infinite; cursor: pointer; padding: 20px; text-shadow: 2px 2px 0 var(--red); }
.press-start:hover { color: var(--gold); }
@keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.05); } }

.roles-container { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
.role-card { flex: 1; min-width: 250px; padding: 20px; cursor: pointer; background: rgba(10,20,40,0.8); border: 4px solid #444; text-align: center; transition: .1s; border-radius: 12px; }
.role-card:hover { transform: translateY(-5px); box-shadow: 0 0 20px #fff; }
.role-card.story { border-color: #fff; }
.role-card.melon { border-color: var(--green); }
.role-card.water { border-color: var(--red); }
.role-card.judge { border-color: var(--gold); }
.role-icon { width: 80px; height: 80px; margin: 0 auto 10px; filter: drop-shadow(4px 4px 0 #000); }
.role-card h3 { font-size: clamp(18px, 4vw, 22px); margin-bottom: 8px; color: #fff; text-shadow: 2px 2px 0 #000; line-height: 1.4; }
.role-card p { font-size: 14px; color: #aaa; }

/* 法庭全景 */
.courtroom-scene { background: #1a1008; border: 4px solid #444; border-radius: 8px; margin-bottom: 15px; position: relative; height: clamp(240px, 40vh, 350px); display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }
.courtroom-scene::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.8) 100%), repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.03) 40px, rgba(255,255,255,0.03) 42px); pointer-events: none; z-index: 0; }
.judge-stand { position: relative; z-index: 2; width: 100%; height: 45%; background: linear-gradient(to bottom, #2a1a0e, #1a1008); border-bottom: 6px solid #4a2e15; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 5px; box-shadow: 0 10px 20px rgba(0,0,0,0.8); }
.judge-bench { display: flex; justify-content: center; align-items: flex-end; gap: clamp(10px, 3vw, 40px); }
.judge-avatar { filter: drop-shadow(0 0 10px #000); transition: .3s; }
.main-judge { width: clamp(60px, 12vw, 100px); height: clamp(60px, 12vw, 100px); }
.judge-side { width: clamp(40px, 8vw, 70px); height: clamp(40px, 8vw, 70px); opacity: 0.7; }
.judge-avatar.active { filter: drop-shadow(0 0 20px var(--gold)); transform: translateY(-5px); }

.bailiff-stand { position: absolute; bottom: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; }
.bailiff-stand.left { left: 2%; }
.bailiff-stand.right { right: 2%; }
.bailiff-avatar { width: clamp(40px, 8vw, 70px); height: clamp(40px, 8vw, 70px); filter: drop-shadow(0 0 5px #000); }
.bailiff-label { font-size: 10px; color: #ffcc00; background: #000; padding: 2px 6px; border-radius: 4px; margin-top: 2px; display: none; }
@media (min-width: 600px) { .bailiff-label { display: block; } }

.players-area { position: relative; z-index: 2; display: flex; justify-content: space-between; padding: 0 5%; width: 100%; margin-bottom: 5px; }
.player-side { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 45%; }
.player-side .avatar { width: clamp(60px, 12vw, 100px); height: clamp(60px, 12vw, 100px); background: #111; border: 3px solid #555; transition: .2s; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }
.player-side.left .avatar { border-color: var(--green); }
.player-side.right .avatar { border-color: var(--red); }
.player-side .avatar.active { transform: translateY(-10px); }
.player-side.left .avatar.active { box-shadow: 0 0 20px var(--green); }
.player-side.right .avatar.active { box-shadow: 0 0 20px var(--red); }
.player-side .avatar svg { width: 100%; height: 100%; }
.name-tag { font-size: clamp(10px, 2.5vw, 14px); font-weight: 900; color: #fff; background: #000; padding: 4px 10px; border: 1px solid #555; text-transform: uppercase; text-align: center; line-height: 1.2; }
.player-side.left .name-tag { color: var(--green); border-color: var(--green); }
.player-side.right .name-tag { color: var(--red); border-color: var(--red); }

/* 對話與 UI */
.dialog-box { background: rgba(0,0,0,0.95); border: 3px solid var(--gold); border-radius: 8px; padding: 15px; min-height: 100px; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,1); }
.speaker-name { position: absolute; top: -14px; left: 15px; background: var(--gold); color: #000; font-size: clamp(12px, 3vw, 14px); font-weight: 900; padding: 2px 15px; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); }
.dialog-content { font-size: clamp(14px, 3.5vw, 18px); line-height: 1.6; color: #fff; margin-top: 8px; font-family: "Noto Sans TC", sans-serif; font-weight: bold; }

/* 提示框 */
.hint-box { background: rgba(0, 50, 150, 0.8); border: 2px solid var(--blue); border-radius: 6px; padding: 10px; margin-top: 15px; text-align: center; font-size: clamp(12px, 3vw, 16px); color: #fff; box-shadow: 0 0 10px rgba(0,102,255,0.5); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 10px rgba(0,102,255,0.5); } 50% { box-shadow: 0 0 20px rgba(0,102,255,1); } }

/* 按鈕 */
.objection-btn { display: block; margin: 15px auto; padding: 12px 40px; background: var(--red); color: #fff; border: 3px solid #fff; border-radius: 8px; font-size: clamp(20px, 5vw, 28px); font-weight: 900; cursor: pointer; transition: .1s; text-transform: uppercase; text-shadow: 2px 2px 0 #000; box-shadow: 0 6px 0 #800, 0 10px 15px rgba(0,0,0,0.8); font-style: italic; width: 90%; max-width: 350px; }
.objection-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #800; }
.btn { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; background: var(--gold); color: #000; font-weight: 900; font-size: clamp(14px, 3.5vw, 18px); transition: .1s; display: block; margin: 10px auto; width: 100%; max-width: 300px; text-transform: uppercase; box-shadow: 0 4px 0 #a00; }
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn.green { background: var(--green); box-shadow: 0 4px 0 #080; }
.btn.red { background: var(--red); color: #fff; box-shadow: 0 4px 0 #800; }
.next-wrap { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }

/* 證物袋 */
.evidence-bag { margin-top: 15px; padding: 15px; background: #112; border: 3px solid #445; border-radius: 8px; animation: slideUp .2s ease; }
.evidence-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(80px, 20vw, 110px), 1fr)); gap: 10px; margin-top: 10px; }
.evidence-card { padding: 10px 5px; text-align: center; background: #223; border: 2px solid #667; border-radius: 6px; cursor: pointer; transition: .1s; color: #fff; }
.evidence-card:active { background: var(--blue); }
.ev-icon { width: 32px; height: 32px; margin: 0 auto 5px; display: block; }
.ev-name { font-size: 12px; font-weight: bold; font-family: "Noto Sans TC", sans-serif; }

/* 審判長 UI */
.judge-ui { background: #112; border: 3px solid var(--gold); border-radius: 8px; padding: 15px; margin-top: 15px; text-align: center; }
.judge-ui h3 { color: var(--gold); margin-bottom: 15px; font-size: clamp(14px, 4vw, 18px); line-height: 1.4; }
.judge-choice { display: flex; flex-direction: column; gap: 10px; }
@media (min-width: 600px) { .judge-choice { flex-direction: row; justify-content: center; } }
.judge-choice button { flex: 1; padding: 15px; font-size: clamp(14px, 3.5vw, 18px); font-weight: 900; border: 3px solid #fff; border-radius: 8px; cursor: pointer; transition: .1s; text-transform: uppercase; line-height: 1.4;}
.btn-pass { background: var(--blue); color: #fff; box-shadow: 0 4px 0 #003; }
.btn-pass:active { transform: translateY(4px); box-shadow: none; }
.btn-object { background: var(--red); color: #fff; box-shadow: 0 4px 0 #800; }
.btn-object:active { transform: translateY(4px); box-shadow: none; }

/* 回饋 */
.feedback { margin-top: 15px; padding: 15px; border-left: 6px solid; font-size: clamp(13px, 3vw, 16px); font-family: "Noto Sans TC", sans-serif; font-weight: bold; border-radius: 4px; }
.feedback.ok { background: rgba(0,255,102,0.15); border-color: var(--green); color: #ccffdd; }
.feedback.ng { background: rgba(255,0,51,0.15); border-color: var(--red); color: #ffccdd; }
.feedback strong { display: block; margin-bottom: 8px; font-size: clamp(16px, 4vw, 20px); font-family: "Arial Black", sans-serif; text-transform: uppercase; }

/* 彈窗與動畫 */
.judge-popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 2000; animation: fadeIn .1s; padding: 20px; }
.judge-popup { background: #000; border: 4px solid var(--red); border-radius: 12px; padding: 20px; text-align: center; max-width: 400px; width: 100%; transform: scale(0.8); animation: popIn .2s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 0 30px var(--red); }
.judge-popup .avatar { width: 100px; height: 100px; margin: 0 auto 15px; filter: drop-shadow(0 0 15px var(--red)); }
.judge-popup h3 { color: var(--red); font-size: clamp(22px, 6vw, 30px); margin-bottom: 10px; text-shadow: 2px 2px 0 #fff; font-style: italic; }
.judge-popup p { font-size: clamp(14px, 4vw, 18px); line-height: 1.5; color: #fff; margin-bottom: 15px; font-family: "Noto Sans TC", sans-serif; font-weight: bold; }
@keyframes popIn { to { transform: scale(1); } }

.bailiff-scene { position: fixed; inset: 0; background: #000; z-index: 3000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.bailiff-drag { display: flex; align-items: flex-end; gap: 10px; animation: dragAway 2.5s forwards cubic-bezier(0.7, 0, 1, 1); }
.bailiff-svg-large { width: clamp(80px, 20vw, 150px); height: clamp(80px, 20vw, 150px); animation: walk 0.4s infinite alternate; }
.player-svg-large { width: clamp(60px, 15vw, 120px); height: clamp(60px, 15vw, 120px); transform: rotate(30deg); filter: drop-shadow(0 0 10px rgba(255,0,0,0.8)); }
.bailiff-text { position: absolute; top: 20%; width: 100%; text-align: center; font-size: clamp(24px, 8vw, 50px); color: var(--red); font-weight: 900; text-shadow: 3px 3px 0 #fff; animation: blink .3s infinite; font-style: italic; padding: 0 10px; }
@keyframes dragAway { 0% { transform: translateX(0); } 20% { transform: translateX(-50px) rotate(-5deg); } 80% { opacity: 1; } 100% { transform: translateX(100vw); opacity: 0; } }
@keyframes walk { from { transform: translateY(0); } to { transform: translateY(-10px); } }

#flash-overlay { position: fixed; inset: 0; background: #fff; z-index: 5000; pointer-events: none; opacity: 0; }
.flash-active { animation: flashAnim 0.4s ease-out; }
@keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
#decisive-text { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5001; pointer-events: none; opacity: 0; padding: 20px; }
.decisive-active { animation: decisiveAnim 1.5s ease-out forwards; }
@keyframes decisiveAnim { 0% { opacity: 0; transform: scale(0.5) rotate(-10deg); } 20% { opacity: 1; transform: scale(1.1) rotate(5deg); } 40% { transform: scale(1) rotate(-2deg); } 80% { opacity: 1; transform: scale(1) rotate(0deg); } 100% { opacity: 0; transform: scale(1.5) rotate(0deg); } }
.decisive-text-inner { font-size: clamp(40px, 12vw, 80px); font-weight: 900; color: var(--gold); text-shadow: 4px 4px 0 var(--red), 8px 8px 0 #000; font-style: italic; letter-spacing: 4px; text-align: center; line-height: 1.2; }

/* 勝訴動畫 */
#victory-overlay { position: fixed; inset: 0; z-index: 6000; background: radial-gradient(circle, rgba(255,204,0,0.2) 0%, rgba(0,0,0,0.95) 70%); display: none; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
#victory-overlay.show { display: flex; animation: fadeIn .5s ease; }
.victory-title { font-size: clamp(60px, 15vw, 120px); color: var(--gold); font-weight: 900; text-shadow: 6px 6px 0 var(--red), 12px 12px 0 #000; transform: rotate(-10deg); animation: popIn .5s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 2; font-style: italic; letter-spacing: 8px; }
.victory-sub { font-size: clamp(20px, 5vw, 36px); color: #fff; margin-top: 20px; z-index: 2; animation: slideUp .5s .2s forwards; opacity: 0; text-align: center; }
.confetti { position: absolute; width: 10px; height: 10px; background: #f00; animation: fall linear forwards; z-index: 1; }
@keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }

@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.shake { animation: shake .4s ease; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }

/* 第六章算帳 UI */
.calc-facts { background: #222; border: 2px solid var(--gold); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
.fact-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #555; font-family: "Noto Sans TC", sans-serif; font-size: 15px; }
.fact-row:last-child { border-bottom: none; }
.fact-label { color: #aaa; }
.fact-val { color: var(--gold); font-weight: bold; }
.calc-options { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
.option-group { background: #112; border: 2px solid #445; padding: 10px; border-radius: 8px; }
.option-title { font-size: 14px; color: var(--blue); margin-bottom: 8px; font-weight: bold; }
.option-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.opt-btn { flex: 1; padding: 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 14px; transition: .1s; }
.opt-btn.selected { background: var(--blue); border-color: #fff; box-shadow: 0 0 10px var(--blue); }
.opt-btn.wrong { background: var(--red); border-color: #fff; }
.opt-btn.correct { background: var(--green); color: #000; border-color: #fff; }
.calc-result { margin-top: 20px; text-align: center; font-size: 20px; color: var(--gold); font-weight: bold; display: none; }
.calc-result.show { display: block; animation: popIn .3s forwards; }
</style>
</head>
<body>

<div id="app"></div>
<div id="flash-overlay"></div>
<div id="decisive-text"><div class="decisive-text-inner">決定的證據！</div></div>

<!-- 勝訴特效層 -->
<div id="victory-overlay">
  <div class="victory-title">勝訴！</div>
  <div class="victory-sub">水利局應給付西瓜寮 1 億 2,722 萬 2,777 元</div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="opp" viewBox="0 0 16 16"><rect x="2" y="0" width="12" height="3" fill="#4a4a4a"/><rect x="2" y="3" width="12" height="6" fill="#e8c8a8"/><rect x="3" y="4" width="4" height="2" fill="none" stroke="#1a1008" stroke-width="0.4"/><rect x="9" y="4" width="4" height="2" fill="none" stroke="#1a1008" stroke-width="0.4"/><rect x="7" y="4.8" width="2" height="0.4" fill="#1a1008"/><rect x="6" y="7.5" width="4" height="0.5" fill="#4a2a2a"/><rect x="2" y="9" width="12" height="7" fill="#2a2a3a"/><rect x="7" y="9" width="2" height="5" fill="#8b3a3a"/></symbol>
    <symbol id="ply" viewBox="0 0 16 16"><rect x="2" y="0" width="12" height="3" fill="#1e4d1e"/><rect x="2" y="3" width="12" height="6" fill="#f5d5b0"/><rect x="3" y="4" width="4" height="2" fill="none" stroke="#1a1008" stroke-width="0.4"/><rect x="9" y="4" width="4" height="2" fill="none" stroke="#1a1008" stroke-width="0.4"/><rect x="7" y="4.8" width="2" height="0.4" fill="#1a1008"/><rect x="7" y="7.5" width="2" height="0.5" fill="#8b3a3a"/><rect x="2" y="9" width="12" height="7" fill="#1a1a3a"/><rect x="7" y="9" width="2" height="5" fill="#ff4d6d"/></symbol>
    <symbol id="judge-main" viewBox="0 0 16 16"><rect x="3" y="0" width="10" height="1" fill="#eeeeee"/><rect x="2" y="1" width="12" height="2" fill="#eeeeee"/><rect x="1" y="3" width="2" height="2" fill="#eeeeee"/><rect x="13" y="3" width="2" height="2" fill="#eeeeee"/><rect x="3" y="3" width="10" height="6" fill="#f5d5b0"/><rect x="4" y="5" width="2" height="1" fill="#1a1008"/><rect x="10" y="5" width="2" height="1" fill="#1a1008"/><rect x="7" y="7" width="2" height="1" fill="#8b3a3a"/><rect x="1" y="9" width="14" height="7" fill="#1a1a1a"/><rect x="4" y="9" width="8" height="7" fill="#2a2a2a"/><rect x="7" y="9" width="2" height="3" fill="#8b3a3a"/><rect x="2" y="11" width="4" height="2" fill="#a87840"/><rect x="4" y="11" width="1" height="4" fill="#6b4f2f"/></symbol>
    <symbol id="judge-side" viewBox="0 0 16 16"><rect x="3" y="1" width="10" height="2" fill="#dddddd"/><rect x="2" y="3" width="12" height="1" fill="#dddddd"/><rect x="3" y="4" width="10" height="6" fill="#f5d5b0"/><rect x="4" y="5" width="2" height="1" fill="#1a1008"/><rect x="10" y="5" width="2" height="1" fill="#1a1008"/><rect x="6" y="7.5" width="4" height="0.5" fill="#1a1008"/><rect x="1" y="10" width="14" height="6" fill="#222"/><rect x="5" y="10" width="6" height="6" fill="#333"/><rect x="7" y="10" width="2" height="4" fill="#003366"/></symbol>
    <symbol id="bailiff" viewBox="0 0 16 16"><rect x="4" y="0" width="8" height="2" fill="#1a1a1a"/><rect x="2" y="2" width="12" height="1" fill="#000"/><rect x="7" y="0" width="2" height="2" fill="#f7c948"/><rect x="3" y="3" width="10" height="6" fill="#f5d5b0"/><rect x="4" y="5" width="2" height="1" fill="#1a1008"/><rect x="10" y="5" width="2" height="1" fill="#1a1008"/><rect x="6" y="7" width="4" height="0.5" fill="#1a1008"/><rect x="2" y="9" width="12" height="7" fill="#2a2a3a"/><rect x="7" y="9" width="2" height="4" fill="#111"/><rect x="4" y="9" width="2" height="2" fill="#f7c948"/><rect x="10" y="9" width="2" height="2" fill="#f7c948"/><rect x="13" y="6" width="2" height="6" fill="#111" rx="1"/></symbol>
    <symbol id="i-doc" viewBox="0 0 16 16"><rect x="3" y="1" width="10" height="14" fill="#f5e6c8"/><rect x="4" y="3" width="8" height="0.6" fill="#5a4020"/><rect x="4" y="5" width="8" height="0.6" fill="#5a4020"/><rect x="4" y="7" width="6" height="0.6" fill="#5a4020"/></symbol>
    <symbol id="i-book" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" fill="#8b3a3a"/><rect x="3" y="3" width="10" height="0.8" fill="#f7c948"/><rect x="3" y="12.2" width="10" height="0.8" fill="#f7c948"/><rect x="6" y="6" width="4" height="4" fill="#f7c948"/></symbol>

class Model {
  constructor() { 
    this.i=0; this.score=0; this.max=60; this.lives=3; this.bag=false; this.res=null; 
    this.logs=[]; this.role=null; this.scenes=[]; this.popup=null; this.bailiffAnim=false;
    this.judgeStep = 0; this.storyStep = 0;
    this.calcSel = { qty: null, price: null, cost: null };
  }
  get cur() { return this.scenes[this.i]; }
  open() { this.bag=true; this.res=null; }
  
  pick(id) {
    const s=this.cur; const ev = ALL_EVIDENCE[id];
    if (ev.joke) {
      this.lives--;
      this.bag = false;
      this.popup = ev.joke;
      if(this.lives<=0){ 
        this.res={ok:false, rev:'GameOver'}; 
        this.logs.push({ok:false, fb:'被趕出法庭'}); 
        setTimeout(() => { this.popup = null; this.bailiffAnim = true; app.start(); }, 2000); 
      }
      else { this.res={ok:false, retry:true}; }
      return this.res;
    }
    if(s.ans.includes(id)){
      this.score+=10; this.bag=false; this.res={ok:true, fb:s.fbOk, line:s.success};
      this.logs.push({ok:true, fb:s.fbOk});
    } else {
      this.lives--;
      if(this.lives<=0){ this.bag=false; this.res={ok:false, fb:s.fbNg, rev:ALL_EVIDENCE[s.ans[0]].name}; this.logs.push({ok:false, fb:'生命耗盡'}); }
      else { this.res={ok:false, fb:s.fbNg, retry:true}; }
    }
    return this.res;
  }

  judgeNextStep() { if (this.judgeStep < 2) this.judgeStep++; }
  judgePick(userAns) {
    const s=this.cur;
    if (s.correct === userAns) {
      this.score += 10; this.res = { ok:true, fb: s.fbOk }; this.logs.push({ok:true, fb:s.fbOk});
    } else {
      this.res = { ok:false, fb: s.fbNg }; this.logs.push({ok:false, fb:'判斷錯誤'});
    }
  }

  storyPick(isCorrect) {
    const s=this.cur;
    if (isCorrect) {
      this.res = { ok:true, fb: s.fbOk };
    } else {
      this.res = { ok:false, fb: s.fbNg };
    }
  }

  setCalcOption(type, val) { this.calcSel[type] = val; }
  submitCalc() {
    const s=this.cur;
    const ans = s.options;
    const isCorrect = 
      this.calcSel.qty === ans.qty.find(o=>o.correct).val &&
      this.calcSel.price === ans.price.find(o=>o.correct).val &&
      this.calcSel.cost === ans.cost.find(o=>o.correct).val;
    
    if(isCorrect) {
      this.score += 10;
      this.res = { ok:true, msg: '計算正確！' };
      this.logs.push({ok:true, fb:'計算正確'});
    } else {
      this.res = { ok:false, msg: '數字有誤，請重新核對卷宗事實！' };
      this.logs.push({ok:false, fb:'計算錯誤'});
    }
  }

  next() { 
    if(this.i<this.scenes.length-1){ 
      this.i++; this.lives=3; this.bag=false; this.res=null; this.popup=null; this.bailiffAnim=false; this.judgeStep = 0; this.storyStep = 0;
      this.calcSel = { qty: null, price: null, cost: null };
    } 
  }
}

class Ctrl {
  constructor(m, v) { this.m=m; this.v=v; }
  start() { this.v.render(this.m); this.bind(); }
  
  bind() {
    const m=this.m;
    const nBtn=document.getElementById('btnNext');
    if(nBtn) nBtn.onclick=()=>{ m.next(); this.start(); };
    const jNext=document.getElementById('btnJudgeNext');
    if(jNext) jNext.onclick=()=>{ m.judgeNextStep(); this.start(); };
    const oBtn=document.getElementById('btnObj');
    if(oBtn) oBtn.onclick=()=>{ m.open(); this.start(); };
    const rBtn=document.getElementById('btnRetry');
    if(rBtn) rBtn.onclick=()=>{ m.res=null; m.open(); this.start(); };
    
    document.querySelectorAll('.evidence-card').forEach(c=>{
      c.onclick=()=>{
        const r=m.pick(c.dataset.id);
        if(r.ok) { this.decisiveEffect(); }
        else if(r.retry || r.rev) this.shake();
        this.start();
      };
    });

    const sBtn=document.getElementById('btnSubmitCalc');
    if(sBtn) sBtn.onclick=()=>{ m.submitCalc(); this.start(); };
  }
  
  decisiveEffect() {
    const flash = document.getElementById('flash-overlay');
    const dText = document.getElementById('decisive-text');
    flash.classList.add('flash-active');
    dText.classList.add('decisive-active');
    setTimeout(() => { flash.classList.remove('flash-active'); dText.classList.remove('decisive-active'); }, 1500);
  }
  shake() {
    const a=document.getElementById('app'); a.classList.add('shake'); setTimeout(()=>a.classList.remove('shake'), 400);
  }
}

  app.m.role = role; app.m.i = 0;
  if (role === 'story') app.m.scenes = [...SCENES_STORY];
  else if (role === 'melon') app.m.scenes = [...SCENES_MELON, { type:'calc', title:'第六章・金額之算', facts:[{label:'系爭土石數量', value:'559,221 m³'},{label:'市價', value:'275 元'},{label:'清運費', value:'47.5 元'}], options:{qty:[{label:'300,000',val:300000},{label:'559,221',val:559221,correct:true}],price:[{label:'100',val:100},{label:'275',val:275,correct:true}],cost:[{label:'40',val:40},{label:'47.5',val:47.5,correct:true}]} }, SCENE_END];
  else if (role === 'water') app.m.scenes = [...SCENES_WATER, { type:'calc', title:'第六章・金額之算', facts:[{label:'系爭土石數量', value:'559,221 m³'},{label:'市價', value:'275 元'},{label:'清運費', value:'47.5 元'}], options:{qty:[{label:'300,000',val:300000},{label:'559,221',val:559221,correct:true}],price:[{label:'100',val:100},{label:'275',val:275,correct:true}],cost:[{label:'40',val:40},{label:'47.5',val:47.5,correct:true}]} }, SCENE_END];
  else if (role === 'judge') app.m.scenes = [...SCENES_JUDGE, { type:'calc', title:'第六章・金額之算', facts:[{label:'系爭土石數量', value:'559,221 m³'},{label:'市價', value:'275 元'},{label:'清運費', value:'47.5 元'}], options:{qty:[{label:'300,000',val:300000},{label:'559,221',val:559221,correct:true}],price:[{label:'100',val:100},{label:'275',val:275,correct:true}],cost:[{label:'40',val:40},{label:'47.5',val:47.5,correct:true}]} }, SCENE_END];
  app.start();
};
window.judgeDecide = (ans) => { app.m.judgePick(ans); app.start(); };
window.storyDecide = (isCorrect) => { app.m.storyPick(isCorrect); app.start(); };
window.closePopup = () => { app.m.popup = null; app.start(); };
window.setCalc = (type, val) => { app.m.setCalcOption(type, val); app.start(); };

// 觸發勝訴動畫
window.playVictory = () => {
  const overlay = document.getElementById('victory-overlay');
  overlay.classList.add('show');
  
  // 生成彩帶
  for(let i=0; i<100; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-10px';
      c.style.backgroundColor = ['#ffcc00','#ff0033','#00ff66','#0066ff','#fff'][Math.floor(Math.random()*5)];
      c.style.animationDuration = (Math.random() * 3 + 2) + 's';
      c.style.width = c.style.height = (Math.random() * 10 + 5) + 'px';
      overlay.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }, i * 20);
  }
  
  // 3.5秒後重載頁面
  setTimeout(() => {
    location.reload();
  }, 5000);
};

app.start();
</script>
