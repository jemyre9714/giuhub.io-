<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>司法的重量：西瓜寮土石案</title>
<style>
:root { --gold: #f0a500; --red: #ff4d6d; --green: #4caf50; --wood: #8b6f47; --bg: #120a06; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
body {
  color: #e8e8e8; min-height: 100vh; padding: 24px; overflow-x: hidden;
  background-color: var(--bg);
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(139, 58, 58, 0.3) 0%, transparent 60%),
    repeating-linear-gradient(0deg, rgba(30,15,8,0.8) 0px, rgba(20,10,5,0.8) 10px, rgba(25,12,6,0.8) 20px);
  background-attachment: fixed;
}
.bg-decor { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bg-decor svg { position: absolute; opacity: 0.15; }
.lamp { top: 0; left: 50%; transform: translateX(-50%); opacity: 0.4 !important; }
.scale { bottom: 40px; right: 40px; }
.gavel { bottom: 40px; left: 40px; }
.emblem { top: 40px; right: 40px; width: 120px; }

#app { max-width: 1000px; margin: 0 auto; position: relative; z-index: 1; }

/* 封面與選單 */
.cover-screen, .start-screen { text-align: center; padding: 60px 20px; background: rgba(20,10,5,0.8); border: 2px solid var(--wood); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
.cover-title { font-size: 48px; color: var(--gold); font-weight: 900; margin-bottom: 20px; text-shadow: 0 4px 12px rgba(240,165,0,0.4); letter-spacing: 4px; }
.cover-sub { color: #b8a080; margin-bottom: 40px; font-size: 18px; letter-spacing: 2px; }
.role-card { flex: 1; min-width: 220px; padding: 30px 20px; cursor: pointer; background: rgba(255,240,220,0.05); border: 2px solid rgba(200,160,100,0.3); border-radius: 16px; text-align: center; transition: .2s; user-select: none; }
.role-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.role-card.melon { border-color: rgba(76,175,80,0.6); }
.role-card.melon:hover { background: rgba(76,175,80,0.15); border-color: #4caf50; }
.role-card.water { border-color: rgba(255,77,109,0.6); }
.role-card.water:hover { background: rgba(255,77,109,0.15); border-color: #ff4d6d; }
.role-card.judge { border-color: rgba(240,165,0,0.6); }
.role-card.judge:hover { background: rgba(240,165,0,0.15); border-color: #f0a500; }
.role-icon { width: 72px; height: 72px; margin: 0 auto 16px; }
.role-card h3 { font-size: 20px; margin-bottom: 8px; color: #f7c948; }
.role-card p { font-size: 13px; color: #aaa; line-height: 1.5; }
.roles-container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }

/* 法庭全景 */
.courtroom-scene {
  background: #2a1a0e;
  border: 4px solid var(--wood);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
  display: flex; flex-direction: column; gap: 20px; position: relative;
}
.judge-bench { display: flex; justify-content: center; align-items: flex-end; gap: 40px; border-bottom: 4px solid var(--wood); padding-bottom: 10px; position: relative; }
.judge-bench::after { content: ''; position: absolute; bottom: -8px; left: 10%; width: 80%; height: 4px; background: #111; }
.juror { width: 60px; height: 60px; opacity: 0.7; }
.main-judge { width: 100px; height: 100px; filter: drop-shadow(0 0 10px rgba(240,165,0,0.5)); z-index: 2; }

.players-area { display: flex; justify-content: space-between; padding: 0 40px; position: relative; }
.player-side { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 40%; }
.player-side .avatar { width: 80px; height: 80px; border-radius: 12px; padding: 4px; background: rgba(60,20,30,0.8); border: 2px solid rgba(255,77,109,0.5); transition: .3s; }
.player-side .avatar.active { box-shadow: 0 0 20px rgba(255,77,109,0.8); transform: scale(1.1); }
.player-side.right .avatar { background: rgba(30,77,30,0.8); border-color: rgba(76,175,80,0.6); }
.player-side.right .avatar.active { box-shadow: 0 0 20px rgba(76,175,80,0.8); }
.name-tag { font-size: 12px; color: #b8a080; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 20px; border: 1px solid #444; }

/* 對話框與 UI */
.dialog-box { background: rgba(20,15,10,0.95); border: 2px solid #8b6f47; border-radius: 12px; padding: 20px; min-height: 100px; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
.speaker-name { position: absolute; top: -14px; left: 20px; background: var(--gold); color: #111; font-size: 13px; font-weight: 700; padding: 2px 12px; border-radius: 20px; }
.dialog-content { font-size: 16px; line-height: 1.8; color: #f0e8dd; margin-top: 8px; }

/* 按鈕與證物 */
.objection-btn { display: block; margin: 20px auto; padding: 16px 48px; background: linear-gradient(135deg, #ff3050, #ff4d6d); color: #fff; border: 3px solid #fff; border-radius: 14px; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 8px 24px rgba(255,48,80,0.5); transition: .15s; letter-spacing: 3px; }
.objection-btn:hover { transform: translateY(-3px) scale(1.03); }
.evidence-bag { margin-top: 20px; padding: 20px; background: rgba(20,10,5,0.95); border: 2px solid rgba(240,165,0,0.4); border-radius: 12px; animation: slideUp .3s ease; }
.evidence-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 10px; }
.evidence-card { padding: 12px 8px; text-align: center; background: rgba(255,240,220,0.05); border: 2px solid rgba(200,160,100,0.3); border-radius: 10px; cursor: pointer; transition: .15s; color: #e8dcc8; }
.evidence-card:hover { background: rgba(240,165,0,0.18); border-color: var(--gold); transform: translateY(-3px); }
.ev-icon { width: 44px; height: 44px; margin: 0 auto 8px; display: block; }
.ev-name { font-size: 12px; font-weight: 700; display: block; }

.btn { padding: 13px 28px; border-radius: 10px; border: none; cursor: pointer; background: linear-gradient(135deg, var(--gold), #f7c948); color: #1a1008; font-weight: 700; font-size: 15px; transition: .15s; display: block; margin: 10px auto; width: 100%; max-width: 300px;}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(240,165,0,0.5); }
.btn.danger { background: linear-gradient(135deg, #ff3050, #ff4d6d); color: #fff; }
.next-wrap { text-align: right; margin-top: 20px; display: flex; justify-content: center; gap: 10px; }

/* 法官彈跳視窗 */
.judge-popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 2000; animation: fadeIn .2s; }
.judge-popup { background: linear-gradient(135deg, #2a1a0e, #120a06); border: 4px solid var(--gold); border-radius: 20px; padding: 40px; text-align: center; max-width: 500px; width: 90%; box-shadow: 0 0 50px rgba(240,165,0,0.4); transform: scale(0.8); animation: popIn .3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
.judge-popup .avatar { width: 120px; height: 120px; margin: 0 auto 20px; filter: drop-shadow(0 0 15px rgba(240,165,0,0.8)); }
.judge-popup h3 { color: var(--red); font-size: 24px; margin-bottom: 10px; }
.judge-popup p { font-size: 16px; line-height: 1.6; color: #ddd2c0; margin-bottom: 20px; }
@keyframes popIn { to { transform: scale(1); } }

/* 審判長 UI */
.judge-ui { background: rgba(30,20,10,0.9); border: 2px solid var(--gold); border-radius: 12px; padding: 20px; margin-top: 20px; text-align: center; }
.judge-ui h3 { color: var(--gold); margin-bottom: 15px; }
.judge-choice { display: flex; gap: 20px; justify-content: center; }
.judge-choice button { flex: 1; max-width: 200px; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; border: none; transition: .2s; }
.btn-pass { background: #4caf50; color: #fff; }
.btn-pass:hover { background: #66bb6a; box-shadow: 0 0 20px rgba(76,175,80,0.5); }
.btn-object { background: #ff4d6d; color: #fff; }
.btn-object:hover { background: #ff7088; box-shadow: 0 0 20px rgba(255,77,109,0.5); }

/* 其他 */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.shake { animation: shake .5s ease; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-12px); } 40%, 80% { transform: translateX(12px); } }
.calc-container { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; background: rgba(20,10,5,0.9); border-radius: 12px; padding: 20px; border: 2px solid var(--wood); }
.calc-inputs { flex: 1; min-width: 280px; }
.calc-field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; margin-bottom: 14px; color: #ddd2c0; }
.calc-field input { padding: 11px 14px; border-radius: 8px; border: 1px solid rgba(200,160,100,0.3); background: rgba(0,0,0,0.4); color: #fff; font-size: 16px; }
.calculator { width: 280px; background: #2a2a2a; border-radius: 12px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.1); border: 2px solid #444; }
.calc-display { background: #8a9a7a; color: #1a1a1a; font-family: "Courier New", monospace; font-size: 24px; text-align: right; padding: 12px; border-radius: 6px; margin-bottom: 16px; min-height: 55px; word-break: break-all; box-shadow: inset 0 2px 6px rgba(0,0,0,0.5); border: 2px solid #555; }
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.calc-btn { padding: 14px 0; font-size: 18px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; background: #555; color: #fff; box-shadow: 0 3px 0 #111; transition: .1s; }
.calc-btn:active { transform: translateY(3px); box-shadow: none; }
.calc-btn.op { background: #d88; color: #fff; box-shadow: 0 3px 0 #811; }
.calc-btn.eq { background: var(--gold); color: #111; box-shadow: 0 3px 0 #a60; }
.calc-btn.clr { background: #f55; color: #fff; box-shadow: 0 3px 0 #a00; }
.calc-btn.span-2 { grid-column: span 2; }
</style>
</head>

class Model {
  constructor() { this.i=0; this.score=0; this.max=60; this.lives=3; this.bag=false; this.res=null; this.logs=[]; this.role=null; this.scenes=[]; this.popup=null; }
  get cur() { return this.scenes[this.i]; }
  open() { this.bag=true; this.res=null; }
  
  pick(id) {
    const s=this.cur; const ev = ALL_EVIDENCE[id];
    if (ev.joke) {
      this.lives--;
      this.bag = false;
      this.popup = ev.joke;
      if(this.lives<=0){ this.res={ok:false, rev:'GameOver'}; this.logs.push({ok:false, fb:'被趕出法庭'}); }
      else { this.res={ok:false, retry:true}; }
      return this.res;
    }
    if(s.ans.includes(id)){
      this.score+=10; this.bag=false; this.res={ok:true, fb:s.fbOk, line:s.success};
      this.logs.push({ok:true, fb:s.fbOk});
    } else {
      this.lives--;
      if(this.lives<=0){ this.bag=false; this.res={ok:false, fb:s.fbNg, rev:ALL_EVIDENCE[s.ans[0]].name}; this.logs.push({ok:false, fb:'生命耗盡'}); }
      else { this.res={ok:false, fb:s.fbNg, retry:true}; }
    }
    return this.res;
  }

  judgePick(correctAns, userAns) {
    const s=this.cur;
    if (correctAns === userAns) {
      this.score += 10;
      this.res = { ok:true, fb: s.fbOk };
      this.logs.push({ok:true, fb:s.fbOk});
    } else {
      this.res = { ok:false, fb: s.fbNg };
      this.logs.push({ok:false, fb:'判斷錯誤'});
    }
  }

  calc(vals) {
    const s=this.cur; let allOk=true;
    const res = s.fields.map(f=>{ const ok=Number(vals[f.k])===f.a; if(!ok)allOk=false; return {...f, ok}; });
    if(allOk) this.score+=10;
    this.logs.push({ok:allOk, fb:allOk?'計算正確':'計算錯誤'});
    return {res, allOk};
  }
  next() { if(this.i<this.scenes.length-1){ this.i++; this.lives=3; this.bag=false; this.res=null; this.popup=null; } }
}

      h+=`<button class="btn" id="btnCalc" style="width:100%;">送出計算</button>`;
    } else {
      h+=`<div class="feedback ${m.res.allOk?'ok':'ng'}"><div class="feedback-text">`;
      m.res.res.forEach(r=>{ h+=`<div>${r.l}：${r.ok?'✔ 正確':'✘ 正確為 '+r.a.toLocaleString()}</div>`; });
      h+=`</div></div><div class="next-wrap"><button class="btn" id="btnNext">下一章 →</button></div>`;
    }
    h+=`</div>`;
    if(!m.res) {
      h+=`<div class="calculator"><div class="calc-display" id="calcDisplay">0</div><div class="calc-grid">
        <button class="calc-btn clr" data-val="C">C</button><button class="calc-btn op" data-val="(">(</button><button class="calc-btn op" data-val=")">)</button><button class="calc-btn op" data-val="/">÷</button>
        <button class="calc-btn" data-val="7">7</button><button class="calc-btn" data-val="8">8</button><button class="calc-btn" data-val="9">9</button><button class="calc-btn op" data-val="*">×</button>
        <button class="calc-btn" data-val="4">4</button><button class="calc-btn" data-val="5">5</button><button class="calc-btn" data-val="6">6</button><button class="calc-btn op" data-val="-">-</button>
        <button class="calc-btn" data-val="1">1</button><button class="calc-btn" data-val="2">2</button><button class="calc-btn" data-val="3">3</button><button class="calc-btn op" data-val="+">+</button>
        <button class="calc-btn span-2" data-val="0">0</button><button class="calc-btn" data-val=".">.</button><button class="calc-btn eq" data-val="=">=</button>
      </div></div>`;
    }
    h+=`</div>`;
    return h;
  }
}

class Ctrl {
  constructor(m, v) { this.m=m; this.v=v; this.calcStr = '0'; }
  start() { this.v.render(this.m); this.bind(); }
  
  bind() {
    const m=this.m;
    
    const nBtn=document.getElementById('btnNext');
    if(nBtn) nBtn.onclick=()=>{ m.next(); this.start(); };
    
    const oBtn=document.getElementById('btnObj');
    if(oBtn) oBtn.onclick=()=>{ m.open(); this.start(); };
    
    const rBtn=document.getElementById('btnRetry');
    if(rBtn) rBtn.onclick=()=>{ m.res=null; m.open(); this.start(); };
    
    document.querySelectorAll('.evidence-card').forEach(c=>{
      c.onclick=()=>{
        const r=m.pick(c.dataset.id);
        if(r.ok) this.objAnim();
        else if(r.retry || r.rev) this.shake();
        this.start();
      };
    });

    // 計算機
    const display = document.getElementById('calcDisplay');
    if (display) {
      display.innerText = this.calcStr;
      document.querySelectorAll('.calc-btn').forEach(btn => {
        btn.onclick = () => {
          const val = btn.dataset.val;
          if (val === 'C') this.calcStr = '0';
          else if (val === '=') {
            try { this.calcStr = String(Math.round(eval(this.calcStr.replace(/×/g, '*').replace(/÷/g, '/')) * 100000) / 100000); } catch { this.calcStr = 'Error'; }
          } else {
            if (this.calcStr === '0' || this.calcStr === 'Error') this.calcStr = val;
            else this.calcStr += val;
          }
          display.innerText = this.calcStr;
        };
      });
    }

    const cBtn=document.getElementById('btnCalc');
    if(cBtn) cBtn.onclick=()=>{
      const vals={}; document.querySelectorAll('input').forEach(i=>vals[i.dataset.k]=i.value);
      m.res=m.calc(vals); this.calcStr = '0'; this.start();
    };
  }
  
  objAnim() {
    const ov=document.createElement('div'); ov.className='objection-overlay';
    ov.innerHTML='<div class="objection-text">異議あり！</div>';
    document.body.appendChild(ov); setTimeout(()=>ov.remove(), 1500);
  }
  shake() {
    const a=document.getElementById('app'); a.classList.add('shake'); setTimeout(()=>a.classList.remove('shake'), 500);
  }
}

const app = new Ctrl(new Model(), new View(document.getElementById('app')));

window.showRoleSelect = () => { app.m.role = 'select'; app.start(); };
window.selectRole = (role) => {
  app.m.role = role;
  if (role === 'melon') app.m.scenes = [...SCENES_MELON, SCENE_CALC, SCENE_END];
  else if (role === 'water') app.m.scenes = [...SCENES_WATER, SCENE_CALC, SCENE_END];
  else if (role === 'judge') app.m.scenes = [...SCENES_JUDGE, SCENE_CALC, SCENE_END];
  app.start();
};
window.judgeDecide = (ans) => {
  app.m.judgePick(app.m.cur.correct, ans);
  app.start();
};
window.closePopup = () => {
  app.m.popup = null;
  app.start();
};

app.start();
</script>
</body>
</html>
