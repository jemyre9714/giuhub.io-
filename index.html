<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西瓜寮裁判所</title>
<style>
:root { --gold: #ffcc00; --red: #ff3344; --green: #00ff88; --blue: #3399ff; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; -webkit-tap-highlight-color: transparent; }
body { color: #eee; background: #0a0b10; min-height: 100vh; padding: 10px; font-size: 15px; line-height: 1.6; }
#app { max-width: 900px; margin: 0 auto; border: 4px solid #222; border-radius: 12px; background: #111; padding: 15px; box-shadow: 0 0 30px rgba(0,0,0,0.8); position: relative; overflow: hidden; }

/* 天秤 */
.top-bar { display: flex; align-items: center; margin-bottom: 12px; padding: 0 5px; }
.trust-meter { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: bold; width: 100%; }
.trust-left { color: var(--green); width: 75px; text-align: right; }
.trust-right { color: var(--red); width: 75px; text-align: left; }
.balance-container { flex: 1; position: relative; display: flex; justify-content: center; }
.balance-bar { width: 90%; height: 10px; background: #222; border-radius: 5px; display: flex; overflow: hidden; border: 1px solid #444; margin-top: 4px; }
.bar-melon { height: 100%; background: var(--green); transition: width 0.4s; }
.bar-water { height: 100%; background: var(--red); transition: width 0.4s; }
.scale-icon { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: 24px; transition: transform 0.4s; z-index: 2; }

/* 封面 */
.cover-screen { text-align: center; padding: 50px 10px; }
.cover-title { font-size: clamp(30px, 8vw, 50px); color: var(--gold); font-weight: 900; text-shadow: 3px 3px 0 #800; margin-bottom: 10px; font-style: italic; letter-spacing: 2px;}
.press-start { font-size: clamp(18px, 5vw, 26px); color: #fff; font-weight: 900; cursor: pointer; padding: 15px 30px; border: 2px dashed transparent; transition: 0.2s; animation: blink 1.2s infinite; }
.press-start:hover { border-color: var(--gold); color: var(--gold); background: rgba(255,204,0,0.1); border-radius: 8px; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* 選人 */
.roles-container { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.role-card { flex: 1; min-width: 150px; padding: 15px 10px; cursor: pointer; background: #1a1a24; border: 2px solid #444; border-radius: 12px; text-align: center; transition: 0.2s; display: flex; flex-direction: column; align-items: center; }
.role-card:hover { transform: translateY(-5px); }
.role-card.story { border-color: #fff; } .role-card.melon { border-color: var(--green); }
.role-card.water { border-color: var(--red); } .role-card.judge { border-color: var(--gold); }
.role-icon { width: 80px; height: 80px; margin-bottom: 10px; image-rendering: pixelated; filter: drop-shadow(0 4px 4px #000); transition: 0.2s;}
.role-card:hover .role-icon { transform: scale(1.1); }
.role-card h3 { font-size: 15px; margin-bottom: 5px; color: #fff; } .role-card p { font-size: 12px; color: #aaa; }

/* 法庭場景 */
.courtroom { background: #0a0805; border: 2px solid #333; border-radius: 8px; height: 280px; display: flex; flex-direction: column; justify-content: space-between; margin-bottom: 15px; position: relative; overflow: hidden; }
.judge-stand { background: #1f150e; height: 40%; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 5px; border-bottom: 4px solid #3a2515; }
.judge-bench { display: flex; gap: 15px; align-items: flex-end; }
.judge-avatar { width: 55px; height: 55px; opacity: 0.6; image-rendering: pixelated; transition: 0.2s; }
.judge-avatar.main { width: 75px; height: 75px; opacity: 0.8; }
.judge-avatar.active { opacity: 1; filter: drop-shadow(0 0 10px var(--gold)); transform: translateY(-5px); }
.bailiff-stand { position: absolute; bottom: 0; display: flex; flex-direction: column; align-items: center; transition: 0.2s; z-index: 5; }
.bailiff-stand.left { left: 2%; } .bailiff-stand.right { right: 2%; }
.bailiff-avatar { width: 45px; height: 45px; image-rendering: pixelated; filter: drop-shadow(0 2px 4px #000); }
.bailiff-shock { animation: shock 0.1s infinite alternate; }
@keyframes shock { from { transform: translateY(0); } to { transform: translateY(-15px) scale(1.2) rotate(5deg); } }

.players-area { display: flex; justify-content: space-between; padding: 0 10%; height: 60%; align-items: flex-end; padding-bottom: 15px; }
.player-side { display: flex; flex-direction: column; align-items: center; position: relative; width: 100px; }
.player-side .avatar { width: 80px; height: 80px; background: #111; border: 2px solid #444; border-radius: 8px; z-index: 3; image-rendering: pixelated; transition: 0.2s; overflow: hidden; }
.player-side.left .avatar { border-color: var(--green); } .player-side.right .avatar { border-color: var(--red); }
.player-side .avatar.active { transform: translateY(-8px); }
.player-side.left .avatar.active { box-shadow: 0 0 15px var(--green); } .player-side.right .avatar.active { box-shadow: 0 0 15px var(--red); }
.name-tag { font-size: 11px; font-weight: bold; background: #000; padding: 2px 8px; border-radius: 20px; margin-top: 5px; z-index: 4; white-space: nowrap; }
.player-side.left .name-tag { color: var(--green); border: 1px solid var(--green); } .player-side.right .name-tag { color: var(--red); border: 1px solid var(--red); }
.lawyer-desk { position: absolute; bottom: -15px; width: 120%; height: 35px; background: #2b1a0e; border: 2px solid #111; border-radius: 4px; z-index: 2; }

/* 對話框 */
.dialog-box { background: #151515; border: 2px solid #555; border-radius: 8px; padding: 15px 20px; min-height: 90px; position: relative; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
.speaker-name { position: absolute; top: -12px; left: 15px; background: #333; color: #fff; font-size: 13px; font-weight: bold; padding: 2px 12px; border-radius: 4px; border: 1px solid #555; }
.dialog-content { font-size: 15px; line-height: 1.6; color: #eee; font-weight: 500; }
.hint-box { background: rgba(30, 60, 120, 0.5); border-left: 4px solid var(--blue); padding: 8px 10px; margin-top: 12px; font-size: 13px; color: #fff; border-radius: 4px;}
.hint-box::before { content: '等等！ '; color: var(--gold); font-weight: bold; font-style: italic; }

/* 按鈕 */
.btn { width: 100%; max-width: 280px; padding: 12px; margin: 10px auto; display: block; background: var(--gold); color: #000; font-weight: bold; font-size: 15px; border: 2px solid #fff; border-radius: 6px; cursor: pointer; box-shadow: 0 4px 0 #800; transition: 0.1s; }
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn.green { background: var(--green); box-shadow: 0 4px 0 #080; }
.btn.red { background: var(--red); color: #fff; box-shadow: 0 4px 0 #800; }
.btn-obj { width: 100%; max-width: 320px; padding: 12px; margin: 12px auto; background: var(--red); color: #fff; font-size: 22px; font-weight: 900; border: 2px solid #fff; border-radius: 8px; cursor: pointer; box-shadow: 0 6px 0 #800; font-style: italic; display: block; }
.btn-obj:active { transform: translateY(6px); box-shadow: none; }

/* 證物袋 */
.evidence-bag { margin-top: 15px; padding: 20px 15px 15px; background: #111; border: 2px solid var(--gold); border-radius: 8px; position: relative; }
.evidence-bag::before { content: 'COURT RECORD'; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; font-weight: bold; font-size: 11px; padding: 2px 15px; border-radius: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
.ev-card { background: #222; border: 1px solid #444; padding: 10px 5px; border-radius: 6px; text-align: center; cursor: pointer; transition: 0.1s; }
.ev-card:hover { background: #333; border-color: #fff; }
.ev-card svg { width: 30px; height: 30px; margin-bottom: 5px; }
.ev-card span { font-size: 12px; display: block; color: #ccc; }

/* 回饋與彈窗 */
.feedback { padding: 15px; margin-top: 15px; border-radius: 8px; font-weight: bold; border-left: 4px solid; }
.feedback.ok { background: rgba(0,255,136,0.1); border-color: var(--green); color: #ccffdd; }
.feedback.ng { background: rgba(255,51,68,0.1); border-color: var(--red); color: #ffccdd; }

.char-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
.char-inner { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 500px; }
.char-img { width: 150px; height: 150px; image-rendering: pixelated; margin-bottom: -15px; z-index: 2; background: #222; border-radius: 12px; border: 2px solid #444;}
.char-dialog { background: #000; border: 3px solid; padding: 20px; border-radius: 8px; width: 100%; position: relative; z-index: 1; }

/* 帶走動畫 */
.bailiff-scene { position: fixed; inset: 0; background: #000; z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.bailiff-drag { display: flex; align-items: flex-end; gap: 10px; animation: drag 2s forwards; }
.bailiff-text { font-size: 28px; color: var(--red); font-weight: 900; margin-bottom: 20px; text-align: center; padding: 0 10px; }
@keyframes drag { to { transform: translateX(100vw); } }

.gameover { position: fixed; inset: 0; background: #000; z-index: 4000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.gameover h1 { font-size: 60px; color: var(--red); margin-bottom: 20px; font-family: Impact, sans-serif; }
</style>
</head>
<body>
<div id="app"></div>

<svg width="0" height="0" style="display:none;">
  <defs>
    <!-- 原告：精緻女律師 (紫髮/紅領帶) -->
    <symbol id="ply" viewBox="0 0 32 32">

      <rect x="8" y="4" width="16" height="2" fill="#2a113a"/><rect x="6" y="6" width="20" height="4" fill="#2a113a"/>

      <rect x="5" y="11" width="2" height="4" fill="#7a3d9e"/><rect x="25" y="11" width="2" height="4" fill="#7a3d9e"/>

      <rect x="7" y="8" width="18" height="14" fill="#fce4d6"/>
      <rect x="9" y="15" width="4" height="2" fill="#ffb3b3"/><rect x="19" y="15" width="4" height="2" fill="#ffb3b3"/>
      <!-- 眼睛（紫瞳、大眼、高光） -->
      <rect x="9" y="11" width="6" height="4" fill="#fff"/><rect x="17" y="11" width="6" height="4" fill="#fff"/>
      <rect x="10" y="12" width="4" height="3" fill="#5b2c83"/><rect x="18" y="12" width="4" height="3" fill="#5b2c83"/>
      <rect x="10" y="12" width="1" height="1" fill="#fff"/><rect x="18" y="12" width="1" height="1" fill="#fff"/>

      <!-- 西裝與襯衫 -->
      <rect x="4" y="22" width="24" height="10" fill="#1a1a3a"/>
      <rect x="10" y="22" width="12" height="10" fill="#fff"/>
      <!-- 紅領帶 -->
      <rect x="14" y="22" width="4" height="8" fill="#ff3366"/>

    <!-- 被告：精緻女律師 (黑髮/貓耳/金瞳) -->
    <symbol id="opp" viewBox="0 0 32 32">
      <!-- 髮飾/貓耳 -->
      <rect x="8" y="2" width="4" height="4" fill="#f7c948" transform="rotate(45 10 4)"/>
      <rect x="20" y="2" width="4" height="4" fill="#f7c948" transform="rotate(-45 22 4)"/>
      <!-- 頭髮底層 -->
      <rect x="6" y="6" width="20" height="4" fill="#111"/><rect x="4" y="10" width="4" height="14" fill="#111"/><rect x="24" y="10" width="4" height="14" fill="#111"/>
      <!-- 頭髮亮部 -->
      <rect x="8" y="7" width="6" height="1" fill="#444"/><rect x="6" y="11" width="2" height="4" fill="#444"/><rect x="24" y="11" width="2" height="4" fill="#444"/>
      <!-- 臉部 -->
      <rect x="7" y="8" width="18" height="14" fill="#fce4d6"/>
      <rect x="9" y="15" width="4" height="2" fill="#ff9999"/><rect x="19" y="15" width="4" height="2" fill="#ff9999"/>
      <!-- 眼睛（金瞳、大眼、高光） -->
      <rect x="9" y="11" width="6" height="4" fill="#fff"/><rect x="17" y="11" width="6" height="4" fill="#fff"/>
      <rect x="10" y="12" width="4" height="3" fill="#d4a300"/><rect x="18" y="12" width="4" height="3" fill="#d4a300"/>
      <rect x="11" y="12" width="1" height="1" fill="#fff"/><rect x="19" y="12" width="1" height="1" fill="#fff"/>
      <!-- 眉毛與嘴巴 -->
      <rect x="9" y="9" width="5" height="1" fill="#111"/><rect x="18" y="9" width="5" height="1" fill="#111"/>
      <rect x="14" y="16" width="4" height="1" fill="#d85b5b"/>
      <!-- 西裝與襯衫 -->
      <rect x="4" y="22" width="24" height="10" fill="#1a1a24"/>
      <rect x="10" y="22" width="12" height="10" fill="#eee"/>
      <!-- 藍領帶 -->
      <rect x="14" y="22" width="4" height="8" fill="#3a5a8b"/>
    </symbol>

    <!-- 審判長 -->
    <symbol id="judge-main" viewBox="0 0 32 32">
      <!-- 假髮 -->
      <rect x="6" y="2" width="20" height="4" fill="#eee"/><rect x="4" y="6" width="4" height="4" fill="#eee"/><rect x="24" y="6" width="4" height="4" fill="#eee"/>
      <!-- 臉 -->
      <rect x="7" y="8" width="18" height="12" fill="#f5d5b0"/>
      <!-- 眼睛與鬍子 -->
      <rect x="9" y="10" width="4" height="2" fill="#111"/><rect x="19" y="10" width="4" height="2" fill="#111"/>

      <rect x="4" y="20" width="24" height="12" fill="#111"/>
      <rect x="10" y="20" width="12" height="12" fill="#222"/>
      <rect x="14" y="20" width="4" height="4" fill="#8b3a3a"/>
    </symbol>

    <!-- 陪席法官 -->
    <symbol id="judge-side" viewBox="0 0 32 32">
      <rect x="8" y="4" width="16" height="2" fill="#ddd"/><rect x="6" y="6" width="20" height="2" fill="#ddd"/>

      <rect x="9" y="11" width="3" height="2" fill="#111"/><rect x="20" y="11" width="3" height="2" fill="#111"/>
      <rect x="4" y="20" width="24" height="12" fill="#222"/>

    <!-- 法警 -->
    <symbol id="bailiff" viewBox="0 0 32 32">

      <rect x="4" y="18" width="24" height="14" fill="#2a2a3a"/>

    <!-- 狀態遮罩 (動態表情) -->
    <symbol id="fx-shock" viewBox="0 0 32 32">
      <rect x="8" y="11" width="16" height="5" fill="rgba(255,255,255,0.9)"/>
      <rect x="10" y="12" width="4" height="3" fill="#000"/><rect x="18" y="12" width="4" height="3" fill="#000"/>
      <rect x="14" y="17" width="4" height="3" fill="#333"/>

</svg>

<script>
const EV = {
  prep: { id: 'prep', name: '準備書狀', icon: 'i-doc' }, tender: { id: 'tender', name: '招標須知', icon: 'i-book' },
  join: { id: 'join', name: '參加書狀', icon: 'i-scale' }, withdraw: { id: 'withdraw', name: '撤回上訴狀', icon: 'i-doc' },
  g1381: { id: 'g1381', name: '1381號判決', icon: 'i-scale' }, deliver: { id: 'deliver', name: '點交證明', icon: 'i-money' },
  min: { id: 'min', name: '辯論筆錄', icon: 'i-doc' }, abuse: { id: 'abuse', name: '歷審判決', icon: 'i-book' },
  gun: { id: 'gun', name: '法警手槍', icon: 'i-gun', joke: '法警（驚恐）：等、等等！我的槍怎麼會在你那裡？！你拿我的配槍打賭？！（全場法警掏槍對準你）', fx: 'gun', fatal: true },
  wig: { id: 'wig', name: '法官假髮', icon: 'i-wig', joke: '審判長（摸頭）：大膽！竟敢拿假髮調侃本官？法警！', fx: 'wig', fatal: true },
  badge: { id: 'badge', name: '律師執照', icon: 'i-badge', joke: '審判長：你拿執照給我看，是想證明你考過國考嗎？' },
  food: { id: 'food', name: '鹹酥雞', icon: 'i-food', joke: '審判長：現在是言詞辯論，你當這裡是熱炒店？', fx: 'food' },
  leaf: { id: 'leaf', name: '法院盆栽', icon: 'i-leaf', joke: '審判長：你連法院的盆栽都不放過嗎？' }
};

const STORY = [
  { type:'story', title:'第一章：案件起因', speaker:'旁白', text:'民國91年，水利署第三河川局公開標售大安溪土石堆。西瓜寮公司以 7,760 萬元得標。', btn:'下一頁' },
  { type:'story', title:'第二章：所有權爭議', speaker:'旁白', text:'西瓜寮清運 30 萬立方公尺後，漢臨公司主張土石是他們的，提起第1381號訴訟。法院判命西瓜寮返還土石確定。', btn:'下一頁' },
  { type:'story', title:'第三章：提起訴訟', speaker:'旁白', text:'西瓜寮認為水利局未使其取得所有權，提訴請求水利局負債務不履行損害賠償責任。', btn:'進入審理' },
  { type:'choice', title:'第四章：程序之門', speaker:'審判長', text:'水利局在二審突襲提出終止契約。你該如何裁定？', opts: [ { label: '准許', correct: false }, { label: '駁回', correct: true } ], fbOk: '正確！違反447條。', fbNg: '錯誤！不符例外。' },
  { type:'choice', title:'第五章：參加效力', speaker:'審判長', text:'水利局抗辯不受1381號判決拘束。你該如何裁定？', opts: [ { label: '不受拘束', correct: false }, { label: '受拘束', correct: true } ], fbOk: '正確！本可獨立上訴。', fbNg: '錯誤！應受拘束。' },
  { type:'choice', title:'第六章：所有權與瑕疵', speaker:'審判長', text:'水利局抗辯已交付且善意受讓。你該如何裁定？', opts: [ { label: '水利局有理', correct: false }, { label: '水利局無理', correct: true } ], fbOk: '正確！未善意受讓。', fbNg: '錯誤！受拘束。' },
  { type:'calc', title:'第七章：金額計算' }, { type:'end', title:'第八章：宣判' }
];

const MELON = [
  { type:'story', title:'第一章', speaker:'審判長', text:'請上訴人陳述。', btn:'開始' },
  { type:'trial', title:'程序之門', speaker:'被上訴人', opp:'我方依招標須知終止契約。', hint:'找二審才提出的證據', ans:['prep'], bag:['prep','tender','badge','wig','gun'], success:'異議あり！這是二審才提出的新攻擊方法！', fbOk:'準備書狀！', fbNg:'證據力不足。' },
  { type:'trial', title:'參加效力', speaker:'被上訴人', opp:'西瓜寮撤回上訴害我方無法防禦！', hint:'證明水利局第一審就參加了', ans:['join'], bag:['join','withdraw','food','leaf','gun'], success:'異議あり！對造本得獨立上訴！', fbOk:'參加書狀！', fbNg:'證據力不足。' },
  { type:'trial', title:'所有權之辯', speaker:'被上訴人', opp:'土石已交付，善意受讓！', hint:'找出打臉的判決', ans:['g1381'], bag:['g1381','deliver','badge','wig','gun'], success:'異議あり！1381號判決認定未善意受讓！', fbOk:'1381號判決！', fbNg:'證據力不足。' },
  { type:'trial', title:'瑕疵之責', speaker:'被上訴人', opp:'上訴人未積極應訴，屬權利濫用！', hint:'證明有在開庭', ans:['min'], bag:['min','abuse','badge','food','gun'], success:'異議あり！我方已連續參與3次辯論！', fbOk:'辯論筆錄！', fbNg:'證據力不足。' }
];

const WATER = [
  { type:'story', title:'第一章', speaker:'審判長', text:'請被上訴人陳述。', btn:'開始' },
  { type:'trial', title:'程序反擊', speaker:'上訴人', opp:'對造二審才提終止契約，應予駁回！', hint:'主張有權終止', ans:['tender'], bag:['prep','tender','withdraw','wig','gun','food'], success:'審判長，基於河防安全，我方有權終止！', fbOk:'招標須知！', fbNg:'證據力不足。' },
  { type:'trial', title:'效力反擊', speaker:'上訴人', opp:'水利局本可獨立上訴，不受拘束！', hint:'主張是對方撤回的', ans:['withdraw'], bag:['withdraw','join','min','food','leaf','gun'], success:'是對造撤回，導致我方無法防禦！', fbOk:'撤回狀！', fbNg:'證據力不足。' },
  { type:'trial', title:'所有權反擊', speaker:'上訴人', opp:'我們沒拿到所有權，有瑕疵！', hint:'主張已交付', ans:['deliver'], bag:['deliver','g1381','tender','badge','leaf','gun'], success:'土石已點交，我方完成義務！', fbOk:'點交證明！', fbNg:'證據力不足。' },
  { type:'trial', title:'責任反擊', speaker:'上訴人', opp:'有瑕疵，應賠償1.5億！', hint:'主張對方與有過失', ans:['min','abuse'], bag:['abuse','min','deliver','food','leaf','gun'], success:'對造未及時清運才被拿走，與有過失！', fbOk:'筆錄與判決！', fbNg:'證據力不足。' }
];

const JUDGE = [
  { type:'story', title:'第一章', speaker:'系統', text:'請聆聽兩造並裁決。', btn:'進入' },
  { type:'judge', title:'程序之戰', p:'我方有權終止。', d:'二審才提，違反447條！', pq:'河防急迫！', dq:'原審有律師，是突襲！', q:'如何裁決？', opts:[ { label:'採信水利局', t:'p', m:-20, w:20 }, { label:'採信西瓜寮', t:'d', m:20, w:-20 }, { label:'追問水利局', t:'pq', m:10, w:-10 }, { label:'追問西瓜寮', t:'dq', m:-10, w:10 } ] },
  { type:'judge', title:'效力之戰', p:'我方不受拘束。', d:'本可獨立上訴，應受拘束！', pq:'誰知他們會撤回？', dq:'判例寫得很清楚！', q:'如何裁決？', opts:[ { label:'採信水利局', t:'p', m:-20, w:20 }, { label:'採信西瓜寮', t:'d', m:20, w:-20 }, { label:'追問水利局', t:'pq', m:10, w:-10 }, { label:'追問西瓜寮', t:'dq', m:-10, w:10 } ] },
  { type:'judge', title:'所有權之戰', p:'已交付，取得所有權！', d:'1381判決認定未善意受讓！', pq:'交付即移轉！', dq:'判決白紙黑字！', q:'如何裁決？', opts:[ { label:'採信水利局', t:'p', m:-20, w:20 }, { label:'採信西瓜寮', t:'d', m:20, w:-20 }, { label:'追問水利局', t:'pq', m:10, w:-10 }, { label:'追問西瓜寮', t:'dq', m:-10, w:10 } ] },
  { type:'judge', title:'責任之戰', p:'西瓜寮權利濫用！', d:'我方合法行使權利！', pq:'想敲詐國庫！', dq:'依法請求！', q:'如何裁決？', opts:[ { label:'採信水利局', t:'p', m:-20, w:20 }, { label:'採信西瓜寮', t:'d', m:20, w:-20 }, { label:'追問水利局', t:'pq', m:10, w:-10 }, { label:'追問西瓜寮', t:'dq', m:-10, w:10 } ] }
];

let state = { mode: null, i: 0, scenes: [], lives: 3, bag: false, res: null, popup: null, bailiffAnim: false, gameover: false, jStep: 0, melon: 50, water: 50 };

function render() {
  const app = document.getElementById('app');
  if (state.gameover) {
    app.innerHTML = `<div class="gameover"><h1>GAME OVER</h1><p>心證崩盤，你已被帶離法庭</p><button class="btn red" onclick="location.reload()" style="margin-top:20px;">重新遊玩</button></div>`;
    return;
  }
  if (state.bailiffAnim) {
    app.innerHTML = `<div class="bailiff-scene"><div class="bailiff-text">打賭輸了！法警，將這位代理人帶出去！</div><div class="bailiff-drag"><svg width="100" height="100" viewBox="0 0 32 32"><use href="#bailiff"/></svg><svg width="80" height="80" viewBox="0 0 32 32"><use href="#${state.mode==='melon'?'ply':'opp'}"/></svg><svg width="100" height="100" viewBox="0 0 32 32"><use href="#bailiff"/></svg></div></div>`;
    return;
  }
  if (!state.mode) {
    app.innerHTML = `<div class="cover-screen"><div class="cover-title">西瓜寮裁判所</div><div class="press-start" onclick="showSelect()">▶ PRESS START ◀</div></div>`;
    return;
  }
  if (state.mode === 'select') {
    app.innerHTML = `<div class="cover-screen"><div class="cover-title" style="font-size:24px;">SELECT YOUR ROLE</div><div class="roles-container"><div class="role-card story" onclick="selectRole('story')"><svg class="role-icon" viewBox="0 0 32 32"><use href="#i-book"/></svg><h3>故事模式</h3><p>跟著判決書走</p></div><div class="role-card melon" onclick="selectRole('melon')"><svg class="role-icon" viewBox="0 0 32 32"><use href="#ply"/></svg><h3>上訴人<br>西瓜寮</h3><p>推翻偏見</p></div><div class="role-card water" onclick="selectRole('water')"><svg class="role-icon" viewBox="0 0 32 32"><use href="#opp"/></svg><h3>被上訴人<br>水利局</h3><p>駁回原告</p></div><div class="role-card judge" onclick="selectRole('judge')"><svg class="role-icon" viewBox="0 0 32 32"><use href="#judge-main"/></svg><h3>審判長</h3><p>裁決心證</p></div></div></div>`;
    return;
  }

  const s = state.scenes[state.i];
  let total = state.melon + state.water; if (total === 0) total = 1;
  let mp = (state.melon / total) * 100; let wp = (state.water / total) * 100;
  let rot = (Math.round(mp) === Math.round(wp)) ? 0 : (mp - 50) * 0.6;
  let h = `<div class="top-bar"><div class="trust-meter"><div class="trust-left">西瓜寮<br>${Math.round(mp)}%</div><div class="balance-container"><div class="balance-bar"><div class="bar-melon" style="width:${mp}%"></div><div class="bar-water" style="width:${wp}%"></div></div><div class="scale-icon" style="transform:translateX(-50%) rotate(${rot}deg)">⚖️</div></div><div class="trust-right">水利局<br>${Math.round(wp)}%</div></div></div>`;

  let curSpk = s.speaker || (state.mode==='judge' ? (state.jStep===0?'上訴人':state.jStep===1?'被上訴人':'審判長') : '');
  if (s.type === 'trial' && state.res && state.res.type === 'strong') curSpk = state.mode === 'melon' ? '上訴人' : '被上訴人';
  
  const isJudge = curSpk === '審判長' || curSpk === '系統' || curSpk === '旁白';
  const isMelon = curSpk === '上訴人';
  const isWater = curSpk === '被上訴人';
  
  // 判定彈出視窗是否有驚嚇表情特效
  const showShock = state.popup && state.popup.fx === 'gun';
  const bald = state.popup && state.popup.fx === 'wig' ? 'filter:grayscale(1);' : '';
  
  let fx = '';
  if (state.popup) {
    if (state.popup.fx === 'wig') fx = `<div class="falling-wig" style="position:absolute;top:10%;left:50%;width:50px;height:50px;animation:drop 1.5s forwards;"><svg width="50" height="50" viewBox="0 0 32 32"><use href="#wig"/></svg></div><style>@keyframes drop { to { top: 100%; opacity: 0; } }</style>`;
    if (state.popup.fx === 'gun') fx = Array(5).fill(0).map(()=>`<div style="position:absolute;width:20px;height:20px;background:#000;border-radius:50%;left:${Math.random()*80+10}%;top:${Math.random()*80+10}%"></div>`).join('');
    if (state.popup.fx === 'food') fx = `<div style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:30px;z-index:10;">🍗</div>`;
  }

  h += `<div class="courtroom">${fx}<div class="judge-stand"><div class="judge-bench"><svg class="judge-avatar ${isJudge?'active':''}" viewBox="0 0 32 32"><use href="#judge-side"/></svg><svg class="judge-avatar main ${isJudge?'active':''}" viewBox="0 0 32 32" style="${bald}"><use href="#judge-main"/></svg><svg class="judge-avatar ${isJudge?'active':''}" viewBox="0 0 32 32"><use href="#judge-side"/></svg></div><div class="bailiff-stand left ${showShock?'bailiff-shock':''}"><svg class="bailiff-avatar" viewBox="0 0 32 32"><use href="#bailiff"/></svg></div><div class="bailiff-stand right ${showShock?'bailiff-shock':''}"><svg class="bailiff-avatar" viewBox="0 0 32 32"><use href="#bailiff"/></svg></div></div><div class="players-area"><div class="player-side left"><div class="avatar ${isMelon?'active':''}" style="${isMelon&&showShock?'filter:drop-shadow(0 0 10px red);':''}"><svg viewBox="0 0 32 32"><use href="#ply"/></svg></div><div class="name-tag">西瓜寮代理人</div><div class="lawyer-desk"></div></div><div class="player-side right"><div class="avatar ${isWater?'active':''}" style="${isWater&&showShock?'filter:drop-shadow(0 0 10px red);':''}"><svg viewBox="0 0 32 32"><use href="#opp"/></svg></div><div class="name-tag">水利局代理人</div><div class="lawyer-desk"></div></div></div></div>`;

  if (s.type === 'story') {
    h += `<div class="dialog-box" id="t-box"><div class="speaker-name">${s.speaker}</div><div class="dialog-content" data-text="${s.text}"></div></div><button class="btn" onclick="next()">${s.btn}</button>`;
  } else if (s.type === 'choice') {
    h += `<div class="dialog-box" id="t-box"><div class="speaker-name">${s.speaker}</div><div class="dialog-content" data-text="${s.text}"></div></div>`;
    if (!state.res) {
      h += `<div class="judge-ui" style="background:#222;border:2px solid var(--gold);padding:15px;border-radius:8px;margin-top:15px;text-align:center;"><h3>💭 請裁決</h3>`;
      s.opts.forEach(o => h += `<button class="btn ${o.correct?'green':'red'}" onclick="storyPick(${o.correct})">${o.label}</button>`);
      h += `</div>`;
    } else {
      h += `<div class="feedback ${state.res.ok?'ok':'ng'}">${state.res.fb}</div><button class="btn" onclick="next()">繼續</button>`;
    }
  } else if (s.type === 'trial') {
    if (!state.res || state.res.type !== 'strong') h += `<div class="dialog-box" id="t-box"><div class="speaker-name">${s.speaker}</div><div class="dialog-content" data-text="${s.opp}"></div></div>`;
    else h += `<div class="dialog-box" style="border-color:${state.mode==='melon'?'var(--green)':'var(--red)'}"><div class="speaker-name" style="background:${state.mode==='melon'?'var(--green)':'var(--red)'};color:#000">${state.mode==='melon'?'上訴人':'被上訴人'}</div><div class="dialog-content" data-text="${state.res.line}"></div></div>`;
    if (!state.res && !state.bag) h += `<div class="hint-box">${s.hint}</div><button class="btn-obj" onclick="openBag()">異議あり！</button>`;
    if (state.bag) {
      h += `<div class="evidence-bag"><div class="grid">`;
      [...s.bag].sort(() => Math.random() - 0.5).forEach(id => {
        const e = EV[id];
        h += `<div class="ev-card" onclick="pick('${id}')"><svg viewBox="0 0 32 32"><use href="#${e.icon}"/></svg><span>${e.name}</span></div>`;
      });
      h += `</div></div>`;
    }
    if (state.res) {
      let c = state.res.type === 'strong' ? 'ok' : 'ng';
      h += `<div class="feedback ${c}">${c === 'ok' ? '✔ 動搖心證！' : '✖ 證據力不足'}</div>`;
      if (state.res.type === 'weak') h += `<button class="btn red" onclick="retry()">重新選擇證物</button>`;
      else h += `<button class="btn" onclick="next()">下一章</button>`;
    }
  } else if (s.type === 'judge') {
    if (state.jStep === 0) {
      h += `<div class="dialog-box" id="t-box"><div class="speaker-name">上訴人</div><div class="dialog-content" data-text="${s.d}"></div></div><button class="btn" onclick="judgeNext()">聽取抗辯 →</button>`;
    } else if (state.jStep === 1) {
      h += `<div class="dialog-box" id="t-box"><div class="speaker-name">被上訴人</div><div class="dialog-content" data-text="${s.p}"></div></div><button class="btn" onclick="judgeNext()">進入裁決 →</button>`;
    } else if (state.jStep === 2) {
      h += `<div class="judge-ui" style="background:#222;border:2px solid var(--gold);padding:15px;border-radius:8px;margin-top:15px;text-align:center;"><h3>💭 ${s.q}</h3>`;
      if (!state.res) {
        s.opts.forEach(o => h += `<button class="choice-btn" style="width:100%;padding:12px;margin-bottom:10px;background:#333;color:#fff;border:2px solid #555;border-radius:6px;font-size:15px;cursor:pointer;font-weight:bold;text-align:left;" onclick="judgePick('${o.t}',${o.m},${o.w})">${o.label}</button>`);
      } else {
        h += `<div class="feedback ${state.res.ok?'ok':'ng'}">${state.res.fb}</div><button class="btn" onclick="next()">下一章</button>`;
      }
      h += `</div>`;
    }
  } else if (s.type === 'calc') {
    h += `<div class="dialog-box"><div class="speaker-name">法官算帳</div><div class="dialog-content">請計算損害賠償金額。</div></div>`;
    if (!state.res) {
      h += `<div style="background:#222;padding:15px;border-radius:8px;margin-top:15px;"><p>市價：275 × 559221 = <input type="number" id="c1" style="width:100px;"></p><p>清運費：47.5 × 559221 = <input type="number" id="c2" style="width:100px;"></p><p>賠償金額 = <input type="number" id="c3" style="width:100px;"></p><button class="btn green" onclick="calc()" style="margin-top:10px;">送出</button></div>`;
    } else {
      h += `<div class="feedback ${state.res.ok?'ok':'ng'}">${state.res.fb}</div><button class="btn" onclick="next()">下一章</button>`;
    }
  } else if (s.type === 'end') {
    let tie = Math.round(mp) === Math.round(wp);
    let melWin = state.melon > state.water;
    if (state.mode === 'story') h += `<div class="dialog-box"><div class="dialog-content">本院判決：水利局應給付西瓜寮 1 億 2722 萬元。</div></div><button class="btn green" onclick="victory(true)">觀看結果</button>`;
    else if (tie) h += `<div class="judge-ui" style="background:#222;border:2px solid var(--gold);padding:15px;border-radius:8px;margin-top:15px;text-align:center;"><h3>⚖️ 心證 50% / 50% ⚖️</h3><p>請行使最終裁量權</p><button class="btn green" onclick="victory(true)">西瓜寮勝訴</button><button class="btn red" onclick="victory(false)">水利局勝訴</button></div>`;
    else if (melWin) h += `<div class="dialog-box" style="border-color:var(--green)"><div class="dialog-content">本院判決：水利局應給付西瓜寮 1 億 2722 萬元。</div></div><button class="btn green" onclick="victory(true)">西瓜寮勝訴！</button>`;
    else h += `<div class="dialog-box" style="border-color:var(--red)"><div class="dialog-content">本院判決：原告之訴駁回。</div></div><button class="btn red" onclick="victory(false)">水利局勝訴！</button>`;
  }

  // 彈跳視窗
  if (state.popup) {
    let popupImg = `<svg style="width:150px;height:150px;image-rendering:pixelated;margin-bottom:-15px;z-index:2;" viewBox="0 0 32 32"><use href="#${state.popup.icon}"/></svg>`;
    if (state.popup.fx === 'gun') {
      popupImg = `<div style="position:relative;width:150px;height:150px;margin-bottom:-15px;z-index:2;"><svg style="width:100%;height:100%;image-rendering:pixelated;" viewBox="0 0 32 32"><use href="#${state.popup.icon}"/></svg><svg style="position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;animation:shake 0.1s infinite;" viewBox="0 0 32 32"><use href="#fx-shock"/></svg></div><style>@keyframes shake { 0%{transform:translate(1px,1px)} 50%{transform:translate(-1px,-1px)} 100%{transform:translate(0,0)} }</style>`;
    }
    h += `<div class="char-popup" onclick="closePopup()"><div class="char-inner">${popupImg}<div class="char-dialog" style="border-color:${state.popup.color}"><div class="speaker-name" style="background:${state.popup.color};color:#000">${state.popup.speaker}</div><div class="dialog-content" data-text="${state.popup.text}"></div></div></div></div>`;
  }

  app.innerHTML = h;
  document.querySelectorAll('[data-text]').forEach(box => {
    if (box.dataset.typed) return;
    box.dataset.typed = 'true';
    const text = box.dataset.text;
    box.innerText = '';
    let i = 0;
    const timer = setInterval(() => { box.innerText += text.charAt(i); i++; if (i >= text.length) clearInterval(timer); }, 30);
    box.onclick = (e) => { e.stopPropagation(); clearInterval(timer); box.innerText = text; };
  });
}

window.showSelect = () => { state.mode = 'select'; render(); };
window.selectRole = (role) => {
  state.mode = role; state.i = 0; state.lives = 3; state.res = null; state.bag = false; state.jStep = 0;
  if (role === 'melon') { state.melon = 20; state.water = 80; state.scenes = [...MELON, {type:'calc'}, {type:'end'}]; }
  else if (role === 'water') { state.melon = 60; state.water = 40; state.scenes = [...WATER, {type:'calc'}, {type:'end'}]; }
  else if (role === 'judge') { state.melon = 50; state.water = 50; state.scenes = [...JUDGE, {type:'calc'}, {type:'end'}]; }
  else if (role === 'story') { state.scenes = STORY; }
  render();
};
window.next = () => { state.i++; state.res = null; state.bag = false; state.popup = null; state.jStep = 0; render(); };
window.openBag = () => { state.bag = true; render(); };
window.retry = () => { state.res = null; state.bag = true; render(); };
window.pick = (id) => {
  const s = state.scenes[state.i];
  const e = EV[id];
  state.bag = false;
  if (e.joke) {
    state.lives--;
    state.popup = { speaker: e.id==='gun'?'法警':'審判長', text: e.joke, icon: e.id==='gun'?'bailiff':'judge-main', color: e.id==='gun'?'var(--red)':'var(--gold)', fx: e.fx };
    if (state.mode === 'melon') { state.melon = Math.max(0, state.melon - 30); state.water += 30; }
    else { state.water = Math.max(0, state.water - 30); state.melon += 30; }
    if (state.lives <= 0) setTimeout(() => { state.popup = null; state.bailiffAnim = true; render(); setTimeout(()=>{ state.bailiffAnim=false; state.gameover=true; render(); }, 2000); }, 2000);
  } else {
    if (s.ans.includes(id)) {
      state.res = { type: 'strong', ok: true, line: s.success };
      if (state.mode === 'melon') { state.melon += 20; state.water -= 20; state.popup = { speaker:'上訴人', text:s.success, icon:'ply', color:'var(--green)' }; }
      else { state.water += 20; state.melon -= 20; state.popup = { speaker:'被上訴人', text:s.success, icon:'opp', color:'var(--red)' }; }
    } else {
      state.res = { type: 'weak', ok: false };
      if (state.mode === 'melon') { state.melon = Math.max(0, state.melon - 10); state.water += 10; }
      else { state.water = Math.max(0, state.water - 10); state.melon += 10; }
    }
  }
  render();
};
window.storyPick = (correct) => { state.res = { ok: correct, fb: correct ? state.scenes[state.i].fbOk : state.scenes[state.i].fbNg }; render(); };
window.judgeNext = () => { state.jStep++; state.res = null; render(); };
window.judgePick = (type, m, w) => { state.melon += m; state.water += w; state.res = { ok: m > 0, fb: m > 0 ? '你採信了上訴人，心證偏向西瓜寮。' : '你採信了被上訴人，心證偏向水利局。' }; render(); };
window.calc = () => {
  const c1 = document.getElementById('c1').value; const c2 = document.getElementById('c2').value; const c3 = document.getElementById('c3').value;
  state.res = (c1 == 153785775 && c2 == 26562998 && c3 == 127222777) ? { ok: true, fb: '計算正確！' } : { ok: false, fb: '計算錯誤！' };
  render();
};
window.closePopup = () => {
  state.popup = null;
  if (state.lives <= 0) { state.bailiffAnim = true; render(); setTimeout(()=>{ state.bailiffAnim=false; state.gameover=true; render(); }, 2000); }
  else render();
};
window.victory = (melWin) => {
  document.getElementById('app').innerHTML = `<div style="position:fixed;inset:0;background:#000;z-index:6000;display:flex;flex-direction:column;align-items:center;justify-content:center;"><h1 style="font-size:60px;color:${melWin?'var(--green)':'var(--red)'};">${melWin ? '西瓜寮勝訴！' : '水利局勝訴！'}</h1><p style="color:#fff;font-size:20px;margin-top:20px;">${melWin ? '水利局應給付 1 億 2722 萬元' : '原告之訴駁回'}</p><button class="btn" onclick="location.reload()" style="margin-top:40px;max-width:200px;">重新開始</button></div>`;
};

render();
</script>
</body>
</html>
