<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>西瓜寮裁判所</title>
<style>
:root { --gold: #ffcc00; --red: #ff0033; --green: #00ff66; --blue: #0066ff; --bg: #0a0a1a; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: "Arial Black", "Impact", "Noto Sans TC", sans-serif; -webkit-tap-highlight-color: transparent; }
body {
  color: #fff; min-height: 100vh; padding: 10px; overflow-x: hidden;
  background-color: #050510;
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(255, 0, 50, 0.15) 0%, transparent 60%),
    linear-gradient(rgba(0, 50, 100, 0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 50, 100, 0.1) 1px, transparent 1px);
  background-size: 100% 100%, 30px 30px, 30px 30px;
  background-attachment: fixed;
}
/* 復古掃描線 */
body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999; background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.25) 50%); background-size: 100% 4px; }

#app { max-width: 1000px; margin: 0 auto; position: relative; z-index: 1; border: 6px solid #111; border-radius: 8px; box-shadow: 0 0 0 4px #444, 0 0 60px rgba(0,0,0,0.9), inset 0 0 100px rgba(0,0,0,0.9); background: #000; padding: 15px; overflow: hidden; }

/* 頂部心證天秤 */
.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 10px; position: relative; }
.trust-meter { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: bold; width: 100%; }
.trust-left { color: var(--green); width: 80px; text-align: right; line-height: 1.2; text-shadow: 1px 1px 0 #000; }
.trust-right { color: var(--red); width: 80px; text-align: left; line-height: 1.2; text-shadow: 1px 1px 0 #000; }
.balance-container { flex: 1; height: 30px; position: relative; display: flex; justify-content: center; }
.balance-bar { width: 90%; height: 14px; background: #222; border-radius: 7px; display: flex; overflow: hidden; border: 2px solid #555; position: relative; margin-top: 8px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.8); }
.bar-melon { height: 100%; background: linear-gradient(90deg, #008800, #00ff66); transition: width 0.5s ease; }
.bar-water { height: 100%; background: linear-gradient(90deg, #ff0033, #aa0022); transition: width 0.5s ease; }
.scale-icon { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 32px; transition: transform 0.5s ease; z-index: 2; filter: drop-shadow(0 0 5px #fff); }

/* 心證浮動提示 */
.trust-float { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: 900; text-shadow: 2px 2px 0 #000; animation: floatUp 1s ease-out forwards; pointer-events: none; z-index: 100; font-style: italic; }
@keyframes floatUp { 0% { opacity: 0; top: 20px; } 20% { opacity: 1; top: 10px; } 100% { opacity: 0; top: -20px; } }

/* 封面（街機風格） */
.cover-screen { text-align: center; padding: 80px 20px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; }
.cover-title { font-size: clamp(40px, 10vw, 80px); color: var(--gold); font-weight: 900; letter-spacing: 6px; text-shadow: 4px 4px 0 #a00, 8px 8px 0 #000, 0 0 20px rgba(255, 204, 0, 0.5); margin-bottom: 10px; font-style: italic; animation: titlePulse 2s infinite alternate; }
@keyframes titlePulse { from { filter: brightness(1); } to { filter: brightness(1.3); } }
.cover-sub { color: #fff; font-size: clamp(16px, 4vw, 24px); letter-spacing: 8px; margin-bottom: 60px; text-shadow: 2px 2px 0 var(--blue); }
.press-start { font-size: clamp(20px, 5vw, 32px); color: #fff; font-weight: 900; animation: blink 1s infinite; cursor: pointer; padding: 20px 40px; text-shadow: 2px 2px 0 var(--red); border: 2px dashed transparent; transition: .2s; }
.press-start:hover { border-color: var(--gold); color: var(--gold); text-shadow: 2px 2px 0 #000; background: rgba(255, 204, 0, 0.1); border-radius: 8px; }
@keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.05); } }

/* 角色選擇畫面 */
.roles-container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 30px; width: 100%; max-width: 900px; }
.role-card { flex: 1; min-width: 200px; padding: 30px 20px; cursor: pointer; background: #111; border: 4px solid #444; text-align: center; transition: .2s; position: relative; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); box-shadow: 0 10px 20px rgba(0,0,0,0.8); }
.role-card:hover { transform: translateY(-10px) scale(1.05); z-index: 10; }
.role-card.story { border-color: #fff; box-shadow: 0 0 30px rgba(255,255,255,0.4); }
.role-card.melon { border-color: var(--green); box-shadow: 0 0 30px rgba(0,255,102,0.4); }
.role-card.water { border-color: var(--red); box-shadow: 0 0 30px rgba(255,0,51,0.4); }
.role-card.judge { border-color: var(--gold); box-shadow: 0 0 30px rgba(255,204,0,0.4); }
.role-icon { width: 100px; height: 100px; margin: 0 auto 15px; filter: drop-shadow(4px 4px 0 #000); transition: .2s; overflow: hidden; border-radius: 50%; }
.role-card:hover .role-icon { transform: scale(1.1); }
.role-card h3 { font-size: clamp(18px, 4vw, 22px); margin-bottom: 8px; color: #fff; text-shadow: 2px 2px 0 #000; line-height: 1.4; }
.role-card p { font-size: 14px; color: #aaa; }

/* 法庭全景 */
.courtroom-scene { 
  background: linear-gradient(to bottom, #2a1a0e, #1a1008);
  border: 4px solid #333; border-radius: 4px; margin-bottom: 15px; position: relative; height: clamp(320px, 50vh, 450px); display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; box-shadow: inset 0 0 50px rgba(0,0,0,0.9); transition: filter 0.3s; 
}
.courtroom-scene.danger { filter: drop-shadow(0 0 30px var(--red)) brightness(1.2) contrast(1.5); }
.courtroom-scene::before { 
  content: ''; position: absolute; inset: 0; 
  background: 
    radial-gradient(circle at 50% 10%, rgba(255, 204, 0, 0.1) 0%, transparent 50%),
    repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.02) 40px, rgba(255,255,255,0.02) 42px),
    linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.9) 100%);
  pointer-events: none; z-index: 0; 
}

/* 審判長席 */
.judge-stand { position: relative; z-index: 2; width: 100%; height: 40%; background: linear-gradient(to bottom, #3a2515, #1a1008); border-bottom: 8px solid #4a2e15; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 5px; box-shadow: 0 10px 20px rgba(0,0,0,0.8); }
.judge-bench { display: flex; justify-content: center; align-items: flex-end; gap: clamp(10px, 3vw, 40px); }
.judge-avatar { filter: drop-shadow(0 0 10px #000); transition: .3s; position: relative;}
.main-judge { width: clamp(60px, 12vw, 100px); height: clamp(60px, 12vw, 100px); z-index: 2; }
.judge-side { width: clamp(40px, 8vw, 70px); height: clamp(40px, 8vw, 70px); opacity: 0.7; }
.judge-avatar.active { filter: drop-shadow(0 0 20px var(--gold)); transform: translateY(-5px); }

/* 特效層 */
.effect-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
.falling-wig { position: absolute; top: 5%; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; animation: wigDrop 2s forwards cubic-bezier(0.5, 0, 1, 1); z-index: 10; }
@keyframes wigDrop { 0% { top: 5%; opacity: 1; } 80% { top: 80%; opacity: 1; } 100% { top: 100%; opacity: 0; } }
.bald-judge { filter: grayscale(0.5) contrast(1.2); }
.note-bounce { position: absolute; font-size: 24px; animation: noteUp 1.5s ease-out forwards; }
@keyframes noteUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-100px) scale(1.5); opacity: 0; } }
.bullet-hole { position: absolute; width: 40px; height: 40px; background: radial-gradient(circle, #000 20%, #555 40%, transparent 60%); border-radius: 50%; animation: popIn 0.2s; }
.tumbleweed { position: absolute; font-size: 40px; animation: blowAcross 4s linear forwards; }
@keyframes blowAcross { 0% { transform: translateX(-100px) rotate(0deg); } 100% { transform: translateX(100vw) rotate(720deg); } }

.desk-item { position: absolute; font-size: 40px; z-index: 10; animation: dropOnDesk 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
@keyframes dropOnDesk { 0% { transform: translateY(-50px) scale(2); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }

/* 法警 */
.bailiff-stand { position: absolute; bottom: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; transition: transform 0.2s; }
.bailiff-stand.left { left: 2%; }
.bailiff-stand.right { right: 2%; }
.bailiff-avatar { width: clamp(40px, 8vw, 70px); height: clamp(40px, 8vw, 70px); filter: drop-shadow(0 0 5px #000); }
.bailiff-label { font-size: 10px; color: #ffcc00; background: #000; padding: 2px 6px; border-radius: 4px; margin-top: 2px; display: none; }
@media (min-width: 600px) { .bailiff-label { display: block; } }
.bailiff-shock { animation: shock 0.15s infinite alternate; }
@keyframes shock { from { transform: translateY(0) scale(1); } to { transform: translateY(-20px) scale(1.3) rotate(5deg); filter: drop-shadow(0 0 20px var(--red)); } }

/* 雙方代理人與桌子 */
.players-area { position: relative; z-index: 2; display: flex; justify-content: space-between; padding: 0 5%; width: 100%; height: 60%; align-items: flex-end; padding-bottom: 20px;}
.player-side { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; width: 45%; position: relative; height: 100%; }
.player-side .avatar { width: clamp(70px, 14vw, 110px); height: clamp(70px, 14vw, 110px); background: #111; border: 3px solid #555; transition: .2s; z-index: 3; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 8px; }
.player-side.left .avatar { border-color: var(--green); }
.player-side.right .avatar { border-color: var(--red); }
.player-side .avatar.active { transform: translateY(-10px); }
.player-side.left .avatar.active { box-shadow: 0 0 20px var(--green); }
.player-side.right .avatar.active { box-shadow: 0 0 20px var(--red); }
.player-side .avatar img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }

.name-tag { font-size: clamp(10px, 2.5vw, 14px); font-weight: 900; color: #fff; background: #000; padding: 4px 10px; border: 2px solid #555; text-transform: uppercase; text-align: center; line-height: 1.2; z-index: 4; box-shadow: 0 2px 5px rgba(0,0,0,0.8); }
.player-side.left .name-tag { color: var(--green); border-color: var(--green); }
.player-side.right .name-tag { color: var(--red); border-color: var(--red); }

.lawyer-desk { 
  position: absolute; bottom: 0; width: 90%; height: 50px; 
  background: linear-gradient(to bottom, #6b4423, #3b2210);
  border: 3px solid #222; border-radius: 4px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.1);
  z-index: 2;
}
.player-side.left .lawyer-desk { left: 5%; }
.player-side.right .lawyer-desk { right: 5%; }
.desk-item-container { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 5; }

.speaking { animation: speakBounce 0.3s infinite alternate; }
@keyframes speakBounce { from { transform: translateY(0) scale(1); } to { transform: translateY(-12px) scale(1.05); filter: drop-shadow(0 0 15px currentColor); } }

/* 對話框 */
.dialog-box { background: #111; border: 4px solid #fff; border-radius: 4px; padding: 20px; min-height: 120px; position: relative; box-shadow: inset 0 0 0 2px #000, 0 10px 20px rgba(0,0,0,0.8); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; }
.speaker-name { position: absolute; top: -16px; left: 15px; background: var(--gold); color: #000; font-size: clamp(12px, 3vw, 14px); font-weight: 900; padding: 4px 15px; border: 2px solid #000; transform: skewX(-10deg); box-shadow: 2px 2px 0 rgba(0,0,0,0.8); }
.dialog-content { font-size: clamp(14px, 3.5vw, 18px); line-height: 1.6; color: #fff; margin-top: 8px; font-family: "Noto Sans TC", sans-serif; font-weight: bold; white-space: pre-wrap; }

@keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

.hint-box { background: rgba(0, 50, 150, 0.9); border: 3px solid var(--blue); border-radius: 4px; padding: 12px; margin-top: 15px; text-align: center; font-size: clamp(12px, 3vw, 16px); color: #fff; box-shadow: 0 0 15px rgba(0,102,255,0.6); animation: pulse 2s infinite; }
.hint-box::before { content: '等等！'; display: block; color: var(--gold); font-size: 1.2em; font-style: italic; margin-bottom: 5px; text-shadow: 2px 2px 0 #000; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 10px rgba(0,102,255,0.5); } 50% { box-shadow: 0 0 25px rgba(0,102,255,1); } }

.objection-btn { display: block; margin: 15px auto; padding: 12px 40px; background: var(--red); color: #fff; border: 4px solid #fff; border-radius: 8px; font-size: clamp(20px, 5vw, 32px); font-weight: 900; cursor: pointer; transition: .1s; text-transform: uppercase; text-shadow: 3px 3px 0 #000; box-shadow: 0 8px 0 #800, 0 15px 20px rgba(0,0,0,0.8); font-style: italic; width: 90%; max-width: 350px; }
.objection-btn:active { transform: translateY(8px); box-shadow: 0 0 0 #800, 0 5px 10px rgba(0,0,0,0.8); }
.btn { padding: 12px 20px; border: 3px solid #fff; border-radius: 4px; cursor: pointer; background: var(--gold); color: #000; font-weight: 900; font-size: clamp(14px, 3.5vw, 18px); transition: .1s; display: block; margin: 10px auto; width: 100%; max-width: 300px; text-transform: uppercase; box-shadow: 0 6px 0 #a00, 0 10px 10px rgba(0,0,0,0.5); text-shadow: 1px 1px 0 #fff; }
.btn:active { transform: translateY(6px); box-shadow: 0 0 0 #a00; }
.btn.green { background: var(--green); box-shadow: 0 6px 0 #080; text-shadow: none; }
.btn.red { background: var(--red); color: #fff; box-shadow: 0 6px 0 #800; text-shadow: 1px 1px 0 #000; }
.next-wrap { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }

/* 證物袋 */
.evidence-bag { margin-top: 15px; padding: 20px 15px 15px; background: #112; border: 4px solid var(--gold); border-radius: 4px; animation: slideUp .2s ease; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
.evidence-bag::after { content: 'COURT RECORD'; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; font-weight: 900; padding: 2px 20px; border: 2px solid #000; font-size: 14px; letter-spacing: 2px; }
.evidence-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(80px, 20vw, 110px), 1fr)); gap: 10px; margin-top: 15px; }
.evidence-card { padding: 10px 5px; text-align: center; background: #222; border: 3px solid #555; border-radius: 4px; cursor: pointer; transition: .1s; color: #fff; position: relative; }
.evidence-card:active { background: var(--blue); border-color: #fff; }
.ev-icon { width: 32px; height: 32px; margin: 0 auto 5px; display: block; filter: drop-shadow(2px 2px 0 #000); }
.ev-name { font-size: 12px; font-weight: bold; font-family: "Noto Sans TC", sans-serif; text-shadow: 1px 1px 0 #000; }

.judge-ui { background: #222; border: 4px solid var(--gold); border-radius: 4px; padding: 15px; margin-top: 15px; text-align: center; animation: popIn .3s ease; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
.judge-ui h3 { color: var(--gold); margin-bottom: 15px; font-size: clamp(14px, 4vw, 18px); line-height: 1.4; text-shadow: 1px 1px 0 #000; }
.judge-choice { display: flex; flex-direction: column; gap: 10px; }
@media (min-width: 600px) { .judge-choice { flex-direction: row; justify-content: center; flex-wrap: wrap;} }
.judge-choice button { flex: 1; min-width: 45%; padding: 15px; font-size: clamp(14px, 3.5vw, 16px); font-weight: 900; border: 3px solid #fff; border-radius: 4px; cursor: pointer; transition: .1s; text-transform: uppercase; line-height: 1.4; box-shadow: 0 5px 0 rgba(0,0,0,0.5); }
.judge-choice button:active { transform: translateY(5px); box-shadow: none; }
.btn-pass { background: var(--blue); color: #fff; text-shadow: 1px 1px 0 #000; }
.btn-object { background: var(--red); color: #fff; text-shadow: 1px 1px 0 #000; }
.btn-ask { background: var(--gold); color: #000; }

.feedback { margin-top: 15px; padding: 15px; border: 4px solid; font-size: clamp(13px, 3vw, 16px); font-family: "Noto Sans TC", sans-serif; font-weight: bold; border-radius: 4px; animation: popIn 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
.feedback.ok { background: rgba(0,255,102,0.2); border-color: var(--green); color: #ccffdd; }
.feedback.ng { background: rgba(255,0,51,0.2); border-color: var(--red); color: #ffccdd; }
.feedback.neutral { background: rgba(255,204,0,0.2); border-color: var(--gold); color: #ffefb3; }
.feedback strong { display: block; margin-bottom: 8px; font-size: clamp(16px, 4vw, 20px); font-family: "Arial Black", sans-serif; text-transform: uppercase; }

/* 角色彈出視窗 */
.character-popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: flex-end; justify-content: center; z-index: 2000; padding: 20px; overflow: hidden; }
.character-popup { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 600px; animation: popOutFromBottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.character-portrait { width: clamp(150px, 35vw, 280px); height: clamp(150px, 35vw, 280px); filter: drop-shadow(0 0 40px rgba(0,0,0,1)); z-index: 2; margin-bottom: -20px; position: relative; animation: speakBounce 0.3s infinite alternate; }
.character-portrait img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; border-radius: 12px; }
.character-dialog { background: #000; border: 5px solid var(--gold); border-radius: 8px; padding: 25px; width: 100%; position: relative; z-index: 1; box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,1); text-align: center; }
.character-dialog .dialog-content { font-size: clamp(16px, 4vw, 24px); text-align: left; padding: 10px; text-shadow: 1px 1px 0 #000; }
@keyframes popOutFromBottom { 0% { transform: translateY(100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

/* 法警帶走動畫 */
.bailiff-scene { position: fixed; inset: 0; background: #000; z-index: 3000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.bailiff-drag { display: flex; align-items: flex-end; gap: 10px; animation: dragAway 2s forwards cubic-bezier(0.7, 0, 1, 1); }
.bailiff-svg-large { width: clamp(80px, 20vw, 150px); height: clamp(80px, 20vw, 150px); animation: walk 0.3s infinite alternate; }
.player-img-large { width: clamp(70px, 16vw, 120px); height: clamp(70px, 16vw, 120px); transform: rotate(30deg); filter: drop-shadow(0 0 10px rgba(255,0,0,0.8)); object-fit: cover; image-rendering: pixelated; }
.bailiff-text { position: absolute; top: 20%; width: 100%; text-align: center; font-size: clamp(24px, 8vw, 50px); color: var(--red); font-weight: 900; text-shadow: 3px 3px 0 #fff; animation: blink .3s infinite; font-style: italic; padding: 0 10px; }
@keyframes dragAway { 0% { transform: translateX(0); } 20% { transform: translateX(-50px) rotate(-5deg); } 100% { transform: translateX(100vw); opacity: 0; } }
@keyframes walk { from { transform: translateY(0); } to { transform: translateY(-10px); } }

.gameover-scene { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 4000; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: fadeIn 0.5s ease; text-align: center; padding: 20px; }
.gameover-title { font-size: clamp(60px, 15vw, 100px); color: var(--red); font-weight: 900; text-shadow: 4px 4px 0 #fff; font-style: italic; margin-bottom: 20px; transform: rotate(-5deg); }
.gameover-sub { font-size: clamp(18px, 4vw, 24px); color: #fff; margin-bottom: 40px; font-weight: bold; }

#flash-overlay { position: fixed; inset: 0; background: #fff; z-index: 5000; pointer-events: none; opacity: 0; }
.flash-active { animation: flashAnim 0.4s ease-out; }
@keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
#decisive-text { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5001; pointer-events: none; opacity: 0; padding: 20px; }
.decisive-active { animation: decisiveAnim 1.5s ease-out forwards; }
@keyframes decisiveAnim { 0% { opacity: 0; transform: scale(0.5) rotate(-10deg); } 20% { opacity: 1; transform: scale(1.1) rotate(5deg); } 40% { transform: scale(1) rotate(-2deg); } 80% { opacity: 1; transform: scale(1) rotate(0deg); } 100% { opacity: 0; transform: scale(1.5) rotate(0deg); } }
.decisive-text-inner { font-size: clamp(40px, 15vw, 100px); font-weight: 900; color: var(--gold); text-shadow: 6px 6px 0 var(--red), 12px 12px 0 #000; font-style: italic; letter-spacing: 6px; text-align: center; line-height: 1.2; transform: rotate(-10deg); }

/* 勝訴動畫 */
#victory-overlay { position: fixed; inset: 0; z-index: 6000; background: radial-gradient(circle, rgba(255,204,0,0.2) 0%, rgba(0,0,0,0.95) 70%); display: none; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
#victory-overlay.show { display: flex; animation: fadeIn .5s ease; }
.victory-title { font-size: clamp(60px, 15vw, 120px); color: var(--gold); font-weight: 900; text-shadow: 8px 8px 0 var(--red), 16px 16px 0 #000; transform: rotate(-10deg); animation: popIn .5s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 2; font-style: italic; letter-spacing: 8px; }
.victory-sub { font-size: clamp(20px, 5vw, 36px); color: #fff; margin-top: 30px; z-index: 2; animation: slideUp .5s .2s forwards; opacity: 0; text-align: center; font-weight: bold; text-shadow: 2px 2px 0 #000; }
.confetti { position: absolute; width: 10px; height: 10px; background: #f00; animation: fall linear forwards; z-index: 1; }
@keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }

@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.shake { animation: shake .4s ease; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-15px); } 40%, 80% { transform: translateX(15px); } }

.calc-facts { background: #222; border: 3px solid var(--gold); padding: 15px; border-radius: 4px; margin-bottom: 15px; animation: popIn .3s; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
.fact-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #555; font-family: "Noto Sans TC", sans-serif; font-size: 15px; }
.fact-row:last-child { border-bottom: none; }
.fact-label { color: #aaa; }
.fact-val { color: var(--gold); font-weight: bold; text-shadow: 1px 1px 0 #000; }
.calc-options { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
.option-group { background: #111; border: 3px solid #444; padding: 15px; border-radius: 4px; }
.option-title { font-size: 14px; color: var(--blue); margin-bottom: 10px; font-weight: bold; text-shadow: 1px 1px 0 #000; }
.option-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.opt-btn { flex: 1; padding: 12px; background: #333; color: #fff; border: 2px solid #555; border-radius: 4px; cursor: pointer; font-size: 14px; transition: .1s; box-shadow: 0 4px 0 #111; }
.opt-btn:active { transform: translateY(4px); box-shadow: none; }
.opt-btn.selected { background: var(--blue); border-color: #fff; box-shadow: 0 4px 0 #002; }
.calc-result { margin-top: 20px; text-align: center; font-size: 20px; color: var(--gold); font-weight: bold; display: none; }
.calc-result.show { display: block; animation: popIn .3s forwards; }

.tie-ui { background: #111; border: 4px solid #fff; border-radius: 8px; padding: 25px; margin-top: 20px; text-align: center; animation: popIn .5s; box-shadow: 0 0 40px rgba(255,255,255,0.5); }
.tie-ui h2 { color: #fff; margin-bottom: 20px; font-size: 24px; text-shadow: 2px 2px 0 #000; }
.tie-btns { display: flex; flex-direction: column; gap: 15px; }
@media (min-width: 600px) { .tie-btns { flex-direction: row; justify-content: center; } }
</style>

class Model {
  constructor() { 
    this.i=0; this.score=0; this.max=60; this.lives=3; this.bag=false; this.res=null; 
    this.logs=[]; this.role=null; this.scenes=[]; 
    this.charPopup = null;
    this.gameover=false;
    this.judgeStep = 0; this.storyStep = 0;
    this.calcSel = { qty: null, price: null, cost: null };
    this.bailiffShock = false;
    this.isDanger = false;
    this.typingDone = false;
    this.effect = null; 
    this.deskItem = null; 
    
    this.trustMelon = 50;
    this.trustWater = 50;
    this.trustChange = null; 
    this.trustChangeColor = null;
    this.isTie = false;
  }
  get cur() { return this.scenes[this.i]; }
  open() { this.bag=true; this.res=null; this.charPopup = null; this.effect = null; this.deskItem = null; this.trustChange = null; }
  
  pick(id) {
    const s=this.cur; const ev = ALL_EVIDENCE[id];
    this.trustChange = null;

    if (ev.joke) {
      this.lives--;
      this.bag = false;
      this.effect = ev.effect; 
      
      if (ev.isFood) {
        const deskSide = (this.role === 'melon') ? 'left' : (this.role === 'water' ? 'right' : 'left');
        this.deskItem = { icon: ev.foodIcon, side: deskSide };
      }

      if (id === 'j_gun') {
        this.bailiffShock = true;
        this.isDanger = true;
        this.shakeScreen();
        this.charPopup = { speaker: '法警', text: ev.joke, icon: 'bailiff', color: 'var(--red)', isImg: false };
      } else if (id === 'j_wig') {
        this.charPopup = { speaker: '審判長', text: ev.joke, icon: 'judge-main', color: 'var(--gold)', isImg: false };
      } else if (id === 'j_earbuds') {
        this.charPopup = { speaker: '陪席法官', text: ev.joke, icon: 'judge-side', color: 'var(--blue)', isImg: false };
      } else {
        this.charPopup = { speaker: '審判長', text: ev.joke, icon: 'judge-main', color: 'var(--gold)', isImg: false };
      }

      if (this.role === 'melon') {
        let penalty = ev.fatal ? 40 : 15;
        this.trustMelon = Math.max(0, this.trustMelon - penalty);
        this.trustWater += penalty;
        this.trustChange = `-${penalty}%`;
        this.trustChangeColor = 'var(--red)';
      }
      if (this.role === 'water') {
        let penalty = ev.fatal ? 40 : 15;
        this.trustWater = Math.max(0, this.trustWater - penalty);
        this.trustMelon += penalty;
        this.trustChange = `-${penalty}%`;
        this.trustChangeColor = 'var(--red)';
      }

      if(this.lives<=0 || (this.role === 'melon' && this.trustMelon <= 0) || (this.role === 'water' && this.trustWater <= 0)){ 
        this.res={ok:false, rev:'GameOver'}; 
        this.logs.push({ok:false, fb:'心證崩盤，被趕出法庭'}); 
        setTimeout(() => { 
          this.charPopup = null; 
          this.bailiffAnim = true; 
          app.start(); 
          setTimeout(() => {
            this.bailiffAnim = false;
            this.gameover = true;
            app.start();
          }, 2500);
        }, 2000); 
      }
      else { this.res={ok:false, retry:true}; }
      return this.res;
    }
    
    if(s.ans.includes(id)){
      this.score+=10; this.bag=false; this.res={ok:true, fb:s.fbOk, line:s.success, type: 'strong'};
      this.logs.push({ok:true, fb:s.fbOk});
      
      if (this.role === 'melon') { 
        this.trustMelon += 20; this.trustWater -= 20; this.trustChange = '+20%'; this.trustChangeColor = 'var(--green)';
        this.charPopup = { speaker: '上訴人訴訟代理人', text: s.success, icon: MELON_AVATAR, color: 'var(--green)', isImg: true };
      } 
      else if (this.role === 'water') {
        this.trustWater += 20; this.trustMelon -= 20; this.trustChange = '+20%'; this.trustChangeColor = 'var(--green)';
        this.charPopup = { speaker: '被上訴人水利局訴訟代理人', text: s.success, icon: WATER_AVATAR, color: 'var(--red)', isImg: true }; 
      }
      
      setTimeout(() => this.decisiveEffect(), 100);
      
    } else {
      this.bag = false;
      this.res = { ok: false, fb: s.fbNg, type: 'weak' };
      
      if (this.role === 'melon') { this.trustMelon = Math.max(0, this.trustMelon - 10); this.trustWater += 10; this.trustChange = '-10%'; this.trustChangeColor = 'var(--red)'; }
      if (this.role === 'water') { this.trustWater = Math.max(0, this.trustWater - 10); this.trustMelon += 10; this.trustChange = '-10%'; this.trustChangeColor = 'var(--red)'; }
    }
    return this.res;
  }

  closeCharPopup() {
    this.charPopup = null;
    if(this.res && this.res.rev === 'GameOver') {} else { app.start(); }
  }

  judgeNextStep() { if (this.judgeStep < 2) { this.judgeStep++; this.typingDone = false; } }
  
  judgePick(optionType, trustM, trustW, fb) {
    this.trustMelon += trustM;
    this.trustWater += trustW;
    
    this.trustChange = trustM > 0 ? `西瓜+${trustM}%` : (trustW > 0 ? `水利+${trustW}%` : '');
    if(trustM < 0) this.trustChange = `西瓜${trustM}%`;
    if(trustW < 0) this.trustChange = `水利${trustW}%`;

    this.trustChangeColor = trustM > 0 ? 'var(--green)' : 'var(--red)';
    if(trustW > 0) this.trustChangeColor = 'var(--red)';
    if(trustW < 0) this.trustChangeColor = 'var(--green)';

    this.score += (trustM > 0) ? 10 : 0;
    this.res = { ok: trustM > 0, fb: fb };
    this.logs.push({ok: trustM > 0, fb: fb});
  }

  storyPick(isCorrect) {
    const s=this.cur;
    if (isCorrect) { this.res = { ok:true, fb: s.fbOk }; } 
    else { this.res = { ok:false, fb: s.fbNg }; }
  }

  setCalcOption(type, val) { this.calcSel[type] = val; }
  submitCalc() {
    const s=this.cur;
    const ans = s.options;
    const isCorrect = 
      this.calcSel.qty === ans.qty.find(o=>o.correct).val &&
      this.calcSel.price === ans.price.find(o=>o.correct).val &&
      this.calcSel.cost === ans.cost.find(o=>o.correct).val;
    
    if(isCorrect) {
      this.score += 10;
      this.res = { ok:true, msg: '計算正確！' };
      this.logs.push({ok:true, fb:'計算正確'});
    } else {
      this.res = { ok:false, msg: '數字有誤，請重新核對卷宗事實！' };
      this.logs.push({ok:false, fb:'計算錯誤'});
    }
  }

  next() { 
    if(this.i<this.scenes.length-1){ 
      this.i++; this.lives=3; this.bag=false; this.res=null; this.charPopup=null; this.effect=null; this.deskItem=null; this.bailiffAnim=false; this.gameover=false; this.bailiffShock = false; this.isDanger = false; this.judgeStep = 0; this.storyStep = 0;
      this.calcSel = { qty: null, price: null, cost: null };
      this.typingDone = false;
      this.trustChange = null;
      this.isTie = false;
    } 
  }

  shakeScreen() {
    const a=document.getElementById('app'); 
    if(a) { a.classList.add('shake'); setTimeout(()=>a.classList.remove('shake'), 800); }
  }

  decisiveEffect() {
    const flash = document.getElementById('flash-overlay');
    const dText = document.getElementById('decisive-text');
    flash.classList.add('flash-active');
    dText.classList.add('decisive-active');
    setTimeout(() => { flash.classList.remove('flash-active'); dText.classList.remove('decisive-active'); }, 1500);
  }
}

class View {
  constructor(r) { this.r=r; }

  renderTopBar(m) {
    let w = Math.max(0, Math.min(100, m.trustWater));
    let mel = Math.max(0, Math.min(100, m.trustMelon));
    let total = w + mel;
    if(total === 0) total = 1;
    
    let melPct = (mel / total) * 100;
    let waterPct = (w / total) * 100;
    let rotate = (Math.round(melPct) === Math.round(waterPct)) ? 0 : (melPct - 50) * 0.6; 

    return `
      <div class="top-bar">
        ${m.trustChange ? `<div class="trust-float" style="color: ${m.trustChangeColor};">${m.trustChange}</div>` : ''}
        <div class="trust-meter">
          <div class="trust-left">西瓜寮<br>${Math.round(melPct)}%</div>
          <div class="balance-container">
            <div class="balance-bar">
              <div class="bar-melon" style="width:${melPct}%"></div>
              <div class="bar-water" style="width:${waterPct}%"></div>
            </div>
            <div class="scale-icon" style="transform: translateX(-50%) rotate(${rotate}deg);">⚖️</div>
          </div>
          <div class="trust-right">水利局<br>${Math.round(waterPct)}%</div>
        </div>
      </div>
    `;
  }

  renderEffects(m) {
    if (!m.effect) return '';
    let html = '<div class="effect-layer">';
    if (m.effect === 'wig_fall') {
      html += `<svg class="falling-wig" viewBox="0 0 16 16"><use href="#i-wig"/></svg>`;
    } else if (m.effect === 'notes') {
      for(let i=0; i<8; i++) {
        html += `<div class="note-bounce" style="left:${Math.random()*100}%; top:50%; animation-delay:${Math.random()}s;">🎵</div>`;
      }
    } else if (m.effect === 'gun') {
      for(let i=0; i<6; i++) {
        html += `<div class="bullet-hole" style="left:${Math.random()*100}%; top:${Math.random()*100}%;"></div>`;
      }
    } else if (m.effect === 'tumbleweed') {
      html += `<div class="tumbleweed" style="top:50%;">🌿</div>`;
    }
    html += '</div>';
    return html;
  }
  
  renderCourt(m, activeSpeaker) {
    const isJudge = activeSpeaker === '審判長' || activeSpeaker === '系統' || activeSpeaker === '旁白';
    const isMelon = activeSpeaker === '上訴人西瓜寮訴訟代理人';
    const isWater = activeSpeaker === '被上訴人水利局訴訟代理人';
    const shockClass = m.bailiffShock ? 'bailiff-shock' : '';
    const dangerClass = m.isDanger ? 'danger' : '';
    const baldClass = (m.effect === 'wig_fall') ? 'bald-judge' : '';

    let deskLeft = m.deskItem && m.deskItem.side === 'left' ? m.deskItem.icon : '';
    let deskRight = m.deskItem && m.deskItem.side === 'right' ? m.deskItem.icon : '';

    return `
      ${this.renderTopBar(m)}
      <div class="courtroom-scene ${dangerClass}">
        ${this.renderEffects(m)}
        <div class="judge-stand">
          <div class="judge-bench">
            <svg class="judge-avatar judge-side ${isJudge?'active speaking':''}" viewBox="0 0 16 16"><use href="#judge-side"/></svg>
            <svg class="judge-avatar main-judge ${isJudge?'active speaking':''} ${dangerClass} ${baldClass}" viewBox="0 0 16 16"><use href="#judge-main"/></svg>
            <svg class="judge-avatar judge-side ${isJudge?'active speaking':''}" viewBox="0 0 16 16"><use href="#judge-side"/></svg>
          </div>
          <div class="bailiff-stand left ${shockClass}"><svg class="bailiff-avatar" viewBox="0 0 16 16"><use href="#bailiff"/></svg><span class="bailiff-label">法警</span></div>
          <div class="bailiff-stand right ${shockClass}"><svg class="bailiff-avatar" viewBox="0 0 16 16"><use href="#bailiff"/></svg><span class="bailiff-label">法警</span></div>
        </div>
        <div class="players-area">
          <div class="player-side left">
            <div class="avatar ${isMelon?'active speaking':''}"><img src="${MELON_AVATAR}" alt="西瓜寮代理人"></div>
            <div class="name-tag">上訴人<br>西瓜寮訴訟代理人</div>
            <div class="lawyer-desk"></div>
            ${deskLeft ? `<div class="desk-item-container"><div class="desk-item">${deskLeft}</div></div>` : ''}
          </div>
          <div class="player-side right">
            <div class="avatar ${isWater?'active speaking':''}"><img src="${WATER_AVATAR}" alt="水利局代理人"></div>
            <div class="name-tag">被上訴人<br>水利局訴訟代理人</div>
            <div class="lawyer-desk"></div>
            ${deskRight ? `<div class="desk-item-container"><div class="desk-item">${deskRight}</div></div>` : ''}
          </div>
        </div>
      </div>
    `;
  }

  render(m) {
    if(!m.role) { 
      this.r.innerHTML = `<div class="cover-screen"><div class="cover-title">西瓜寮裁判所</div><div class="cover-sub">THE WEIGHT OF JUSTICE</div><div class="press-start" onclick="window.showRoleSelect()">▶ PRESS START ◀</div></div>`;
      return; 
    }
    
    if (m.role === 'select') {
      this.r.innerHTML = `
        <div class="cover-screen">
          <div class="cover-title" style="font-size:clamp(24px,6vw,32px);letter-spacing:4px;margin-bottom:20px;">SELECT YOUR ROLE</div>
          <div class="roles-container">
            <div class="role-card story" onclick="window.selectRole('story')">
              <svg class="role-icon" viewBox="0 0 16 16"><use href="#i-book"/></svg>
              <h3>📖 案件故事模式</h3>
              <p>跟著判決書一步步審理</p>
            </div>
            <div class="role-card melon" onclick="window.selectRole('melon')">
              <div class="role-icon"><img src="${MELON_AVATAR}" style="width:100%;height:100%;object-fit:cover;image-rendering:pixelated;"></div>
              <h3>上訴人<br>西瓜寮訴訟代理人</h3>
              <p>推翻偏見，逆轉心證！</p>
            </div>
            <div class="role-card water" onclick="window.selectRole('water')">
              <div class="role-icon"><img src="${WATER_AVATAR}" style="width:100%;height:100%;object-fit:cover;image-rendering:pixelated;"></div>
              <h3>被上訴人<br>水利局訴訟代理人</h3>
              <p>守住優勢，駁回原告！</p>
            </div>
            <div class="role-card judge" onclick="window.selectRole('judge')">
              <svg class="role-icon" viewBox="0 0 16 16"><use href="#judge-main"/></svg>
              <h3>審判長<br>承審法官</h3>
              <p>聆聽兩造，裁決心證！</p>
            </div>
          </div>
        </div>`;
      return;
    }

    const s=m.cur; let h='';

    if (m.gameover) {
      h += `
        <div class="gameover-scene">
          <div class="gameover-title">GAME OVER</div>
          <div class="gameover-sub">心證崩盤，你已被法警強制帶離法庭</div>
          <button class="btn red" onclick="location.reload()">重新遊玩</button>
        </div>`;
      this.r.innerHTML = h; return;
    }

    if (m.bailiffAnim) {
      h += `
        <div class="bailiff-scene">
          <div class="bailiff-text">法警！將這位訴訟代理人帶出去！</div>
          <div class="bailiff-drag">
            <svg class="bailiff-svg-large" viewBox="0 0 16 16"><use href="#bailiff"/></svg>
            <img src="${m.role==='melon' ? MELON_AVATAR : WATER_AVATAR}" class="player-img-large">
            <svg class="bailiff-svg-large" viewBox="0 0 16 16"><use href="#bailiff"/></svg>
          </div>
        </div>`;
      this.r.innerHTML = h; return;
    }

    if(s.type==='end' || s.type==='end_story'){
      h+=this.renderCourt(m, '審判長');
      let isTie = Math.round(m.trustMelon) === Math.round(m.trustWater);
      let isMelonWin = m.trustMelon > m.trustWater;

      if (s.type === 'end_story') {
         h += `<div class="dialog-box" style="margin-top:15px;"><span class="speaker-name">審判長</span><div class="dialog-content">本院判斷如下：被上訴人水利局應給付上訴人西瓜寮 <strong>1 億 2,722 萬 2,777 元</strong>，及自 99 年 6 月 8 日起至清償日止，按年息 5% 計算之利息。</div></div>`;
         h += `<div class="next-wrap"><button class="btn green" onclick="window.playVictory(true)">觀看判決結果</button></div>`;
      } else if (isTie) {
         h += `<div class="tie-ui"><h2>⚖️ 兩造勢均力敵，心證 50% / 50% ⚖️</h2><p style="margin-bottom:20px;color:#aaa;">請法官行使最終裁量權，決定本案勝訴方。</p><div class="tie-btns">
           <button class="btn green" onclick="window.playVictory(true)">判決西瓜寮勝訴</button>
           <button class="btn red" onclick="window.playVictory(false)">判決水利局勝訴</button>
         </div></div>`;
      } else if (isMelonWin) {
         h += `<div class="dialog-box" style="margin-top:15px; border-color:var(--green);"><span class="speaker-name" style="background:var(--green); color:#000;">審判長</span><div class="dialog-content">本院判斷如下：被上訴人水利局應給付上訴人西瓜寮 <strong>1 億 2,722 萬 2,777 元</strong>，及自 99 年 6 月 8 日起至清償日止，按年息 5% 計算之利息。</div></div>`;
         h += `<div class="next-wrap"><button class="btn green" onclick="window.playVictory(true)">西瓜寮勝訴！</button></div>`;
      } else {
         h += `<div class="dialog-box" style="margin-top:15px; border-color:var(--red);"><span class="speaker-name" style="background:var(--red); color:#fff;">審判長</span><div class="dialog-content">本院判斷如下：上訴人西瓜寮之訴及假執行之聲請均駁回。訴訟費用由上訴人負擔。</div></div>`;
         h += `<div class="next-wrap"><button class="btn red" onclick="window.playVictory(false)">水利局勝訴！</button></div>`;
      }
      this.r.innerHTML=h; return;
    }

    if (m.role === 'story') {
      if(s.type==='story'){
        h+=this.renderCourt(m, s.speaker);
        h+=`<div class="dialog-box" id="typewriter-box"><span class="speaker-name">${s.speaker}</span><div class="dialog-content" data-text="${s.text}"></div></div>`;
        h+=`<div class="next-wrap"><button class="btn" id="btnNext">${s.btn}</button></div>`;
      } else if (s.type === 'story_choice') {
        h+=this.renderCourt(m, s.speaker);
        h+=`<div class="dialog-box" id="typewriter-box"><span class="speaker-name">${s.speaker}</span><div class="dialog-content" data-text="${s.text}"></div></div>`;
        if (!m.res) {
          h+=`<div class="judge-ui"><h3>💭 請做出裁決</h3><div class="judge-choice">`;
          s.opts.forEach((opt, idx) => { h+=`<button class="${idx===1?'btn-object':'btn-pass'}" onclick="window.storyDecide(${opt.correct})">${opt.label}</button>`; });
          h+=`</div></div>`;
        } else {
          h+=`<div class="feedback ${m.res.ok?'ok':'ng'}"><strong>${m.res.ok?'✔ 裁決正確！':'✘ 裁決錯誤！'}</strong>${m.res.fb}</div>`;
          h+=`<div class="next-wrap"><button class="btn" id="btnNext">繼續故事 →</button></div>`;
        }
      } else if (s.type === 'calc') {
        h+=this.renderCourt(m, '系統');
        h+=this.renderCalc(m, s);
      }
    } else if (m.role === 'judge') {
      if(s.type==='story'){
        h+=this.renderCourt(m, '系統');
        h+=`<div class="dialog-box" id="typewriter-box"><span class="speaker-name">系統</span><div class="dialog-content" data-text="${s.text}"></div></div>`;
        h+=`<div class="next-wrap"><button class="btn" id="btnNext">${s.btn}</button></div>`;
      } else if (s.type === 'judge_trial') {
        let activeSpeaker = (m.judgeStep === 0) ? '被上訴人水利局訴訟代理人' : (m.judgeStep === 1) ? '上訴人西瓜寮訴訟代理人' : '審判長';
        h+=this.renderCourt(m, activeSpeaker);
        
        if (m.judgeStep === 0) {
          h+=`<div class="dialog-box" id="typewriter-box" style="border-color:var(--red);"><span class="speaker-name" style="background:var(--red);color:#fff;">被上訴人(水利局)</span><div class="dialog-content" data-text="「${s.p_claim}」"></div></div>`;
          h+=`<div class="next-wrap"><button class="btn" id="btnJudgeNext">聽取上訴人抗辯 →</button></div>`;
        } else if (m.judgeStep === 1) {
          h+=`<div class="dialog-box" id="typewriter-box" style="border-color:var(--green);"><span class="speaker-name" style="background:var(--green);color:#fff;">上訴人(西瓜寮)</span><div class="dialog-content" data-text="「${s.d_claim}」"></div></div>`;
          h+=`<div class="next-wrap"><button class="btn" id="btnJudgeNext">進入審判長裁決 →</button></div>`;
        } else if (m.judgeStep === 2) {
          h+=`<div class="judge-ui"><h3>💭 ${s.question}</h3>`;
          if (!m.res) {
            h+=`<div class="judge-choice">`;
            s.options.forEach(opt => {
              let btnClass = opt.type === 'p' ? 'btn-pass' : (opt.type === 'd' ? 'btn-object' : 'btn-ask');
              h+=`<button class="${btnClass}" onclick="window.judgeDecide('${opt.type}', ${opt.trustM}, ${opt.trustW}, '${opt.fb}')">${opt.label}</button>`;
            });
            h+=`</div>`;
          } else {
            h+=`<div class="feedback ${m.res.ok?'ok':'neutral'}"><strong>${m.res.ok?'✔ 裁決成立！':'⚖️ 自由心證裁量'}</strong>${m.res.fb}</div>`;
            h+=`<div class="next-wrap"><button class="btn" id="btnNext">下一章 →</button></div>`;
          }
          h+=`</div>`;
        }
      } else if (s.type === 'calc') {
        h+=this.renderCourt(m, '系統');
        h+=this.renderCalc(m, s);
      }
    } else {
      if(s.type==='story'){
        h+=this.renderCourt(m, s.speaker);
        h+=`<div class="dialog-box" id="typewriter-box"><span class="speaker-name">${s.speaker}</span><div class="dialog-content" data-text="${s.text}"></div></div>`;
        h+=`<div class="next-wrap"><button class="btn" id="btnNext">${s.btn}</button></div>`;
      } else if(s.type==='trial'){
        h+=this.renderCourt(m, (!m.res||m.res.type!=='strong') ? s.speaker : (m.role==='melon'?'上訴人西瓜寮訴訟代理人':'被上訴人水利局訴訟代理人'));
        if(!m.res||m.res.type!=='strong') h+=`<div class="dialog-box" id="typewriter-box"><span class="speaker-name">${s.speaker}</span><div class="dialog-content" data-text="「${s.opp}」"></div></div>`;
        else h+=`<div class="dialog-box" id="typewriter-box" style="border-color:${m.role==='melon'?'var(--green)':'var(--red)'};"><span class="speaker-name" style="background:${m.role==='melon'?'var(--green)':'var(--red)'};color:#000;">${m.role==='melon'?'上訴人西瓜寮訴訟代理人':'被上訴人水利局訴訟代理人'}</span><div class="dialog-content" data-text="「${m.res.line}」"></div></div>`;

        if(!m.res&&!m.bag) {
          h+=`<div class="hint-box">💡 ${s.hint}</div><button class="objection-btn" id="btnObj">異議あり！</button>`;
        }
        
        if(m.bag){
          const shuffledBag = [...s.bag].sort(() => Math.random() - 0.5);
          h+=`<div class="evidence-bag"><div class="evidence-grid">`;
          shuffledBag.forEach(id => {
            const e = ALL_EVIDENCE[id];
            h+=`<button class="evidence-card" data-id="${e.id}"><svg class="ev-icon" viewBox="0 0 16 16"><use href="#${e.icon}"/></svg><span class="ev-name">${e.name}</span></button>`; 
          });
          h+=`</div></div>`;
        }
        
        if(m.res){
          let fbClass = m.res.type === 'strong' ? 'ok' : 'neutral';
          let fbTitle = m.res.type === 'strong' ? '✔ 動搖心證！' : '⚖️ 證據力不足';
          h+=`<div class="feedback ${fbClass}"><strong>${fbTitle}</strong>${m.res.fb||''}</div>`;
          
          if(m.res.ok||m.res.rev) h+=`<div class="next-wrap"><button class="btn" id="btnNext">下一章 →</button></div>`;
          else if (m.res.retry) h+=`<div class="next-wrap"><button class="btn red" id="btnRetry">重新選擇證物</button></div>`;
          else h+=`<div class="next-wrap"><button class="btn" id="btnNext">下一章 →</button></div>`;
        }
      } else if(s.type==='calc'){
        h+=this.renderCourt(m, '系統');
        h+=this.renderCalc(m, s);
      }
    }

    if (m.charPopup) {
      h += `
        <div class="character-popup-overlay" onclick="window.closePopup()">
          <div class="character-popup">
            <div class="character-portrait" style="color: ${m.charPopup.color}; filter: drop-shadow(0 0 30px ${m.charPopup.color});">
              ${m.charPopup.isImg 
                ? `<img src="${m.charPopup.icon}" style="width:100%;height:100%;object-fit:cover;image-rendering:pixelated;border-radius:12px;">` 
                : `<svg viewBox="0 0 16 16" style="width:100%;height:100%;"><use href="#${m.charPopup.icon}"/></svg>`}
            </div>
            <div class="character-dialog" style="border-color: ${m.charPopup.color}; box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 20px ${m.charPopup.color};">
              <span class="speaker-name" style="background:${m.charPopup.color}; color:#000;">${m.charPopup.speaker}</span>
              <div class="dialog-content" data-text="${m.charPopup.text}"></div>
            </div>
          </div>
        </div>`;
    }
    
    this.r.innerHTML=h;
  }

  renderCalc(m, s) {
    let h = `<div class="dialog-box" style="margin-top:15px;border-color:var(--blue);"><span class="speaker-name" style="background:var(--blue);color:#fff;">法官算帳</span><div class="dialog-content">請依據卷宗事實，選擇正確的參數以計算損害賠償金額。</div></div>
      <div class="calc-facts">
        <h3 style="color:var(--gold);font-size:16px;margin-bottom:10px;">📑 卷宗事實</h3>
        ${s.facts.map(f=>`<div class="fact-row"><span class="fact-label">${f.label}</span><span class="fact-val">${f.value}</span></div>`).join('')}
      </div>
      <div class="calc-options">`;

    if(!m.res) {
      h += `<div class="option-group"><div class="option-title">1. 選擇【系爭土石數量】</div><div class="option-btns">`;
      s.options.qty.forEach(opt => { h += `<button class="opt-btn ${m.calcSel.qty === opt.val ? 'selected' : ''}" onclick="window.setCalc('qty', ${opt.val})">${opt.label}</button>`; });
      h += `</div></div>`;
      
      h += `<div class="option-group"><div class="option-title">2. 選擇【起訴時市價】</div><div class="option-btns">`;
      s.options.price.forEach(opt => { h += `<button class="opt-btn ${m.calcSel.price === opt.val ? 'selected' : ''}" onclick="window.setCalc('price', ${opt.val})">${opt.label}</button>`; });
      h += `</div></div>`;
      
      h += `<div class="option-group"><div class="option-title">3. 選擇【每立方公尺清運費】</div><div class="option-btns">`;
      s.options.cost.forEach(opt => { h += `<button class="opt-btn ${m.calcSel.cost === opt.val ? 'selected' : ''}" onclick="window.setCalc('cost', ${opt.val})">${opt.label}</button>`; });
      h += `</div></div>`;

      const disabled = !m.calcSel.qty || !m.calcSel.price || !m.calcSel.cost;
      h += `<button class="btn green" style="margin-top:20px; ${disabled?'opacity:0.5;cursor:not-allowed;':''}" id="btnSubmitCalc" ${disabled?'disabled':''}>確認並計算金額</button>`;
    } else {
      if (m.res.ok) {
        h += `<div class="feedback ok"><strong>✔ 計算正確！</strong>系統已自動為您算出最終賠償金額。</div>`;
        h += `<div class="calc-result show">
          <div style="font-size:16px;color:#fff;margin-bottom:10px;">市價總額：275 × 559,221 = 153,785,775 元</div>
          <div style="font-size:16px;color:#fff;margin-bottom:10px;">扣除清運費：47.5 × 559,221 = 26,562,998 元</div>
          <div style="font-size:24px;color:var(--gold);margin-top:20px;">最終賠償：127,222,777 元</div>
        </div>`;
      } else {
        h += `<div class="feedback ng"><strong>✘ 計算錯誤！</strong>請檢查您選擇的數量、市價或清運費是否與卷宗事實相符。</div>`;
      }
      h += `<div class="next-wrap" style="margin-top:20px;"><button class="btn" id="btnNext">下一章 →</button></div>`;
    }
    h += `</div>`;
    return h;
  }
}

class Ctrl {
  constructor(m, v) { this.m=m; this.v=v; this.typeTimer=null; }
  start() { this.v.render(this.m); this.bind(); }
  
  bind() {
    const m=this.m;
    const nBtn=document.getElementById('btnNext');
    if(nBtn) nBtn.onclick=()=>{ m.next(); this.start(); };
    const jNext=document.getElementById('btnJudgeNext');
    if(jNext) jNext.onclick=()=>{ m.judgeNextStep(); this.start(); };
    const oBtn=document.getElementById('btnObj');
    if(oBtn) oBtn.onclick=()=>{ m.open(); this.start(); };
    const rBtn=document.getElementById('btnRetry');
    if(rBtn) rBtn.onclick=()=>{ m.res=null; m.open(); this.start(); };
    
    document.querySelectorAll('.evidence-card').forEach(c=>{
      c.onclick=()=>{
        const r=m.pick(c.dataset.id);
        if(r.ok) { m.decisiveEffect(); }
        else if(r.retry || r.rev) this.shake();
        this.start();
      };
    });

    const sBtn=document.getElementById('btnSubmitCalc');
    if(sBtn) sBtn.onclick=()=>{ m.submitCalc(); this.start(); };

    const typeBoxes = document.querySelectorAll('[data-text]');
    if (typeBoxes.length > 0) {
      typeBoxes.forEach(box => {
        const text = box.dataset.text;
        if (text && !box.dataset.typed) {
          box.dataset.typed = 'true';
          box.innerText = '';
          let i = 0;
          clearInterval(this.typeTimer);
          this.typeTimer = setInterval(() => {
            if (i < text.length) {
              box.innerText += text.charAt(i);
              i++;
            } else {
              clearInterval(this.typeTimer);
            }
          }, 30);
          
          box.onclick = (e) => {
            e.stopPropagation();
            clearInterval(this.typeTimer);
            box.innerText = text;
          };
        } else if (text) {
          box.innerText = text;
        }
      });
    }
  }
  
  shake() {
    const a=document.getElementById('app'); a.classList.add('shake'); setTimeout(()=>a.classList.remove('shake'), 400);
  }
}

const app = new Ctrl(new Model(), new View(document.getElementById('app')));

window.showRoleSelect = () => { app.m.role = 'select'; app.start(); };
window.selectRole = (role) => {
  app.m.role = role; app.m.i = 0; app.m.typingDone = false;
  
  if (role === 'melon') { app.m.trustMelon = 20; app.m.trustWater = 80; } 
  else if (role === 'water') { app.m.trustMelon = 60; app.m.trustWater = 40; } 
  else if (role === 'judge') { app.m.trustMelon = 50; app.m.trustWater = 50; }

  if (role === 'story') app.m.scenes = [...SCENES_STORY];
  else if (role === 'melon') app.m.scenes = [...SCENES_MELON, SCENE_CALC, SCENE_END];
  else if (role === 'water') app.m.scenes = [...SCENES_WATER, SCENE_CALC, SCENE_END];
  else if (role === 'judge') app.m.scenes = [...SCENES_JUDGE, SCENE_CALC, SCENE_END];
  
  app.m.trustChange = null;
  app.start();
};

window.judgeDecide = (type, trustM, trustW, fb) => { app.m.judgePick(type, trustM, trustW, fb); app.start(); };
window.storyDecide = (isCorrect) => { app.m.storyPick(isCorrect); app.start(); };
window.closePopup = () => { app.m.closeCharPopup(); };
window.setCalc = (type, val) => { app.m.setCalcOption(type, val); app.start(); };

window.playVictory = (isMelonWin) => {
  const overlay = document.getElementById('victory-overlay');
  const title = overlay.querySelector('.victory-title');
  const sub = overlay.querySelector('.victory-sub');
  
  if (isMelonWin) {
    title.innerText = '西瓜寮勝訴！';
    title.style.color = 'var(--green)';
    title.style.textShadow = '6px 6px 0 #005500, 12px 12px 0 #000';
    sub.innerText = '水利局應給付西瓜寮 1 億 2,722 萬 2,777 元';
  } else {
    title.innerText = '水利局勝訴！';
    title.style.color = 'var(--red)';
    title.style.textShadow = '6px 6px 0 #550000, 12px 12px 0 #000';
    sub.innerText = '原告之訴及假執行之聲請均駁回，訴訟費用由原告負擔。';
  }

  overlay.classList.add('show');
  for(let i=0; i<100; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-10px';
      c.style.backgroundColor = ['#ffcc00','#ff0033','#00ff66','#0066ff','#fff'][Math.floor(Math.random()*5)];
      c.style.animationDuration = (Math.random() * 3 + 2) + 's';
      c.style.width = c.style.height = (Math.random() * 10 + 5) + 'px';
      overlay.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }, i * 20);
  }
  setTimeout(() => { location.reload(); }, 5000);
};

app.start();
</script>
