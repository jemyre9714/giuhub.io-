<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西瓜寮裁判所</title>
<style>
:root { --gold: #f0a500; --red: #ff4d6d; --green: #4caf50; --wood: #8b6f47; --bg: #0a0502; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
body {
  color: #e8e8e8; min-height: 100vh; padding: 24px; overflow-x: hidden;
  background-color: var(--bg);
  background-image: 
    linear-gradient(rgba(0,0,0,0.8) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.8) 1px, transparent 1px),
    radial-gradient(circle at 50% 0%, rgba(139, 58, 58, 0.4) 0%, transparent 60%);
  background-size: 20px 20px, 20px 20px, 100% 100%;
  background-attachment: fixed;
}
/* 掃描線效果 */
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
  background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.1) 50%);
  background-size: 100% 4px;
}

#app { max-width: 1000px; margin: 0 auto; position: relative; z-index: 1; }

/* 封面 (遊戲感) */
.cover-screen { text-align: center; padding: 80px 20px; background: rgba(10,5,2,0.85); border: 4px solid var(--wood); border-radius: 16px; box-shadow: 0 0 50px rgba(240,165,0,0.2), inset 0 0 50px rgba(0,0,0,0.9); position: relative; overflow: hidden; }
.cover-screen::before { content: ''; position: absolute; inset: 0; background: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="none" stroke="rgba(240,165,0,0.05)" stroke-width="1"/></svg>'); }
.cover-title { font-size: 56px; color: #fff; font-weight: 900; letter-spacing: 8px; text-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold), 0 4px 0 #8b3a3a; margin-bottom: 20px; position: relative; z-index: 2; }
.cover-sub { color: var(--gold); font-size: 20px; letter-spacing: 4px; margin-bottom: 60px; text-shadow: 0 0 10px rgba(240,165,0,0.5); position: relative; z-index: 2; }
.press-start { font-size: 24px; color: #fff; font-weight: bold; animation: blink 1.2s infinite; cursor: pointer; padding: 20px; border: 2px solid transparent; transition: .2s; position: relative; z-index: 2; }
.press-start:hover { color: var(--gold); text-shadow: 0 0 10px var(--gold); border-color: var(--gold); border-radius: 10px; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* 角色選擇 */
.role-card { flex: 1; min-width: 220px; padding: 30px 20px; cursor: pointer; background: rgba(20,10,5,0.9); border: 2px solid rgba(200,160,100,0.3); border-radius: 16px; text-align: center; transition: .2s; user-select: none; position: relative; z-index: 2; }
.role-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.8), 0 0 20px rgba(240,165,0,0.3); }
.role-card.melon { border-color: rgba(76,175,80,0.6); }
.role-card.melon:hover { background: rgba(76,175,80,0.15); border-color: #4caf50; }
.role-card.water { border-color: rgba(255,77,109,0.6); }
.role-card.water:hover { background: rgba(255,77,109,0.15); border-color: #ff4d6d; }
.role-card.judge { border-color: rgba(240,165,0,0.6); }
.role-card.judge:hover { background: rgba(240,165,0,0.15); border-color: #f0a500; }
.role-icon { width: 80px; height: 80px; margin: 0 auto 16px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.8)); }
.role-card h3 { font-size: 22px; margin-bottom: 8px; color: #f7c948; font-weight: 900; }
.role-card p { font-size: 13px; color: #aaa; line-height: 1.5; }
.roles-container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 40px; }

/* 法庭全景 */
.courtroom-scene {
  background: #1a0f08; border: 4px solid var(--wood); border-radius: 12px;
  padding: 20px 20px 0; margin-bottom: 20px;
  box-shadow: inset 0 0 50px rgba(0,0,0,0.9), 0 10px 30px rgba(0,0,0,0.5);
  display: flex; flex-direction: column; gap: 20px; position: relative;
}
.judge-bench { display: flex; justify-content: center; align-items: flex-end; gap: 30px; border-bottom: 6px solid #4a2e15; padding-bottom: 15px; position: relative; }
.judge-bench::after { content: ''; position: absolute; bottom: -10px; left: 5%; width: 90%; height: 4px; background: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.8); }
.juror { width: 50px; height: 50px; opacity: 0.6; transition: .3s; }
.juror.active { opacity: 1; filter: drop-shadow(0 0 10px var(--gold)); }
.main-judge { width: 110px; height: 110px; filter: drop-shadow(0 0 10px rgba(240,165,0,0.3)); z-index: 2; transition: .3s; }
.main-judge.active { filter: drop-shadow(0 0 30px rgba(240,165,0,0.9)); transform: scale(1.05); }

.players-area { display: flex; justify-content: space-between; padding: 0 40px; position: relative; margin-bottom: -20px; }
.player-side { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 40%; }
.player-side .avatar { width: 90px; height: 90px; border-radius: 50%; padding: 4px; background: rgba(20,10,5,0.9); border: 3px solid #444; transition: .3s; position: relative; }
.player-side .avatar.active { border-color: var(--gold); box-shadow: 0 0 20px rgba(240,165,0,0.6); transform: scale(1.1); }
.player-side.left .avatar { border-bottom: 6px solid #4caf50; }
.player-side.right .avatar { border-bottom: 6px solid #ff4d6d; }
.player-side .avatar svg { width: 100%; height: 100%; }
.name-tag { font-size: 13px; font-weight: 700; color: #fff; background: #333; padding: 4px 14px; border-radius: 20px; border: 1px solid #555; }
.player-side.left .name-tag { background: #1e4d1e; border-color: #4caf50; }
.player-side.right .name-tag { background: #4d1e2a; border-color: #ff4d6d; }

/* 對話與 UI */
.dialog-box { background: rgba(15,10,5,0.95); border: 2px solid var(--wood); border-radius: 8px; padding: 20px; min-height: 100px; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.8); margin-top: 20px; }
.speaker-name { position: absolute; top: -16px; left: 20px; background: var(--gold); color: #111; font-size: 14px; font-weight: 900; padding: 4px 16px; border-radius: 4px; border: 1px solid #fff; }
.dialog-content { font-size: 16px; line-height: 1.8; color: #f0e8dd; margin-top: 8px; }

/* 按鈕 */
.objection-btn { display: block; margin: 20px auto; padding: 16px 48px; background: linear-gradient(135deg, #ff3050, #ff4d6d); color: #fff; border: 3px solid #fff; border-radius: 14px; font-size: 22px; font-weight: 900; cursor: pointer; box-shadow: 0 8px 24px rgba(255,48,80,0.5); transition: .15s; letter-spacing: 4px; font-family: "Impact", sans-serif; }
.objection-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 12px 30px rgba(255,48,80,0.8); }
.btn { padding: 14px 28px; border-radius: 8px; border: none; cursor: pointer; background: linear-gradient(135deg, var(--gold), #f7c948); color: #1a1008; font-weight: 900; font-size: 16px; transition: .15s; display: block; margin: 10px auto; width: 100%; max-width: 300px; font-family: inherit; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(240,165,0,0.5); }
.next-wrap { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }

/* 證物袋 */
.evidence-bag { margin-top: 20px; padding: 20px; background: rgba(10,5,2,0.95); border: 2px solid rgba(240,165,0,0.4); border-radius: 12px; animation: slideUp .3s ease; }
.evidence-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 10px; }
.evidence-card { padding: 12px 8px; text-align: center; background: rgba(255,240,220,0.05); border: 2px solid rgba(200,160,100,0.3); border-radius: 10px; cursor: pointer; transition: .15s; color: #e8dcc8; }
.evidence-card:hover { background: rgba(240,165,0,0.18); border-color: var(--gold); transform: translateY(-3px); }
.ev-icon { width: 44px; height: 44px; margin: 0 auto 8px; display: block; }
.ev-name { font-size: 12px; font-weight: 700; display: block; }

/* 審判長 UI */
.judge-ui { background: rgba(30,20,10,0.9); border: 2px solid var(--gold); border-radius: 12px; padding: 20px; margin-top: 20px; text-align: center; }
.judge-ui h3 { color: var(--gold); margin-bottom: 15px; font-size: 18px; }
.judge-choice { display: flex; gap: 20px; justify-content: center; }
.judge-choice button { flex: 1; max-width: 250px; padding: 16px; font-size: 16px; font-weight: 900; border-radius: 8px; cursor: pointer; border: none; transition: .2s; }
.btn-pass { background: #4caf50; color: #fff; border-bottom: 4px solid #2e7d32; }
.btn-pass:hover { background: #66bb6a; }
.btn-object { background: #ff4d6d; color: #fff; border-bottom: 4px solid #c62828; }
.btn-object:hover { background: #ff7088; }

/* 法官彈跳視窗 */
.judge-popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 2000; animation: fadeIn .2s; }
.judge-popup { background: linear-gradient(135deg, #2a1a0e, #120a06); border: 4px solid var(--gold); border-radius: 20px; padding: 40px; text-align: center; max-width: 500px; width: 90%; box-shadow: 0 0 50px rgba(240,165,0,0.4); transform: scale(0.8); animation: popIn .3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
.judge-popup .avatar { width: 130px; height: 130px; margin: 0 auto 20px; filter: drop-shadow(0 0 15px rgba(240,165,0,0.8)); }
.judge-popup h3 { color: var(--red); font-size: 28px; margin-bottom: 10px; font-weight: 900; text-shadow: 2px 2px 0 #000; }
.judge-popup p { font-size: 18px; line-height: 1.6; color: #ddd2c0; margin-bottom: 20px; }
@keyframes popIn { to { transform: scale(1); } }

/* 法警帶走動畫 */
.bailiff-scene { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.bailiff-drag { display: flex; align-items: flex-end; gap: 20px; animation: dragAway 3s forwards cubic-bezier(0.4, 0, 1, 1); }
.bailiff-svg { width: 120px; height: 120px; }
.player-svg { width: 100px; height: 100px; transform: rotate(20deg); filter: drop-shadow(0 0 10px rgba(255,0,0,0.5)); }
.bailiff-text { position: absolute; top: 30%; width: 100%; text-align: center; font-size: 40px; color: var(--red); font-weight: 900; text-shadow: 2px 2px 0 #000, 0 0 20px rgba(255,0,0,0.5); animation: blink .5s infinite; }
@keyframes dragAway {
  0% { transform: translateX(0); }
  100% { transform: translateX(100vw) translateY(100px); }
}

/* 其他 */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.shake { animation: shake .5s ease; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-12px); } 40%, 80% { transform: translateX(12px); } }
.feedback { margin-top: 18px; padding: 16px; border-radius: 8px; font-size: 15px; line-height: 1.8; border-left: 6px solid; }
.feedback.ok { background: rgba(76,175,80,0.15); border-color: #4caf50; color: #b2fab2; }
.feedback.ng { background: rgba(255,77,109,0.15); border-color: #ff4d6d; color: #ffb2b2; }
.feedback strong { display: block; margin-bottom: 6px; font-size: 18px; }

/* 計算機 */
.calc-container { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; background: rgba(20,10,5,0.9); border-radius: 12px; padding: 20px; border: 2px solid var(--wood); }
.calc-inputs { flex: 1; min-width: 280px; }
.calc-field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; margin-bottom: 14px; color: #ddd2c0; }
.calc-field input { padding: 11px 14px; border-radius: 8px; border: 1px solid rgba(200,160,100,0.3); background: rgba(0,0,0,0.4); color: #fff; font-size: 16px; }
.calculator { width: 280px; background: #2a2a2a; border-radius: 12px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 2px solid #444; }
.calc-display { background: #8a9a7a; color: #1a1a1a; font-family: "Courier New", monospace; font-size: 24px; text-align: right; padding: 12px; border-radius: 6px; margin-bottom: 16px; min-height: 55px; border: 2px solid #555; }
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.calc-btn { padding: 14px 0; font-size: 18px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; background: #555; color: #fff; box-shadow: 0 3px 0 #111; transition: .1s; }
.calc-btn:active { transform: translateY(3px); box-shadow: none; }
.calc-btn.op { background: #d88; box-shadow: 0 3px 0 #811; }
.calc-btn.eq { background: var(--gold); color: #111; box-shadow: 0 3px 0 #a60; }
.calc-btn.clr { background: #f55; box-shadow: 0 3px 0 #a00; }
.calc-btn.span-2 { grid-column: span 2; }
</style>
</head>

<script type="module">
const ALL_EVIDENCE = {
  // 正常證物
  e_prep: { id:'e_prep', name:'準備書(一)狀', icon:'i-doc', desc:'二審才提終止主張' },
  e_join: { id:'e_join', name:'參加書狀', icon:'i-gavel', desc:'水利局一審即參加' },

class Model {
  constructor() { 
    this.i=0; this.score=0; this.max=60; this.lives=3; this.bag=false; this.res=null; 
    this.logs=[]; this.role=null; this.scenes=[]; this.popup=null; this.bailiffAnim=false;
    this.judgeStep = 0; // 0: 原告說話, 1: 被告說話, 2: 裁決
  }
  get cur() { return this.scenes[this.i]; }
  open() { this.bag=true; this.res=null; }
  
  pick(id) {
    const s=this.cur; const ev = ALL_EVIDENCE[id];
    if (ev.joke) {
      this.lives--;
      this.bag = false;
      this.popup = ev.joke;
      if(this.lives<=0){ 
        this.res={ok:false, rev:'GameOver'}; 
        this.logs.push({ok:false, fb:'被趕出法庭'}); 
        this.bailiffAnim = true; 
      }
      else { this.res={ok:false, retry:true}; }
      return this.res;
    }
    if(s.ans.includes(id)){
      this.score+=10; this.bag=false; this.res={ok:true, fb:s.fbOk, line:s.success};
      this.logs.push({ok:true, fb:s.fbOk});
    } else {
      this.lives--;
      if(this.lives<=0){ this.bag=false; this.res={ok:false, fb:s.fbNg, rev:ALL_EVIDENCE[s.ans[0]].name}; this.logs.push({ok:false, fb:'生命耗盡'}); }
      else { this.res={ok:false, fb:s.fbNg, retry:true}; }
    }
    return this.res;
  }

  judgeNextStep() {
    if (this.judgeStep < 2) this.judgeStep++;
  }

  judgePick(userAns) {
    const s=this.cur;
    if (s.correct === userAns) {
      this.score += 10;
      this.res = { ok:true, fb: s.fbOk };
      this.logs.push({ok:true, fb:s.fbOk});
    } else {
      this.res = { ok:false, fb: s.fbNg };
      this.logs.push({ok:false, fb:'判斷錯誤'});
    }
  }

  calc(vals) {
    const s=this.cur; let allOk=true;
    const res = s.fields.map(f=>{ const ok=Number(vals[f.k])===f.a; if(!ok)allOk=false; return {...f, ok}; });
    if(allOk) this.score+=10;
    this.logs.push({ok:allOk, fb:allOk?'計算正確':'計算錯誤'});
    return {res, allOk};
  }
  next() { 
    if(this.i<this.scenes.length-1){ 
      this.i++; this.lives=3; this.bag=false; this.res=null; this.popup=null; this.bailiffAnim=false; this.judgeStep = 0;
    } 
  }
}

        h+=`<div class="next-wrap"><button class="btn" id="btnNext">${s.btn}</button></div>`;
      } else if (s.type === 'judge_trial') {
        let activeSpeaker = (m.judgeStep === 0) ? '水利局代理人' : (m.judgeStep === 1) ? '西瓜寮代理人' : '審判長';
        h+=this.renderCourt(m, activeSpeaker);
        
        if (m.judgeStep === 0) {
          h+=`<div class="dialog-box" style="border-color:var(--red);"><span class="speaker-name" style="background:var(--red);color:#fff;">原告(水利局)</span><div class="dialog-content">「${s.p_claim}」</div></div>`;
          h+=`<div class="next-wrap"><button class="btn" id="btnJudgeNext">聽取被告抗辯 →</button></div>`;
        } else if (m.judgeStep === 1) {
          h+=`<div class="dialog-box" style="border-color:var(--green);"><span class="speaker-name" style="background:var(--green);color:#fff;">被告(西瓜寮)</span><div class="dialog-content">「${s.d_claim}」</div></div>`;
          h+=`<div class="next-wrap"><button class="btn" id="btnJudgeNext">審判長裁決 →</button></div>`;
        } else if (m.judgeStep === 2) {
          h+=`<div class="judge-ui"><h3>💭 ${s.question}</h3>`;
          if (!m.res) {
            h+=`<div class="judge-choice">
              <button class="btn-pass" onclick="window.judgeDecide('p')">原告(水利局) 有理由</button>
              <button class="btn-object" onclick="window.judgeDecide('d')">被告(西瓜寮) 有理由</button>
            </div>`;
          } else {
            h+=`<div class="feedback ${m.res.ok?'ok':'ng'}" style="margin-top:20px;"><div class="feedback-text"><strong>${m.res.ok?'✔ 判斷正確！':'✘ 判斷錯誤！'}</strong>${m.res.fb}</div></div>`;
            h+=`<div class="next-wrap"><button class="btn" id="btnNext">下一章 →</button></div>`;
          }
          h+=`</div>`;
        }
      } else if (s.type === 'calc') {
        h+=this.renderCourt(m, '系統');
        h+=this.renderCalc(m, s);
      }
    } else {
      // 代理人模式
      if(s.type==='story'){
        h+=this.renderCourt(m, s.speaker);
        h+=`<div class="dialog-box"><span class="speaker-name">${s.speaker}</span><div class="dialog-content">${s.text}</div></div>`;
        h+=`<div class="next-wrap"><button class="btn" id="btnNext">${s.btn}</button></div>`;
      } else if(s.type==='trial'){
        h+=this.renderCourt(m, (!m.res||!m.res.ok) ? s.speaker : (m.role==='melon'?'西瓜寮代理人':'水利局代理人'));
        if(!m.res||!m.res.ok) h+=`<div class="dialog-box"><span class="speaker-name">${s.speaker}</span><div class="dialog-content">「${s.opp}」</div></div>`;
        else h+=`<div class="dialog-box" style="border-color:var(--green);"><span class="speaker-name" style="background:var(--green);color:#fff;">${m.role==='melon'?'西瓜寮代理人':'水利局代理人'}</span><div class="dialog-content">「${m.res.line}」</div></div>`;

        if(!m.res&&!m.bag) h+=`<div style="text-align:center;color:var(--gold);margin-top:20px;font-weight:900;font-size:18px;text-shadow:1px 1px 0 #000;">💭 ${s.challenge}</div><button class="objection-btn" id="btnObj">異議あり！</button>`;
        
        if(m.bag){
          const shuffledBag = [...s.bag].sort(() => Math.random() - 0.5);
          h+=`<div class="evidence-bag"><div class="bag-header">📁 法庭紀錄 — 請點擊證物提出</div><div class="evidence-grid">`;
          shuffledBag.forEach(id => {
            const e = ALL_EVIDENCE[id];
            h+=`<button class="evidence-card" data-id="${e.id}"><svg class="ev-icon" viewBox="0 0 16 16"><use href="#${e.icon}"/></svg><span class="ev-name">${e.name}</span></button>`; 
          });
          h+=`</div></div>`;
        }
        
        if(m.res){
          h+=`<div class="feedback ${m.res.ok?'ok':'ng'}"><div class="feedback-text"><strong>${m.res.ok?'✔ 提出成功！':(m.res.rev?'✘ 生命耗盡！':'✘ 無法說服法官！')}</strong>${m.res.fb||''}</div></div>`;
          if(m.res.ok||m.res.rev) h+=`<div class="next-wrap"><button class="btn" id="btnNext">下一章 →</button></div>`;
          else if (m.res.retry) h+=`<div class="next-wrap"><button class="btn" style="background:#ff4d6d;color:#fff;" id="btnRetry">重新選擇證物</button></div>`;
        }
      } else if(s.type==='calc'){
        h+=this.renderCourt(m, '系統');
        h+=this.renderCalc(m, s);
      }
    }

    // 法官吐槽彈窗 (覆蓋在畫面上)
    if (m.popup) {
      h += `
        <div class="judge-popup-overlay" onclick="window.closePopup()">
          <div class="judge-popup">
            <svg class="avatar" viewBox="0 0 16 16"><use href="#judge"/></svg>
            <h3>審判長動怒！</h3>
            <p>${m.popup}</p>
            <button class="btn" style="max-width:150px;">我知道錯了</button>
          </div>
        </div>`;
    }
    
    this.r.innerHTML=h;
  }

  renderCalc(m, s) {
    let h = `<div class="scene-body" style="margin:20px 0;"><p style="white-space: pre-wrap;">${s.q}</p></div>
      <div class="calc-container">
        <div class="calc-inputs">`;
    if(!m.res){
      s.fields.forEach(f=>{ h+=`<div class="calc-field"><span>${f.l}</span><input type="number" id="input-${f.k}" data-k="${f.k}" placeholder="輸入計算結果"></div>`; });
      h+=`<button class="btn" id="btnCalc" style="width:100%;">送出計算</button>`;
    } else {
      h+=`<div class="feedback ${m.res.allOk?'ok':'ng'}"><div class="feedback-text">`;
      m.res.res.forEach(r=>{ h+=`<div>${r.l}：${r.ok?'✔ 正確':'✘ 正確為 '+r.a.toLocaleString()}</div>`; });
      h+=`</div></div><div class="next-wrap"><button class="btn" id="btnNext">下一章 →</button></div>`;
    }
    h+=`</div>`;
    if(!m.res) {
      h+=`<div class="calculator"><div class="calc-display" id="calcDisplay">0</div><div class="calc-grid">
        <button class="calc-btn clr" data-val="C">C</button><button class="calc-btn op" data-val="(">(</button><button class="calc-btn op" data-val=")">)</button><button class="calc-btn op" data-val="/">÷</button>
        <button class="calc-btn" data-val="7">7</button><button class="calc-btn" data-val="8">8</button><button class="calc-btn" data-val="9">9</button><button class="calc-btn op" data-val="*">×</button>
        <button class="calc-btn" data-val="4">4</button><button class="calc-btn" data-val="5">5</button><button class="calc-btn" data-val="6">6</button><button class="calc-btn op" data-val="-">-</button>
        <button class="calc-btn" data-val="1">1</button><button class="calc-btn" data-val="2">2</button><button class="calc-btn" data-val="3">3</button><button class="calc-btn op" data-val="+">+</button>
        <button class="calc-btn span-2" data-val="0">0</button><button class="calc-btn" data-val=".">.</button><button class="calc-btn eq" data-val="=">=</button>
      </div></div>`;
    }
    h+=`</div>`;
    return h;
  }
}

class Ctrl {
  constructor(m, v) { this.m=m; this.v=v; this.calcStr = '0'; }
  start() { this.v.render(this.m); this.bind(); }
  
  bind() {
    const m=this.m;
    
    const nBtn=document.getElementById('btnNext');
    if(nBtn) nBtn.onclick=()=>{ m.next(); this.start(); };
    
    const jNext=document.getElementById('btnJudgeNext');
    if(jNext) jNext.onclick=()=>{ m.judgeNextStep(); this.start(); };
    
    const oBtn=document.getElementById('btnObj');
    if(oBtn) oBtn.onclick=()=>{ m.open(); this.start(); };
    
    const rBtn=document.getElementById('btnRetry');
    if(rBtn) rBtn.onclick=()=>{ m.res=null; m.open(); this.start(); };
    
    document.querySelectorAll('.evidence-card').forEach(c=>{
      c.onclick=()=>{
        const r=m.pick(c.dataset.id);
        if(r.ok) this.objAnim();
        else if(r.retry || r.rev) this.shake();
        this.start();
      };
    });

    // 計算機
    const display = document.getElementById('calcDisplay');
    if (display) {
      display.innerText = this.calcStr;
      document.querySelectorAll('.calc-btn').forEach(btn => {
        btn.onclick = () => {
          const val = btn.dataset.val;
          if (val === 'C') this.calcStr = '0';
          else if (val === '=') {
            try { this.calcStr = String(Math.round(eval(this.calcStr.replace(/×/g, '*').replace(/÷/g, '/')) * 100000) / 100000); } catch { this.calcStr = 'Error'; }
          } else {
            if (this.calcStr === '0' || this.calcStr === 'Error') this.calcStr = val;
            else this.calcStr += val;
          }
          display.innerText = this.calcStr;
        };
      });
    }

    const cBtn=document.getElementById('btnCalc');
    if(cBtn) cBtn.onclick=()=>{
      const vals={}; document.querySelectorAll('input').forEach(i=>vals[i.dataset.k]=i.value);
      m.res=m.calc(vals); this.calcStr = '0'; this.start();
    };
  }
  
  objAnim() {
    const ov=document.createElement('div'); ov.className='objection-overlay';
    ov.innerHTML='<div class="objection-text">異議あり！</div>';
    document.body.appendChild(ov); setTimeout(()=>ov.remove(), 1500);
  }
  shake() {
    const a=document.getElementById('app'); a.classList.add('shake'); setTimeout(()=>a.classList.remove('shake'), 500);
  }
}

const app = new Ctrl(new Model(), new View(document.getElementById('app')));

window.showRoleSelect = () => { app.m.role = 'select'; app.start(); };
window.selectRole = (role) => {
  app.m.role = role;
  app.m.i = 0;
  if (role === 'melon') app.m.scenes = [...SCENES_MELON, SCENE_CALC, SCENE_END];
  else if (role === 'water') app.m.scenes = [...SCENES_WATER, SCENE_CALC, SCENE_END];
  else if (role === 'judge') app.m.scenes = [...SCENES_JUDGE, SCENE_CALC, SCENE_END];
  app.start();
};
window.judgeDecide = (ans) => {
  app.m.judgePick(ans);
  app.start();
};
window.closePopup = () => {
  app.m.popup = null;
  app.start();
};

app.start();
</script>
</body>
