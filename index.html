<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西瓜寮裁判</title>
<style>
:root { --gold: #f0a500; --red: #ff4d6d; --green: #4caf50; --wood: #8b6f47; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
body {
  color: #e8e8e8; min-height: 100vh; padding: 24px;
  background-color: #1a1008;
  background-image: 
    repeating-linear-gradient(0deg, rgba(60,35,15,0.5) 0px, rgba(40,22,8,0.4) 8px, rgba(55,30,12,0.5) 16px),
    radial-gradient(ellipse 80% 40% at 50% 0%, rgba(240,165,0,0.15), transparent 70%),
    linear-gradient(180deg, #2a1a0e 0%, #1a1008 50%, #0f0805 100%);
  background-attachment: fixed;
}
.bg-decor { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bg-decor svg { position: absolute; opacity: 0.2; }
.lamp { top: 0; left: 50%; transform: translateX(-50%); opacity: 0.5 !important; }
.scale { bottom: 40px; right: 40px; }
.gavel { bottom: 40px; left: 40px; }

#app { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
.top-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.icon-40 { width: 40px; height: 40px; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
.progress-wrap { flex: 1; }
.progress-bar { height: 8px; background: #2a1a0e; border-radius: 4px; overflow: hidden; border: 1px solid rgba(240,165,0,0.2); }
.progress-fill { height: 100%; background: linear-gradient(90deg, #2d6a2d, #4caf50, #ff4d6d); transition: width .4s; }
.hud { display: flex; justify-content: space-between; font-size: 13px; color: #b8a080; margin-top: 8px; align-items: center; }
.score { color: var(--gold); font-weight: 700; }
.hp-heart { width: 20px; height: 20px; margin-left: 4px; transition: 0.3s; }
.hp-heart.lost { filter: grayscale(1) brightness(0.3); }

.scene {
  background: linear-gradient(135deg, rgba(60,40,20,0.85), rgba(35,22,12,0.9));
  border: 2px solid var(--wood); border-radius: 16px; padding: 32px;
  box-shadow: 0 12px 48px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,220,150,0.1);
  animation: fadeIn .4s ease; position: relative;
}
.scene::before { content: ''; position: absolute; inset: 8px; border: 1px solid rgba(240,165,0,0.15); border-radius: 10px; pointer-events: none; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.scene-title { font-size: 22px; color: var(--gold); margin-bottom: 20px; border-left: 4px solid var(--gold); padding-left: 14px; display: flex; align-items: center; gap: 10px; text-shadow: 0 2px 8px rgba(240,165,0,0.3); }
.icon-28 { width: 28px; height: 28px; }
.scene-body p { line-height: 1.95; margin-bottom: 12px; color: #ddd2c0; font-size: 15px; }

/* 身分選擇畫面 */
.start-screen { text-align: center; padding: 40px 20px; }
.start-title { font-size: 32px; color: var(--gold); font-weight: 900; margin-bottom: 10px; text-shadow: 0 4px 12px rgba(240,165,0,0.4); }
.start-sub { color: #b8a080; margin-bottom: 40px; }
.role-btn {
  display: block; width: 100%; max-width: 400px; margin: 16px auto; padding: 20px;
  background: rgba(255,240,220,0.05); border: 2px solid rgba(200,160,100,0.3); border-radius: 12px;
  color: #e8dcc8; cursor: pointer; transition: .2s; font-size: 18px; font-weight: bold;
}
.role-btn:hover { background: rgba(240,165,0,0.15); border-color: var(--gold); transform: scale(1.02); }
.role-btn.melon { border-color: var(--green); }
.role-btn.melon:hover { background: rgba(76,175,80,0.15); }
.role-btn.water { border-color: var(--red); }
.role-btn.water:hover { background: rgba(255,77,109,0.15); }

.courtroom { display: flex; gap: 16px; margin: 24px 0; align-items: flex-start; }
.avatar { width: 88px; height: 88px; flex-shrink: 0; border-radius: 12px; padding: 6px; background: rgba(60,20,30,0.8); border: 2px solid rgba(255,77,109,0.5); }
.avatar.player { background: rgba(30,77,30,0.8); border-color: rgba(76,175,80,0.6); }
.avatar svg { width: 100%; height: 100%; }
.dialog { flex: 1; padding: 16px 20px; background: rgba(40,15,20,0.92); border: 2px solid rgba(255,77,109,0.4); border-radius: 12px; font-size: 15px; line-height: 1.8; color: #f0e8dd; position: relative; min-height: 72px; }
.dialog.player { background: rgba(20,45,20,0.92); border-color: rgba(76,175,80,0.5); }
.speaker { display: block; font-size: 12px; color: #ff8899; font-weight: 700; margin-bottom: 6px; }
.dialog.player .speaker { color: #8fd9a8; }

.challenge-box { padding: 18px; margin: 20px 0; background: rgba(240,165,0,0.1); border-left: 4px solid var(--gold); border-radius: 8px; font-size: 15px; color: var(--gold); font-weight: 600; }
.objection-btn { display: block; margin: 20px auto; padding: 18px 48px; background: linear-gradient(135deg, #ff3050, #ff4d6d); color: #fff; border: 3px solid #fff; border-radius: 14px; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 8px 24px rgba(255,48,80,0.5); transition: .15s; letter-spacing: 3px; }
.objection-btn:hover { transform: translateY(-3px) scale(1.03); }

.evidence-bag { margin-top: 20px; padding: 18px; background: rgba(25,15,10,0.95); border: 2px solid rgba(240,165,0,0.4); border-radius: 12px; animation: slideUp .3s ease; }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.bag-header { font-size: 14px; color: var(--gold); font-weight: 700; margin-bottom: 14px; }
.evidence-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.evidence-card { padding: 12px 8px; text-align: center; background: rgba(255,240,220,0.05); border: 2px solid rgba(200,160,100,0.3); border-radius: 10px; cursor: pointer; transition: .15s; color: #e8dcc8; }
.evidence-card:hover { background: rgba(240,165,0,0.18); border-color: var(--gold); transform: translateY(-3px); }
.ev-icon { width: 44px; height: 44px; margin: 0 auto 8px; display: block; }
.ev-name { font-size: 12px; font-weight: 700; display: block; }
.ev-desc { font-size: 10px; color: #8a7a60; margin-top: 4px; display: block; }

.feedback { margin-top: 18px; padding: 16px 18px; border-radius: 10px; font-size: 14px; line-height: 1.8; display: flex; gap: 12px; align-items: flex-start; }
.feedback.ok { background: rgba(76,175,80,0.2); border: 2px solid rgba(76,175,80,0.5); }
.feedback.ng { background: rgba(255,77,109,0.2); border: 2px solid rgba(255,77,109,0.5); }
.feedback-text strong { display: block; margin-bottom: 6px; font-size: 15px; color: var(--gold); }

.calc-field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; margin-bottom: 14px; color: #ddd2c0; }
.calc-field input { padding: 11px 14px; border-radius: 8px; border: 1px solid rgba(200,160,100,0.3); background: rgba(0,0,0,0.4); color: #fff; font-size: 15px; }

.btn { padding: 13px 28px; border-radius: 10px; border: none; cursor: pointer; background: linear-gradient(135deg, var(--gold), #f7c948); color: #1a1008; font-weight: 700; font-size: 15px; transition: .15s; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(240,165,0,0.5); }
.next-wrap { text-align: right; margin-top: 20px; }

.objection-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; pointer-events: none; }
.objection-text { font-size: clamp(60px, 15vw, 140px); font-weight: 900; color: #fff; text-shadow: 6px 6px 0 #ff3050, 12px 12px 0 #1a1008; transform: rotate(-8deg); animation: boom .8s cubic-bezier(0.2, 1.4, 0.4, 1); }
@keyframes boom { 0% { transform: rotate(-8deg) scale(0); } 50% { transform: rotate(-8deg) scale(1.5); } 100% { transform: rotate(-8deg) scale(1); } }

.shake { animation: shake .5s ease; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-12px); } 40%, 80% { transform: translateX(12px); } }

.end .verdict-line { font-size: 16px; line-height: 1.95; margin: 18px 0; padding: 18px; background: rgba(240,165,0,0.15); border-radius: 10px; border: 1px solid rgba(240,165,0,0.3); }
.end .verdict-line strong { color: var(--gold); }
.end h2 { color: var(--gold); margin: 22px 0 8px; display: flex; align-items: center; gap: 10px; }
.score-line { font-size: 18px; color: var(--gold); margin: 14px 0; font-weight: 700; }
.answer-log { list-style: none; margin: 14px 0 22px; }
.answer-log li { padding: 10px 0; border-bottom: 1px solid rgba(200,160,100,0.15); font-size: 13px; line-height: 1.6; }
</style>
</head>

<script type="module">
const EVIDENCE = {
  e1: { id:'e1', name:'招標須知第8條', icon:'i-book', desc:'機關終止契約條款' },
  e2: { id:'e2', name:'準備書（一）狀', icon:'i-doc', desc:'二審才提終止主張' },
  e3: { id:'e3', name:'參加書狀', icon:'i-gavel', desc:'水利局第一審已參加' },
  e4: { id:'e4', name:'第1381號判決', icon:'i-scale', desc:'認定未善意受讓' },
  e5: { id:'e5', name:'言詞辯論筆錄', icon:'i-doc', desc:'已連續參與3次' },
  e6: { id:'e6', name:'市價自認紀錄', icon:'i-money', desc:'275元/m³' }
};

const SCENES = [
  { type:'story', title:'第一章・開庭', paras:['臺灣高等法院臺中分院民事第四庭。','審判長：本件上訴人西瓜寮與水利局間損害賠償事件，開始言詞辯論。'], btn:'開始陳述' },
  {
    type:'trial', title:'第二章・程序之門',
    opp:'審判長，我方依招標須知第8條終止契約，屬合法行使權利。',
    challenge:'對造突襲提出終止契約。找出證明此主張「二審才提出」的證物！',

  },
  {

    challenge:'對造說自己沒防禦到。找出證明他們「第一審就參與」的證物！',
    ans:['e3'], success:'異議あり！對造第一審即參加訴訟，本得獨立上訴，不得主張裁判不當！',
    fbOk:'正確！水利局於第一審即參加訴訟，且依法可獨立上訴卻未提，應受判決拘束。',

  },
  {
    type:'trial', title:'第四章・所有權之辯',
    opp:'土石已交付，上訴人已善意受讓取得所有權，本件無給付不能。',
    challenge:'對造主張善意受讓。找出已經打臉過這一點的證物！',
    ans:['e4'], success:'異議あり！第1381號確定判決已認定未善意受讓！',
    fbOk:'正確！第1381號判決明確認定未善意受讓，水利局受拘束。',
    fbNg:'要找的是關於「所有權歸屬」的證據。'
  },
  {
    type:'trial', title:'第五章・瑕疵之責',
    opp:'上訴人未積極應訴，惡意撤回上訴侵蝕國庫，請求屬權利濫用。',
    challenge:'對造指控未應訴。找出證明上訴人「有在開庭」的證物！',
    ans:['e5'], success:'異議あり！上訴人已連續參與3次言詞辯論並提抗辯！',
    fbOk:'正確！卷證顯示上訴人已盡力應訴，撤回上訴屬合法權利行使。',

    fields: [ {k:'m', l:'市價總額', a:153785775, h:'275 × 559221'}, {k:'f', l:'清運費總額', a:26562998, h:'47.5 × 559221'}, {k:'t', l:'賠償金額', a:127222777, h:'市價 − 清運費'} ]

class Model {
  constructor() { this.i=0; this.score=0; this.max=60; this.lives=3; this.bag=false; this.res=null; this.logs=[]; this.role=null; }
  get cur() { return SCENES[this.i]; }
  open() { this.bag=true; this.res=null; }
  pick(id) {
    const s=this.cur;
    if(s.ans.includes(id)){
      this.score+=10; this.bag=false; this.res={ok:true, fb:s.fbOk, line:s.success};
      this.logs.push({ok:true, fb:s.fbOk});
    } else {
      this.lives--;
      if(this.lives<=0){ this.bag=false; this.res={ok:false, fb:s.fbNg, rev:EVIDENCE[s.ans[0]].name}; this.logs.push({ok:false, fb:'生命耗盡'}); }
      else { this.res={ok:false, fb:s.fbNg, retry:true}; }
    }
    return this.res;
  }
  calc(vals) {
    const s=this.cur; let allOk=true;
    const res = s.fields.map(f=>{ const ok=Number(vals[f.k])===f.a; if(!ok)allOk=false; return {...f, ok}; });
    if(allOk) this.score+=10;
    this.logs.push({ok:allOk, fb:allOk?'計算正確':'計算錯誤'});
    return {res, allOk};
  }
  next() { if(this.i<SCENES.length-1){ this.i++; this.lives=3; this.bag=false; this.res=null; } }
}

class View {
  constructor(r) { this.r=r; }
  top(m) {
    const hs=[0,1,2].map(i=>`<svg class="hp-heart ${i>=m.lives?'lost':''}" viewBox="0 0 16 16"><use href="#h"/></svg>`).join('');
    return `<div class="top-bar"><svg class="icon-40" viewBox="0 0 16 16"><use href="#wm"/></svg>
      <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${(m.i/SCENES.length)*100}%"></div></div>
      <div class="hud"><span>第 ${m.i+1} 章</span><span>${hs}</span><span class="score">得分: ${m.score}</span></div></div></div>`;
  }
  
  renderStart() {
    this.r.innerHTML = `
      <div class="scene start-screen">
        <div class="start-title">司法的重量：西瓜寮土石案</div>
        <div class="start-sub">請選擇你的身分，進入法庭辯論</div>
        <button class="role-btn melon" onclick="window.selectRole('melon')">🟩 我是西瓜寮訴訟代理人<br><small style="font-size:13px;color:#aaa;">(目標：找出破綻，贏得賠償)</small></button>
        <button class="role-btn water" onclick="window.selectRole('water')">🟥 我是水利局訴訟代理人<br><small style="font-size:13px;color:#aaa;">(目標：模擬防守，理解法官邏輯)</small></button>
      </div>`;
  }

  render(m) {
    if(!m.role) { this.renderStart(); return; }
    const s=m.cur; let h=this.top(m);
    
    // 根據身分設定角色名字與頭像
    const isMelon = m.role === 'melon';
    const pName = isMelon ? '西瓜寮代理人' : '水利局代理人';
    const oName = isMelon ? '水利局代理人' : '西瓜寮代理人';
    const pIcon = isMelon ? 'ply' : 'opp';
    const oIcon = isMelon ? 'opp' : 'ply';

    if(s.type==='end'){
      h+=`<div class="scene end"><h1 class="scene-title"><svg class="icon-28" viewBox="0 0 16 16"><use href="#wmr"/></svg>判決宣示</h1>
        <p class="verdict-line">水利局應給付西瓜寮 <strong>1 億 2,722 萬 2,777 元</strong>及法定利息。</p>
        <h2>總得分：${m.score} / ${m.max}</h2>
        <ul class="answer-log">${m.logs.map(l=>`<li class="${l.ok?'ok':'ng'}">${l.ok?'✔':'✘'} ${l.fb}</li>`).join('')}</ul>
        <button class="btn" onclick="location.reload()">重新審判</button></div>`;
      this.r.innerHTML=h; return;
    }
    
    h+=`<div class="scene"><h1 class="scene-title"><svg class="icon-28" viewBox="0 0 16 16"><use href="#wmr"/></svg>${s.title}</h1>`;
    if(s.type==='story'){
      h+=`<div class="scene-body">${s.paras.map(p=>`<p>${p}</p>`).join('')}</div><div class="next-wrap"><button class="btn" id="btnNext">${s.btn}</button></div>`;
    } else if(s.type==='trial'){
      if(!m.res||!m.res.ok) h+=`<div class="courtroom"><div class="avatar"><svg viewBox="0 0 16 16"><use href="#${oIcon}"/></svg></div><div class="dialog"><span class="speaker">${oName}</span>${s.opp}</div></div>`;
      else h+=`<div class="courtroom"><div class="avatar player"><svg viewBox="0 0 16 16"><use href="#${pIcon}"/></svg></div><div class="dialog player"><span class="speaker">${pName}</span>${m.res.line}</div></div>`;
      
      if(!m.res&&!m.bag) h+=`<div class="challenge-box">💭 ${s.challenge}</div><button class="objection-btn" id="btnObj">異議あり！</button>`;
      if(m.bag){
        h+=`<div class="evidence-bag"><div class="bag-header">📁 法庭紀錄 — 選擇證物</div><div class="evidence-grid">`;
        Object.values(EVIDENCE).forEach(e=>{ h+=`<button class="evidence-card" data-id="${e.id}"><svg class="ev-icon" viewBox="0 0 16 16"><use href="#${e.icon}"/></svg><span class="ev-name">${e.name}</span><span class="ev-desc">${e.desc}</span></button>`; });
        h+=`</div></div>`;
      }
      if(m.res){
        h+=`<div class="feedback ${m.res.ok?'ok':'ng'}"><div class="feedback-text"><strong>${m.res.ok?'✔ 反駁成功！':(m.res.rev?'✘ 生命耗盡！正確解答為「'+m.res.rev+'」':'✘ 無法推翻對造！')}</strong>${m.res.fb}</div></div>`;
        if(m.res.ok||m.res.rev) h+=`<div class="next-wrap"><button class="btn" id="btnNext">下一章 →</button></div>`;
      }
    } else if(s.type==='calc'){
      h+=`<div class="scene-body"><p>${s.q}</p></div>`;
      if(!m.res){
        s.fields.forEach(f=>{ h+=`<div class="calc-field"><span>${f.l} (${f.h})</span><input type="number" data-k="${f.k}"></div>`; });
        h+=`<button class="btn" id="btnCalc">送出計算</button>`;
      } else {
        h+=`<div class="feedback ${m.res.allOk?'ok':'ng'}"><div class="feedback-text">`;
        m.res.res.forEach(r=>{ h+=`<div>${r.l}：${r.ok?'✔':'✘ 正確為 '+r.a}</div>`; });
        h+=`</div></div><div class="next-wrap"><button class="btn" id="btnNext">下一章 →</button></div>`;
      }
    }
    h+=`</div>`; this.r.innerHTML=h;
  }
}

class Ctrl {
  constructor(m, v) { this.m=m; this.v=v; }
  start() { this.v.render(this.m); this.bind(); }
  bind() {
    const m=this.m, s=m.cur;
    const nBtn=document.getElementById('btnNext');
    if(nBtn) nBtn.onclick=()=>{ m.next(); this.start(); };
    const oBtn=document.getElementById('btnObj');
    if(oBtn) oBtn.onclick=()=>{ m.open(); this.start(); };
    
    document.querySelectorAll('.evidence-card').forEach(c=>{
      c.onclick=()=>{
        const r=m.pick(c.dataset.id);
        if(r.ok) this.objAnim();
        else if(r.retry) this.shake();
        this.start();
      };
    });

    const cBtn=document.getElementById('btnCalc');
    if(cBtn) cBtn.onclick=()=>{
      const vals={}; document.querySelectorAll('input').forEach(i=>vals[i.dataset.k]=i.value);
      m.res=m.calc(vals); this.start();
    };
  }
  objAnim() {
    const ov=document.createElement('div'); ov.className='objection-overlay';
    ov.innerHTML='<div class="objection-text">異議あり！</div>';
    document.body.appendChild(ov); setTimeout(()=>ov.remove(), 1500);
  }
  shake() {
    const a=document.getElementById('app'); a.classList.add('shake');
    setTimeout(()=>a.classList.remove('shake'), 500);
  }
}

const app = new Ctrl(new Model(), new View(document.getElementById('app')));

// 綁定身分選擇的全域函數
window.selectRole = (role) => {
  app.m.role = role;
  app.start();
};

app.start();
</script>
</body>
</html>
