<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>司法的重量：西瓜寮土石案</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* ========== 裁判所背景 ========== */
body {
  font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color: #e8e8e8; min-height: 100vh; padding: 24px;
  background-color: #1a1008;
  background-image:
    /* 木紋細紋 */
    repeating-linear-gradient(90deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0) 2px, rgba(255,255,255,0.02) 3px, rgba(0,0,0,0) 5px),
    /* 水平木紋 */
    repeating-linear-gradient(0deg, rgba(60,35,15,0.5) 0px, rgba(40,22,8,0.4) 8px, rgba(55,30,12,0.5) 16px),
    /* 頂部暖燈光暈 */
    radial-gradient(ellipse 80% 40% at 50% 0%, rgba(240,165,0,0.18), transparent 70%),
    /* 底部陰影 */
    radial-gradient(ellipse 100% 50% at 50% 100%, rgba(0,0,0,0.6), transparent 70%),
    /* 主木質漸層 */
    linear-gradient(180deg, #2a1a0e 0%, #1a1008 50%, #0f0805 100%);
  background-attachment: fixed;
  position: relative;
}

/* 背景裝飾 SVG 圖層 */
.bg-decor {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  overflow: hidden;
}
.bg-decor svg { position: absolute; opacity: 0.4; }
.decor-lamp { top: 0; left: 50%; transform: translateX(-50%); }
.decor-scale { bottom: 40px; right: 40px; opacity: 0.15; }
.decor-gavel { bottom: 40px; left: 40px; opacity: 0.15; }
.decor-books-l { top: 20%; left: 0; opacity: 0.2; }
.decor-books-r { top: 20%; right: 0; opacity: 0.2; transform: scaleX(-1); }

/* ========== 主容器 ========== */
#app { max-width: 820px; margin: 0 auto; position: relative; z-index: 1; }

/* ========== 進度條 + 西瓜 ========== */
.top-bar {
  display: flex; align-items: center; gap: 14px; margin-bottom: 12px;
}
.watermelon-icon { width: 40px; height: 40px; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
.progress-wrap { flex: 1; }
.progress-bar {
  height: 8px; background: #2a1a0e; border-radius: 4px; overflow: hidden;
  border: 1px solid rgba(240,165,0,0.2);
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #2d6a2d, #4caf50, #ff4d6d);
  transition: width .4s; border-radius: 4px;
  box-shadow: 0 0 8px rgba(255,77,109,0.5);
}
.hud {
  display: flex; justify-content: space-between; font-size: 13px;
  color: #b8a080; margin-top: 8px;
}
.hud .score { color: #f7c948; font-weight: 700; }

/* ========== 場景卡片（羊皮紙/木質風格） ========== */
.scene {
  background:
    linear-gradient(135deg, rgba(60,40,20,0.85), rgba(35,22,12,0.9));
  border: 2px solid #8b6f47;
  border-radius: 16px; padding: 32px;
  box-shadow:
    0 0 0 1px rgba(240,165,0,0.15),
    0 12px 48px rgba(0,0,0,0.7),
    inset 0 1px 0 rgba(255,220,150,0.1);
  animation: fadeIn .4s ease;
  position: relative;
}
.scene::before {
  content: '';
  position: absolute; inset: 8px;
  border: 1px solid rgba(240,165,0,0.15);
  border-radius: 10px; pointer-events: none;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.scene-title {
  font-size: 22px; color: #f7c948; margin-bottom: 20px;
  border-left: 4px solid #f0a500; padding-left: 14px;
  display: flex; align-items: center; gap: 10px;
  text-shadow: 0 2px 8px rgba(240,165,0,0.3);
}
.scene-title .watermelon-mini { width: 28px; height: 28px; flex-shrink: 0; }

.scene-body p {
  line-height: 1.95; margin-bottom: 12px; color: #ddd2c0; font-size: 15px;
}

/* ========== 問題區 ========== */
.question {
  margin: 24px 0 16px; padding: 16px 18px;
  background: linear-gradient(135deg, rgba(240,165,0,0.12), rgba(240,165,0,0.05));
  border-left: 3px solid #f0a500; border-radius: 6px;
  font-weight: 600; color: #f7c948; font-size: 15px;
}

/* ========== 選項 ========== */
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  text-align: left; padding: 15px 18px; cursor: pointer;
  background: rgba(255,240,220,0.05); color: #e8dcc8;
  border: 1px solid rgba(200,160,100,0.25); border-radius: 10px;
  font-size: 14px; transition: all .2s; font-family: inherit;
}
.option:hover:not(:disabled) {
  background: rgba(240,165,0,0.15); border-color: #f0a500;
  transform: translateX(4px);
}
.option:disabled { cursor: default; opacity: .65; }
.option.correct {
  background: linear-gradient(135deg, rgba(76,175,80,0.25), rgba(76,175,80,0.1));
  border-color: #4caf50; color: #c8f0c8;
}
.option.wrong {
  background: linear-gradient(135deg, rgba(255,77,109,0.25), rgba(255,77,109,0.1));
  border-color: #ff4d6d; color: #ffd0d8;
}

/* ========== 計算題 ========== */
.calc-fields { display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }
.calc-field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #ddd2c0; }
.calc-field small { color: #8a7a60; }
.calc-field input {
  padding: 11px 14px; border-radius: 8px;
  border: 1px solid rgba(200,160,100,0.3);
  background: rgba(0,0,0,0.4); color: #fff; font-size: 15px;
  font-family: inherit;
}
.calc-field input:focus { outline: none; border-color: #f0a500; box-shadow: 0 0 0 3px rgba(240,165,0,0.15); }

/* ========== 按鈕 ========== */
.submit-calc, .next-btn, .restart-btn {
  padding: 13px 28px; border-radius: 10px; border: none; cursor: pointer;
  background: linear-gradient(135deg, #f0a500, #f7c948);
  color: #1a1008; font-weight: 700; font-size: 15px;
  transition: all .15s; font-family: inherit;
  box-shadow: 0 4px 12px rgba(240,165,0,0.3);
}
.submit-calc:hover:not(:disabled), .next-btn:hover:not(:disabled), .restart-btn:hover {
  transform: translateY(-2px); box-shadow: 0 6px 20px rgba(240,165,0,0.5);
}
.next-btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }

/* ========== 回饋 ========== */
.feedback {
  margin-top: 18px; padding: 16px; border-radius: 10px;
  font-size: 14px; line-height: 1.8;
  display: flex; gap: 12px; align-items: flex-start;
}
.feedback.ok {
  background: linear-gradient(135deg, rgba(76,175,80,0.15), rgba(76,175,80,0.05));
  border: 1px solid rgba(76,175,80,0.5);
}
.feedback.ng {
  background: linear-gradient(135deg, rgba(255,77,109,0.15), rgba(255,77,109,0.05));
  border: 1px solid rgba(255,77,109,0.5);
}
.feedback .melon { width: 32px; height: 32px; flex-shrink: 0; }
.feedback-text { flex: 1; }

.next-wrap { text-align: right; margin-top: 24px; }

/* ========== 結局 ========== */
.end .verdict-line {
  font-size: 16px; line-height: 1.95; margin: 18px 0; padding: 18px;
  background: linear-gradient(135deg, rgba(240,165,0,0.15), rgba(240,165,0,0.05));
  border-radius: 10px; border: 1px solid rgba(240,165,0,0.3);
}
.end .verdict-line strong { color: #f7c948; }
.end h2 { color: #f7c948; margin: 22px 0 8px; display: flex; align-items: center; gap: 10px; }
.end h2 .watermelon-mini { width: 32px; height: 32px; }
.score-line { font-size: 18px; color: #f0a500; margin: 14px 0; font-weight: 700; }
.answer-log { list-style: none; margin: 14px 0 22px; }
.answer-log li {
  padding: 10px 0; border-bottom: 1px solid rgba(200,160,100,0.15);
  font-size: 13px; line-height: 1.6;
}
.answer-log li.ok { color: #8fd9a8; }
.answer-log li.ng { color: #ff9caa; }

/* 答對時的西瓜彈跳 */
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.feedback.ok .melon { animation: bounce .6s ease infinite; }
</style>

    paragraphs: [
      '民國91年，經濟部水利署第三河川局公開標售大安溪河床堆置的土石堆。',
      '西瓜寮開發股份有限公司以總價 7,760 萬元得標，並簽立土石標售契約，約定土石總數量 85 萬 9,221 立方公尺。',

    ],
    question: '你是二審承審法官。這個案件的核心法律問題是什麼？',
    options: [
      { text: '水利局標售程序是否合法', correct: false, feedback: '程序合法性並非本件主爭點，標售本身有效。' },

/* ===================== 輔助：取得 SVG 圖示 ===================== */
function melonSVG(id = 'watermelon', cls = '') {
  return `<svg class="${cls}" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><use href="#${id}"/></svg>`;
}

/* ===================== MODEL：狀態管理 ===================== */
class GameModel {
  constructor(scenes) {
    this.scenes = scenes;
    this.index = 0;
    this.score = 0;
    this.maxScore = scenes.length * 10;
    this.answers = [];
  }
  get current() { return this.scenes[this.index]; }
  get isLast() { return this.index === this.scenes.length - 1; }
  get progress() { return (this.index / this.scenes.length) * 100; }

  submitChoice(optionIndex) {
    const scene = this.current;
    const opt = scene.options[optionIndex];
    if (opt.correct) this.score += 10;
    this.answers.push({ scene: scene.id, correct: opt.correct, feedback: opt.feedback });
    return opt;
  }

  submitCalc(values) {
    const scene = this.current;
    let allCorrect = true;
    const results = scene.fields.map(f => {
      const ok = Number(values[f.key]) === f.answer;
      if (!ok) allCorrect = false;
      return { ...f, ok, userValue: values[f.key] };
    });
    if (allCorrect) this.score += 10;
    this.answers.push({
      scene: scene.id,
      correct: allCorrect,
      feedback: allCorrect ? '計算正確！' : '部分計算有誤。'
    });
    return results;
  }

  next() { if (!this.isLast) this.index++; }

  getRating() {
    const pct = this.score / this.maxScore;
    if (pct === 1) return { title: '明察秋毫・承審法官', desc: '你完全掌握本件爭點與法律適用，判決精準。' };
    if (pct >= 0.7) return { title: '穩健斷案・資深法官', desc: '大部分爭點判斷正確，少數細節可再精進。' };
    if (pct >= 0.4) return { title: '尚需磨練・學習中', desc: '掌握部分爭點，建議重讀判決理由。' };
    return { title: '初入法門・見習生', desc: '再讀一次判決，你會發現更多細節。' };
  }
}

/* ===================== VIEW：渲染 ===================== */
class GameView {
  constructor(root) { this.root = root; }

  renderTopBar(model) {
    return `
      <div class="top-bar">
        ${melonSVG('watermelon', 'watermelon-icon')}
        <div class="progress-wrap">
          <div class="progress-bar">
            <div class="progress-fill" style="width:${model.progress}%"></div>
          </div>
          <div class="hud">
            <span>第 ${model.index + 1} / ${model.scenes.length} 章</span>
            <span class="score">得分：${model.score} / ${model.maxScore}</span>
          </div>
        </div>
      </div>`;
  }

  renderScene(model) {
    const scene = model.current;
    const body = scene.paragraphs.map(p => `<p>${p}</p>`).join('');
    let interactive = '';

    if (scene.type === 'story') {
      interactive = `
        <div class="question">${scene.question}</div>
        <div class="options">
          ${scene.options.map((o, i) =>
            `<button class="option" data-index="${i}">${String.fromCharCode(65 + i)}. ${o.text}</button>`
          ).join('')}
        </div>
        <div class="feedback" id="feedback"></div>`;
    } else if (scene.type === 'calc') {
      interactive = `
        <div class="question">${scene.question}</div>
        <div class="calc-fields">
          ${scene.fields.map(f => `
            <label class="calc-field">
              <span>${f.label} <small>（提示：${f.hint}）</small></span>
              <input type="number" data-key="${f.key}" placeholder="輸入金額">
            </label>`).join('')}
        </div>
        <button class="submit-calc">送出計算</button>
        <div class="feedback" id="feedback"></div>`;
    }

    return `
      ${this.renderTopBar(model)}
      <div class="scene">
        <h1 class="scene-title">${melonSVG('watermelon-round', 'watermelon-mini')}${scene.title}</h1>
        <div class="scene-body">${body}</div>
        ${interactive}
        <div class="next-wrap">
          <button class="next-btn" id="nextBtn" disabled>下一章 →</button>
        </div>
      </div>`;
  }

  renderEnd(model) {
    const rating = model.getRating();
    const log = model.answers.map((a, i) =>
      `<li class="${a.correct ? 'ok' : 'ng'}">
        第 ${i + 1} 關：${a.correct ? '✔ 正確' : '✘ 待改進'} — ${a.feedback}
      </li>`).join('');
    return `
      <div class="scene end">
        <h1 class="scene-title">${melonSVG('watermelon-round', 'watermelon-mini')}判決宣示</h1>
        <p class="verdict-line">水利局應給付西瓜寮 <strong>1 億 2,722 萬 2,777 元</strong>，及自 99 年 6 月 8 日起至清償日止，按年息 5% 計算之利息。</p>
        <h2>${melonSVG('watermelon', 'watermelon-mini')}你的評價：${rating.title}</h2>
        <p>${rating.desc}</p>
        <p class="score-line">總得分：${model.score} / ${model.maxScore}</p>
        <h3>審判紀錄</h3>
        <ul class="answer-log">${log}</ul>
        <button class="restart-btn" onclick="location.reload()">重新審判</button>
      </div>`;
  }

  showFeedback(html, isCorrect) {
    const el = document.getElementById('feedback');
    if (!el) return;
    el.innerHTML = `
      ${melonSVG(isCorrect ? 'watermelon' : 'watermelon-round', 'melon')}
      <div class="feedback-text">${html}</div>`;
    el.className = 'feedback ' + (isCorrect ? 'ok' : 'ng');
    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn) nextBtn.disabled = false;
  }
}

/* ===================== CONTROLLER：流程控制 ===================== */
class GameController {
  constructor(model, view) {
    this.model = model;
    this.view = view;
  }
  start() { this.render(); }

  render() {
    if (this.model.index >= this.model.scenes.length) {
      this.view.root.innerHTML = this.view.renderEnd(this.model);
      return;
    }
    this.view.root.innerHTML = this.view.renderScene(this.model);
    this.bind();
  }

  bind() {
    const scene = this.model.current;
    const nextBtn = document.getElementById('nextBtn');

    if (scene.type === 'story') {
      document.querySelectorAll('.option').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.option').forEach(b => b.disabled = true);
          const idx = Number(btn.dataset.index);
          const opt = this.model.submitChoice(idx);
          const feedback = `<strong>${opt.correct ? '✔ 正確' : '✘ 不正確'}</strong><br>${opt.feedback}`;
          this.view.showFeedback(feedback, opt.correct);
          btn.classList.add(opt.correct ? 'correct' : 'wrong');
        });
      });
    } else if (scene.type === 'calc') {
      document.querySelector('.submit-calc').addEventListener('click', () => {
        const values = {};
        document.querySelectorAll('.calc-field input').forEach(inp => {
          values[inp.dataset.key] = inp.value;
        });
        const results = this.model.submitCalc(values);
        const allOk = results.every(r => r.ok);
        const html = results.map(r =>
          `<div>${r.label}：${r.ok ? '✔ 正確' : `✘ 正確答案為 ${r.answer.toLocaleString()} 元`}</div>`
        ).join('');
        this.view.showFeedback(html, allOk);
        document.querySelector('.submit-calc').disabled = true;
      });
    }

    nextBtn.addEventListener('click', () => {
      this.model.next();
      this.render();
    });
  }
}

/* ===================== 啟動 ===================== */
const root = document.getElementById('app');
const model = new GameModel(SCENES);
const view = new GameView(root);
const controller = new GameController(model, view);
controller.start();
</script>
