<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>法庭攻防與土石清運計算系統</title>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    
    /* 1. 合議庭區：使用 align-items: flex-end 底部對齊，解決桌子懸空問題 */
    .judicial-bench {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 15px;
      margin-bottom: 25px;
      background: #1a1a1a;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .judicial-bench img {
      max-height: 160px;
      object-fit: contain;
    }

    /* 2. 訴訟代理人區 */
    .lawyer-section {
      display: flex;
      justify-content: space-around;
      margin-bottom: 25px;
    }
    .lawyer-box {
      background: #1a1a1a;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .lawyer-box img {
      max-height: 200px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .lawyer-box img:active {
      transform: scale(0.95);
    }
    .tip {
      font-size: 12px;
      color: #aaa;
      margin-top: 5px;
    }

    /* 3. 數據表格與按鈕樣式 */
    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 60%;
      background: #222;
    }
    th, td {
      border: 1px solid #444;
      padding: 12px;
    }
    th {
      background: #333;
    }
    button {
      padding: 10px 20px;
      background-color: #d9534f;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #c9302c;
    }

    /* 4. 彈跳視窗 (Modal) 樣式 */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.8);
    }
    .modal-content {
      background-color: #2c2c2c;
      margin: 10% auto;
      padding: 25px;
      border: 1px solid #555;
      width: 320px;
      border-radius: 8px;
      text-align: left;
    }
    .modal-content label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
    }
    .modal-content input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
      background: #111;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1>法庭攻防模擬系統</h1>

  <!-- 合議庭畫面：左陪席、審判長、右陪席 (底部對齊) -->
  <div class="judicial-bench">
    <img src="judge_left.png" alt="左陪席法官">
    <img src="judge_chief.png" alt="審判長">
    <img src="judge_right.png" alt="右陪席法官">
  </div>

  <!-- 訴訟代理人區 (點擊圖片可測試異議指向動畫) -->
  <div class="lawyer-section">
    <div class="lawyer-box">
      <h3>上訴人：西瓜寮</h3>
      <img id="melon-avatar" src="lawyer_melon.png" alt="西瓜寮代理人" onclick="triggerObjection('melon')">
      <div class="tip">點擊角色可發動異議動畫</div>
    </div>
    <div class="lawyer-box">
      <h3>被上訴人：水利局</h3>
      <img id="water-avatar" src="lawyer_water.png" alt="水利局代理人" onclick="triggerObjection('water')">
      <div class="tip">點擊角色可發動異議動畫</div>
    </div>
  </div>

  <hr style="border-color: #444; width: 80%;">

  <!-- 數據申報表格 -->
  <h2>土石清運與金額申報表</h2>
  <table>
    <tr>
      <th>項目</th>
      <th>數量 (立方公尺)</th>
      <th>金額 (新台幣)</th>
    </tr>
    <tr>
      <td>土石體積與清運費計算</td>
      <td id="result-volume">0</td>
      <td id="result-amount">0</td>
    </tr>
  </table>
  <button onclick="openCalculator()">開啟土石計算機</button>

  <!-- 彈跳計算機 Modal 視窗 -->
  <div id="calcModal" class="modal">
    <div class="modal-content">
      <h3>土石清運計算機</h3>
      <label>長度 (公尺)：</label>
      <input type="number" id="calc-length" value="10">
      
      <label>寬度 (公尺)：</label>
      <input type="number" id="calc-width" value="5">
      
      <label>深度/高度 (公尺)：</label>
      <input type="number" id="calc-depth" value="2">
      
      <label>單價 (元/立方公尺)：</label>
      <input type="number" id="calc-price" value="1500">
      
      <button onclick="calculateAndFill()" style="width: 100%; margin-top: 20px;">計算並自動填入表格</button>
    </div>
  </div>

  <script>
    // 點擊代理人切換異議指向動畫，2秒後自動還原
    function triggerObjection(lawyer) {
      const melonImg = document.getElementById('melon-avatar');
      const waterImg = document.getElementById('water-avatar');
      
      if (lawyer === 'melon') {
        melonImg.src = 'lawyer_melon_point.png';
        setTimeout(() => { melonImg.src = 'lawyer_melon.png'; }, 2000);
      } else if (lawyer === 'water') {
        waterImg.src = 'lawyer_water_point.png';
        setTimeout(() => { waterImg.src = 'lawyer_water.png'; }, 2000);
      }
    }

    // 開啟計算機 Modal
    function openCalculator() {
      document.getElementById('calcModal').style.display = 'block';
    }

    // 點擊 Modal 外部黑幕自動關閉
    window.onclick = function(event) {
      const modal = document.getElementById('calcModal');
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    }

    // 計算邏輯並自動填入表格
    function calculateAndFill() {
      const L = parseFloat(document.getElementById('calc-length').value) || 0;
      const W = parseFloat(document.getElementById('calc-width').value) || 0;
      const D = parseFloat(document.getElementById('calc-depth').value) || 0;
      const P = parseFloat(document.getElementById('calc-price').value) || 0;

      const volume = L * W * D;
      const amount = volume * P;

      // 自動將計算結果填入網頁表格
      document.getElementById('result-volume').innerText = volume.toLocaleString();
      document.getElementById('result-amount').innerText = amount.toLocaleString() + ' 元';

      // 關閉彈跳視窗
      document.getElementById('calcModal').style.display = 'none';
    }
  </script>

</body>
</html>
