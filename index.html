<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>西瓜寮裁判所</title>
<style>
:root { --gold: #ffcc00; --red: #ff0033; --green: #00ff66; --blue: #0066ff; --bg: #0a0a1a; --panel: #112233; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: "Arial Black", "Impact", "Noto Sans TC", sans-serif; -webkit-tap-highlight-color: transparent; }
body {
  color: #fff; min-height: 100vh; padding: 10px; overflow-x: hidden;
  background-color: var(--bg);
  background-image: 
    radial-gradient(circle at center, rgba(0,50,100,0.4) 0%, transparent 70%),
    linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000),
    linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000);
  background-size: 100% 100%, 20px 20px, 20px 20px;
  background-position: 0 0, 0 0, 10px 10px;
}
body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999; background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.15) 50%); background-size: 100% 4px; }

#app { max-width: 1000px; margin: 0 auto; position: relative; z-index: 1; border: 4px solid #222; border-radius: 12px; box-shadow: 0 0 0 2px #444, 0 0 50px rgba(0,0,0,0.8), inset 0 0 100px rgba(0,0,0,0.9); background: #000; padding: 15px; overflow: hidden; }

/* 封面 */
.cover-screen { text-align: center; padding: 60px 20px; position: relative; }
.cover-title { font-size: clamp(36px, 8vw, 60px); color: var(--gold); font-weight: 900; letter-spacing: 4px; text-shadow: 4px 4px 0 #a00, 8px 8px 0 #000; margin-bottom: 10px; font-style: italic; }
.cover-sub { color: #fff; font-size: clamp(16px, 4vw, 24px); letter-spacing: 4px; margin-bottom: 40px; text-shadow: 2px 2px 0 var(--blue); }
.press-start { font-size: clamp(20px, 5vw, 32px); color: #fff; font-weight: 900; animation: blink 1s infinite; cursor: pointer; padding: 20px; text-shadow: 2px 2px 0 var(--red); }
.press-start:hover { color: var(--gold); }
@keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.05); } }

/* 角色選擇 */
.roles-container { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
.role-card { flex: 1; min-width: 200px; max-width: 280px; padding: 20px; cursor: pointer; background: rgba(10,20,40,0.8); border: 4px solid #444; text-align: center; transition: .1s; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); }
.role-card:hover { transform: scale(1.05); z-index: 10; }
.role-card.melon { border-color: var(--green); box-shadow: 0 0 20px rgba(0,255,102,0.3); }
.role-card.water { border-color: var(--red); box-shadow: 0 0 20px rgba(255,0,51,0.3); }
.role-card.judge { border-color: var(--gold); box-shadow: 0 0 20px rgba(255,204,0,0.3); }
.role-icon { width: 60px; height: 60px; margin: 0 auto 10px; filter: drop-shadow(4px 4px 0 #000); }
.role-card h3 { font-size: clamp(18px, 4vw, 24px); margin-bottom: 8px; color: #fff; text-shadow: 2px 2px 0 #000; }
.role-card p { font-size: 14px; color: #aaa; }

/* 法庭全景 (RWD 重新設計) */
.courtroom-scene { 
  background: #1a1008; 
  border: 4px solid #444; 
  border-radius: 8px;
  margin-bottom: 15px; 
  position: relative; 
  height: clamp(240px, 40vh, 350px);
  display: flex; flex-direction: column; justify-content: space-between;
  overflow: hidden;
  box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
}
/* 木紋背景與高台 */
.courtroom-scene::before {
  content: ''; position: absolute; inset: 0;
  background: 
    linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.8) 100%),
    repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.03) 40px, rgba(255,255,255,0.03) 42px),
    repeating-linear-gradient(0deg, transparent, transparent 20px, rgba(0,0,0,0.3) 20px, rgba(0,0,0,0.3) 22px);
  pointer-events: none;
  z-index: 0;
}

/* 頂部：法官席高台 */
.judge-stand {
  position: relative; z-index: 2; width: 100%; height: 45%;
  background: linear-gradient(to bottom, #2a1a0e, #1a1008);
  border-bottom: 6px solid #4a2e15;
  display: flex; justify-content: center; align-items: flex-end; padding-bottom: 5px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.8);
}
.judge-bench { display: flex; justify-content: center; align-items: flex-end; gap: clamp(10px, 3vw, 40px); }
.judge-avatar { filter: drop-shadow(0 0 10px #000); transition: .3s; }
.main-judge { width: clamp(60px, 12vw, 100px); height: clamp(60px, 12vw, 100px); }
.judge-side { width: clamp(40px, 8vw, 70px); height: clamp(40px, 8vw, 70px); opacity: 0.7; }
.judge-avatar.active { filter: drop-shadow(0 0 20px var(--gold)); transform: translateY(-5px); }

/* 法警站崗 (兩側) */
.bailiff-stand { position: absolute; bottom: 0; z-index: 3; transition: all 0.5s; display: flex; flex-direction: column; align-items: center; }
.bailiff-stand.left { left: 2%; }
.bailiff-stand.right { right: 2%; }
.bailiff-avatar { width: clamp(40px, 8vw, 70px); height: clamp(40px, 8vw, 70px); filter: drop-shadow(0 0 5px #000); }
.bailiff-label { font-size: 10px; color: #ffcc00; background: #000; padding: 2px 6px; border-radius: 4px; margin-top: 2px; display: none; }
@media (min-width: 600px) { .bailiff-label { display: block; } }

/* 底部：代理人區 */
.players-area { position: relative; z-index: 2; display: flex; justify-content: space-between; padding: 0 5%; width: 100%; margin-bottom: 5px; }
.player-side { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.player-side .avatar { width: clamp(60px, 12vw, 100px); height: clamp(60px, 12vw, 100px); background: #111; border: 3px solid #555; transition: .2s; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }
.player-side.left .avatar { border-color: var(--green); }
.player-side.right .avatar { border-color: var(--red); }
.player-side .avatar.active { transform: translateY(-10px); }
.player-side.left .avatar.active { box-shadow: 0 0 20px var(--green); }
.player-side.right .avatar.active { box-shadow: 0 0 20px var(--red); }
.player-side .avatar svg { width: 100%; height: 100%; }
.name-tag { font-size: clamp(10px, 2vw, 14px); font-weight: 900; color: #fff; background: #000; padding: 2px 10px; border: 1px solid #555; text-transform: uppercase; white-space: nowrap; }
.player-side.left .name-tag { color: var(--green); border-color: var(--green); }
.player-side.right .name-tag { color: var(--red); border-color: var(--red); }

/* 對話與 UI */
.dialog-box { background: rgba(0,0,0,0.95); border: 3px solid var(--gold); border-radius: 8px; padding: 15px; min-height: 100px; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,1); }
.speaker-name { position: absolute; top: -14px; left: 15px; background: var(--gold); color: #000; font-size: 14px; font-weight: 900; padding: 2px 15px; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); }
.dialog-content { font-size: clamp(14px, 3.5vw, 18px); line-height: 1.6; color: #fff; margin-top: 8px; font-family: "Noto Sans TC", sans-serif; font-weight: bold; }

/* 提示框 */
.hint-box { background: rgba(0, 50, 150, 0.8); border: 2px solid var(--blue); border-radius: 6px; padding: 10px; margin-top: 15px; text-align: center; font-size: clamp(12px, 3vw, 16px); color: #fff; box-shadow: 0 0 10px rgba(0,102,255,0.5); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 10px rgba(0,102,255,0.5); } 50% { box-shadow: 0 0 20px rgba(0,102,255,1); } }

/* 按鈕 */
.objection-btn { display: block; margin: 15px auto; padding: 12px 40px; background: var(--red); color: #fff; border: 3px solid #fff; border-radius: 8px; font-size: clamp(20px, 5vw, 28px); font-weight: 900; cursor: pointer; transition: .1s; text-transform: uppercase; text-shadow: 2px 2px 0 #000; box-shadow: 0 6px 0 #800, 0 10px 15px rgba(0,0,0,0.8); font-style: italic; width: 90%; max-width: 350px; }
.objection-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #800; }
.btn { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; background: var(--gold); color: #000; font-weight: 900; font-size: clamp(14px, 3.5vw, 18px); transition: .1s; display: block; margin: 10px auto; width: 100%; max-width: 300px; text-transform: uppercase; box-shadow: 0 4px 0 #a00; }
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn.green { background: var(--green); box-shadow: 0 4px 0 #080; }
.btn.red { background: var(--red); color: #fff; box-shadow: 0 4px 0 #800; }
.next-wrap { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }

/* 證物袋 (RWD Grid) */
.evidence-bag { margin-top: 15px; padding: 15px; background: #112; border: 3px solid #445; border-radius: 8px; animation: slideUp .2s ease; }
.evidence-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(80px, 20vw, 110px), 1fr)); gap: 10px; margin-top: 10px; }
.evidence-card { padding: 10px 5px; text-align: center; background: #223; border: 2px solid #667; border-radius: 6px; cursor: pointer; transition: .1s; color: #fff; }
.evidence-card:active { background: var(--blue); }
.ev-icon { width: 32px; height: 32px; margin: 0 auto 5px; display: block; }
.ev-name { font-size: 12px; font-weight: bold; font-family: "Noto Sans TC", sans-serif; }

/* 審判長 UI */
.judge-ui { background: #112; border: 3px solid var(--gold); border-radius: 8px; padding: 15px; margin-top: 15px; text-align: center; }
.judge-ui h3 { color: var(--gold); margin-bottom: 15px; font-size: clamp(14px, 4vw, 18px); }
.judge-choice { display: flex; flex-direction: column; gap: 10px; }
@media (min-width: 600px) { .judge-choice { flex-direction: row; justify-content: center; } }
.judge-choice button { flex: 1; padding: 15px; font-size: clamp(14px, 3.5vw, 18px); font-weight: 900; border: 3px solid #fff; border-radius: 8px; cursor: pointer; transition: .1s; text-transform: uppercase; }
.btn-pass { background: var(--blue); color: #fff; box-shadow: 0 4px 0 #003; }
.btn-pass:active { transform: translateY(4px); box-shadow: none; }
.btn-object { background: var(--red); color: #fff; box-shadow: 0 4px 0 #800; }
.btn-object:active { transform: translateY(4px); box-shadow: none; }

/* 回饋 */
.feedback { margin-top: 15px; padding: 15px; border-left: 6px solid; font-size: clamp(13px, 3vw, 16px); font-family: "Noto Sans TC", sans-serif; font-weight: bold; border-radius: 4px; }
.feedback.ok { background: rgba(0,255,102,0.15); border-color: var(--green); color: #ccffdd; }
.feedback.ng { background: rgba(255,0,51,0.15); border-color: var(--red); color: #ffccdd; }
.feedback strong { display: block; margin-bottom: 8px; font-size: clamp(16px, 4vw, 20px); font-family: "Arial Black", sans-serif; text-transform: uppercase; }

/* 法官震怒彈窗 */
.judge-popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 2000; animation: fadeIn .1s; padding: 20px; }
.judge-popup { background: #000; border: 4px solid var(--red); border-radius: 12px; padding: 20px; text-align: center; max-width: 400px; width: 100%; transform: scale(0.8); animation: popIn .2s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 0 30px var(--red); }
.judge-popup .avatar { width: 100px; height: 100px; margin: 0 auto 15px; filter: drop-shadow(0 0 15px var(--red)); }
.judge-popup h3 { color: var(--red); font-size: clamp(22px, 6vw, 30px); margin-bottom: 10px; text-shadow: 2px 2px 0 #fff; font-style: italic; }
.judge-popup p { font-size: clamp(14px, 4vw, 18px); line-height: 1.5; color: #fff; margin-bottom: 15px; font-family: "Noto Sans TC", sans-serif; font-weight: bold; }
@keyframes popIn { to { transform: scale(1); } }

/* 法警帶走動畫 */
.bailiff-scene { position: fixed; inset: 0; background: #000; z-index: 3000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.bailiff-drag { display: flex; align-items: flex-end; gap: 10px; animation: dragAway 2.5s forwards cubic-bezier(0.7, 0, 1, 1); }
.bailiff-svg-large { width: clamp(80px, 20vw, 150px); height: clamp(80px, 20vw, 150px); animation: walk 0.4s infinite alternate; }
.player-svg-large { width: clamp(60px, 15vw, 120px); height: clamp(60px, 15vw, 120px); transform: rotate(30deg); filter: drop-shadow(0 0 10px rgba(255,0,0,0.8)); }
.bailiff-text { position: absolute; top: 20%; width: 100%; text-align: center; font-size: clamp(24px, 8vw, 50px); color: var(--red); font-weight: 900; text-shadow: 3px 3px 0 #fff; animation: blink .3s infinite; font-style: italic; padding: 0 10px; }
@keyframes dragAway { 
  0% { transform: translateX(0); } 
  20% { transform: translateX(-50px) rotate(-5deg); } 
  80% { opacity: 1; } 
  100% { transform: translateX(100vw); opacity: 0; } 
}
@keyframes walk { from { transform: translateY(0); } to { transform: translateY(-10px); } }

/* 決定性證據特效 */
#flash-overlay { position: fixed; inset: 0; background: #fff; z-index: 5000; pointer-events: none; opacity: 0; }
.flash-active { animation: flashAnim 0.4s ease-out; }
@keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
#decisive-text { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5001; pointer-events: none; opacity: 0; padding: 20px; }
.decisive-active { animation: decisiveAnim 1.5s ease-out forwards; }
@keyframes decisiveAnim {
  0% { opacity: 0; transform: scale(0.5) rotate(-10deg); }
  20% { opacity: 1; transform: scale(1.1) rotate(5deg); }
  40% { transform: scale(1) rotate(-2deg); }
  80% { opacity: 1; transform: scale(1) rotate(0deg); }
  100% { opacity: 0; transform: scale(1.5) rotate(0deg); }
}
.decisive-text-inner { font-size: clamp(40px, 12vw, 80px); font-weight: 900; color: var(--gold); text-shadow: 4px 4px 0 var(--red), 8px 8px 0 #000; font-style: italic; letter-spacing: 4px; text-align: center; line-height: 1.2; }

@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.shake { animation: shake .4s ease; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }

/* 計算機 (RWD) */
.calc-container { display: flex; flex-direction: column; gap: 15px; background: #112; border: 3px solid #445; padding: 15px; border-radius: 8px; }
@media (min-width: 768px) { .calc-container { flex-direction: row; align-items: flex-start; } .calc-inputs { flex: 1; } .calculator { width: 280px; } }
.calc-field { display: flex; flex-direction: column; gap: 5px; font-size: clamp(13px, 3.5vw, 16px); margin-bottom: 10px; color: #fff; }
.calc-field input { padding: 10px; border: 2px solid #667; border-radius: 4px; background: #000; color: var(--green); font-size: clamp(16px, 4vw, 20px); font-family: "Courier New", monospace; font-weight: bold; width: 100%; }
.calculator { background: #222; padding: 15px; border: 3px solid #555; border-radius: 8px; width: 100%; }
.calc-display { background: #000; color: var(--green); font-family: "Courier New", monospace; font-size: clamp(20px, 5vw, 32px); text-align: right; padding: 10px; margin-bottom: 10px; border: 2px solid #444; border-radius: 4px; overflow: hidden; }
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.calc-btn { padding: 12px 0; font-size: clamp(16px, 4vw, 20px); font-weight: 900; border: none; border-radius: 4px; cursor: pointer; background: #444; color: #fff; }
.calc-btn:active { background: #222; }
.calc-btn.op { background: var(--blue); }
.calc-btn.eq { background: var(--green); color: #000; }
.calc-btn.clr { background: var(--red); }
.calc-btn.span-2 { grid-column: span 2; }
</style>
</head>
<body>

<div id="app"></div>
<div id="flash-overlay"></div>
<div id="decisive-text"><div class="decisive-text-inner">決定的證據！</div></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="opp" viewBox="0 0 16 16">
      <rect x="2" y="0" width="12" height="3" fill="#4a4a4a"/><rect x="2" y="3" width="12" height="6" fill="#e8c8a8"/>
      <rect x="3" y="4" width="4" height="2" fill="none" stroke="#1a1008" stroke-width="0.4"/><rect x="9" y="4" width="4" height="2" fill="none" stroke="#1a1008" stroke-width="0.4"/>
      <rect x="7" y="4.8" width="2" height="0.4" fill="#1a1008"/><rect x="6" y="7.5" width="4" height="0.5" fill="#4a2a2a"/>
      <rect x="2" y="9" width="12" height="7" fill="#2a2a3a"/><rect x="7" y="9" width="2" height="5" fill="#8b3a3a"/>
    </symbol>
    <symbol id="ply" viewBox="0 0 16 16">
      <rect x="2" y="0" width="12" height="3" fill="#1e4d1e"/><rect x="2" y="3" width="12" height="6" fill="#f5d5b0"/>
      <rect x="3" y="4" width="4" height="2" fill="none" stroke="#1a1008" stroke-width="0.4"/><rect x="9" y="4" width="4" height="2" fill="none" stroke="#1a1008" stroke-width="0.4"/>
      <rect x="7" y="4.8" width="2" height="0.4" fill="#1a1008"/><rect x="7" y="7.5" width="2" height="0.5" fill="#8b3a3a"/>
      <rect x="2" y="9" width="12" height="7" fill="#1a1a3a"/><rect x="7" y="9" width="2" height="5" fill="#ff4d6d"/>
    </symbol>
    <symbol id="judge-main" viewBox="0 0 16 16">
      <rect x="3" y="0" width="10" height="1" fill="#eeeeee"/><rect x="2" y="1" width="12" height="2" fill="#eeeeee"/>
      <rect x="1" y="3" width="2" height="2" fill="#eeeeee"/><rect x="13" y="3" width="2" height="2" fill="#eeeeee"/>
      <rect x="3" y="3" width="10" height="6" fill="#f5d5b0"/>
      <rect x="4" y="5" width="2" height="1" fill="#1a1008"/><rect x="10" y="5" width="2" height="1" fill="#1a1008"/>
      <rect x="7" y="7" width="2" height="1" fill="#8b3a3a"/>
      <rect x="1" y="9" width="14" height="7" fill="#1a1a1a"/>
      <rect x="4" y="9" width="8" height="7" fill="#2a2a2a"/>
      <rect x="7" y="9" width="2" height="3" fill="#8b3a3a"/>
      <rect x="2" y="11" width="4" height="2" fill="#a87840"/>
      <rect x="4" y="11" width="1" height="4" fill="#6b4f2f"/>
    </symbol>
    <symbol id="judge-side" viewBox="0 0 16 16">
      <rect x="3" y="1" width="10" height="2" fill="#dddddd"/><rect x="2" y="3" width="12" height="1" fill="#dddddd"/>
      <rect x="3" y="4" width="10" height="6" fill="#f5d5b0"/>
      <rect x="4" y="5" width="2" height="1" fill="#1a1008"/><rect x="10" y="5" width="2" height="1" fill="#1a1008"/>
      <rect x="6" y="7.5" width="4" height="0.5" fill="#1a1008"/>
      <rect x="1" y="10" width="14" height="6" fill="#222"/>
      <rect x="5" y="10" width="6" height="6" fill="#333"/>
      <rect x="7" y="10" width="2" height="4" fill="#003366"/>
    </symbol>
    <symbol id="bailiff" viewBox="0 0 16 16">
      <rect x="4" y="0" width="8" height="2" fill="#1a1a1a"/><rect x="2" y="2" width="12" height="1" fill="#000"/>
      <rect x="7" y="0" width="2" height="2" fill="#f7c948"/><rect x="3" y="3" width="10" height="6" fill="#f5d5b0"/>
      <rect x="4" y="5" width="2" height="1" fill="#1a1008"/><rect x="10" y="5" width="2" height="1" fill="#1a1008"/>
      <rect x="6" y="7" width="4" height="0.5" fill="#1a1008"/><rect x="2" y="9" width="12" height="7" fill="#2a2a3a"/>
      <rect x="7" y="9" width="2" height="4" fill="#111"/><rect x="4" y="9" width="2" height="2" fill="#f7c948"/>
      <rect x="10" y="9" width="2" height="2" fill="#f7c948"/><rect x="13" y="6" width="2" height="6" fill="#111" rx="1"/>
    </symbol>
    <symbol id="i-doc" viewBox="0 0 16 16"><rect x="3" y="1" width="10" height="14" fill="#f5e6c8"/><rect x="4" y="3" width="8" height="0.6" fill="#5a4020"/><rect x="4" y="5" width="8" height="0.6" fill="#5a4020"/><rect x="4" y="7" width="6" height="0.6" fill="#5a4020"/></symbol>

class Model {
  constructor() { 
    this.i=0; this.score=0; this.max=60; this.lives=3; this.bag=false; this.res=null; 
    this.logs=[]; this.role=null; this.scenes=[]; this.popup=null; this.bailiffAnim=false;
    this.judgeStep = 0; 
  }
  get cur() { return this.scenes[this.i]; }
  open() { this.bag=true; this.res=null; }
  
  pick(id) {
    const s=this.cur; const ev = ALL_EVIDENCE[id];
    if (ev.joke) {
      this.lives--;
      this.bag = false;
      this.popup = ev.joke;
      if(this.lives<=0){ 
        this.res={ok:false, rev:'GameOver'}; 
        this.logs.push({ok:false, fb:'被趕出法庭'}); 
        setTimeout(() => { this.popup = null; this.bailiffAnim = true; app.start(); }, 2000); 
      }
      else { this.res={ok:false, retry:true}; }
      return this.res;
    }
    if(s.ans.includes(id)){
      this.score+=10; this.bag=false; this.res={ok:true, fb:s.fbOk, line:s.success};
      this.logs.push({ok:true, fb:s.fbOk});
    } else {
      this.lives--;
      if(this.lives<=0){ this.bag=false; this.res={ok:false, fb:s.fbNg, rev:ALL_EVIDENCE[s.ans[0]].name}; this.logs.push({ok:false, fb:'生命耗盡'}); }
      else { this.res={ok:false, fb:s.fbNg, retry:true}; }
    }
    return this.res;
  }

  judgeNextStep() { if (this.judgeStep < 2) this.judgeStep++; }

  judgePick(userAns) {
    const s=this.cur;
    if (s.correct === userAns) {
      this.score += 10;
      this.res = { ok:true, fb: s.fbOk };
      this.logs.push({ok:true, fb:s.fbOk});
    } else {
      this.res = { ok:false, fb: s.fbNg };
      this.logs.push({ok:false, fb:'判斷錯誤'});
    }
  }

  calc(vals) {
    const s=this.cur; let allOk=true;
    const res = s.fields.map(f=>{ const ok=Number(vals[f.k])===f.a; if(!ok)allOk=false; return {...f, ok}; });
    if(allOk) this.score+=10;
    this.logs.push({ok:allOk, fb:allOk?'計算正確':'計算錯誤'});
    return {res, allOk};
  }
  next() { 
    if(this.i<this.scenes.length-1){ 
      this.i++; this.lives=3; this.bag=false; this.res=null; this.popup=null; this.bailiffAnim=false; this.judgeStep = 0;
    } 
  }
}

          <div class="cover-title" style="font-size:clamp(24px,6vw,32px);letter-spacing:4px;">選擇你的身分</div>
          <div class="roles-container">
            <div class="role-card melon" onclick="window.selectRole('melon')">
              <svg class="role-icon" viewBox="0 0 16 16"><use href="#ply"/></svg>
              <h3>西瓜寮代理人</h3>
              <p>提出證物，逆轉戰局！</p>
            </div>
            <div class="role-card water" onclick="window.selectRole('water')">
              <svg class="role-icon" viewBox="0 0 16 16"><use href="#opp"/></svg>
              <h3>水利局代理人</h3>
              <p>防守指控，保護國庫！</p>
            </div>
            <div class="role-card judge" onclick="window.selectRole('judge')">
              <svg class="role-icon" viewBox="0 0 16 16"><use href="#judge-main"/></svg>
              <h3>審判長視角</h3>
              <p>聆聽兩造，做出公正裁決！</p>
            </div>
          </div>
        </div>`;
      return;
    }

    const s=m.cur; let h='';

    if (m.bailiffAnim) {
      h += `
        <div class="bailiff-scene">
          <div class="bailiff-text">法警！將這位代理人帶出去！</div>
          <div class="bailiff-drag">
            <svg class="bailiff-svg-large" viewBox="0 0 16 16"><use href="#bailiff"/></svg>
            <svg class="player-svg-large" viewBox="0 0 16 16"><use href="${m.role==='melon'?'#ply':'#opp'}"/></svg>
            <svg class="bailiff-svg-large" viewBox="0 0 16 16"><use href="#bailiff"/></svg>
          </div>
        </div>`;
      this.r.innerHTML = h;
      return;
    }

    if(s.type==='end'){
      h+=this.renderCourt(m, '審判長');
      h+=`<div class="dialog-box" style="margin-top:15px;"><span class="speaker-name">審判長</span><div class="dialog-content">本院判斷如下：水利局應給付西瓜寮 <strong>1 億 2,722 萬 2,777 元</strong>，及自 99 年 6 月 8 日起至清償日止，按年息 5% 計算之利息。</div></div>`;
      h+=`<h2 style="color:var(--gold);margin-top:15px;text-align:center;font-size:clamp(18px,5vw,24px);">總得分：${m.score} / ${m.max}</h2>`;
      h+=`<div class="next-wrap"><button class="btn" onclick="location.reload()">重新審判</button></div>`;
      this.r.innerHTML=h; return;
    }

    if (m.role === 'judge') {
      if(s.type==='story'){
        h+=this.renderCourt(m, '系統');
        h+=`<div class="dialog-box"><span class="speaker-name">系統</span><div class="dialog-content">${s.text}</div></div>`;
        h+=`<div class="next-wrap"><button class="btn" id="btnNext">${s.btn}</button></div>`;
      } else if (s.type === 'judge_trial') {
        let activeSpeaker = (m.judgeStep === 0) ? '水利局代理人' : (m.judgeStep === 1) ? '西瓜寮代理人' : '審判長';
        h+=this.renderCourt(m, activeSpeaker);
        
        if (m.judgeStep === 0) {
          h+=`<div class="dialog-box" style="border-color:var(--red);"><span class="speaker-name" style="background:var(--red);color:#fff;">原告(水利局)</span><div class="dialog-content">「${s.p_claim}」</div></div>`;
          h+=`<div class="next-wrap"><button class="btn" id="btnJudgeNext">聽取被告抗辯 →</button></div>`;
        } else if (m.judgeStep === 1) {
          h+=`<div class="dialog-box" style="border-color:var(--green);"><span class="speaker-name" style="background:var(--green);color:#fff;">被告(西瓜寮)</span><div class="dialog-content">「${s.d_claim}」</div></div>`;
          h+=`<div class="next-wrap"><button class="btn" id="btnJudgeNext">審判長裁決 →</button></div>`;
        } else if (m.judgeStep === 2) {
          h+=`<div class="judge-ui"><h3>💭 ${s.question}</h3>`;
          if (!m.res) {
            h+=`<div class="judge-choice">
              <button class="btn-pass" onclick="window.judgeDecide('p')">原告(水利局) 有理由</button>
              <button class="btn-object" onclick="window.judgeDecide('d')">被告(西瓜寮) 有理由</button>
            </div>`;
          } else {
            h+=`<div class="feedback ${m.res.ok?'ok':'ng'}"><strong>${m.res.ok?'✔ 判斷正確！':'✘ 判斷錯誤！'}</strong>${m.res.fb}</div>`;
            h+=`<div class="next-wrap"><button class="btn" id="btnNext">下一章 →</button></div>`;
          }
          h+=`</div>`;
        }
      } else if (s.type === 'calc') {
        h+=this.renderCourt(m, '系統');
        h+=this.renderCalc(m, s);
      }
    } else {
      // 代理人模式
      if(s.type==='story'){
        h+=this.renderCourt(m, s.speaker);
        h+=`<div class="dialog-box"><span class="speaker-name">${s.speaker}</span><div class="dialog-content">${s.text}</div></div>`;
        h+=`<div class="next-wrap"><button class="btn" id="btnNext">${s.btn}</button></div>`;
      } else if(s.type==='trial'){
        h+=this.renderCourt(m, (!m.res||!m.res.ok) ? s.speaker : (m.role==='melon'?'西瓜寮代理人':'水利局代理人'));
        if(!m.res||!m.res.ok) h+=`<div class="dialog-box"><span class="speaker-name">${s.speaker}</span><div class="dialog-content">「${s.opp}」</div></div>`;
        else h+=`<div class="dialog-box" style="border-color:var(--green);"><span class="speaker-name" style="background:var(--green);color:#fff;">${m.role==='melon'?'西瓜寮代理人':'水利局代理人'}</span><div class="dialog-content">「${m.res.line}」</div></div>`;

        if(!m.res&&!m.bag) {
          h+=`<div class="hint-box">💡 提示：${s.hint}</div>`;
          h+=`<button class="objection-btn" id="btnObj">異議あり！</button>`;
        }
        
        if(m.bag){
          const shuffledBag = [...s.bag].sort(() => Math.random() - 0.5);
          h+=`<div class="evidence-bag"><div class="bag-header" style="font-weight:bold;font-size:14px;margin-bottom:10px;">📁 法庭紀錄 — 請點擊證物提出</div><div class="evidence-grid">`;
          shuffledBag.forEach(id => {
            const e = ALL_EVIDENCE[id];
            h+=`<button class="evidence-card" data-id="${e.id}"><svg class="ev-icon" viewBox="0 0 16 16"><use href="#${e.icon}"/></svg><span class="ev-name">${e.name}</span></button>`; 
          });
          h+=`</div></div>`;
        }
        
        if(m.res){
          h+=`<div class="feedback ${m.res.ok?'ok':'ng'}"><strong>${m.res.ok?'✔ 提出成功！':(m.res.rev?'✘ 生命耗盡！':'✘ 無法說服法官！')}</strong>${m.res.fb||''}</div>`;
          if(m.res.ok||m.res.rev) h+=`<div class="next-wrap"><button class="btn" id="btnNext">下一章 →</button></div>`;
          else if (m.res.retry) h+=`<div class="next-wrap"><button class="btn red" id="btnRetry">重新選擇證物</button></div>`;
        }
      } else if(s.type==='calc'){
        h+=this.renderCourt(m, '系統');
        h+=this.renderCalc(m, s);
      }
    }

    if (m.popup) {
      h += `
        <div class="judge-popup-overlay">
          <div class="judge-popup">
            <svg class="avatar" viewBox="0 0 16 16"><use href="#judge-main"/></svg>
            <h3>審判長動怒！</h3>
            <p>${m.popup}</p>
            <button class="btn red" onclick="window.closePopup()" style="max-width:200px;">我知道錯了</button>
          </div>
        </div>`;
    }
    
    this.r.innerHTML=h;
  }

  renderCalc(m, s) {
    let h = `<div class="dialog-box" style="margin-top:15px;border-color:var(--blue);"><span class="speaker-name" style="background:var(--blue);color:#fff;">計算題</span><div class="dialog-content" style="white-space:pre-wrap;">${s.q}</div></div>
      <div class="calc-container" style="margin-top:15px;">
        <div class="calc-inputs">`;
    if(!m.res){
      s.fields.forEach(f=>{ h+=`<div class="calc-field"><span>${f.l}</span><input type="number" id="input-${f.k}" data-k="${f.k}" placeholder="輸入結果"></div>`; });
      h+=`<button class="btn green" id="btnCalc" style="width:100%;">送出計算</button>`;
    } else {
      h+=`<div class="feedback ${m.res.allOk?'ok':'ng'}"><strong>${m.res.allOk?'✔ 計算正確！':'✘ 計算錯誤'}</strong>`;
      m.res.res.forEach(r=>{ h+=`<div>${r.l}：${r.ok?'✔ 正確':'✘ 正確為 '+r.a.toLocaleString()}</div>`; });
      h+=`</div><div class="next-wrap"><button class="btn" id="btnNext">下一章 →</button></div>`;
    }
    h+=`</div>`;
    if(!m.res) {
      h+=`<div class="calculator"><div class="calc-display" id="calcDisplay">0</div><div class="calc-grid">
        <button class="calc-btn clr" data-val="C">C</button><button class="calc-btn op" data-val="(">(</button><button class="calc-btn op" data-val=")">)</button><button class="calc-btn op" data-val="/">÷</button>
        <button class="calc-btn" data-val="7">7</button><button class="calc-btn" data-val="8">8</button><button class="calc-btn" data-val="9">9</button><button class="calc-btn op" data-val="*">×</button>
        <button class="calc-btn" data-val="4">4</button><button class="calc-btn" data-val="5">5</button><button class="calc-btn" data-val="6">6</button><button class="calc-btn op" data-val="-">-</button>
        <button class="calc-btn" data-val="1">1</button><button class="calc-btn" data-val="2">2</button><button class="calc-btn" data-val="3">3</button><button class="calc-btn op" data-val="+">+</button>
        <button class="calc-btn span-2" data-val="0">0</button><button class="calc-btn" data-val=".">.</button><button class="calc-btn eq" data-val="=">=</button>
      </div></div>`;
    }
    h+=`</div>`;
    return h;
  }
}

class Ctrl {
  constructor(m, v) { this.m=m; this.v=v; this.calcStr = '0'; }
  start() { this.v.render(this.m); this.bind(); }
  
  bind() {
    const m=this.m;
    
    const nBtn=document.getElementById('btnNext');
    if(nBtn) nBtn.onclick=()=>{ m.next(); this.start(); };
    
    const jNext=document.getElementById('btnJudgeNext');
    if(jNext) jNext.onclick=()=>{ m.judgeNextStep(); this.start(); };
    
    const oBtn=document.getElementById('btnObj');
    if(oBtn) oBtn.onclick=()=>{ m.open(); this.start(); };
    
    const rBtn=document.getElementById('btnRetry');
    if(rBtn) rBtn.onclick=()=>{ m.res=null; m.open(); this.start(); };
    
    document.querySelectorAll('.evidence-card').forEach(c=>{
      c.onclick=()=>{
        const r=m.pick(c.dataset.id);
        if(r.ok) {
          this.decisiveEffect();
        }
        else if(r.retry || r.rev) this.shake();
        this.start();
      };
    });

    const display = document.getElementById('calcDisplay');
    if (display) {
      display.innerText = this.calcStr;
      document.querySelectorAll('.calc-btn').forEach(btn => {
        btn.onclick = () => {
          const val = btn.dataset.val;
          if (val === 'C') this.calcStr = '0';
          else if (val === '=') {
            try { this.calcStr = String(Math.round(eval(this.calcStr.replace(/×/g, '*').replace(/÷/g, '/')) * 100000) / 100000); } catch { this.calcStr = 'Error'; }
          } else {
            if (this.calcStr === '0' || this.calcStr === 'Error') this.calcStr = val;
            else this.calcStr += val;
          }
          display.innerText = this.calcStr;
        };
      });
    }

    const cBtn=document.getElementById('btnCalc');
    if(cBtn) cBtn.onclick=()=>{
      const vals={}; document.querySelectorAll('input').forEach(i=>vals[i.dataset.k]=i.value);
      m.res=m.calc(vals); this.calcStr = '0'; this.start();
    };
  }
  
  decisiveEffect() {
    const flash = document.getElementById('flash-overlay');
    const dText = document.getElementById('decisive-text');
    flash.classList.add('flash-active');
    dText.classList.add('decisive-active');
    
    setTimeout(() => {
      flash.classList.remove('flash-active');
      dText.classList.remove('decisive-active');
    }, 1500);
  }

  shake() {
    const a=document.getElementById('app'); a.classList.add('shake'); setTimeout(()=>a.classList.remove('shake'), 400);
  }
}

const app = new Ctrl(new Model(), new View(document.getElementById('app')));

window.showRoleSelect = () => { app.m.role = 'select'; app.start(); };
window.selectRole = (role) => {
  app.m.role = role;
  app.m.i = 0;
  if (role === 'melon') app.m.scenes = [...SCENES_MELON, SCENE_CALC, SCENE_END];
  else if (role === 'water') app.m.scenes = [...SCENES_WATER, SCENE_CALC, SCENE_END];
  else if (role === 'judge') app.m.scenes = [...SCENES_JUDGE, SCENE_CALC, SCENE_END];
  app.start();
};
window.judgeDecide = (ans) => {
  app.m.judgePick(ans);
  app.start();
};
window.closePopup = () => {
  app.m.popup = null;
  app.start();
};

app.start();
</script>
</body>
</html>
