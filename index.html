<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西瓜寮裁判所</title>
<style>
:root { --gold: #ffcc00; --red: #ff3344; --green: #00ff88; --blue: #3399ff; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; -webkit-tap-highlight-color: transparent; }
body { color: #eee; background: #0a0b10; min-height: 100vh; padding: 10px; overflow-x: hidden; font-size: 16px; line-height: 1.6; }
#app { max-width: 1000px; margin: 0 auto; border: 4px solid #222; border-radius: 12px; background: #111; padding: 15px; box-shadow: 0 0 30px rgba(0,0,0,0.8); position: relative; }

/* 天秤 */
.top-bar { display: flex; align-items: center; margin-bottom: 15px; padding: 0 10px; }
.trust-meter { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: bold; width: 100%; }
.trust-left { color: var(--green); width: 80px; text-align: right; }
.trust-right { color: var(--red); width: 80px; text-align: left; }
.balance-container { flex: 1; position: relative; display: flex; justify-content: center; }
.balance-bar { width: 90%; height: 12px; background: #222; border-radius: 6px; display: flex; overflow: hidden; border: 1px solid #444; margin-top: 5px; }
.bar-melon { height: 100%; background: var(--green); transition: width 0.4s; }
.bar-water { height: 100%; background: var(--red); transition: width 0.4s; }
.scale-icon { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: 28px; transition: transform 0.4s; z-index: 2; }
.trust-float { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: bold; animation: floatUp 1s forwards; pointer-events: none; z-index: 10; }
@keyframes floatUp { 0% { opacity: 0; top: 30px; } 20% { opacity: 1; top: 20px; } 100% { opacity: 0; top: 0; } }

/* 封面與選人 */
.cover-screen { text-align: center; padding: 60px 10px; }
.cover-title { font-size: clamp(32px, 8vw, 60px); color: var(--gold); font-weight: 900; letter-spacing: 4px; text-shadow: 3px 3px 0 #800; margin-bottom: 10px; font-style: italic; }
.cover-sub { color: #fff; letter-spacing: 6px; margin-bottom: 40px; font-weight: bold; }
.press-start { font-size: clamp(20px, 5vw, 28px); color: #fff; font-weight: 900; cursor: pointer; padding: 15px 30px; border: 2px dashed transparent; transition: 0.2s; animation: blink 1.2s infinite; }
.press-start:hover { border-color: var(--gold); color: var(--gold); background: rgba(255,204,0,0.1); border-radius: 8px; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.roles-container { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
.role-card { flex: 1; min-width: 160px; padding: 20px 10px; cursor: pointer; background: #1a1a24; border: 2px solid #444; border-radius: 12px; text-align: center; transition: 0.2s; display: flex; flex-direction: column; align-items: center; }
.role-card:hover { transform: translateY(-5px); }
.role-card.story { border-color: #fff; } .role-card.melon { border-color: var(--green); }
.role-card.water { border-color: var(--red); } .role-card.judge { border-color: var(--gold); }
.role-icon { width: 80px; height: 80px; margin-bottom: 10px; image-rendering: pixelated; filter: drop-shadow(0 4px 4px #000); }
.role-card h3 { font-size: 16px; margin-bottom: 5px; color: #fff; } .role-card p { font-size: 12px; color: #aaa; }

/* 法庭場景 */
.courtroom { background: #0a0805; border: 2px solid #333; border-radius: 8px; height: 300px; display: flex; flex-direction: column; justify-content: space-between; margin-bottom: 15px; position: relative; overflow: hidden; }
.courtroom.danger { filter: drop-shadow(0 0 15px var(--red)); }
.judge-stand { background: #1f150e; height: 40%; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 5px; border-bottom: 4px solid #3a2515; }
.judge-bench { display: flex; gap: 20px; align-items: flex-end; }
.judge-avatar { width: 60px; height: 60px; opacity: 0.6; image-rendering: pixelated; transition: 0.2s; }
.judge-avatar.main { width: 80px; height: 80px; opacity: 0.8; }
.judge-avatar.active { opacity: 1; filter: drop-shadow(0 0 10px var(--gold)); transform: translateY(-5px); }

.bailiff-stand { position: absolute; bottom: 0; display: flex; flex-direction: column; align-items: center; transition: 0.2s; z-index: 5; }
.bailiff-stand.left { left: 2%; } .bailiff-stand.right { right: 2%; }
.bailiff-avatar { width: 50px; height: 50px; image-rendering: pixelated; filter: drop-shadow(0 2px 4px #000); }
.bailiff-shock { animation: shock 0.1s infinite alternate; }
@keyframes shock { from { transform: translateY(0); } to { transform: translateY(-15px) scale(1.2) rotate(5deg); } }

.players-area { display: flex; justify-content: space-between; padding: 0 10%; height: 60%; align-items: flex-end; padding-bottom: 20px; }
.player-side { display: flex; flex-direction: column; align-items: center; position: relative; width: 100px; }
.player-side .avatar { width: 80px; height: 80px; background: #111; border: 2px solid #444; border-radius: 8px; z-index: 3; image-rendering: pixelated; transition: 0.2s; }
.player-side.left .avatar { border-color: var(--green); } .player-side.right .avatar { border-color: var(--red); }
.player-side .avatar.active { transform: translateY(-8px); }
.player-side.left .avatar.active { box-shadow: 0 0 15px var(--green); } .player-side.right .avatar.active { box-shadow: 0 0 15px var(--red); }
.name-tag { font-size: 12px; font-weight: bold; background: #000; padding: 2px 10px; border-radius: 20px; margin-top: 5px; z-index: 4; white-space: nowrap; }
.player-side.left .name-tag { color: var(--green); border: 1px solid var(--green); } .player-side.right .name-tag { color: var(--red); border: 1px solid var(--red); }

.lawyer-desk { position: absolute; bottom: -15px; width: 120%; height: 35px; background: #2b1a0e; border: 2px solid #111; border-radius: 4px; z-index: 2; }
.desk-item { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); font-size: 30px; z-index: 5; animation: popIn 0.3s; }

/* 特效 */
.effect-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
.falling-wig { position: absolute; top: 10%; left: 50%; width: 50px; height: 50px; animation: drop 1.5s forwards; }
@keyframes drop { 0% { top: 10%; opacity: 1; } 100% { top: 100%; opacity: 0; } }
.bullet-hole { position: absolute; width: 20px; height: 20px; background: #000; border-radius: 50%; opacity: 0.8; }
.note { position: absolute; font-size: 20px; animation: noteUp 1s forwards; }
@keyframes noteUp { to { transform: translateY(-50px); opacity: 0; } }

/* 對話框 */
.dialog-box { background: #151515; border: 2px solid #555; border-radius: 8px; padding: 20px; min-height: 100px; position: relative; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
.speaker-name { position: absolute; top: -12px; left: 15px; background: #333; color: #fff; font-size: 14px; font-weight: bold; padding: 2px 12px; border-radius: 4px; border: 1px solid #555; }
.dialog-content { font-size: 16px; line-height: 1.7; color: #eee; font-weight: 500; }
.hint-box { background: rgba(30, 60, 120, 0.5); border-left: 4px solid var(--blue); padding: 10px; margin-top: 15px; font-size: 14px; color: #fff; }
.hint-box::before { content: '等等！ '; color: var(--gold); font-weight: bold; font-style: italic; }

/* 按鈕 */
.btn { width: 100%; max-width: 300px; padding: 12px; margin: 10px auto; display: block; background: var(--gold); color: #000; font-weight: bold; font-size: 16px; border: 2px solid #fff; border-radius: 6px; cursor: pointer; box-shadow: 0 4px 0 #800; transition: 0.1s; }
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn.green { background: var(--green); box-shadow: 0 4px 0 #080; }
.btn.red { background: var(--red); color: #fff; box-shadow: 0 4px 0 #800; }
.btn-obj { width: 100%; max-width: 350px; padding: 15px; margin: 15px auto; background: var(--red); color: #fff; font-size: 24px; font-weight: 900; border: 2px solid #fff; border-radius: 8px; cursor: pointer; box-shadow: 0 6px 0 #800; font-style: italic; display: block; }
.btn-obj:active { transform: translateY(6px); box-shadow: none; }

/* 證物袋 */
.evidence-bag { margin-top: 15px; padding: 20px 15px 15px; background: #111; border: 2px solid var(--gold); border-radius: 8px; position: relative; }
.evidence-bag::before { content: 'COURT RECORD'; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; font-weight: bold; font-size: 12px; padding: 2px 15px; border-radius: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; }
.ev-card { background: #222; border: 1px solid #444; padding: 10px 5px; border-radius: 6px; text-align: center; cursor: pointer; transition: 0.1s; }
.ev-card:hover { background: #333; border-color: #fff; }
.ev-card svg { width: 30px; height: 30px; margin-bottom: 5px; }
.ev-card span { font-size: 12px; display: block; color: #ccc; }

/* 回饋與彈窗 */
.feedback { padding: 15px; margin-top: 15px; border-radius: 8px; font-weight: bold; border-left: 4px solid; }
.feedback.ok { background: rgba(0,255,136,0.1); border-color: var(--green); color: #ccffdd; }
.feedback.ng { background: rgba(255,51,68,0.1); border-color: var(--red); color: #ffccdd; }

.char-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: flex-end; justify-content: center; z-index: 2000; padding: 20px; }
.char-inner { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 500px; animation: popUp 0.3s; }
.char-img { width: 150px; height: 150px; image-rendering: pixelated; margin-bottom: -15px; z-index: 2; }
.char-dialog { background: #000; border: 3px solid; padding: 20px; border-radius: 8px; width: 100%; position: relative; z-index: 1; }
@keyframes popUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* 其他 UI */
.judge-ui { background: #222; border: 2px solid var(--gold); padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; }
.choice-btn { width: 100%; padding: 15px; margin-bottom: 10px; background: #333; color: #fff; border: 2px solid #555; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; text-align: left; }
.choice-btn:hover { background: #444; border-color: #fff; }
.choice-btn.p { border-left: 5px solid var(--red); } .choice-btn.d { border-left: 5px solid var(--green); } .choice-btn.a { border-left: 5px solid var(--blue); }

/* 帶走動畫 */
.bailiff-scene { position: fixed; inset: 0; background: #000; z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.bailiff-drag { display: flex; align-items: flex-end; gap: 10px; animation: drag 2s forwards; }
.bailiff-text { font-size: 30px; color: var(--red); font-weight: 900; margin-bottom: 20px; text-align: center; padding: 0 10px; }
@keyframes drag { to { transform: translateX(100vw); } }

.gameover { position: fixed; inset: 0; background: #000; z-index: 4000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.gameover h1 { font-size: 60px; color: var(--red); margin-bottom: 20px; font-family: Impact, sans-serif; }
</style>
</head>
<body>
<div id="app"></div>

<!-- 定義像素圖 SVG -->
<svg width="0" height="0" style="display:none;">
  <defs>
    <!-- 上訴人 (綠髮律師) -->
    <symbol id="ply" viewBox="0 0 16 16">
      <rect x="3" y="1" width="10" height="2" fill="#113311"/><rect x="4" y="2" width="8" height="1" fill="#2a5a2a"/>
      <rect x="3" y="3" width="2" height="2" fill="#2a5a2a"/><rect x="11" y="3" width="2" height="2" fill="#2a5a2a"/>
      <rect x="4" y="3" width="8" height="6" fill="#fce4d6"/>
      <rect x="4" y="4" width="3" height="3" fill="#1a1a1a"/><rect x="5" y="5" width="1" height="2" fill="#4a90e2"/><rect x="4" y="4" width="1" height="1" fill="#fff"/>
      <rect x="9" y="4" width="3" height="3" fill="#1a1a1a"/><rect x="10" y="5" width="1" height="2" fill="#4a90e2"/><rect x="9" y="4" width="1" height="1" fill="#fff"/>
      <rect x="6" y="7.5" width="4" height="0.5" fill="#d88"/>

    </symbol>
    <!-- 被上訴人 (灰髮律師) -->
    <symbol id="opp" viewBox="0 0 16 16">

      <rect x="3" y="3" width="2" height="2" fill="#555555"/><rect x="11" y="3" width="2" height="2" fill="#555555"/>
      <rect x="4" y="3" width="8" height="6" fill="#e8c8a8"/>
      <rect x="4" y="4" width="3" height="3" fill="#1a1a1a"/><rect x="5" y="5" width="1" height="2" fill="#3a5a8b"/><rect x="4" y="4" width="1" height="1" fill="#fff"/>
      <rect x="9" y="4" width="3" height="3" fill="#1a1a1a"/><rect x="10" y="5" width="1" height="2" fill="#3a5a8b"/><rect x="9" y="4" width="1" height="1" fill="#fff"/>
      <rect x="6" y="7.5" width="4" height="0.5" fill="#4a2a2a"/>
      <rect x="2" y="9" width="12" height="7" fill="#2a2a3a"/><rect x="5" y="9" width="6" height="7" fill="#dddddd"/><rect x="7" y="9" width="2" height="5" fill="#3a5a8b"/>
    </symbol>
    <!-- 審判長 -->
    <symbol id="judge-main" viewBox="0 0 16 16">
      <rect x="3" y="0" width="10" height="1" fill="#eee"/><rect x="2" y="1" width="12" height="2" fill="#eee"/><rect x="1" y="3" width="2" height="2" fill="#eee"/><rect x="13" y="3" width="2" height="2" fill="#eee"/>
      <rect x="3" y="3" width="10" height="6" fill="#f5d5b0"/><rect x="4" y="5" width="2" height="1" fill="#1a1008"/><rect x="10" y="5" width="2" height="1" fill="#1a1008"/><rect x="7" y="7" width="2" height="1" fill="#8b3a3a"/>
      <rect x="1" y="9" width="14" height="7" fill="#1a1a1a"/><rect x="4" y="9" width="8" height="7" fill="#2a2a2a"/><rect x="7" y="9" width="2" height="3" fill="#8b3a3a"/>
    </symbol>
    <!-- 陪席法官 -->
    <symbol id="judge-side" viewBox="0 0 16 16">
      <rect x="3" y="1" width="10" height="2" fill="#ddd"/><rect x="2" y="3" width="12" height="1" fill="#ddd"/><rect x="3" y="4" width="10" height="6" fill="#f5d5b0"/>
      <rect x="4" y="5" width="2" height="1" fill="#1a1008"/><rect x="10" y="5" width="2" height="1" fill="#1a1008"/><rect x="1" y="10" width="14" height="6" fill="#222"/>
    </symbol>
    <!-- 法警 -->
    <symbol id="bailiff" viewBox="0 0 16 16">
      <rect x="4" y="0" width="8" height="2" fill="#1a1a1a"/><rect x="7" y="0" width="2" height="2" fill="#f7c948"/><rect x="3" y="3" width="10" height="6" fill="#f5d5b0"/>
      <rect x="4" y="5" width="2" height="1" fill="#1a1008"/><rect x="10" y="5" width="2" height="1" fill="#1a1008"/><rect x="2" y="9" width="12" height="7" fill="#2a2a3a"/>

    <!-- 證物圖示 -->
    <symbol id="i-doc" viewBox="0 0 16 16"><rect x="3" y="1" width="10" height="14" fill="#f5e6c8"/><rect x="4" y="3" width="8" height="1" fill="#5a4020"/><rect x="4" y="5" width="8" height="1" fill="#5a4020"/></symbol>

</svg>

<script type="module">
// 證物庫
const EV = {
  prep: { id: 'prep', name: '準備書狀', icon: 'i-doc' },
  tender: { id: 'tender', name: '招標須知', icon: 'i-book' },
  join: { id: 'join', name: '參加書狀', icon: 'i-scale' },
  withdraw: { id: 'withdraw', name: '撤回上訴狀', icon: 'i-doc' },
  g1381: { id: 'g1381', name: '1381號判決', icon: 'i-scale' },
  deliver: { id: 'deliver', name: '點交證明', icon: 'i-money' },
  min: { id: 'min', name: '辯論筆錄', icon: 'i-doc' },
  abuse: { id: 'abuse', name: '歷審判決', icon: 'i-book' },
  
  gun: { id: 'gun', name: '法警手槍', icon: 'i-gun', joke: '法警（驚恐）：等、等等！我的槍怎麼會在你那裡？！你拿我的配槍打賭？！（全場法警掏槍對準你）', fx: 'gun', fatal: true },
  wig: { id: 'wig', name: '法官假髮', icon: 'i-wig', joke: '審判長（摸頭）：大膽！竟敢拿假髮調侃本官？法警！', fx: 'wig', fatal: true },
  badge: { id: 'badge', name: '律師執照', icon: 'i-badge', joke: '審判長：代理人，你拿自己的執照給我看，是想證明你考過國考嗎？' },
  food: { id: 'food', name: '宵夜鹹酥雞', icon: 'i-food', joke: '審判長：現在是言詞辯論，你當這裡是熱炒店？', fx: 'food' },
  leaf: { id: 'leaf', name: '法院盆栽', icon: 'i-leaf', joke: '審判長：你連法院的盆栽都不放過嗎？' }
};

// 劇本
const STORY = [
  { type:'story', title:'第一章：案件起因', speaker:'旁白', text:'民國91年，水利署第三河川局公開標售大安溪土石堆。西瓜寮公司以 7,760 萬元得標，約定土石總量 85 萬 9,221 立方公尺。', btn:'下一頁' },
  { type:'story', title:'第二章：所有權爭議', speaker:'旁白', text:'西瓜寮清運 30 萬立方公尺後，水利局告知暫停清運。原來漢臨公司主張土石是他們的，提起第1381號訴訟。法院判命西瓜寮返還土石確定，土石遭漢臨公司載離。', btn:'下一頁' },
  { type:'story', title:'第三章：提起訴訟', speaker:'旁白', text:'西瓜寮認為水利局未使其取得所有權，提訴請求水利局負債務不履行損害賠償責任，求償 1.5 億元。', btn:'進入審理' },
  { type:'choice', title:'第四章：程序之門', speaker:'審判長', text:'水利局在二審突襲提出終止契約。你該如何裁定？',
    opts: [ { label: '准許', correct: false }, { label: '駁回', correct: true } ],
    fbOk: '正確！違反447條。', fbNg: '錯誤！水利局原審有律師，不符例外。'
  },
  { type:'choice', title:'第五章：參加效力', speaker:'審判長', text:'水利局抗辯不受1381號判決拘束。你該如何裁定？',
    opts: [ { label: '不受拘束', correct: false }, { label: '受拘束', correct: true } ],
    fbOk: '正確！水利局本可獨立上訴。', fbNg: '錯誤！參加人本得獨立上訴。'
  },
  { type:'choice', title:'第六章：所有權與瑕疵', speaker:'審判長', text:'水利局抗辯已交付且善意受讓。你該如何裁定？',
    opts: [ { label: '水利局有理', correct: false }, { label: '水利局無理', correct: true } ],
    fbOk: '正確！1381號判決已認定未善意受讓。', fbNg: '錯誤！應受1381號判決拘束。'
  },
  { type:'calc', title:'第七章：金額計算' },
  { type:'end_story', title:'第八章：宣判' }
];

// 狀態管理
const state = {
  mode: null, i: 0, scenes: [], lives: 3, bag: false, res: null, popup: null, 
  bailiffAnim: false, gameover: false, typingDone: false,
  melon: 50, water: 50, float: null, floatColor: null,
  calc: { m: null, f: null, t: null }
};

// DOM 元素
const app = document.getElementById('app');

// 渲染函數
function render() {
  if (state.gameover) {
    app.innerHTML = `<div class="gameover"><h1>GAME OVER</h1><p>心證崩盤，你已被帶離法庭</p><button class="btn red" onclick="location.reload()" style="margin-top:20px;">重新遊玩</button></div>`;
    return;
  }
  
  if (state.bailiffAnim) {
    app.innerHTML = `<div class="bailiff-scene"><div class="bailiff-text">打賭輸了！法警，將這位代理人帶出去！</div><div class="bailiff-drag"><svg width="100" height="100" viewBox="0 0 16 16"><use href="#bailiff"/></svg><svg width="80" height="80" viewBox="0 0 16 16"><use href="#${state.mode==='melon'?'ply':'opp'}"/></svg><svg width="100" height="100" viewBox="0 0 16 16"><use href="#bailiff"/></svg></div></div>`;
    return;
  }

  if (!state.mode) {
    app.innerHTML = `<div class="cover-screen"><div class="cover-title">西瓜寮裁判所</div><div class="cover-sub">THE WEIGHT OF JUSTICE</div><div class="press-start" onclick="showSelect()">▶ PRESS START ◀</div></div>`;
    return;
  }

  if (state.mode === 'select') {
    app.innerHTML = `
      <div class="cover-screen">
        <div class="cover-title" style="font-size:24px;">SELECT YOUR ROLE</div>
        <div class="roles-container">
          <div class="role-card story" onclick="selectRole('story')"><svg class="role-icon" viewBox="0 0 16 16"><use href="#i-book"/></svg><h3>📖 故事模式</h3><p>跟著判決書走</p></div>
          <div class="role-card melon" onclick="selectRole('melon')"><svg class="role-icon" viewBox="0 0 16 16"><use href="#ply"/></svg><h3>上訴人<br>西瓜寮</h3><p>推翻偏見</p></div>
          <div class="role-card water" onclick="selectRole('water')"><svg class="role-icon" viewBox="0 0 16 16"><use href="#opp"/></svg><h3>被上訴人<br>水利局</h3><p>駁回原告</p></div>
          <div class="role-card judge" onclick="selectRole('judge')"><svg class="role-icon" viewBox="0 0 16 16"><use href="#judge-main"/></svg><h3>審判長</h3><p>裁決心證</p></div>
        </div>
      </div>`;
    return;
  }

  const s = state.scenes[state.i];
  let h = '';

  // 天秤
  let total = state.melon + state.water;
  if (total === 0) total = 1;
  let mp = (state.melon / total) * 100;
  let wp = (state.water / total) * 100;
  let rot = (Math.round(mp) === Math.round(wp)) ? 0 : (mp - 50) * 0.6;

  h += `
    <div class="top-bar">
      ${state.float ? `<div class="trust-float" style="color:${state.floatColor}">${state.float}</div>` : ''}
      <div class="trust-meter">
        <div class="trust-left">西瓜寮<br>${Math.round(mp)}%</div>
        <div class="balance-container">
          <div class="balance-bar"><div class="bar-melon" style="width:${mp}%"></div><div class="bar-water" style="width:${wp}%"></div></div>
          <div class="scale-icon" style="transform:translateX(-50%) rotate(${rot}deg)">⚖️</div>
        </div>
        <div class="trust-right">水利局<br>${Math.round(wp)}%</div>
      </div>
    </div>`;

  // 法庭場景
  const isJudge = !s.speaker || s.speaker==='審判長' || s.speaker==='系統' || s.speaker==='旁白';
  const isMelon = s.speaker==='上訴人';
  const isWater = s.speaker==='被上訴人';
  const bald = state.popup && state.popup.fx === 'wig' ? 'filter:grayscale(1);' : '';
  
  let fx = '';
  if (state.popup) {
    if (state.popup.fx === 'wig') fx = `<div class="falling-wig"><svg width="50" height="50" viewBox="0 0 16 16"><use href="#wig"/></svg></div>`;
    if (state.popup.fx === 'gun') fx = Array(5).fill(0).map(()=>`<div class="bullet-hole" style="left:${Math.random()*80+10}%;top:${Math.random()*80+10}%"></div>`).join('');
    if (state.popup.fx === 'food') fx = `<div class="desk-item">🍗</div>`;
  }

  h += `
    <div class="courtroom ${state.popup?.fx==='gun'?'danger':''}">
      ${fx}
      <div class="judge-stand">
        <div class="judge-bench">
          <svg class="judge-avatar ${isJudge?'active':''}" viewBox="0 0 16 16"><use href="#judge-side"/></svg>
          <svg class="judge-avatar main ${isJudge?'active':''}" viewBox="0 0 16 16" style="${bald}"><use href="#judge-main"/></svg>
          <svg class="judge-avatar ${isJudge?'active':''}" viewBox="0 0 16 16"><use href="#judge-side"/></svg>
        </div>
        <div class="bailiff-stand left ${state.popup?.fx==='gun'?'bailiff-shock':''}"><svg class="bailiff-avatar" viewBox="0 0 16 16"><use href="#bailiff"/></svg></div>
        <div class="bailiff-stand right ${state.popup?.fx==='gun'?'bailiff-shock':''}"><svg class="bailiff-avatar" viewBox="0 0 16 16"><use href="#bailiff"/></svg></div>
      </div>
      <div class="players-area">
        <div class="player-side left">
          <svg class="avatar ${isMelon?'active':''}" viewBox="0 0 16 16"><use href="#ply"/></svg>
          <div class="name-tag">西瓜寮代理人</div>
          <div class="lawyer-desk"></div>
        </div>
        <div class="player-side right">
          <svg class="avatar ${isWater?'active':''}" viewBox="0 0 16 16"><use href="#opp"/></svg>
          <div class="name-tag">水利局代理人</div>
          <div class="lawyer-desk"></div>
        </div>
      </div>
    </div>`;

  // 對話與操作
  if (s.type === 'story') {
    h += `<div class="dialog-box" id="t-box"><div class="speaker-name">${s.speaker}</div><div class="dialog-content" data-text="${s.text}"></div></div>`;
    h += `<button class="btn" onclick="next()">${s.btn}</button>`;
  } else if (s.type === 'choice') {
    h += `<div class="dialog-box" id="t-box"><div class="speaker-name">${s.speaker}</div><div class="dialog-content" data-text="${s.text}"></div></div>`;
    if (!state.res) {
      h += `<div class="judge-ui"><h3>💭 請裁決</h3>`;
      s.opts.forEach(o => h += `<button class="btn ${o.correct?'green':'red'}" onclick="storyPick(${o.correct})">${o.label}</button>`);
      h += `</div>`;
    } else {
      h += `<div class="feedback ${state.res.ok?'ok':'ng'}">${state.res.fb}</div><button class="btn" onclick="next()">繼續</button>`;
    }
  } else if (s.type === 'trial') {
    if (!state.res || state.res.type !== 'strong') {
      h += `<div class="dialog-box" id="t-box"><div class="speaker-name">${s.speaker}</div><div class="dialog-content" data-text="${s.opp}"></div></div>`;
    } else {
      h += `<div class="dialog-box" style="border-color:${state.mode==='melon'?'var(--green)':'var(--red)'}"><div class="speaker-name" style="background:${state.mode==='melon'?'var(--green)':'var(--red)'};color:#000">${state.mode==='melon'?'上訴人':'被上訴人'}</div><div class="dialog-content" data-text="${state.res.line}"></div></div>`;
    }
    
    if (!state.res && !state.bag) {
      h += `<div class="hint-box">${s.hint}</div><button class="btn-obj" onclick="openBag()">異議あり！</button>`;
    }
    
    if (state.bag) {
      const bag = [...s.bag].sort(() => Math.random() - 0.5);
      h += `<div class="evidence-bag"><div class="grid">`;
      bag.forEach(id => {
        const e = EV[id];
        h += `<div class="ev-card" onclick="pick('${id}')"><svg viewBox="0 0 16 16"><use href="#${e.icon}"/></svg><span>${e.name}</span></div>`;
      });
      h += `</div></div>`;
    }
    
    if (state.res) {
      let c = state.res.type === 'strong' ? 'ok' : 'ng';
      h += `<div class="feedback ${c}">${state.res.type === 'strong' ? '✔ 動搖心證！' : '✖ 證據力不足'}</div>`;
      if (state.res.rev) h += `<button class="btn red" onclick="location.reload()">重新遊玩</button>`;
      else h += `<button class="btn" onclick="next()">下一章</button>`;
    }
  } else if (s.type === 'judge') {
    let active = state.jStep === 0 ? '上訴人' : (state.jStep === 1 ? '被上訴人' : '審判長');
    // 更新頭像狀態
    if (state.jStep === 0) h = h.replace('isJudge', 'false').replace('isMelon', 'true');
    if (state.jStep === 1) h = h.replace('isJudge', 'false').replace('isWater', 'true');
    
    if (state.jStep === 0) {
      h += `<div class="dialog-box" id="t-box"><div class="speaker-name">上訴人</div><div class="dialog-content" data-text="${s.d}"></div></div>`;
      h += `<button class="btn" onclick="judgeNext()">聽取抗辯 →</button>`;
    } else if (state.jStep === 1) {
      h += `<div class="dialog-box" id="t-box"><div class="speaker-name">被上訴人</div><div class="dialog-content" data-text="${s.p}"></div></div>`;
      h += `<button class="btn" onclick="judgeNext()">進入裁決 →</button>`;
    } else if (state.jStep === 2) {
      h += `<div class="judge-ui"><h3>💭 ${s.q}</h3>`;
      if (!state.res) {
        s.opts.forEach(o => {
          h += `<button class="choice-btn ${o.t[0]}" onclick="judgePick('${o.t}',${o.m},${o.w})">${o.label}</button>`;
        });
      } else {
        h += `<div class="feedback ${state.res.ok?'ok':'ng'}">${state.res.fb}</div><button class="btn" onclick="next()">下一章</button>`;
      }
      h += `</div>`;
    }
  } else if (s.type === 'calc') {
    h += `<div class="dialog-box"><div class="speaker-name">法官算帳</div><div class="dialog-content">請計算損害賠償金額。</div></div>`;
    if (!state.res) {
      h += `<div style="background:#222;padding:15px;border-radius:8px;margin-top:15px;">
        <p>市價：275 × 559221 = <input type="number" id="c1" style="width:100px;"></p>
        <p>清運費：47.5 × 559221 = <input type="number" id="c2" style="width:100px;"></p>
        <p>賠償金額 = <input type="number" id="c3" style="width:100px;"></p>
        <button class="btn green" onclick="calc()" style="margin-top:10px;">送出</button>
      </div>`;
    } else {
      h += `<div class="feedback ${state.res.ok?'ok':'ng'}">${state.res.fb}</div><button class="btn" onclick="next()">下一章</button>`;
    }
  } else if (s.type === 'end' || s.type === 'end_story') {
    let tie = Math.round(mp) === Math.round(wp);
    let melWin = state.melon > state.water;
    if (state.mode === 'story') {
      h += `<div class="dialog-box"><div class="dialog-content">本院判決：水利局應給付西瓜寮 1 億 2722 萬元。</div></div><button class="btn green" onclick="victory(true)">觀看結果</button>`;
    } else if (tie) {
      h += `<div class="judge-ui"><h3>⚖️ 心證 50% / 50% ⚖️</h3><p>請行使最終裁量權</p><button class="btn green" onclick="victory(true)">西瓜寮勝訴</button><button class="btn red" onclick="victory(false)">水利局勝訴</button></div>`;
    } else if (melWin) {
      h += `<div class="dialog-box" style="border-color:var(--green)"><div class="dialog-content">本院判決：水利局應給付西瓜寮 1 億 2722 萬元。</div></div><button class="btn green" onclick="victory(true)">西瓜寮勝訴！</button>`;
    } else {
      h += `<div class="dialog-box" style="border-color:var(--red)"><div class="dialog-content">本院判決：原告之訴駁回。</div></div><button class="btn red" onclick="victory(false)">水利局勝訴！</button>`;
    }
  }

  // 彈窗
  if (state.popup) {
    h += `<div class="char-popup" onclick="closePopup()"><div class="char-inner"><svg class="char-img" viewBox="0 0 16 16"><use href="#${state.popup.icon}"/></svg><div class="char-dialog" style="border-color:${state.popup.color}"><div class="speaker-name" style="background:${state.popup.color};color:#000">${state.popup.speaker}</div><div class="dialog-content" data-text="${state.popup.text}"></div></div></div></div>`;
  }

  app.innerHTML = h;
  
  // 打字機效果
  document.querySelectorAll('[data-text]').forEach(box => {
    if (box.dataset.typed) return;
    box.dataset.typed = 'true';
    const text = box.dataset.text;
    box.innerText = '';
    let i = 0;
    const timer = setInterval(() => {
      box.innerText += text.charAt(i);
      i++;
      if (i >= text.length) clearInterval(timer);
    }, 30);
    box.onclick = (e) => { e.stopPropagation(); clearInterval(timer); box.innerText = text; };
  });
}

// 事件處理
window.showSelect = () => { state.mode = 'select'; render(); };
window.selectRole = (role) => {
  state.mode = role; state.i = 0; state.lives = 3; state.res = null; state.bag = false;
  if (role === 'melon') { state.melon = 20; state.water = 80; state.scenes = [...MELON, {type:'calc'}, {type:'end'}]; }
  else if (role === 'water') { state.melon = 60; state.water = 40; state.scenes = [...WATER, {type:'calc'}, {type:'end'}]; }
  else if (role === 'judge') { state.melon = 50; state.water = 50; state.scenes = [...JUDGE, {type:'calc'}, {type:'end'}]; }
  else if (role === 'story') { state.scenes = STORY; }
  render();
};

window.next = () => { state.i++; state.res = null; state.bag = false; state.popup = null; render(); };
window.openBag = () => { state.bag = true; render(); };

window.pick = (id) => {
  const s = state.scenes[state.i];
  const e = EV[id];
  state.bag = false;
  
  if (e.joke) {
    state.lives--;
    state.popup = { speaker: e.id==='gun'?'法警':'審判長', text: e.joke, icon: e.id==='gun'?'bailiff':'judge-main', color: e.id==='gun'?'var(--red)':'var(--gold)', fx: e.fx };
    if (state.mode === 'melon') { state.melon = Math.max(0, state.melon - 30); state.water += 30; }
    else { state.water = Math.max(0, state.water - 30); state.melon += 30; }
    if (state.lives <= 0) {
      setTimeout(() => { state.popup = null; state.bailiffAnim = true; render(); setTimeout(()=>{ state.bailiffAnim=false; state.gameover=true; render(); }, 2000); }, 2000);
    }
  } else {
    if (s.ans.includes(id)) {
      state.res = { type: 'strong', ok: true, line: s.success };
      if (state.mode === 'melon') { state.melon += 20; state.water -= 20; state.popup = { speaker:'上訴人', text:s.success, icon:'ply', color:'var(--green)' }; }
      else { state.water += 20; state.melon -= 20; state.popup = { speaker:'被上訴人', text:s.success, icon:'opp', color:'var(--red)' }; }
    } else {
      state.res = { type: 'weak', ok: false };
      if (state.mode === 'melon') { state.melon = Math.max(0, state.melon - 10); state.water += 10; }
      else { state.water = Math.max(0, state.water - 10); state.melon += 10; }
    }
  }
  render();
};

window.storyPick = (correct) => { state.res = { ok: correct, fb: correct ? state.scenes[state.i].fbOk : state.scenes[state.i].fbNg }; render(); };

window.judgeNext = () => { state.jStep = (state.jStep || 0) + 1; state.res = null; render(); };
window.judgePick = (type, m, w) => {
  state.melon += m; state.water += w;
  state.res = { ok: m > 0, fb: '已記錄裁決。' };
  render();
};

window.calc = () => {
  const c1 = document.getElementById('c1').value;
  const c2 = document.getElementById('c2').value;
  const c3 = document.getElementById('c3').value;
  if (c1 == 153785775 && c2 == 26562998 && c3 == 127222777) state.res = { ok: true, fb: '計算正確！' };
  else state.res = { ok: false, fb: '計算錯誤！' };
  render();
};

window.closePopup = () => { state.popup = null; if (state.lives <= 0) { state.bailiffAnim = true; render(); setTimeout(()=>{ state.bailiffAnim=false; state.gameover=true; render(); }, 2000); } else { render(); } };

window.victory = (melWin) => {
  app.innerHTML = `
